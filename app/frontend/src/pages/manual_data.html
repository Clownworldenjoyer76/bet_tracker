<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/matstheme.css">
<link rel="stylesheet" href="assets/css/pages/manual_data.css">
<link rel="stylesheet" href="assets/css/site-polish.css?v=nav-icons-20261001">
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="manual-header">
    <h1 class="manual-title">MANUAL<span class="manual-title-slash">/</span>DATA</h1>
    <div id="status" class="status"></div>
  </div>

  <div class="manual-controls">
    <div class="control-wrap">
      <span class="control-label">League</span>
      <select id="league" onchange="updateMarkets()">
        <option value="">-- select --</option>
        <option value="soccer">Soccer</option>
        <option value="mma">MMA</option>
      </select>
    </div>

    <div class="control-wrap">
      <span class="control-label">Market</span>
      <select id="market" onchange="updateSources()">
        <option value="">-- placeholder --</option>
      </select>
    </div>

    <div class="control-wrap">
      <span class="control-label">Source</span>
      <select id="source">
        <option value="">-- select --</option>
        <option value="Predictions">Predictions</option>
        <option value="Soccer Totals">Soccer Results</option>
        <option value="UFC Results">UFC Results</option>
      </select>
    </div>

    <div class="control-wrap">
      <span class="control-label">Magic</span>
      <input id="token" type="password" placeholder="••••••••">
    </div>
  </div>

  <div class="manual-body">
    <div class="manual-card">
      <div class="raw-label-row">
        <span class="raw-label">Raw Text</span>
        <span class="raw-hint">Paste dump here</span>
      </div>

      <textarea id="raw"></textarea>

      <button id="btn" onclick="dispatch()">Create File</button>
      <div id="out"></div>
    </div>
  </div>

  <script src="assets/js/shared/nav.js"></script>

  <script src="assets/js/pages/manual_data.js"></script>

</body>
</html>
