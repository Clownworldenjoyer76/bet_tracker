<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/matstheme.css">
<link rel="stylesheet" href="assets/css/pages/the_picks.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="picks-header">
    <h1 class="picks-title">PICKS</h1>
    <div id="status" class="status"></div>
  </div>

  <div class="picks-controls">
    <div class="date-wrap">
      <span class="date-label">Date</span>
      <input id="p-date" type="date">
    </div>
    <div class="ufc-event-wrap">
      <span class="ufc-event-label">UFC Event</span>
      <div id="ufc-event-selector">Loading...</div>
    </div>
    <div id="league-filters"></div>
  </div>

  <div id="games"></div>

  <div id="modal" class="modal">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
      <button class="modal-close-btn" onclick="document.getElementById('modal').classList.remove('open')">Close</button>
    </div>
  </div>

  <script src="assets/js/shared/config.js"></script>
  <script src="assets/js/shared/nav.js"></script>
  <script src="assets/js/shared/app.js"></script>

  <script src="assets/js/pages/the_picks.js"></script>

</body>
</html>
