<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ligue 1 Dashboard</title>
<link rel="stylesheet" href="assets/css/matstheme.css">
<link rel="stylesheet" href="assets/css/generated/soccer-league-dashboard.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body class="generated-dashboard">
<div id="nav-placeholder"></div>
<header>
  <h1>Ligue 1 Dashboard</h1>
  <span class="ts">Built 2026-09-27T09:10:29+00:00 UTC</span>
</header>

<div class="league-bar">
  <span class="lbl">League:</span>
  <button class="league-btn active" data-league="ligue1" onclick="selectLeague('ligue1')">Ligue 1</button>
</div>

<main>

<section class="league-section" data-league="ligue1">
  <h2>Ligue 1 Analytics</h2>
  <div class="kpis"></div>

  <h2>By Market</h2>
  <div class="by-market"></div>

  <h2>By Market + Side</h2>
  <div class="side-tally"></div>

  <h2>Model Quality</h2>
  <div class="model-area">
    <div class="tabs">
      <button class="tab active" data-key="core">Core Metrics</button>
      <button class="tab" data-key="xg">xG Metrics</button>
      <button class="tab" data-key="calibration">Calibration</button>
    </div>
    <div class="tab-body">
      <div class="tab-panel model-core" data-key="core"></div>
      <div class="tab-panel model-xg" data-key="xg" style="display:none"></div>
      <div class="tab-panel model-calibration" data-key="calibration" style="display:none"></div>
    </div>
  </div>

  <h2>Per Market Drilldown</h2>
  <div class="market-area">
    <div class="tabs">
      <button class="tab active" data-key="match_odds">Match Odds</button>
<button class="tab" data-key="btts">BTTS</button>
<button class="tab" data-key="total25">Total 2.5</button>
<button class="tab" data-key="total35">Total 3.5</button>
    </div>
    <div class="tab-body">
      <div class="tab-panel panel-match_odds" data-key="match_odds"></div>
<div class="tab-panel panel-btts" data-key="btts" style="display:none"></div>
<div class="tab-panel panel-total25" data-key="total25" style="display:none"></div>
<div class="tab-panel panel-total35" data-key="total35" style="display:none"></div>
    </div>
  </div>
</section>

</main>

<script src="assets/js/shared/nav.js"></script>
<script src="assets/js/pages/ligue1_dashboard.js"></script>
</body>
</html>
