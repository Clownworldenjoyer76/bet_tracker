<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/matstheme.css">
<link rel="stylesheet" href="assets/css/pages/games_today.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="gt-header">
    <h1 class="gt-title">GAMES TODAY</h1>
    <div id="gt-status" class="status" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <div class="gt-controls">
    <div class="gt-date-wrap">
      <label class="gt-date-label" for="gt-date">Date</label>
      <input id="gt-date" type="date">
    </div>
    <div id="gt-filters"></div>
  </div>

  <div id="gt-games"></div>

  <div id="gt-modal" class="gt-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Game details">
    <div class="gt-modal-card" onclick="event.stopPropagation()">
      <div id="gt-modal-content"></div>
      <button class="gt-modal-close-btn" onclick="document.getElementById('gt-modal').classList.remove('open')">Close</button>
    </div>
  </div>

  <script src="assets/js/shared/config.js"></script>
  <script src="assets/js/shared/nav.js"></script>
  <script type="module" src="assets/js/games-today/main.js"></script>

</body>
</html>
