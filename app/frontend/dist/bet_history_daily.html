<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bet History Daily</title>

  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/pages/index.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>

<body>
  <div id="nav-placeholder"></div>

  <main class="main">
    <section class="summary-strip" aria-label="Overall completed bet performance">
      <div class="summary-item">
        <div class="summary-val" id="summary-completed">N/A</div>
        <div class="summary-lbl">Completed Bets</div>
      </div>

      <div class="summary-item">
        <div class="summary-val" id="summary-record">N/A</div>
        <div class="summary-lbl">W-L-P Record</div>
      </div>

      <div class="summary-item">
        <div class="summary-val" id="summary-win-rate">N/A</div>
        <div class="summary-lbl">Win Rate</div>
      </div>

      <div class="summary-item">
        <div class="summary-val val-blue" id="summary-model-prob">N/A</div>
        <div class="summary-lbl">Avg Model Prob</div>
      </div>

      <div class="summary-item">
        <div class="summary-val" id="summary-profit">N/A</div>
        <div class="summary-lbl">Profit / Loss</div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <div class="section-title">Completed Bet History</div>
        <div class="section-note">Last 30 completed dates, all sports, all markets</div>
      </div>

      <div class="status-line">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Loading completed bet history...</span>
      </div>

      <div class="history-grid" id="history-grid">
        <div class="empty-state">Loading completed bet history...</div>
      </div>
    </section>
  </main>

  <script src="assets/js/shared/nav.js"></script>

  <script src="assets/js/bet-history/config.js"></script>
  <script src="assets/js/bet-history/sources.js"></script>
  <script src="assets/js/bet-history/csv.js"></script>
  <script src="assets/js/bet-history/normalize.js"></script>

  <script src="assets/js/pages/index.js"></script>
</body>
</html>
