<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Health</title>
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/pages/pipeline_health.css">
<link rel="stylesheet" href="assets/css/site-polish.css?v=nav-icons-20261001">
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Pipeline Health</div>
    <div class="page-subtitle">All · Basketball · MLB · NHL · CFB · Soccer · UFC</div>
  </div>
</div>

<div class="controls" id="sport-controls">
  <button type="button" class="sport-pill active" data-sport="all">All</button>
  <button type="button" class="sport-pill" data-sport="basketball">Basketball</button>
  <button type="button" class="sport-pill" data-sport="mlb">MLB</button>
  <button type="button" class="sport-pill" data-sport="nhl">NHL</button>
  <button type="button" class="sport-pill" data-sport="cfb">CFB</button>
  <button type="button" class="sport-pill" data-sport="soccer">Soccer</button>
  <button type="button" class="sport-pill" data-sport="ufc">UFC</button>
</div>

<div class="status-bar" id="status-bar">
  <span class="status-dot yellow" id="load-dot"></span>
  <span id="load-text">Loading pipeline health data...</span>
</div>

<div class="main">
  <div id="health-content"></div>
</div>

<script src="assets/js/shared/nav.js"></script>
<script src="assets/js/pages/pipeline_health.js"></script>
</body>
</html>
