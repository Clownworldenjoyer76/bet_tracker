<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players</title>
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/pages/players.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Players</div>
    <div class="page-subtitle">ROSTER BY TEAM · CLICK PLAYER FOR PROFILE</div>
  </div>
</div>

<div class="controls">
  <div id="league-controls"></div>
  <div class="team-select-wrap" id="team-select-wrap">
    <span class="team-select-label">Team</span>
    <select class="team-select" id="team-select">
      <option value="">— Select Team —</option>
    </select>
  </div>
</div>

<div class="status-bar" id="players-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading players page...</span>
</div>

<div class="main" id="players-main">
  <div class="empty-state">Select a team to view roster</div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">CLOSE ✕</button>
    <div class="modal-player-header" id="modal-player-header"></div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div id="modal-panels"></div>
  </div>
</div>

<script src="assets/js/shared/nav.js"></script>
<script src="assets/js/players/render.js"></script>
</body>
</html>
