<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venue Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/matstheme.css">

<link rel="stylesheet" href="assets/css/pages/manual_venue_data.css">
<link rel="stylesheet" href="assets/css/site-polish.css?v=nav-icons-20261001">
</head>

<body>

  <div id="nav-placeholder"></div>

  <div class="manual-header">
    <h1 class="manual-title">VENUE<span class="manual-title-slash">/</span>DATA</h1>
    <div id="status" class="status"></div>
  </div>

  <div class="manual-controls">
    <div class="control-wrap">
      <span class="control-label">League</span>
      <select id="league" onchange="updateVariable1()">
        <option value="">-- select --</option>
      </select>
    </div>

    <div class="control-wrap">
      <span class="control-label">Variable 1</span>
      <select id="variable1" onchange="updateVariable2()">
        <option value="">-- select league first --</option>
      </select>
    </div>

    <div class="control-wrap">
      <span class="control-label">Variable 2</span>
      <select id="variable2" onchange="updateTargetPathDisplay()">
        <option value="">-- select variable 1 first --</option>
      </select>
    </div>

    <div class="control-wrap">
      <span class="control-label">Magic</span>
      <input id="token" type="password" placeholder="••••••••">
    </div>
  </div>

  <div class="manual-body">
    <div class="manual-card">
      <div class="raw-label-row">
        <span class="raw-label">Raw Text</span>
        <span class="raw-hint">Paste venue data dump here</span>
      </div>

      <textarea id="raw"></textarea>

      <div id="targetPath" class="target-path"></div>

      <button id="btn" onclick="dispatch()">Create File</button>
      <div id="out"></div>
    </div>
  </div>

  <script src="assets/js/shared/nav.js"></script>

  <script src="assets/js/pages/manual_venue_data.js"></script>

</body>
</html>
