<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Props</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link rel="stylesheet" href="assets/css/pages/props_nfl.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <header class="page-header">
    <div class="page-title">NFL Props</div>
    <div class="page-subtitle">MODEL PICKS · PLAYER PROJECTIONS · OVER/UNDER PROBABILITIES</div>
  </header>

  <main class="main">
    <div class="selector-row">
      <div class="selector-block">
        <label class="selector-label" for="seasonSelect">Season</label>
        <select id="seasonSelect" class="selector"></select>
      </div>

      <div class="selector-block">
        <label class="selector-label" for="weekSelect">Week</label>
        <select id="weekSelect" class="selector"></select>
      </div>

      <div id="status"></div>
    </div>

    <section class="section">
      <div class="section-title">Prop Types</div>
      <div id="propButtons" class="button-grid"></div>
    </section>

    <section class="section">
      <div class="section-title">Game Props</div>
      <div id="gameButtons"></div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <div class="results-title" id="resultsTitle">Picks</div>
        <div id="resultCount"></div>
      </div>
      <div id="results"></div>
    </section>
  </main>

  <script src="assets/js/shared/nav.js"></script>

  <script src="assets/js/pages/props_nfl.js"></script>
</body>
</html>
