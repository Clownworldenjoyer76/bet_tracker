<script src="/assets/js/bet-history/sources.js"></script>
<script src="/assets/js/bet-history/csv.js"></script>
<script src="/assets/js/bet-history/normalize.js"></script>
<script src="/assets/js/pages/index.js"></script>
<script>
(function(){
var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
var ov=document.getElementById('home-pk-overlay'),hg=document.getElementById('history-grid'),started=false,idx=-1,cur='',chain=Promise.resolve(),st={};
function pad(n){return n<10?'0'+n:String(n)}
function parse(t){var m=/^([A-Za-z]+) (\d{1,2}), (\d{4})$/.exec(String(t||'').trim());if(!m)return null;var i=MN.indexOf(m[1]);return i<0?null:{y:+m[3],m:i,d:+m[2]}}
function once(k,f){return st[k]?Promise.resolve():f().then(function(){st[k]=1})}
function css(h){return new Promise(function(ok,no){var l=document.createElement('link');l.rel='stylesheet';l.href=h;l.onload=ok;l.onerror=function(){no(new Error(h))};document.head.appendChild(l)})}
function js(s){return new Promise(function(ok,no){var e=document.createElement('script');e.src=s;e.onload=ok;e.onerror=function(){no(new Error(s))};document.body.appendChild(e)})}
function idle(){return new Promise(function(ok){(function t(){var s=document.getElementById('status');if(!s||s.className.indexOf('loading')<0)ok();else setTimeout(t,100)})()})}
function fail(e){started=false;var s=document.getElementById('status');if(s){s.className='status';s.textContent='Could not load picks ('+e.message+')'}}
function boot(p){return once('css',function(){return css('/assets/css/pages/the_picks.css')}).then(function(){return once('cfg',function(){return js('/assets/js/shared/config.js')})}).then(function(){return once('app',function(){var RD=Date,used=false;window.Date=class extends RD{constructor(){if(arguments.length===0&&!used){used=true;window.Date=RD;super(p.y,p.m,p.d,12)}else{super(...arguments)}}};return js('/assets/js/pages/index_picks.js?v=202610061224').then(function(){window.Date=RD},function(e){window.Date=RD;throw e})})}).then(function(){return once('pk',function(){return js('/assets/js/pages/the_picks.js')})})}
function nav(){var l=cards(),a=document.getElementById('home-pk-prev'),b=document.getElementById('home-pk-next');if(a)a.disabled=idx<0||idx+1>=l.length;if(b)b.disabled=idx<=0}
function show(p){nav();var v=p.y+'-'+pad(p.m+1)+'-'+pad(p.d);document.getElementById('home-pk-date').textContent=MN[p.m]+' '+p.d+', '+p.y;ov.classList.add('open');
if(!started){started=true;cur=v;var s0=document.getElementById('status');if(s0){s0.className='status loading';s0.textContent='Loading\u2026'}chain=boot(p).catch(fail);return}
if(v===cur)return;cur=v;chain=chain.then(idle).then(function(){var i=document.getElementById('p-date');i.value=v;i.dispatchEvent(new Event('change'))})}
function close(){ov.classList.remove('open')}
function cards(){return [].filter.call(hg.querySelectorAll('.day-card'),function(c){return c.offsetParent!==null})}
function step(n){var l=cards();if(n<0||n>=l.length)return;var d=l[n].querySelector('.date-value'),p=parse(d&&d.textContent);if(p){idx=n;show(p)}}
if(hg)hg.addEventListener('click',function(e){var c=e.target.closest('.day-card');if(!c)return;var d=c.querySelector('.date-value'),p=parse(d&&d.textContent);if(p){idx=cards().indexOf(c);show(p)}});
document.getElementById('home-pk-close').addEventListener('click',close);
document.getElementById('home-pk-prev').addEventListener('click',function(){step(idx+1)});
document.getElementById('home-pk-next').addEventListener('click',function(){step(idx-1)});
ov.addEventListener('click',function(e){if(e.target===ov)close()});
document.addEventListener('keydown',function(e){var m=document.getElementById('modal'),mo=m&&m.classList.contains('open');if(e.key==='Escape'){if(mo)m.classList.remove('open');else close();return}if(!ov.classList.contains('open')||mo||idx<0)return;if(e.key==='ArrowLeft'){e.preventDefault();step(idx+1)}else if(e.key==='ArrowRight'){e.preventDefault();step(idx-1)}});
})();
</script>
<script>
(function(){
var g=document.getElementById('history-grid'),sm=document.getElementById('hist-summary'),mb=document.getElementById('hist-more'),lim=7;
if(!g)return;
function cl(r){return r>=55?'val-green':r<45?'val-red':'val-yellow'}
function sh(t){var m=/^([A-Za-z]{3})[a-z]*\s+(\d{1,2})/.exec(String(t||'').trim());return m?m[1]+' '+m[2]:''}
function put(id,t,c){var e=document.getElementById(id);if(!e)return;e.textContent=t;e.className='day-stat-value'+(c?' '+c:'')}
function run(){
var c=[].slice.call(g.querySelectorAll('.day-card'));
c.forEach(function(x,i){x.classList.toggle('hist-hidden',i>=lim)});
if(mb)mb.hidden=c.length<=lim;
var n=Math.min(7,c.length),w=0,l=0,p=0,b=0,i,v,m;
for(i=0;i<n;i++){v=c[i].querySelectorAll('.day-stat-value');m=/(\d+)-(\d+)-(\d+)/.exec(v[1]?v[1].textContent:'');b+=parseInt((v[0]?v[0].textContent:'0').replace(/,/g,''),10)||0;if(m){w+=+m[1];l+=+m[2];p+=+m[3]}}
if(!sm)return;
if(!n){sm.hidden=true;return}
sm.hidden=false;
var d=w+l,r=d?w/d*100:null,a=sh((c[n-1].querySelector('.date-value')||{}).textContent),z=sh((c[0].querySelector('.date-value')||{}).textContent);
document.getElementById('hs-title').textContent='Last '+n+' days';
document.getElementById('hs-range').textContent=a&&z?a+' – '+z:'';
put('hs-bets',b.toLocaleString());
put('hs-rec',w+'-'+l+'-'+p,r===null?'':cl(r));
put('hs-rate',r===null?'N/A':r.toFixed(1)+'%',r===null?'':cl(r));
}
new MutationObserver(run).observe(g,{childList:true});
if(mb)mb.addEventListener('click',function(){lim+=7;run()});
run();
})();
</script>
