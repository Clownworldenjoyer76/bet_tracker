{% extends "accounts/base.html" %}
{% block title %}Reset Sent{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="auth-eyebrow">SECURITY</div>
  <h1>Check your email</h1>
  <p class="auth-intro">
    If an account exists for that email address, a reset link has been sent.
  </p>
  <a class="auth-primary auth-button-link" href="{% url 'accounts:login' %}">
    Return to sign in
  </a>
</div>
{% endblock %}
