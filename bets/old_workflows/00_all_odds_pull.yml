name: 00 All Odds Pull

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-all-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/basketball/odds
          mkdir -p docs/win/hockey/odds
          mkdir -p docs/win/baseball/odds
          mkdir -p docs/win/basketball/errors/00_intake

      - name: Verify API keys are present
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_ODDS: ${{ secrets.API_ODDS }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "ODDS_API_KEY secret is missing."
            exit 1
          fi

          if [ -z "$API_ODDS" ]; then
            echo "API_ODDS secret is missing."
            exit 1
          fi

      - name: Run Odds API pull (NBA / NHL / Baseball)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/odds_api.py

      - name: Run WNBA Odds API pull
        env:
          API_ODDS: ${{ secrets.API_ODDS }}
        run: |
          python docs/win/basketball/scripts/00_parsing/wnba_odds_api.py

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/basketball/odds/wnba/
          git add docs/win/basketball/odds/nba/
          git add docs/win/basketball/odds/ncaam/
          git add docs/win/basketball/odds/
          git add docs/win/hockey/odds/
          git add docs/win/baseball/odds/
          git add docs/win/basketball/errors/00_intake/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update odds data"
            git push
          fi
