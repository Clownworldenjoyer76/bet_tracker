<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Engine · SportsModelHub</title>
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/pages/prop_engine.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div>
    <div class="page-title">Prop Engine</div>
    <div class="page-subtitle">HIT RATES · TRENDS · OVER/UNDER ANALYSIS</div>
  </div>
</div>
<div class="controls-wrap">
  <div class="controls-row">
    <span class="controls-label">League</span>
    <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
    <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
    <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  </div>
  <div class="controls-row">
    <span class="controls-label">Team</span>
    <select class="ctrl-select" id="team-select"><option value="">— Select Team —</option></select>
    <span class="controls-label" style="margin-left:8px">Player</span>
    <select class="ctrl-select" id="player-select"><option value="">— Select Player —</option></select>
  </div>
  <div class="controls-row">
    <span class="controls-label">Prop</span>
    <select class="ctrl-select" id="prop-select"></select>
    <span class="controls-label" style="margin-left:8px">Games</span>
    <input class="ctrl-num" id="game-count" type="number" min="5" max="82" value="15" title="Last N games">
    <button class="analyze-btn" id="analyze-btn">Analyze</button>
  </div>
</div>
<div class="status-bar" id="prop-status">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Select a league, team, and player</span>
</div>
<div class="main" id="prop-main">
  <div class="empty-state">
    Select a player and prop to begin analysis
    <div class="empty-sub">NBA · NHL · MLB · Hit rates · Trends · Game log</div>
  </div>
</div>
<script src="assets/js/shared/nav.js"></script>
<script src="assets/js/pages/prop_engine.js"></script>
</body>
</html>
