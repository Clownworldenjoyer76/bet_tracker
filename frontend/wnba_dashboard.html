<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WNBA Analytics</title>
<link rel="stylesheet" href="assets/css/matstheme.css">
<style>
html, body {
  height: 100%;
}
body {
  overflow: hidden;
}
.league-shell {
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.league-shell-head {
  flex: 0 0 auto;
  border-bottom: 1px solid var(--border-soft);
}
.league-frame {
  width: 100%;
  flex: 1 1 auto;
  border: 0;
  background: var(--background);
}
</style>
</head>
<body>
<div class="league-shell">
  <div class="league-shell-head" id="nav-placeholder"></div>
  <iframe
    id="league-frame"
    class="league-frame"
    src="basketball_dashboard.html"
    title="WNBA Analytics">
  </iframe>
</div>
<script src="assets/js/shared/nav.js"></script>
<script>
document.getElementById('league-frame').addEventListener('load', function () {
  try {
    const w = this.contentWindow;
    const d = this.contentDocument;

      const nav = d.getElementById('nav-placeholder');
      if (nav) nav.style.display = 'none';

      const bar = d.querySelector('.league-bar');
      if (bar) bar.style.display = 'none';

      if (typeof w.selectLeague === 'function') {
        w.selectLeague('wnba');
      }
  } catch (err) {
    console.error('League dashboard initialization failed:', err);
  }
});
</script>
</body>
</html>
