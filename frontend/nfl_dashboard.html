<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Analytics</title>
<link rel="stylesheet" href="assets/css/matstheme.css">
<style>
.dashboard-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 20px 48px;
}
.dashboard-head {
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 14px;
  margin-bottom: 18px;
}
.dashboard-head h1 {
  margin: 0 0 6px;
  font-size: 24px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.dashboard-status {
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.empty-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 4px;
  padding: 24px;
}
.empty-panel h2 {
  margin-top: 0;
  font-size: 15px;
}
.empty-panel p {
  margin-bottom: 0;
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.7;
}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<main class="dashboard-wrap">
  <div class="dashboard-head">
    <h1>NFL Analytics</h1>
    <div class="dashboard-status">Football · league dashboard</div>
  </div>
  <section class="empty-panel">
    <h2>Dashboard scaffold ready</h2>
    <p>No NFL analytics data source is connected to the frontend yet.</p>
  </section>
</main>
<script src="assets/js/shared/nav.js"></script>
</body>
</html>
