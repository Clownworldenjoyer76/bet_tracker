<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet History · SportsModelHub</title>
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/pages/bet_history.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Bet History</div>
    <div class="page-subtitle">GRADED BETS · RESULTS · MODEL PROBABILITY · EV · ODDS</div>
  </div>
</div>

<div class="controls" id="league-controls">
  <button type="button" class="league-pill active" data-league-key="all" data-league="all">All</button>

  <button type="button" class="league-pill" data-league-key="cfb" data-league="CFB">College Football</button>

  <button type="button" class="league-pill" data-league-key="nhl" data-league="NHL">NHL</button>

  <button type="button" class="league-pill" data-league-key="mlb" data-league="MLB">MLB</button>
  <button type="button" class="league-pill" data-league-key="mlb_lineups" data-league="MLB_LINEUPS">MLB · With Lineups</button>

  <button type="button" class="league-pill" data-league-key="wnba" data-league="WNBA">WNBA</button>

  <button type="button" class="league-pill" data-league-key="mls" data-league="SOCCER" data-league-sub="MLS">MLS</button>
  <button type="button" class="league-pill" data-league-key="epl" data-league="SOCCER" data-league-sub="EPL">EPL</button>
  <button type="button" class="league-pill" data-league-key="laliga" data-league="SOCCER" data-league-sub="LALIGA">La Liga</button>
  <button type="button" class="league-pill" data-league-key="ligue1" data-league="SOCCER" data-league-sub="LIGUE1">Ligue 1</button>
  <button type="button" class="league-pill" data-league-key="seriea" data-league="SOCCER" data-league-sub="SERIEA">Serie A</button>
  <button type="button" class="league-pill" data-league-key="bundesliga" data-league="SOCCER" data-league-sub="BUNDESLIGA">Bundesliga</button>

  <button type="button" class="league-pill" data-league-key="ufc" data-league="UFC">UFC</button>
</div>

<div class="controls">
  <div class="market-pill active" data-market="all">All Markets</div>
  <div class="market-pill" data-market="moneyline">Moneyline</div>
  <div class="market-pill" data-market="spread">Spread / Line</div>
  <div class="market-pill" data-market="total">Total</div>

  <div class="result-pill active" data-result="all">All Results</div>
  <div class="result-pill" data-result="win">Wins</div>
  <div class="result-pill" data-result="loss">Losses</div>
  <div class="result-pill" data-result="push">Push</div>

  <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
</div>

<div class="status-bar" id="history-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading bet history...</span>
</div>

<div class="main" id="history-main"></div>

<script src="assets/js/shared/nav.js"></script>
<script src="assets/js/shared/kelly-league-availability.js"></script>
<script src="assets/js/shared/league_nav.js"></script>

<script src="assets/js/bet-history/config.js"></script>
<script src="assets/js/bet-history/sources.js"></script>
<script src="assets/js/bet-history/csv.js"></script>
<script src="assets/js/bet-history/normalize.js"></script>
<script src="assets/js/bet-history/render.js"></script>
<script src="assets/js/pages/bet_history.2.js"></script>
<script src="assets/js/bet-history/app.js"></script>
<script src="assets/js/pages/bet_history.3.js"></script>
</body>
</html>
