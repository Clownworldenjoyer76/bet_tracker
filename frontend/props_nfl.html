<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Props</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--background);
      color: var(--text-main);
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
    }

    .page-header {
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 24px;
    }

    .page-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
    }

    .page-subtitle {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .main {
      width: min(1500px, calc(100% - 48px));
      margin: 0 auto;
      padding: 20px 0 44px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .selector-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .selector-block {
      width: 120px;
      flex: 0 0 120px;
    }

    .selector-label,
    .section-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .selector-label {
      display: block;
      margin-bottom: 5px;
    }

    .selector {
      width: 100%;
      height: 34px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      padding: 0 10px;
      outline: none;
      cursor: pointer;
    }

    .selector:focus,
    .selector:hover {
      border-color: var(--accent-green);
    }

    #status {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 0 4px;
      color: var(--accent-green);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .section {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 14px 16px 16px;
    }

    .section-title {
      padding-bottom: 6px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      cursor: pointer;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    button:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    button.active {
      background: rgba(0, 255, 132, 0.06);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    #gameButtons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }

    .game-button {
      width: 100%;
      min-width: 0;
      height: 68px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
    }

    .game-button .teams {
      display: block;
      width: 100%;
      color: var(--text-main);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-button.active .teams,
    .game-button:hover .teams {
      color: var(--accent-green);
    }

    .game-button .meta {
      display: block;
      width: 100%;
      color: var(--text-muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      margin-top: 5px;
    }

    .results-section {
      width: 100%;
      padding-top: 4px;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 7px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-soft);
    }

    .results-title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    #resultCount {
      color: var(--text-muted);
      font-size: 11px;
    }

    .pick-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 10px;
    }

    .pick-card-nfl {
      min-width: 0;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      padding: 12px 14px;
    }

    .pick-card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding-bottom: 9px;
      margin-bottom: 9px;
      border-bottom: 1px solid var(--border-soft);
    }

    .pick-player {
      min-width: 0;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.05;
    }

    .pick-prop {
      margin-top: 3px;
      color: var(--accent-blue);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pick-game {
      margin-top: 4px;
      color: var(--text-muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .pick-choice {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .pick-metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .pick-metric {
      min-width: 0;
      padding-right: 8px;
      border-right: 1px solid var(--border-soft);
    }

    .pick-metric:nth-child(4n) {
      border-right: 0;
      padding-right: 0;
    }

    .pick-metric-label {
      color: var(--text-muted);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .pick-metric-value {
      margin-top: 3px;
      color: var(--text-main);
      font-size: 11px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .pick-over {
      color: var(--accent-green);
      font-weight: 700;
      text-transform: uppercase;
    }

    .pick-under {
      color: var(--accent-red);
      font-weight: 700;
      text-transform: uppercase;
    }

    .prob {
      color: var(--accent-blue);
      font-weight: 700;
    }

    .empty {
      padding: 28px 0;
      color: var(--text-muted);
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }


    @media (max-width: 1180px) {
      #gameButtons {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .main {
        width: min(100% - 24px, 1500px);
      }

      #gameButtons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pick-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pick-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pick-metric:nth-child(4n) {
        border-right: 1px solid var(--border-soft);
        padding-right: 8px;
      }

      .pick-metric:nth-child(2n) {
        border-right: 0;
        padding-right: 0;
      }
    }

    @media (max-width: 560px) {
      .page-header {
        padding: 14px 12px;
      }

      .main {
        width: calc(100% - 16px);
        padding-top: 12px;
      }

      .selector-row {
        gap: 8px;
      }

      .selector-block {
        width: 120px;
        flex: 0 0 120px;
      }

      #status {
        width: 100%;
      }

      #gameButtons {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pick-grid {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 12px;
      }

      td {
        grid-template-columns: 110px minmax(0, 1fr);
      }
    }

    @media (max-width: 420px) {
      #gameButtons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <header class="page-header">
    <div class="page-title">NFL Props</div>
    <div class="page-subtitle">MODEL PICKS · PLAYER PROJECTIONS · OVER/UNDER PROBABILITIES</div>
  </header>

  <main class="main">
    <div class="selector-row">
      <div class="selector-block">
        <label class="selector-label" for="seasonSelect">Season</label>
        <select id="seasonSelect" class="selector"></select>
      </div>

      <div class="selector-block">
        <label class="selector-label" for="weekSelect">Week</label>
        <select id="weekSelect" class="selector"></select>
      </div>

      <div id="status"></div>
    </div>

    <section class="section">
      <div class="section-title">Prop Types</div>
      <div id="propButtons" class="button-grid"></div>
    </section>

    <section class="section">
      <div class="section-title">Game Props</div>
      <div id="gameButtons"></div>
    </section>

    <section class="results-section">
      <div class="results-header">
        <div class="results-title" id="resultsTitle">Picks</div>
        <div id="resultCount"></div>
      </div>
      <div id="results"></div>
    </section>
  </main>

  <script src="assets/js/shared/nav.js"></script>

  <script>
    const RAW_ROOT =
      "https://raw.githubusercontent.com/Clownworldenjoyer76/football_for_mat/main";

    const AVAILABLE_SEASONS = [2026];
    const AVAILABLE_WEEKS = Array.from({ length: 18 }, (_, i) => i + 1);

    const PROP_TYPES = [
      {
        key: "passing",
        label: "Passing Yards",
        path: "passing",
        suffix: "passing",
        line: "actual_prop_total_passing_yards",
        projection: "prop_engine_passing_yards",
        low: "prop_engine_passing_yards_low",
        high: "prop_engine_passing_yards_high"
      },
      {
        key: "rushing",
        label: "Rushing Yards",
        path: "rushing",
        suffix: "rushing",
        line: "actual_prop_total_rushing_yards",
        projection: "prop_engine_rushing_yards",
        low: "prop_engine_rushing_yards_low",
        high: "prop_engine_rushing_yards_high"
      },
      {
        key: "receiving",
        label: "Receiving Yards",
        path: "receiving",
        suffix: "receiving",
        line: "actual_prop_total_receiving_yards",
        projection: "prop_engine_receiving_yards",
        low: "prop_engine_receiving_yards_low",
        high: "prop_engine_receiving_yards_high"
      },
      {
        key: "kicking",
        label: "Kicking Points",
        path: "kicking",
        suffix: "kicking",
        line: "actual_prop_total_kicking_points",
        projection: "prop_engine_kicking_points",
        low: "prop_engine_kicking_points_low",
        high: "prop_engine_kicking_points_high"
      },
      {
        key: "defense",
        label: "Tackles",
        path: "defense",
        suffix: "defense",
        line: "actual_prop_total_tackles",
        projection: "prop_engine_tackles",
        low: "prop_engine_tackles_low",
        high: "prop_engine_tackles_high"
      },
      {
        key: "pass_rush",
        label: "Passing/Rushing Yards",
        path: "combo/pass_rush_yds",
        suffix: "pass_rush_yds",
        line: "actual_prop_total_passing_plus_rushing_yards",
        projection: "prop_engine_pr",
        low: "prop_engine_pr_low",
        high: "prop_engine_pr_high"
      },
      {
        key: "rec_rush",
        label: "Rushing/Receiving Yards",
        path: "combo/rec_rush_yds",
        suffix: "rec_rush_yds",
        line: "actual_prop_total_rushing_plus_receiving_yards",
        projection: "prop_engine_rr",
        low: "prop_engine_rr_low",
        high: "prop_engine_rr_high"
      }
    ];

    const state = {
      season: 2026,
      week: 1,
      schedule: [],
      props: [],
      selectedProp: null,
      selectedGame: null
    };

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];

        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i++;
            } else {
              quoted = false;
            }
          } else {
            field += ch;
          }
        } else {
          if (ch === '"') {
            quoted = true;
          } else if (ch === ",") {
            row.push(field);
            field = "";
          } else if (ch === "\n") {
            row.push(field.replace(/\r$/, ""));
            rows.push(row);
            row = [];
            field = "";
          } else {
            field += ch;
          }
        }
      }

      if (field.length || row.length) {
        row.push(field.replace(/\r$/, ""));
        rows.push(row);
      }

      if (!rows.length) return [];

      const headers = rows[0].map(h => h.trim());

      return rows
        .slice(1)
        .filter(r => r.some(v => String(v).trim() !== ""))
        .map(r => {
          const obj = {};
          headers.forEach((h, index) => {
            obj[h] = r[index] ?? "";
          });
          return obj;
        });
    }

    async function fetchCsv(url) {
      const response = await fetch(url, { cache: "no-store" });

      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }

      return parseCsv(await response.text());
    }

    function stage2Url(season, week, config) {
      return (
        `${RAW_ROOT}/docs/win/football/nfl/prop_engine/prop_picks_final/` +
        `${season}/stage_2/week_${week}/${config.path}/` +
        `week_${week}_${config.suffix}.csv`
      );
    }

    function scheduleUrl(week) {
      return (
        `${RAW_ROOT}/docs/win/football/nfl/00_intake/schedule/weekly/` +
        `week_${week}_NFL_weekly_schedule.csv`
      );
    }

    function numeric(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function formatProb(value) {
      const n = numeric(value);
      return n === null ? "" : n.toFixed(4);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function gameLabel(gameId) {
      const game = state.schedule.find(
        g => String(g.game_id) === String(gameId)
      );

      if (!game) return String(gameId);

      return `${game.away_team} @ ${game.home_team}`;
    }

    function renderSeasonSelect() {
      const select = document.getElementById("seasonSelect");
      select.innerHTML = "";

      AVAILABLE_SEASONS.forEach(season => {
        const option = document.createElement("option");
        option.value = String(season);
        option.textContent = String(season);
        option.selected = season === state.season;
        select.appendChild(option);
      });
    }

    function renderWeekSelect() {
      const select = document.getElementById("weekSelect");
      select.innerHTML = "";

      AVAILABLE_WEEKS.forEach(week => {
        const option = document.createElement("option");
        option.value = String(week);
        option.textContent = `Week ${week}`;
        option.selected = week === state.week;
        select.appendChild(option);
      });
    }

    function renderPropButtons() {
      const container = document.getElementById("propButtons");
      container.innerHTML = "";

      PROP_TYPES.forEach(config => {
        const count = state.props.filter(
          row => row.prop_type === config.key && row.pick !== "no_bet"
        ).length;

        const button = document.createElement("button");
        button.textContent = `${config.label} (${count})`;
        button.classList.toggle(
          "active",
          state.selectedProp === config.key
        );

        button.onclick = () => {
          state.selectedProp = config.key;
          state.selectedGame = null;
          renderPropButtons();
          renderGameButtons();
          renderResults();
        };

        container.appendChild(button);
      });
    }

    function renderGameButtons() {
      const container = document.getElementById("gameButtons");
      container.innerHTML = "";

      state.schedule.forEach(game => {
        const gameId = String(game.game_id);
        const count = state.props.filter(
          row =>
            String(row.game_id) === gameId &&
            row.pick !== "no_bet"
        ).length;

        const button = document.createElement("button");
        button.className = "game-button";
        button.classList.toggle(
          "active",
          state.selectedGame === gameId
        );

        const teams = document.createElement("span");
        teams.className = "teams";
        teams.textContent = `${game.away_team} @ ${game.home_team}`;

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `${game.game_date || ""} • ${count} picks`;

        button.appendChild(teams);
        button.appendChild(meta);

        button.onclick = () => {
          state.selectedGame = gameId;
          state.selectedProp = null;
          renderPropButtons();
          renderGameButtons();
          renderResults();
        };

        container.appendChild(button);
      });
    }

    function renderResults() {
      const target = document.getElementById("results");
      const title = document.getElementById("resultsTitle");
      const count = document.getElementById("resultCount");

      let rows = state.props.filter(row => row.pick !== "no_bet");

      if (state.selectedProp) {
        const config = PROP_TYPES.find(
          p => p.key === state.selectedProp
        );

        rows = rows.filter(
          row => row.prop_type === state.selectedProp
        );

        title.textContent = config ? config.label : "Picks";
      } else if (state.selectedGame) {
        rows = rows.filter(
          row => String(row.game_id) === state.selectedGame
        );

        title.textContent = gameLabel(state.selectedGame);
      } else {
        title.textContent = "Picks";
      }

      rows.sort(
        (a, b) =>
          (numeric(b.pick_prob) ?? -1) -
          (numeric(a.pick_prob) ?? -1)
      );

      count.textContent = `${rows.length} picks`;

      if (!rows.length) {
        target.innerHTML =
          '<div class="empty">No qualifying picks.</div>';
        return;
      }

      const cards = rows.map(row => {
        const config = PROP_TYPES.find(
          p => p.key === row.prop_type
        );

        const pickClass =
          row.pick === "over" ? "pick-over" : "pick-under";

        return `
          <article class="pick-card-nfl">
            <div class="pick-card-head">
              <div>
                <div class="pick-player">${escapeHtml(row.player_name)}</div>
                <div class="pick-prop">${escapeHtml(config?.label || row.prop_type)}</div>
                <div class="pick-game">${escapeHtml(gameLabel(row.game_id))}</div>
              </div>
              <div class="pick-choice ${pickClass}">${escapeHtml(row.pick)}</div>
            </div>
            <div class="pick-metrics">
              <div class="pick-metric">
                <div class="pick-metric-label">Sportsbook Line</div>
                <div class="pick-metric-value">${escapeHtml(row[config.line])}</div>
              </div>
              <div class="pick-metric">
                <div class="pick-metric-label">Pick Prob</div>
                <div class="pick-metric-value prob">${escapeHtml(formatProb(row.pick_prob))}</div>
              </div>
              <div class="pick-metric">
                <div class="pick-metric-label">Over Prob</div>
                <div class="pick-metric-value">${escapeHtml(formatProb(row.over_prob))}</div>
              </div>
              <div class="pick-metric">
                <div class="pick-metric-label">Under Prob</div>
                <div class="pick-metric-value">${escapeHtml(formatProb(row.under_prob))}</div>
              </div>
              <div class="pick-metric">
                <div class="pick-metric-label">Projection</div>
                <div class="pick-metric-value">${escapeHtml(row[config.projection])}</div>
              </div>
              <div class="pick-metric">
                <div class="pick-metric-label">Low</div>
                <div class="pick-metric-value">${escapeHtml(row[config.low])}</div>
              </div>
              <div class="pick-metric">
                <div class="pick-metric-label">High</div>
                <div class="pick-metric-value">${escapeHtml(row[config.high])}</div>
              </div>
            </div>
          </article>
        `;
      }).join("");

      target.innerHTML = `<div class="pick-grid">${cards}</div>`;
    }

    async function loadWeek() {
      const status = document.getElementById("status");

      status.textContent =
        `Loading ${state.season} Week ${state.week}...`;

      state.schedule = [];
      state.props = [];

      const schedulePromise = fetchCsv(scheduleUrl(state.week))
        .catch(() => []);

      const propPromises = PROP_TYPES.map(async config => {
        try {
          const rows = await fetchCsv(
            stage2Url(state.season, state.week, config)
          );

          return rows.map(row => ({
            ...row,
            prop_type: config.key
          }));
        } catch (_) {
          return [];
        }
      });

      const [schedule, propGroups] = await Promise.all([
        schedulePromise,
        Promise.all(propPromises)
      ]);

      state.schedule = schedule.filter(
        row =>
          !row.season ||
          String(row.season) === String(state.season)
      );

      state.props = propGroups.flat();

      renderPropButtons();
      renderGameButtons();
      renderResults();

      if (!state.schedule.length && !state.props.length) {
        status.textContent =
          `No data found for ${state.season} Week ${state.week}.`;
      } else {
        status.textContent =
          `${state.season} Week ${state.week}`;
      }
    }

    async function init() {
      renderSeasonSelect();
      renderWeekSelect();

      document.getElementById("seasonSelect").addEventListener("change", async event => {
        state.season = Number(event.target.value);
        state.selectedProp = null;
        state.selectedGame = null;
        await loadWeek();
      });

      document.getElementById("weekSelect").addEventListener("change", async event => {
        state.week = Number(event.target.value);
        state.selectedProp = null;
        state.selectedGame = null;
        await loadWeek();
      });

      await loadWeek();
    }

    init();
  </script>
</body>
</html>
