<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions · Edgelytics</title>
  <link rel="stylesheet" href="assets/css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    .page-header {
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-top: 2px;
      line-height: 1.5;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
      position: relative;
      z-index: 20;
    }

    .league-pill,
    .group-pill,
    .submenu-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      line-height: 1.2;
      white-space: nowrap;
    }

    .league-pill:hover,
    .group-pill:hover,
    .submenu-pill:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .league-pill.active,
    .group-pill.active,
    .submenu-pill.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.06);
    }

    .control-group {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .group-pill::after {
      content: " ▾";
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0;
    }

    .group-pill.active::after,
    .group-pill:hover::after {
      color: var(--accent-green);
    }

    .control-group.open .group-pill {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
      background: rgba(0,191,255,0.04);
    }

    .control-group.open .group-pill.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.06);
    }

    .submenu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 190px;
      display: none;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: var(--background);
      border: 1px solid var(--border-soft);
      box-shadow: 0 18px 44px rgba(0,0,0,0.45);
      z-index: 50;
    }

    .control-group.open .submenu {
      display: flex;
    }

    .submenu-pill {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
    }

    .search-box {
      margin-left: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 5px 10px;
      width: 220px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-blue);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .status-bar {
      padding: 8px 24px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-bar.loading {
      color: var(--accent-yellow);
    }

    .status-bar.error {
      color: var(--accent-red);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-dot.yellow {
      background: var(--accent-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.red {
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red);
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%     { opacity: 0.3; }
    }

    .filter-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .toolbar-select {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      padding: 6px 9px;
      outline: none;
      color-scheme: dark;
    }

    .toolbar-select:focus {
      border-color: var(--accent-blue);
    }

    .result-count {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .main {
      padding: 18px 24px 36px;
    }

    .txn-feed {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .txn-date-group {
      margin-top: 18px;
    }

    .txn-date-group:first-child {
      margin-top: 0;
    }

    .txn-date-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 0 7px;
      border-bottom: 1px solid var(--border-soft);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .txn-date-count {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 9px;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .txn-row {
      display: grid;
      grid-template-columns: 74px 58px 116px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      padding: 10px 10px;
      border-bottom: 1px solid var(--border-soft);
      border-left: 2px solid transparent;
      background: var(--background);
      transition: background 0.1s, border-color 0.1s;
    }

    .txn-row:hover {
      background: var(--bg-card);
      border-left-color: var(--accent-green);
    }

    .txn-league {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .league-NHL {
      color: var(--accent-blue);
    }

    .league-NBA,
    .league-WNBA,
    .league-NCAAM {
      color: var(--accent-yellow);
    }

    .league-MLB,
    .league-NFL,
    .league-CFB,
    .league-CFL {
      color: var(--accent-green);
    }

    .league-MLS,
    .league-EPL,
    .league-LALIGA,
    .league-LIGUE1,
    .league-SERIEA,
    .league-BUNDESLIGA {
      color: var(--accent-blue);
    }

    .league-UFC {
      color: var(--accent-red);
    }

    .txn-team {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: var(--text-main);
    }

    .txn-type {
      display: inline-block;
      width: fit-content;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      padding: 2px 6px;
      border: 1px solid var(--border-soft);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .type-signed {
      color: var(--accent-green);
      border-color: rgba(0,255,132,0.3);
      background: rgba(0,255,132,0.06);
    }

    .type-trade,
    .type-claimed {
      color: var(--accent-blue);
      border-color: rgba(0,191,255,0.3);
      background: rgba(0,191,255,0.06);
    }

    .type-il,
    .type-released {
      color: var(--accent-red);
      border-color: rgba(255,68,68,0.3);
      background: rgba(255,68,68,0.06);
    }

    .type-reinstated,
    .type-recalled {
      color: var(--accent-green);
      border-color: rgba(0,255,132,0.25);
      background: rgba(0,255,132,0.04);
    }

    .type-optioned,
    .type-waived {
      color: var(--accent-yellow);
      border-color: rgba(250,204,21,0.28);
      background: rgba(250,204,21,0.05);
    }

    .type-other {
      color: var(--text-muted);
    }

    .txn-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
      min-width: 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .load-more {
      display: none;
      margin: 16px auto 0;
      padding: 7px 18px;
      border: 1px solid rgba(0,255,132,0.3);
      background: transparent;
      color: var(--accent-green);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .load-more:hover {
      background: rgba(0,255,132,0.06);
    }

    @media (max-width: 760px) {
      .controls {
        align-items: stretch;
      }

      .control-group {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      .league-pill,
      .group-pill {
        width: 100%;
        text-align: left;
      }

      .submenu {
        position: static;
        width: 100%;
        min-width: 0;
        margin-top: 6px;
        box-shadow: none;
        background: transparent;
      }

      .submenu-pill {
        padding-left: 22px;
      }

      .search-box {
        margin-left: 0;
        width: 100%;
      }
    }

    @media (max-width: 600px) {
      .page-header,
      .controls,
      .status-bar,
      .main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .filter-toolbar {
        padding-left: 16px;
        padding-right: 16px;
      }

      .result-count {
        width: 100%;
        margin-left: 0;
      }

      .txn-row {
        grid-template-columns: 64px 52px 1fr;
        gap: 6px 10px;
      }

      .txn-type {
        justify-self: start;
      }

      .txn-desc {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Transactions</div>
    <div class="page-subtitle">All · Football · NHL · MLB · Basketball · Soccer · UFC</div>
  </div>
</div>

<div class="controls" id="league-controls">
  <button type="button" class="league-pill active" data-filter-type="all" data-filter-value="all">All</button>

  <div class="control-group" data-group="football">
    <button type="button" class="group-pill" data-group-toggle="football">Football</button>
    <div class="submenu">
      <button type="button" class="submenu-pill" data-filter-type="group" data-filter-value="football">All Football</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="NFL">NFL</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="CFB">College Football</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="CFL">CFL</button>
    </div>
  </div>

  <button type="button" class="league-pill" data-filter-type="league" data-filter-value="NHL">NHL</button>
  <button type="button" class="league-pill" data-filter-type="league" data-filter-value="MLB">MLB</button>

  <div class="control-group" data-group="basketball">
    <button type="button" class="group-pill" data-group-toggle="basketball">Basketball</button>
    <div class="submenu">
      <button type="button" class="submenu-pill" data-filter-type="group" data-filter-value="basketball">All Basketball</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="NBA">NBA</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="NCAAM">College Basketball</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="WNBA">WNBA</button>
    </div>
  </div>

  <div class="control-group" data-group="soccer">
    <button type="button" class="group-pill" data-group-toggle="soccer">Soccer</button>
    <div class="submenu">
      <button type="button" class="submenu-pill" data-filter-type="group" data-filter-value="soccer">All Soccer</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="MLS">MLS</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="EPL">EPL</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="LALIGA">La Liga</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="LIGUE1">Ligue 1</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="SERIEA">Serie A</button>
      <button type="button" class="submenu-pill" data-filter-type="league" data-filter-value="BUNDESLIGA">Bundesliga</button>
    </div>
  </div>

  <button type="button" class="league-pill" data-filter-type="league" data-filter-value="UFC">UFC</button>

  <input type="text" class="search-box" id="txn-search" placeholder="Search team or move...">
</div>

<div class="status-bar" id="txn-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>

<div class="filter-toolbar">
  <span class="toolbar-label">Type</span>
  <select class="toolbar-select" id="type-filter">
    <option value="all">All</option>
    <option value="signed">Signed</option>
    <option value="trade">Trade</option>
    <option value="il">Injured List</option>
    <option value="reinstated">Activated / Reinstated</option>
    <option value="recalled">Recalled</option>
    <option value="optioned">Optioned / Assigned</option>
    <option value="claimed">Claimed</option>
    <option value="waived">Waived</option>
    <option value="released">Released / DFA</option>
    <option value="other">Other</option>
  </select>

  <span class="toolbar-label">Period</span>
  <select class="toolbar-select" id="period-filter">
    <option value="today">Today</option>
    <option value="3">Last 3 Days</option>
    <option value="7" selected>Last 7 Days</option>
    <option value="30">Last 30 Days</option>
    <option value="all">All Loaded</option>
  </select>

  <span class="result-count" id="result-count">—</span>
</div>

<div class="main">
  <div class="txn-feed" id="txn-feed"></div>
  <div class="empty-state" id="txn-empty" style="display:none">No transactions found</div>
  <button type="button" class="load-more" id="load-more">Load 50 More</button>
</div>

<script src="assets/js/shared/nav.js"></script>
<script>
var SOURCES = [
  { key: "NHL",        label: "NHL",                group: "hockey",     sport: "hockey",     league: "nhl"                    },
  { key: "MLB",        label: "MLB",                group: "baseball",   sport: "baseball",   league: "mlb"                    },

  { key: "NBA",        label: "NBA",                group: "basketball", sport: "basketball", league: "nba"                    },
  { key: "NCAAM",      label: "College Basketball", group: "basketball", sport: "basketball", league: "mens-college-basketball" },
  { key: "WNBA",       label: "WNBA",               group: "basketball", sport: "basketball", league: "wnba"                   },

  { key: "MLS",        label: "MLS",                group: "soccer",     sport: "soccer",     league: "usa.1"                  },
  { key: "EPL",        label: "EPL",                group: "soccer",     sport: "soccer",     league: "eng.1"                  },
  { key: "LALIGA",     label: "La Liga",            group: "soccer",     sport: "soccer",     league: "esp.1"                  },
  { key: "LIGUE1",     label: "Ligue 1",            group: "soccer",     sport: "soccer",     league: "fra.1"                  },
  { key: "SERIEA",     label: "Serie A",            group: "soccer",     sport: "soccer",     league: "ita.1"                  },
  { key: "BUNDESLIGA", label: "Bundesliga",         group: "soccer",     sport: "soccer",     league: "ger.1"                  },

  { key: "UFC",        label: "UFC",                group: "mma",        sport: "mma",        league: "ufc"                    },

  { key: "NFL",        label: "NFL",                group: "football",   sport: "football",   league: "nfl"                    },
  { key: "CFB",        label: "College Football",   group: "football",   sport: "football",   league: "college-football"       },
  { key: "CFL",        label: "CFL",                group: "football",   sport: "football",   league: "cfl"                    }
];

var GROUPS = {
  football: ["NFL", "CFB", "CFL"],
  basketball: ["NBA", "NCAAM", "WNBA"],
  soccer: ["MLS", "EPL", "LALIGA", "LIGUE1", "SERIEA", "BUNDESLIGA"]
};

var PAGE_SIZE = 50;

var allTxns = [];
var activeFilterType = "all";
var activeFilterValue = "all";
var searchQuery = "";
var typeFilter = "all";
var periodFilter = "7";
var visibleLimit = PAGE_SIZE;

function escapeHtml(value) {
  return String(value || "").replace(/[&<>'"]/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "'": "&#39;",
      '"': "&quot;"
    }[char];
  });
}

function setStatus(text, cls, dotCls) {
  document.getElementById("status-text").textContent = text;
  document.getElementById("txn-status").className = "status-bar " + (cls || "");
  document.getElementById("status-dot").className = "status-dot " + (dotCls || "");
}

function parseTxnDate(str) {
  if (!str) return null;

  var d = new Date(str);
  if (isNaN(d.getTime())) return null;

  return d;
}

function fmtDateHeading(str) {
  var d = parseTxnDate(str);
  if (!d) return "Unknown Date";

  return d.toLocaleDateString("en-US", {
    month: "long",
    day: "numeric",
    year: "numeric"
  });
}

function dateGroupKey(str) {
  var d = parseTxnDate(str);
  if (!d) return "unknown";

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function transactionAgeDays(str) {
  var d = parseTxnDate(str);
  if (!d) return Number.POSITIVE_INFINITY;

  var now = new Date();

  var txnDay = new Date(
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  );

  var today = new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  );

  return Math.floor(
    (today.getTime() - txnDay.getTime()) /
    86400000
  );
}

function classifyTransaction(desc) {
  var text = String(desc || "").toLowerCase();

  if (/\btraded\b|\btrade\b/.test(text)) {
    return { key: "trade", label: "Trade" };
  }

  if (/\bsigned\b|\bsigns\b|\bsigning\b/.test(text)) {
    return { key: "signed", label: "Signed" };
  }

  if (
    /\binjured list\b|\bdisabled list\b|\bplaced\b.*\bil\b|\b15-day il\b|\b10-day il\b|\b60-day il\b/.test(text)
  ) {
    return { key: "il", label: "Injured List" };
  }

  if (/\bdesignated\b.*\bassignment\b|\bdfa\b|\breleased\b/.test(text)) {
    return { key: "released", label: "Released / DFA" };
  }

  if (/\breinstated\b|\bactivated\b/.test(text)) {
    return { key: "reinstated", label: "Reinstated" };
  }

  if (/\brecalled\b/.test(text)) {
    return { key: "recalled", label: "Recalled" };
  }

  if (/\boptioned\b|\bassigned\b|\bassignment\b/.test(text)) {
    return { key: "optioned", label: "Optioned" };
  }

  if (/\bclaimed\b/.test(text)) {
    return { key: "claimed", label: "Claimed" };
  }

  if (/\bwaived\b|\bwaivers\b/.test(text)) {
    return { key: "waived", label: "Waived" };
  }

  return { key: "other", label: "Other" };
}

function sourceLabel(key) {
  var found = SOURCES.find(function(source) {
    return source.key === key;
  });

  return found ? found.label : key;
}

function sourceGroup(key) {
  var found = SOURCES.find(function(source) {
    return source.key === key;
  });

  return found ? found.group : "";
}

function closeAllMenus() {
  document.querySelectorAll(".control-group").forEach(function(group) {
    group.classList.remove("open");
  });
}

function setActiveControls(type, value) {
  document.querySelectorAll(".league-pill, .group-pill, .submenu-pill").forEach(function(button) {
    button.classList.remove("active");
  });

  if (type === "all") {
    var allButton = document.querySelector('[data-filter-type="all"][data-filter-value="all"]');
    if (allButton) allButton.classList.add("active");
    return;
  }

  if (type === "group") {
    var groupButton = document.querySelector('[data-group-toggle="' + value + '"]');
    var groupSubButton = document.querySelector('.submenu-pill[data-filter-type="group"][data-filter-value="' + value + '"]');

    if (groupButton) groupButton.classList.add("active");
    if (groupSubButton) groupSubButton.classList.add("active");
    return;
  }

  if (type === "league") {
    var directButton = document.querySelector('.league-pill[data-filter-type="league"][data-filter-value="' + value + '"]');
    var childButton = document.querySelector('.submenu-pill[data-filter-type="league"][data-filter-value="' + value + '"]');
    var group = sourceGroup(value);

    if (directButton) directButton.classList.add("active");
    if (childButton) childButton.classList.add("active");

    if (group) {
      var parentButton = document.querySelector('[data-group-toggle="' + group + '"]');
      if (parentButton) parentButton.classList.add("active");
    }
  }
}

function applyFilter(type, value) {
  activeFilterType = type;
  activeFilterValue = value;
  visibleLimit = PAGE_SIZE;

  closeAllMenus();
  setActiveControls(type, value);
  render();
}

function matchesPeriod(row) {
  if (periodFilter === "all") {
    return true;
  }

  var ageDays = transactionAgeDays(row.date);

  if (!Number.isFinite(ageDays) || ageDays < 0) {
    return false;
  }

  if (periodFilter === "today") {
    return ageDays === 0;
  }

  var days = parseInt(periodFilter, 10);

  if (!Number.isFinite(days)) {
    return true;
  }

  return ageDays <= (days - 1);
}

function filteredTransactions() {
  var rows = allTxns.slice();

  if (activeFilterType === "league") {
    rows = rows.filter(function(row) {
      return row.league === activeFilterValue;
    });
  }

  if (activeFilterType === "group") {
    var allowed = GROUPS[activeFilterValue] || [];

    rows = rows.filter(function(row) {
      return allowed.indexOf(row.league) !== -1;
    });
  }

  if (typeFilter !== "all") {
    rows = rows.filter(function(row) {
      return row.typeKey === typeFilter;
    });
  }

  rows = rows.filter(matchesPeriod);

  if (searchQuery) {
    var q = searchQuery.toLowerCase();

    rows = rows.filter(function(row) {
      return String(row.team || "").toLowerCase().indexOf(q) !== -1 ||
             String(row.teamName || "").toLowerCase().indexOf(q) !== -1 ||
             String(row.desc || "").toLowerCase().indexOf(q) !== -1 ||
             String(row.label || "").toLowerCase().indexOf(q) !== -1 ||
             String(row.typeLabel || "").toLowerCase().indexOf(q) !== -1;
    });
  }

  rows.sort(function(a, b) {
    var at = a.date ? new Date(a.date).getTime() : 0;
    var bt = b.date ? new Date(b.date).getTime() : 0;
    return bt - at;
  });

  return rows;
}

function render() {
  var rows = filteredTransactions();
  var shown = rows.slice(0, visibleLimit);

  var feed = document.getElementById("txn-feed");
  var empty = document.getElementById("txn-empty");
  var loadMore = document.getElementById("load-more");
  var resultCount = document.getElementById("result-count");

  feed.innerHTML = "";

  resultCount.textContent =
    "Showing " +
    Math.min(shown.length, rows.length) +
    " of " +
    rows.length +
    " matching transactions";

  if (rows.length === 0) {
    empty.style.display = "";
    loadMore.style.display = "none";
    return;
  }

  empty.style.display = "none";

  var currentGroupKey = "";
  var currentGroup = null;
  var currentRows = null;
  var groupCounts = {};

  shown.forEach(function(t) {
    var groupKey = dateGroupKey(t.date);

    if (!groupCounts[groupKey]) {
      groupCounts[groupKey] = 0;
    }

    groupCounts[groupKey]++;
  });

  shown.forEach(function(t) {
    var groupKey = dateGroupKey(t.date);

    if (groupKey !== currentGroupKey) {
      currentGroupKey = groupKey;

      currentGroup = document.createElement("section");
      currentGroup.className = "txn-date-group";

      var heading = document.createElement("div");
      heading.className = "txn-date-heading";
      heading.innerHTML =
        '<span>' + escapeHtml(fmtDateHeading(t.date)) + '</span>' +
        '<span class="txn-date-count">' +
          groupCounts[groupKey] +
          ' shown' +
        '</span>';

      currentRows = document.createElement("div");

      currentGroup.appendChild(heading);
      currentGroup.appendChild(currentRows);
      feed.appendChild(currentGroup);
    }

    var row = document.createElement("div");
    row.className = "txn-row";

    var teamTitle = t.teamName || t.team || "";

    row.innerHTML =
      '<div class="txn-league league-' + escapeHtml(t.league) + '">' +
        escapeHtml(t.label || sourceLabel(t.league)) +
      '</div>' +

      '<div class="txn-team" title="' + escapeHtml(teamTitle) + '">' +
        escapeHtml(t.team || "—") +
      '</div>' +

      '<div>' +
        '<span class="txn-type type-' + escapeHtml(t.typeKey) + '">' +
          escapeHtml(t.typeLabel) +
        '</span>' +
      '</div>' +

      '<div class="txn-desc">' +
        escapeHtml(t.desc || "—") +
      '</div>';

    currentRows.appendChild(row);
  });

  loadMore.style.display =
    rows.length > visibleLimit
      ? "block"
      : "none";
}

async function fetchLeagueTransactions(source) {
  var url = "https://site.api.espn.com/apis/site/v2/sports/" +
    source.sport + "/" +
    source.league +
    "/transactions";

  try {
    var response = await fetch(url, { cache: "no-store" });

    if (!response.ok) return [];

    var data = await response.json();
    var txns = data.transactions || [];

    return txns.map(function(t) {
      var classification = classifyTransaction(t.description || "");

      return {
        league: source.key,
        label: source.label,
        group: source.group,
        date: t.date || "",
        team: t.team ? (t.team.abbreviation || t.team.displayName || "") : "",
        teamName: t.team ? (t.team.displayName || t.team.name || t.team.abbreviation || "") : "",
        desc: t.description || "",
        typeKey: classification.key,
        typeLabel: classification.label
      };
    });
  } catch (error) {
    console.warn(source.key + " transactions failed:", error);
    return [];
  }
}

async function loadAll() {
  setStatus("Fetching transactions...", "loading", "yellow");
  allTxns = [];

  try {
    var results = await Promise.all(SOURCES.map(function(source) {
      return fetchLeagueTransactions(source);
    }));

    results.forEach(function(rows) {
      allTxns = allTxns.concat(rows);
    });

    render();

    if (allTxns.length === 0) {
      setStatus("No transactions loaded", "", "");
    } else {
      var updatedTime = new Date().toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit"
      });

      setStatus(
        allTxns.length +
        " TRANSACTIONS LOADED · UPDATED " +
        updatedTime,
        "",
        "green"
      );
    }
  } catch (error) {
    console.error(error);
    setStatus("Error loading transactions", "error", "red");
    render();
  }
}

document.querySelectorAll("[data-group-toggle]").forEach(function(button) {
  button.addEventListener("click", function(event) {
    event.stopPropagation();

    var groupName = button.dataset.groupToggle;
    var group = document.querySelector('.control-group[data-group="' + groupName + '"]');
    var wasOpen = group && group.classList.contains("open");

    closeAllMenus();

    if (group && !wasOpen) {
      group.classList.add("open");
    }
  });
});

document.querySelectorAll("[data-filter-type]").forEach(function(button) {
  button.addEventListener("click", function(event) {
    event.stopPropagation();

    applyFilter(button.dataset.filterType, button.dataset.filterValue);
  });
});

document.addEventListener("click", function(event) {
  if (!event.target.closest(".control-group")) {
    closeAllMenus();
  }
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeAllMenus();
  }
});

document.getElementById("txn-search").addEventListener("input", function(event) {
  searchQuery = event.target.value.trim();
  visibleLimit = PAGE_SIZE;
  render();
});

document.getElementById("type-filter").addEventListener("change", function(event) {
  typeFilter = event.target.value;
  visibleLimit = PAGE_SIZE;
  render();
});

document.getElementById("period-filter").addEventListener("change", function(event) {
  periodFilter = event.target.value;
  visibleLimit = PAGE_SIZE;
  render();
});

document.getElementById("load-more").addEventListener("click", function() {
  visibleLimit += PAGE_SIZE;
  render();
});

loadAll();
</script>
</body>
</html>
