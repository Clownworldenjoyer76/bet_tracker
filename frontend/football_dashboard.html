<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Analytics</title>
<link rel="stylesheet" href="assets/css/matstheme.css">
<style>
.master-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 20px 48px;
}
.master-head {
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border-soft);
  padding-bottom: 14px;
}
.master-head h1 {
  margin: 0 0 6px;
  font-size: 24px;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.master-sub {
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.league-grid-master {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
}
.league-card {
  display: block;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  border-radius: 4px;
  padding: 18px;
  color: var(--text-main);
  text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.league-card:hover {
  border-color: var(--accent-green);
  transform: translateY(-1px);
}
.league-name {
  color: var(--accent-green);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.league-link {
  margin-top: 10px;
  color: var(--text-muted);
  font-size: 10px;
  letter-spacing: 1px;
}
</style>
</head>
<body>
<div id="nav-placeholder"></div>
<main class="master-wrap">
  <div class="master-head">
    <h1>Football Analytics</h1>
    <div class="master-sub">Master sport dashboard · 3 leagues configured</div>
  </div>
  <div class="league-grid-master">
      <a class="league-card" href="nfl_dashboard.html">
        <div class="league-name">NFL</div>
        <div class="league-link">OPEN DASHBOARD →</div>
      </a>
      <a class="league-card" href="ncaaf_dashboard.html">
        <div class="league-name">College Football</div>
        <div class="league-link">OPEN DASHBOARD →</div>
      </a>
      <a class="league-card" href="cfl_dashboard.html">
        <div class="league-name">CFL</div>
        <div class="league-link">OPEN DASHBOARD →</div>
      </a>
  </div>
</main>
<script src="assets/js/shared/nav.js"></script>
</body>
</html>
