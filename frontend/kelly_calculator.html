<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/matstheme.css">
<link rel="stylesheet" href="assets/css/pages/kelly_calculator.css">
<link rel="stylesheet" href="assets/css/site-polish.css">
</head>
<body>

<div id="nav-placeholder"></div>

<div class="picks-header">
  <h1 class="picks-title">KELLY CALCULATOR</h1>
</div>

<div class="league-filter-controls" id="league-controls">
  <button type="button" class="league-pill active" data-league-key="all">All</button>

  <button type="button" class="league-pill" data-league-key="cfb">College Football</button>

  <button type="button" class="league-pill" data-league-key="nhl">NHL</button>

  <button type="button" class="league-pill" data-league-key="mlb">MLB</button>
  <button type="button" class="league-pill" data-league-key="mlb_lineups">MLB · With Lineups</button>

  <button type="button" class="league-pill" data-league-key="nba">NBA</button>
  <button type="button" class="league-pill" data-league-key="wnba">WNBA</button>

  <button type="button" class="league-pill" data-league-key="mls">MLS</button>
  <button type="button" class="league-pill" data-league-key="epl">EPL</button>
  <button type="button" class="league-pill" data-league-key="laliga">La Liga</button>
  <button type="button" class="league-pill" data-league-key="ligue1">Ligue 1</button>
  <button type="button" class="league-pill" data-league-key="seriea">Serie A</button>
  <button type="button" class="league-pill" data-league-key="bundesliga">Bundesliga</button>

  <button type="button" class="league-pill" data-league-key="ufc">UFC</button>
</div>

<div class="picks-controls">
  <div class="ctrl-group">
    <label class="ctrl-label" for="date-picker">Date</label>
    <input type="date" id="date-picker">
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label" id="kelly-ufc-event-label">UFC Event</span>
    <div id="kelly-ufc-event" role="status" aria-live="polite" aria-labelledby="kelly-ufc-event-label">Loading...</div>
  </div>
  <div class="ctrl-group">
    <label class="ctrl-label" for="bankroll">Bankroll</label>
    <div class="bankroll-wrap">
      <span class="dollar">$</span>
      <input type="number" id="bankroll" placeholder="10000" min="0" step="100" autocomplete="off" data-private="true">
    </div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label" id="kelly-fraction-label">Kelly Fraction</span>
    <div class="fraction-btns" role="group" aria-labelledby="kelly-fraction-label">
      <button type="button" data-frac="1" class="active" aria-pressed="true">Full</button>
      <button type="button" data-frac="0.5" aria-pressed="false">Half</button>
      <button type="button" data-frac="0.25" aria-pressed="false">Quarter</button>
    </div>
  </div>
</div>

<div class="totals-bar">
  <div class="total-item">
    <span class="t-label">Total Picks</span>
    <div class="t-val" id="total-picks">—</div>
  </div>
  <div class="total-item">
    <span class="t-label">Total to Bet</span>
    <div class="t-val" id="total-bet">—</div>
  </div>
  <div class="total-item">
    <span class="t-label">% of Bankroll</span>
    <div class="t-val" id="total-pct">—</div>
  </div>
</div>

<div class="picks-body" id="picks-container">
  <div class="loading-state">Loading picks...</div>
</div>

<script src="assets/js/shared/config.js"></script>

<script src="assets/js/pages/kelly_calculator.js"></script>
<script src="assets/js/shared/nav.js"></script>
<script src="assets/js/shared/league_nav.js"></script>
<script src="assets/js/pages/kelly_calculator.2.js"></script>
</body>
</html>
