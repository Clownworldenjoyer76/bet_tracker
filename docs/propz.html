<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prop Finder</title>

<style>
body {
  font-family: Arial;
  background:#0e1117;
  color:#e6edf3;
  padding:20px;
}
.controls {
  margin-bottom:15px;
}
select,input,button {
  padding:6px;
  margin:4px;
}
.card {
  border:1px solid #30363d;
  padding:12px;
  margin:10px 0;
}
.good { color:#00ff88; }
.mid { color:#facc15; }
.bad { color:#ef4444; }
.header {
  font-weight:bold;
  margin-top:10px;
  margin-bottom:5px;
  color:#58a6ff;
}
</style>
</head>

<body>

<h2>Multi-Sport Prop Finder</h2>

<div class="controls">
  <label>League:</label>
  <select id="league">
    <option value="nba">NBA</option>
    <option value="nhl">NHL</option>
    <option value="mlb">MLB</option>
  </select>

  <label>Prop:</label>
  <select id="prop"></select>

  <label>Type:</label>
  <select id="type">
    <option value="over">Over</option>
    <option value="under">Under</option>
  </select>

  <label>Line:</label>
  <input type="number" id="line" value="1.5" step="0.5">

  <label>Last N Games:</label>
  <input type="number" id="games" value="10">

  <label>Min Hit %:</label>
  <input type="number" id="hit" value="80">

  <label>Min Streak:</label>
  <input type="number" id="streak" value="5">

  <button onclick="run()">Run</button>
</div>

<div id="results"></div>

<script>

// ================= CONFIG =================

const CONFIG = {
  nba: {
    sport: "basketball",
    props: {
      "Points": ['points'],
      "Rebounds": ['rebounds'],
      "Assists": ['assists'],
      "Blocks": ['blocks'],
      "Steals": ['steals'],
      "3PM": ['three']
    }
  },
  nhl: {
    sport: "hockey",
    props: {
      "Goals": ['goals'],
      "Assists": ['assists'],
      "Points": ['points'],
      "Shots": ['shots']
    }
  },
  mlb: {
    sport: "baseball",
    props: {
      "Hits": ['hits'],
      "RBI": ['rbi'],
      "Strikeouts": ['strike'],
      "Home Runs": ['home']
    }
  }
};

// ================= UI =================

function populateProps(){
  let league = document.getElementById('league').value;
  let propSel = document.getElementById('prop');
  propSel.innerHTML = '';

  Object.keys(CONFIG[league].props).forEach(p=>{
    let o = document.createElement('option');
    o.textContent = p;
    propSel.appendChild(o);
  });
}

document.getElementById('league').addEventListener('change', populateProps);
populateProps();

// ================= HELPERS =================

function today(){
  let d = new Date();
  return d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0');
}

function isHit(val,line,type){
  return type === 'over' ? val > line : val < line;
}

function getStreak(games,line,type){
  let s=0;
  for(let g of games){
    if(isHit(g.val,line,type)) s++;
    else break;
  }
  return s;
}

async function fetchJSON(url){
  try{
    let r = await fetch(url);
    return await r.json();
  }catch{
    return null;
  }
}

// 🔥 FIXED extraction (robust)
function extract(labels,names,stats,keys){
  labels = labels || [];
  names  = names  || [];
  stats  = stats  || [];

  for(let i=0;i<labels.length;i++){
    let label = (labels[i]||'').toLowerCase();
    for(let k of keys){
      if(label.includes(k)) return parseFloat(stats[i]);
    }
  }

  for(let i=0;i<names.length;i++){
    let name = (names[i]||'').toLowerCase();
    for(let k of keys){
      if(name.includes(k)) return parseFloat(stats[i]);
    }
  }

  return null;
}

function parseGames(data,keys){
  let gl = data.gameLog || {};
  let sg = (gl.statistics||[])[0];
  if(!sg) return [];

  let games=[];

  for(let e of sg.events||[]){
    let val = extract(sg.labels, sg.names, e.stats, keys);
    if(val!=null) games.push({val});
  }

  return games;
}

// ================= MAIN =================

async function run(){

  let league = document.getElementById('league').value;
  let prop   = document.getElementById('prop').value;
  let type   = document.getElementById('type').value;
  let line   = parseFloat(document.getElementById('line').value);
  let lastN  = parseInt(document.getElementById('games').value);
  let minHit = parseFloat(document.getElementById('hit').value)/100;
  let minStr = parseInt(document.getElementById('streak').value);

  let conf = CONFIG[league];

  let results = document.getElementById('results');
  results.innerHTML = "<div>Loading...</div>";

  let scoreboard = await fetchJSON(
    `https://site.api.espn.com/apis/site/v2/sports/${conf.sport}/${league}/scoreboard?dates=${today()}`
  );

  let matches = [];
  let fallback = [];

  for(let game of scoreboard.events || []){
    let comp = game.competitions[0];

    for(let team of comp.competitors){
      let teamId = team.team.id;

      let roster = await fetchJSON(
        `https://site.api.espn.com/apis/site/v2/sports/${conf.sport}/${league}/teams/${teamId}/roster`
      );

      let players=[];
      (roster?.athletes||[]).forEach(g=>{
        (g.items||[]).forEach(p=>players.push(p));
      });

      for(let p of players.slice(0,15)){

        let data = await fetchJSON(
          `https://site.web.api.espn.com/apis/common/v3/sports/${conf.sport}/${league}/athletes/${p.id}/overview`
        );

        if(!data) continue;

        let games = parseGames(data, conf.props[prop]);
        if(games.length < lastN) continue;

        games = games.slice(0,lastN);

        let hits = games.filter(g=>isHit(g.val,line,type)).length;
        let rate = hits/games.length;
        let streak = getStreak(games,line,type);

        let obj = {
          name: p.displayName,
          rate, hits, total: games.length, streak
        };

        if(rate >= minHit && streak >= minStr){
          matches.push(obj);
        } else if(rate >= 0.6){
          fallback.push(obj);
        }
      }
    }
  }

  let html = '';

  if(matches.length){
    html += `<div class="header">MATCHES</div>`;
    matches.forEach(p=>{
      html += `
      <div class="card">
        <b>${p.name}</b><br>
        ${type.toUpperCase()} ${line} ${prop}<br>
        <span class="good">${(p.rate*100).toFixed(0)}%</span> (${p.hits}/${p.total})<br>
        Streak: ${p.streak}
      </div>`;
    });
  }

  if(!matches.length && fallback.length){
    html += `<div class="header">CLOSE (relaxed results)</div>`;
    fallback.forEach(p=>{
      html += `
      <div class="card">
        <b>${p.name}</b><br>
        ${type.toUpperCase()} ${line} ${prop}<br>
        <span class="mid">${(p.rate*100).toFixed(0)}%</span> (${p.hits}/${p.total})<br>
        Streak: ${p.streak}
      </div>`;
    });
  }

  if(!html){
    html = `<div>No data found (this is real, not a bug — try lowering filters)</div>`;
  }

  results.innerHTML = html;
}

</script>

</body>
</html>
