<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Multi-Sport Prop Finder</title>
<style>
body { font-family: Arial; background:#0e1117; color:#e6edf3; padding:20px; }
input, select, button { padding:6px; margin:4px; }
.card { border:1px solid #30363d; padding:10px; margin:10px 0; }
.good { color:#00ff88; }
</style>
</head>
<body>

<h2>Prop Finder (NBA / NHL / MLB)</h2>

<div>
  <select id="league">
    <option value="nba">NBA</option>
    <option value="nhl">NHL</option>
    <option value="mlb">MLB</option>
  </select>

  <select id="prop"></select>

  <select id="type">
    <option value="over">Over</option>
    <option value="under">Under</option>
  </select>

  <input type="number" id="line" value="1.5" step="0.5">
  <input type="number" id="games" value="10">
  <input type="number" id="hit" value="80">
  <input type="number" id="streak" value="5">

  <button onclick="run()">Run</button>
</div>

<div id="results"></div>

<script>
const CONFIG = {
  nba: {
    sport: "basketball",
    props: {
      "Points": ['points','PTS'],
      "Rebounds": ['rebounds','REB'],
      "Assists": ['assists','AST'],
      "Blocks": ['blocks','BLK'],
      "Steals": ['steals','STL'],
      "3PM": ['threePointFieldGoalsMade','3PM']
    }
  },
  nhl: {
    sport: "hockey",
    props: {
      "Goals": ['goals','G'],
      "Assists": ['assists','A'],
      "Points": ['points','PTS'],
      "Shots": ['shots','S']
    }
  },
  mlb: {
    sport: "baseball",
    props: {
      "Hits": ['hits','H'],
      "RBI": ['rbi','RBI'],
      "Strikeouts": ['strikeouts','SO'],
      "Home Runs": ['homeRuns','HR']
    }
  }
};

function populateProps(){
  let league = document.getElementById('league').value;
  let propSel = document.getElementById('prop');
  propSel.innerHTML = '';

  Object.keys(CONFIG[league].props).forEach(p=>{
    let o = document.createElement('option');
    o.textContent = p;
    propSel.appendChild(o);
  });
}

document.getElementById('league').addEventListener('change', populateProps);
populateProps();

function today(){
  let d = new Date();
  return d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0');
}

function isHit(val,line,type){
  return type === 'over' ? val > line : val < line;
}

function getStreak(games,line,type){
  let s=0;
  for(let g of games){
    if(isHit(g.val,line,type)) s++;
    else break;
  }
  return s;
}

async function fetchJSON(url){
  try{
    let r = await fetch(url);
    return await r.json();
  }catch{ return null; }
}

function extract(labels,names,stats,keys){
  for(let k of keys){
    k = k.toLowerCase();
    for(let i=0;i<labels.length;i++){
      if((labels[i]||'').toLowerCase()===k) return +stats[i];
    }
    for(let i=0;i<names.length;i++){
      if((names[i]||'').toLowerCase()===k) return +stats[i];
    }
  }
  return null;
}

function parseGames(data,keys){
  let gl = data.gameLog || {};
  let sg = (gl.statistics||[])[0];
  if(!sg) return [];

  let games=[];
  for(let e of sg.events||[]){
    let val = extract(sg.labels, sg.names, e.stats, keys);
    if(val!=null) games.push({val});
  }
  return games;
}

async function run(){
  let league = document.getElementById('league').value;
  let prop   = document.getElementById('prop').value;
  let type   = document.getElementById('type').value;
  let line   = parseFloat(document.getElementById('line').value);
  let lastN  = parseInt(document.getElementById('games').value);
  let minHit = parseFloat(document.getElementById('hit').value)/100;
  let minStr = parseInt(document.getElementById('streak').value);

  let conf = CONFIG[league];

  let resDiv = document.getElementById('results');
  resDiv.innerHTML = 'Loading...';

  let scoreboard = await fetchJSON(
    `https://site.api.espn.com/apis/site/v2/sports/${conf.sport}/${league}/scoreboard?dates=${today()}`
  );

  let html = '';

  for(let game of scoreboard.events || []){
    let comp = game.competitions[0];

    for(let team of comp.competitors){
      let teamId = team.team.id;

      let roster = await fetchJSON(
        `https://site.api.espn.com/apis/site/v2/sports/${conf.sport}/${league}/teams/${teamId}/roster`
      );

      let players=[];
      (roster?.athletes||[]).forEach(g=>{
        (g.items||[]).forEach(p=>players.push(p));
      });

      for(let p of players.slice(0,8)){
        let data = await fetchJSON(
          `https://site.web.api.espn.com/apis/common/v3/sports/${conf.sport}/${league}/athletes/${p.id}/overview`
        );

        if(!data) continue;

        let games = parseGames(data, conf.props[prop]);
        if(games.length < lastN) continue;

        games = games.slice(0,lastN);

        let hits = games.filter(g=>isHit(g.val,line,type)).length;
        let rate = hits/games.length;
        let streak = getStreak(games,line,type);

        if(rate >= minHit && streak >= minStr){
          html += `
            <div class="card">
              <b>${p.displayName}</b><br>
              ${league.toUpperCase()} — ${type.toUpperCase()} ${line} ${prop}<br>
              <span class="good">${(rate*100).toFixed(0)}% (${hits}/${games.length})</span><br>
              Streak: ${streak}
            </div>
          `;
        }
      }
    }
  }

  resDiv.innerHTML = html || 'No matches (adjust filters)';
}
</script>

</body>
</html>
