<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Custom Prop Finder</title>
<style>
body { font-family: Arial; background:#111; color:#eee; padding:20px; }
input, select, button { padding:6px; margin:4px; }
.card { border:1px solid #333; padding:10px; margin:10px 0; }
.good { color:#00ff88; }
</style>
</head>
<body>

<h2>Custom Prop Finder</h2>

<div>
  <label>Prop:</label>
  <select id="prop">
    <option>Points</option>
    <option>Assists</option>
    <option>Rebounds</option>
  </select>

  <label>Type:</label>
  <select id="type">
    <option value="over">Over</option>
    <option value="under">Under</option>
  </select>

  <label>Line:</label>
  <input type="number" id="line" value="10.5" step="0.5">

  <label>Min Hit %:</label>
  <input type="number" id="hit" value="80">

  <label>Min Streak:</label>
  <input type="number" id="streak" value="5">

  <button onclick="run()">Run</button>
</div>

<div id="results"></div>

<script>
const PROPS = {
  "Points": ['points','PTS'],
  "Assists": ['assists','AST'],
  "Rebounds": ['rebounds','REB']
};

function today() {
  let d = new Date();
  return d.getFullYear() +
    String(d.getMonth()+1).padStart(2,'0') +
    String(d.getDate()).padStart(2,'0');
}

function isHit(val,line,type){
  return type === 'over' ? val > line : val < line;
}

function getStreak(games,line,type){
  let s=0;
  for(let g of games){
    if(isHit(g.val,line,type)) s++;
    else break;
  }
  return s;
}

async function fetchJSON(url){
  try{
    let r = await fetch(url);
    return await r.json();
  }catch{ return null; }
}

function extract(labels,names,stats,keys){
  for(let k of keys){
    k = k.toLowerCase();
    for(let i=0;i<labels.length;i++){
      if((labels[i]||'').toLowerCase()===k) return +stats[i];
    }
    for(let i=0;i<names.length;i++){
      if((names[i]||'').toLowerCase()===k) return +stats[i];
    }
  }
  return null;
}

function parseGames(data,keys){
  let gl = data.gameLog || {};
  let sg = (gl.statistics||[])[0];
  if(!sg) return [];

  let games=[];
  for(let e of sg.events||[]){
    let val = extract(sg.labels, sg.names, e.stats, keys);
    if(val!=null) games.push({val});
  }
  return games;
}

async function run(){
  let prop   = document.getElementById('prop').value;
  let type   = document.getElementById('type').value;
  let line   = parseFloat(document.getElementById('line').value);
  let minHit = parseFloat(document.getElementById('hit').value)/100;
  let minStr = parseInt(document.getElementById('streak').value);

  let resDiv = document.getElementById('results');
  resDiv.innerHTML = 'Loading...';

  let scoreboard = await fetchJSON(
    `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${today()}`
  );

  let resultsHTML = '';

  for(let game of scoreboard.events){
    let comp = game.competitions[0];

    for(let team of comp.competitors){
      let teamId = team.team.id;

      let roster = await fetchJSON(
        `https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/${teamId}/roster`
      );

      let players = [];
      roster.athletes.forEach(g=>{
        (g.items||[]).forEach(p=>players.push(p));
      });

      for(let p of players.slice(0,6)){
        let data = await fetchJSON(
          `https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/${p.id}/overview`
        );

        if(!data) continue;

        let games = parseGames(data, PROPS[prop]);
        if(games.length < 5) continue;

        let hits = games.filter(g=>isHit(g.val,line,type)).length;
        let rate = hits/games.length;
        let streak = getStreak(games,line,type);

        if(rate >= minHit && streak >= minStr){
          resultsHTML += `
            <div class="card">
              <div><b>${p.displayName}</b></div>
              <div>${type.toUpperCase()} ${line} ${prop}</div>
              <div class="good">${(rate*100).toFixed(0)}% hit (${hits}/${games.length})</div>
              <div>Streak: ${streak}</div>
            </div>
          `;
        }
      }
    }
  }

  resDiv.innerHTML = resultsHTML || 'No matches';
}
</script>

</body>
</html>
