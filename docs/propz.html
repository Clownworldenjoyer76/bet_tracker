<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Finder · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--background);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }

    /* HEADER */
    .page-header { border-bottom:1px solid var(--border-soft);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-green); }
    .page-subtitle { color:var(--text-muted);font-size:11px;letter-spacing:0.06em;margin-top:2px; }

    /* CONTROLS */
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap; }

    .league-pill {
      font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;
      padding:4px 14px;border:1px solid var(--border-soft);background:transparent;
      color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase;
    }
    .league-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .league-pill.active { border-color:var(--accent-green);color:var(--accent-green);background:rgba(0,255,132,0.06); }

    .divider { width:1px;height:24px;background:var(--border-soft);margin:0 4px; }

    .prop-pill {
      font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.07em;
      padding:4px 12px;border:1px solid var(--border-soft);background:transparent;
      color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase;
    }
    .prop-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .prop-pill.active { border-color:var(--accent-yellow);color:var(--accent-yellow);background:rgba(250,204,21,0.06); }

    .ctrl-label { font-size:10px;color:var(--text-muted);letter-spacing:0.1em;text-transform:uppercase; }

    .filter-group { display:flex;align-items:center;gap:6px;margin-left:auto; }
    .ctrl-input {
      background:var(--bg-card);border:1px solid var(--border-soft);color:var(--text-main);
      font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 8px;width:64px;
    }
    .ctrl-input:focus { outline:none;border-color:var(--accent-green); }

    .run-btn {
      font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.12em;
      padding:6px 20px;border:1px solid var(--accent-green);background:rgba(0,255,132,0.08);
      color:var(--accent-green);cursor:pointer;text-transform:uppercase;transition:all 0.15s;
    }
    .run-btn:hover { background:rgba(0,255,132,0.18); }
    .run-btn:disabled { opacity:0.4;cursor:not-allowed; }

    /* STATUS */
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;flex-shrink:0; }
    .status-dot.green  { background:var(--accent-green);box-shadow:0 0 6px var(--accent-green); }
    .status-dot.yellow { background:var(--accent-yellow);animation:pulse 1s infinite; }
    .status-dot.red    { background:var(--accent-red); }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .progress-wrap { flex:1;height:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);overflow:hidden; }
    .progress-fill { height:100%;background:var(--accent-green);transition:width 0.3s; }

    /* MAIN */
    .main { padding:20px 24px;display:flex;flex-direction:column;gap:24px; }

    /* RESULTS TABLE */
    .results-table { width:100%;border-collapse:collapse;border:1px solid var(--border-soft); }
    .results-table thead tr { background:var(--bg-card); }
    .results-table th {
      font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;
      text-transform:uppercase;color:var(--text-muted);padding:9px 16px;
      border-bottom:1px solid var(--border-soft);text-align:left;white-space:nowrap;
    }
    .results-table th.r { text-align:right; }
    .results-table td { padding:10px 16px;border-bottom:1px solid rgba(26,31,38,0.5);font-size:12px;color:var(--text-muted);white-space:nowrap; }
    .results-table tr:last-child td { border-bottom:none; }
    .results-table tr:hover td { background:rgba(255,255,255,0.015); }

    .td-rank { font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:var(--border-soft);width:28px; }
    .td-player { color:var(--text-main);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.04em; }
    .td-sub { font-size:10px;color:var(--text-muted);margin-top:2px; }
    .td-prop { color:var(--accent-blue);font-size:11px;letter-spacing:0.04em; }
    .td-line { font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text-main);text-align:right; }
    .td-avg { font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-muted);text-align:right; }
    .td-streak { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;text-align:right; }

    .hit-cell { text-align:right; }
    .hit-pct { font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;line-height:1; }
    .hit-count { font-size:9px;color:var(--text-muted);margin-top:1px; }
    .pct-high { color:var(--accent-green); }
    .pct-mid  { color:var(--accent-yellow); }
    .pct-low  { color:var(--accent-red); }

    .mini-bar-wrap { width:80px;height:4px;background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);display:inline-block;vertical-align:middle; }
    .mini-bar-fill { height:100%; }

    .section-label {
      font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
      letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);
      padding:6px 0 4px 0;border-bottom:1px solid var(--border-soft);margin-bottom:8px;
    }
    .section-label span { color:var(--accent-green); }

    .empty-state { text-align:center;padding:80px 20px;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; }
    .empty-sub { font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:8px;font-weight:400;letter-spacing:0;opacity:0.6; }

    /* PROP PILLS ROW */
    .prop-row { display:flex;flex-wrap:wrap;gap:6px;align-items:center; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Prop Finder</div>
    <div class="page-subtitle">SEARCH TODAY'S GAMES FOR QUALIFYING PROPS · FILTER BY STAT TYPE</div>
  </div>
</div>

<!-- LEAGUE + PROP CONTROLS -->
<div class="controls" id="league-controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba" data-key="NBA">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl" data-key="NHL">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb" data-key="MLB">MLB</div>
</div>

<div class="controls" id="prop-controls">
  <!-- populated by JS -->
  <div class="divider"></div>
  <div class="filter-group">
    <span class="ctrl-label">min hit%</span>
    <input class="ctrl-input" type="number" id="min-hit" value="70" min="50" max="100" step="5">
    <span class="ctrl-label">min streak</span>
    <input class="ctrl-input" type="number" id="min-streak" value="3" min="1" max="20">
    <span class="ctrl-label">last n</span>
    <input class="ctrl-input" type="number" id="last-n" value="10" min="5" max="30">
    <button class="run-btn" id="run-btn">Run</button>
  </div>
</div>

<div class="status-bar" id="status-bar">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Select a league, choose a prop type, and click Run</span>
  <div class="progress-wrap" id="progress-wrap" style="display:none"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="main" id="main">
  <div class="empty-state">
    Select a league and click Run
    <div class="empty-sub">Scans today's games · filters by hit rate and streak</div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────

var PROPS = {
  nba: [
    { label:'Points',   statKeys:['points','PTS'],        abbr:'PTS', key:'all' },
    { label:'Rebounds', statKeys:['totalRebounds','REB'], abbr:'REB', key:'all' },
    { label:'Assists',  statKeys:['assists','AST'],        abbr:'AST', key:'all' },
    { label:'Blocks',   statKeys:['blocks','BLK'],         abbr:'BLK', key:'all' },
    { label:'Steals',   statKeys:['steals','STL'],         abbr:'STL', key:'all' },
    { label:'3PM',      statKeys:['threePointFieldGoalsMade','3PM'], abbr:'3PM', key:'all' }
  ],
  nhl: [
    { label:'Goals',         statKeys:['goals','G'],        abbr:'G',   key:'all' },
    { label:'Assists',       statKeys:['assists','A'],       abbr:'A',   key:'all' },
    { label:'Points',        statKeys:['points','PTS'],     abbr:'PTS', key:'all' },
    { label:'Shots on Goal', statKeys:['shotsTotal','S'],   abbr:'S',   key:'all' }
  ],
  mlb: [
    { label:'Hits',       statKeys:['hits','H'],              abbr:'H',   key:'all' },
    { label:'RBI',        statKeys:['rbi','runsBattedIn'],    abbr:'RBI', key:'all' },
    { label:'Strikeouts', statKeys:['strikeouts','SO'],       abbr:'SO',  key:'all' },
    { label:'Home Runs',  statKeys:['homeRuns','HR'],         abbr:'HR',  key:'all' }
  ]
};

var MIN_GAMES      = 5;
var PLAYERS_PER_TEAM = 8;

var activeSport  = 'basketball';
var activeLeague = 'nba';
var activeKey    = 'NBA';
var activeProp   = null; // null = all props
var isRunning    = false;

// ── HELPERS ─────────────────────────────────────────────────────────────────

function todayESPN() {
  var d = new Date();
  var mm = ('0'+(d.getMonth()+1)).slice(-2);
  var dd = ('0'+d.getDate()).slice(-2);
  return d.getFullYear() + '' + mm + '' + dd;
}

async function fetchJSON(url) {
  try {
    var r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

function extractStat(labels, names, statsArr, keys) {
  for (var k = 0; k < keys.length; k++) {
    var key = keys[k].toLowerCase();
    for (var i = 0; i < labels.length; i++) {
      if ((labels[i]||'').toLowerCase() === key) {
        var v = parseFloat(statsArr[i]);
        return isNaN(v) ? null : v;
      }
    }
    for (var i = 0; i < (names||[]).length; i++) {
      if ((names[i]||'').toLowerCase() === key) {
        var v = parseFloat(statsArr[i]);
        return isNaN(v) ? null : v;
      }
    }
  }
  return null;
}

function parseGamesForProp(data, propDef) {
  var gl = data.gameLog || {};
  var sg = (gl.statistics||[])[0];
  if (!sg) return [];
  var labels = sg.labels||[], names = sg.names||[], evts = sg.events||[];
  var evDict = gl.events||{};
  var games = [];
  evts.forEach(function(entry) {
    var val = extractStat(labels, names, entry.stats||[], propDef.statKeys.concat([propDef.abbr]));
    if (val !== null) {
      var ev = evDict[entry.eventId]||{};
      games.push({ date: ev.gameDate ? new Date(ev.gameDate) : null, val: val });
    }
  });
  return games.sort(function(a,b){ return (b.date?b.date.getTime():0)-(a.date?a.date.getTime():0); });
}

function getStreak(games, line) {
  var s = 0;
  for (var i = 0; i < games.length; i++) {
    if (games[i].val > line) s++;
    else break;
  }
  return s;
}

function bestLineForGames(games, lastN) {
  var slice = games.slice(0, lastN);
  if (slice.length < MIN_GAMES) return null;
  var avg  = slice.reduce(function(s,g){return s+g.val;},0)/slice.length;
  var step = 0.5;
  var lo   = Math.max(0, Math.floor((avg-1)/step)*step);
  var best = null;
  for (var i = 0; i < 8; i++) {
    var line = +(lo + i*step).toFixed(1);
    var hits = slice.filter(function(g){return g.val > line;}).length;
    var rate = hits / slice.length;
    if (!best || rate > best.rate) {
      best = { line:line, rate:rate, hits:hits, total:slice.length, streak: getStreak(slice, line), avg:avg };
    }
  }
  return best && best.rate > 0 ? best : null;
}

function pctClass(r) { return r >= 0.70 ? 'pct-high' : r >= 0.55 ? 'pct-mid' : 'pct-low'; }
function barClr(r)   { return r >= 0.70 ? 'var(--accent-green)' : r >= 0.55 ? 'var(--accent-yellow)' : 'var(--accent-red)'; }
function streakClr(s){ return s >= 5 ? 'var(--accent-green)' : s >= 3 ? 'var(--accent-yellow)' : 'var(--text-muted)'; }

// ── STATUS ───────────────────────────────────────────────────────────────────

function setStatus(text, dotCls, pct) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls||'');
  var pw = document.getElementById('progress-wrap');
  var pf = document.getElementById('progress-fill');
  if (pct !== undefined) { pw.style.display=''; pf.style.width=pct+'%'; }
  else { pw.style.display='none'; }
}

// ── PROP PILLS UI ────────────────────────────────────────────────────────────

function buildPropPills() {
  var props = PROPS[activeLeague] || [];
  var ctrl  = document.getElementById('prop-controls');

  // Remove old pills (everything before the divider)
  var divider = ctrl.querySelector('.divider');
  var kids = Array.from(ctrl.children);
  kids.forEach(function(k){ if (k !== divider && !k.classList.contains('filter-group')) k.remove(); });

  activeProp = null; // reset to "all"

  var allPill = document.createElement('div');
  allPill.className = 'prop-pill active';
  allPill.textContent = 'All Props';
  allPill.dataset.prop = '__all__';
  ctrl.insertBefore(allPill, divider);

  props.forEach(function(p) {
    var pill = document.createElement('div');
    pill.className = 'prop-pill';
    pill.textContent = p.label;
    pill.dataset.prop = p.label;
    ctrl.insertBefore(pill, divider);
  });

  ctrl.querySelectorAll('.prop-pill').forEach(function(pill) {
    pill.addEventListener('click', function() {
      ctrl.querySelectorAll('.prop-pill').forEach(function(x){ x.classList.remove('active'); });
      pill.classList.add('active');
      activeProp = pill.dataset.prop === '__all__' ? null : pill.dataset.prop;
    });
  });
}

// ── LEAGUE PILLS ─────────────────────────────────────────────────────────────

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    if (isRunning) return;
    document.querySelectorAll('.league-pill').forEach(function(p){ p.classList.remove('active'); });
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    activeKey    = pill.dataset.key;
    buildPropPills();
    document.getElementById('main').innerHTML = '<div class="empty-state">Click Run<div class="empty-sub">'+activeKey+' · Today\'s games</div></div>';
    setStatus('Select a prop type and click Run', '');
  });
});

buildPropPills();

// ── RUN ───────────────────────────────────────────────────────────────────────

document.getElementById('run-btn').addEventListener('click', runAnalysis);

async function runAnalysis() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('run-btn').disabled = true;
  document.getElementById('main').innerHTML = '';

  var minHit    = parseFloat(document.getElementById('min-hit').value) / 100;
  var minStreak = parseInt(document.getElementById('min-streak').value);
  var lastN     = parseInt(document.getElementById('last-n').value);

  var propsToRun = (activeProp === null)
    ? PROPS[activeLeague]
    : PROPS[activeLeague].filter(function(p){ return p.label === activeProp; });

  setStatus('Fetching today\'s games...', 'yellow', 0);

  var url    = 'https://site.api.espn.com/apis/site/v2/sports/'+activeSport+'/'+activeLeague+'/scoreboard?dates='+todayESPN();
  var data   = await fetchJSON(url);
  var events = (data && data.events) || [];

  if (!events.length) {
    setStatus('No games today for '+activeKey, '', undefined);
    document.getElementById('main').innerHTML = '<div class="empty-state">No games today<div class="empty-sub">Check back on a game day</div></div>';
    isRunning = false;
    document.getElementById('run-btn').disabled = false;
    return;
  }

  setStatus('Scanning '+events.length+' games...', 'yellow', 5);

  var allResults = []; // { player, teamAbbr, matchup, prop, abbr, line, rate, hits, total, streak, avg }
  var total      = events.length;

  for (var i = 0; i < total; i++) {
    var game = events[i];
    var pct  = Math.round(5 + ((i+1)/total)*88);
    var comp = game.competitions && game.competitions[0];
    var competitors = (comp && comp.competitors) || [];
    var away = competitors.find(function(c){return c.homeAway==='away';});
    var home = competitors.find(function(c){return c.homeAway==='home';});
    var awayN = away && away.team ? (away.team.abbreviation||'?') : '?';
    var homeN = home && home.team ? (home.team.abbreviation||'?') : '?';
    var matchup = awayN + ' @ ' + homeN;
    setStatus('Scanning '+matchup+' ('+(i+1)+'/'+total+')...', 'yellow', pct);

    await Promise.all(competitors.map(async function(team) {
      var teamId   = team.team && team.team.id;
      var teamAbbr = team.team && (team.team.abbreviation || team.team.shortDisplayName || '?');
      if (!teamId) return;

      var roster = await fetchJSON('https://site.api.espn.com/apis/site/v2/sports/'+activeSport+'/'+activeLeague+'/teams/'+teamId+'/roster');
      if (!roster) return;

      var players = [];
      (roster.athletes||[]).forEach(function(g) {
        (g.items||g.athletes||(g.id?[g]:[])).forEach(function(p){ if(p.id) players.push(p); });
      });

      var subset = players.slice(0, PLAYERS_PER_TEAM);

      await Promise.all(subset.map(async function(player) {
        var pdata = await fetchJSON('https://site.web.api.espn.com/apis/common/v3/sports/'+activeSport+'/'+activeLeague+'/athletes/'+player.id+'/overview');
        if (!pdata) return;

        propsToRun.forEach(function(propDef) {
          var games = parseGamesForProp(pdata, propDef);
          var bl    = bestLineForGames(games, lastN);
          if (!bl) return;
          if (bl.rate < minHit) return;
          if (bl.streak < minStreak) return;

          allResults.push({
            player:  player.displayName || player.fullName || '?',
            teamAbbr: teamAbbr,
            matchup: matchup,
            prop:    propDef.label,
            abbr:    propDef.abbr,
            line:    bl.line,
            rate:    bl.rate,
            hits:    bl.hits,
            total:   bl.total,
            streak:  bl.streak,
            avg:     bl.avg
          });
        });
      }));
    }));
  }

  // Sort by rate desc, then streak desc
  allResults.sort(function(a,b){
    if (b.rate !== a.rate) return b.rate - a.rate;
    return b.streak - a.streak;
  });

  renderResults(allResults, minHit, minStreak);
  setStatus(allResults.length+' props found · '+activeKey+' · Last '+lastN+' games', 'green');
  isRunning = false;
  document.getElementById('run-btn').disabled = false;
}

// ── RENDER ────────────────────────────────────────────────────────────────────

function renderResults(results, minHit, minStreak) {
  var main = document.getElementById('main');
  main.innerHTML = '';

  if (!results.length) {
    main.innerHTML = '<div class="empty-state">No qualifying props found<div class="empty-sub">Try lowering Min Hit% or Min Streak</div></div>';
    return;
  }

  // Section label
  var lbl = document.createElement('div');
  lbl.className = 'section-label';
  lbl.innerHTML = '<span>'+results.length+'</span> props · Hit ≥ '+(minHit*100).toFixed(0)+'% · Streak ≥ '+minStreak;
  main.appendChild(lbl);

  // Table
  var rows = results.map(function(p, idx) {
    var pct = (p.rate*100).toFixed(0);
    var cls = pctClass(p.rate);
    var clr = barClr(p.rate);
    var sClr = streakClr(p.streak);
    return '<tr>'+
      '<td class="td-rank">'+(idx+1)+'</td>'+
      '<td>'+
        '<div class="td-player">'+p.player+'</div>'+
        '<div class="td-sub">'+p.teamAbbr+' · '+p.matchup+'</div>'+
      '</td>'+
      '<td class="td-prop">'+p.prop+'</td>'+
      '<td class="td-line">Over '+p.line+'</td>'+
      '<td class="td-avg">'+p.avg.toFixed(1)+' avg</td>'+
      '<td class="td-streak" style="color:'+sClr+'">'+p.streak+'</td>'+
      '<td class="hit-cell">'+
        '<div class="hit-pct '+cls+'">'+pct+'%</div>'+
        '<div class="hit-count">'+p.hits+'/'+p.total+' games</div>'+
        '<div style="margin-top:4px"><div class="mini-bar-wrap"><div class="mini-bar-fill" style="width:'+(p.rate*100)+'%;background:'+clr+'"></div></div></div>'+
      '</td>'+
    '</tr>';
  }).join('');

  var table = document.createElement('table');
  table.className = 'results-table';
  table.innerHTML =
    '<thead><tr>'+
      '<th></th>'+
      '<th>Player</th>'+
      '<th>Prop</th>'+
      '<th class="r">Line</th>'+
      '<th class="r">Avg</th>'+
      '<th class="r">Streak</th>'+
      '<th class="r">Hit Rate</th>'+
    '</tr></thead>'+
    '<tbody>'+rows+'</tbody>';

  main.appendChild(table);
}
