<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a;--bg2:#111111;--bg3:#141414;--border:#222222;
      --green:#00ff84;--blue:#00bfff;--yellow:#facc15;--red:#ff4444;
      --orange:#ff8c00;--muted:#555555;--text:#e0e0e0;--text2:#888888;
    }
    body { background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--green); }
    .page-subtitle { color:var(--text2);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--blue);color:var(--blue); }
    .league-pill.active { border-color:var(--green);color:var(--green);background:rgba(0,255,132,0.06); }
    .team-select { background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 10px;outline:none;min-width:200px; }
    .team-select:focus { border-color:var(--blue); }
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--green);box-shadow:0 0 6px var(--green); }
    .status-dot.yellow { background:var(--yellow);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .main { padding:20px 24px; }
    .roster-header { display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border); }
    .roster-logo { width:40px;height:40px;object-fit:contain; }
    .roster-team-name { font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:var(--text);letter-spacing:0.04em; }
    .roster-group-header { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;color:var(--text2);text-transform:uppercase;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px;margin-top:12px; }
    .players-table { width:100%;border-collapse:collapse;font-size:12px; }
    .players-table thead tr { border-bottom:1px solid var(--border); }
    .players-table th { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);padding:5px 8px;text-align:left; }
    .players-table tbody tr { border-bottom:1px solid #161616;transition:background 0.1s; }
    .players-table tbody tr:hover { background:var(--bg2); }
    .players-table td { padding:7px 8px;color:var(--text2); }
    .player-name-cell { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);letter-spacing:0.04em; }
    .inj-badge { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;padding:1px 5px;color:var(--red);border:1px solid rgba(255,68,68,0.3);background:rgba(255,68,68,0.08); }
    .empty-state { text-align:center;padding:60px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div>
    <div class="page-title">Players</div>
    <div class="page-subtitle">ESPN · ROSTER BY TEAM</div>
  </div>
</div>
<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  <select class="team-select" id="team-select"><option value="">— Select Team —</option></select>
</div>
<div class="status-bar" id="players-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Select a league and team</span>
</div>
<div class="main" id="players-main">
  <div class="empty-state" id="players-empty">Select a team to view roster</div>
</div>
<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';
var allTeams     = [];

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

async function loadTeamList() {
  setStatus('Loading teams...', 'yellow');
  var sel = document.getElementById('team-select');
  sel.innerHTML = '<option value="">— Select Team —</option>';
  allTeams = [];

  try {
    var url  = 'https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams?limit=200';
    var r    = await fetch(url);
    var data = await r.json();
    allTeams = (data.sports[0].leagues[0].teams || []).map(function(t) {
      return { id: t.team.id, name: t.team.displayName, logo: t.team.logos && t.team.logos[0] ? t.team.logos[0].href : '' };
    }).sort(function(a, b) { return a.name.localeCompare(b.name); });

    allTeams.forEach(function(t) {
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.name;
      sel.appendChild(opt);
    });

    setStatus('Select a team', '');
    document.getElementById('players-main').innerHTML = '<div class="empty-state" id="players-empty">Select a team to view roster</div>';
  } catch(e) {
    setStatus('Failed to load teams', '');
  }
}

async function loadRoster(teamId) {
  var team = allTeams.find(function(t) { return t.id == teamId; });
  if (!team) return;
  setStatus('Loading roster...', 'yellow');

  try {
    var r    = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams/' + teamId + '/roster');
    var data = await r.json();

    var groups = data.athletes || [];
    var main   = document.getElementById('players-main');
    main.innerHTML = '';

    var logoHtml = team.logo ? '<img class="roster-logo" src="' + team.logo + '">' : '';
    var hdr = document.createElement('div');
    hdr.className = 'roster-header';
    hdr.innerHTML = logoHtml + '<div class="roster-team-name">' + team.name + '</div>';
    main.appendChild(hdr);

    var colsByLeague = {
      nba: ['#','Name','Pos','Age','HT','WT'],
      nhl: ['#','Name','Pos','Age','HT','WT'],
      mlb: ['#','Name','Pos','Age','HT','WT','Bats/Throws']
    };
    var cols = colsByLeague[activeLeague] || ['#','Name','Pos','Age'];

    // flatten all players across groups
    var allPlayers = [];
    var groupMap   = [];
    groups.forEach(function(group) {
      var players = [];
      if (group.items && group.items.length) {
        players = group.items;
      } else if (group.athletes && group.athletes.length) {
        players = group.athletes;
      } else if (group.displayName === undefined && group.id) {
        players = [group]; // single player object
      }
      if (players.length) groupMap.push({ label: group.displayName || group.position || '', players: players });
    });

    // if no groups resolved, treat entire array as flat player list
    if (groupMap.length === 0 && groups.length > 0) {
      groupMap = [{ label: '', players: groups }];
    }

    var table = document.createElement('table');
    table.className = 'players-table';
    table.innerHTML = '<thead><tr>' + cols.map(function(c) { return '<th>' + c + '</th>'; }).join('') + '<th>Status</th></tr></thead>';
    var tbody = document.createElement('tbody');

    groupMap.forEach(function(grp) {
      if (grp.label) {
        var gh = document.createElement('tr');
        gh.innerHTML = '<td colspan="' + (cols.length + 1) + '" class="roster-group-header" style="padding:8px 8px 4px;">' + grp.label + '</td>';
        tbody.appendChild(gh);
      }

      grp.players.forEach(function(p) {
        var pos    = p.position ? (p.position.abbreviation || p.position.name || '—') : '—';
        var jersey = p.jersey || '—';
        var age    = p.age || '—';
        var ht     = p.displayHeight || '—';
        var wt     = p.displayWeight || '—';
        // bats/throws can be objects with a displayValue or abbreviation
        var batsVal   = p.bats   ? (typeof p.bats   === 'string' ? p.bats   : (p.bats.abbreviation   || p.bats.displayValue   || '—')) : '—';
        var throwsVal = p.throws ? (typeof p.throws === 'string' ? p.throws : (p.throws.abbreviation || p.throws.displayValue || '—')) : '—';
        var bt  = (batsVal !== '—' || throwsVal !== '—') ? batsVal + '/' + throwsVal : '—';
        var inj = p.injuries && p.injuries.length ? '<span class="inj-badge">' + p.injuries[0].status + '</span>' : '—';

        var cells = [jersey, '<span class="player-name-cell">' + (p.displayName || p.fullName || '—') + '</span>', pos, age, ht, wt];
        if (activeLeague === 'mlb') cells.push(bt);
        cells = cells.slice(0, cols.length);

        var tr = document.createElement('tr');
        tr.innerHTML = cells.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '<td>' + inj + '</td>';
        tbody.appendChild(tr);
      });
    });

    table.appendChild(tbody);
    main.appendChild(table);

    setStatus(team.name + ' roster loaded', 'green');
  } catch(e) {
    setStatus('Failed to load roster', '');
  }
}

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    loadTeamList();
  });
});

document.getElementById('team-select').addEventListener('change', function() {
  if (this.value) loadRoster(this.value);
});

loadTeamList();
</script>
</body>
</html>
