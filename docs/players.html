<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    .page-header {
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .league-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .league-pill:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .league-pill.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.06);
    }

    .league-pill.placeholder {
      border-style: dashed;
      opacity: 0.7;
    }

    .league-pill.placeholder.active {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      background: rgba(255,204,0,0.06);
    }

    .team-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 4px;
    }

    .team-select-wrap.hidden {
      display: none;
    }

    .team-select-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .team-select {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 5px 10px;
      outline: none;
      min-width: 220px;
    }

    .team-select:focus {
      border-color: var(--accent-blue);
    }

    .status-bar {
      padding: 8px 24px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-dot.yellow {
      background: var(--accent-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.red {
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .main {
      padding: 20px 24px;
    }

    .roster-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .roster-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .roster-team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .roster-team-meta {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .players-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .roster-group-row td {
      padding: 8px 8px 4px;
      border-bottom: 1px solid var(--border-soft);
    }

    .roster-group-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .players-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 720px;
    }

    .players-table thead tr {
      border-bottom: 1px solid var(--border-soft);
    }

    .players-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 5px 8px;
      text-align: left;
      white-space: nowrap;
    }

    .players-table tbody tr {
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.1s;
    }

    .players-table tbody tr.player-row {
      cursor: pointer;
    }

    .players-table tbody tr.player-row:hover {
      background: var(--bg-card);
    }

    .players-table tbody tr.player-row:hover .player-name-cell {
      color: var(--accent-green);
    }

    .players-table td {
      padding: 7px 8px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .player-name-cell {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }

    .inj-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      color: var(--accent-red);
      border: 1px solid rgba(255,68,68,0.3);
      background: rgba(255,68,68,0.08);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .placeholder-state {
      max-width: 760px;
      margin: 40px auto;
      padding: 28px;
      border: 1px dashed var(--border-soft);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }

    .placeholder-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--accent-yellow);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .placeholder-copy {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .error-details {
      margin-top: 10px;
      color: var(--accent-red);
      font-size: 10px;
      word-break: break-all;
      line-height: 1.5;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      width: 100%;
      max-width: 680px;
      position: relative;
      margin: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.1em;
      background: none;
      border: none;
      z-index: 2;
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .modal-player-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .modal-headshot {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .modal-headshot-placeholder {
      width: 56px;
      height: 56px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      color: var(--text-muted);
    }

    .modal-player-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .modal-player-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-player-meta .tag {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-green);
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-soft);
      overflow-x: auto;
    }

    .modal-tab {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 14px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .modal-tab:hover {
      color: var(--text-main);
    }

    .modal-tab.active {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    .modal-panel {
      padding: 16px 20px;
      display: none;
      min-height: 100px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .modal-panel.active {
      display: block;
    }

    .modal-subtitle {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 4px;
      margin-bottom: 8px;
      margin-top: 14px;
    }

    .modal-subtitle:first-child {
      margin-top: 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px 12px;
      margin-bottom: 12px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .info-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .info-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      min-width: 560px;
    }

    .stat-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 4px 6px;
      text-align: right;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    .stat-table th:first-child {
      text-align: left;
    }

    .stat-table td {
      padding: 4px 6px;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text-muted);
      text-align: right;
      white-space: nowrap;
    }

    .stat-table td:first-child {
      text-align: left;
      color: var(--text-main);
    }

    .stat-table tr:last-child td {
      border-bottom: none;
    }

    .stat-table tr:hover td {
      background: var(--bg-card);
    }

    .news-item {
      padding: 8px 0;
      border-bottom: 1px solid var(--border-soft);
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-headline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .news-meta {
      font-size: 10px;
      color: var(--text-muted);
    }

    .news-link {
      font-size: 10px;
      color: var(--accent-green);
      text-decoration: none;
      letter-spacing: 0.08em;
    }

    .news-link:hover {
      text-decoration: underline;
    }

    .bio-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 11px;
    }

    .bio-row:last-child {
      border-bottom: none;
    }

    .bio-label {
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .bio-val {
      color: var(--text-main);
      text-align: right;
    }

    .modal-loading {
      color: var(--text-muted);
      font-size: 11px;
      padding: 20px 0;
      text-align: center;
    }

    .modal-error {
      color: var(--accent-red);
      font-size: 11px;
      padding: 12px 0;
      text-align: center;
    }

    .no-data {
      color: var(--text-muted);
      font-size: 11px;
      padding: 12px 0;
      text-align: center;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      .page-header,
      .controls,
      .status-bar,
      .main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .team-select-wrap {
        width: 100%;
        margin-left: 0;
      }

      .team-select {
        width: 100%;
        min-width: 0;
      }

      .info-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .modal-player-header {
        padding-right: 52px;
      }
    }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Players</div>
    <div class="page-subtitle">ESPN · ROSTER BY TEAM · CLICK PLAYER FOR PROFILE</div>
  </div>
</div>

<div class="controls">
  <div id="league-controls"></div>
  <div class="team-select-wrap" id="team-select-wrap">
    <span class="team-select-label">Team</span>
    <select class="team-select" id="team-select">
      <option value="">— Select Team —</option>
    </select>
  </div>
</div>

<div class="status-bar" id="players-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading players page...</span>
</div>

<div class="main" id="players-main">
  <div class="empty-state">Select a team to view roster</div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">CLOSE ✕</button>
    <div class="modal-player-header" id="modal-player-header"></div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div id="modal-panels"></div>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/players/render.js"></script>
</body>
</html>
