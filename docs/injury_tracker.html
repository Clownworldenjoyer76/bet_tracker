<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Injury Impact Tracker · Edgelytics</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #0a0a0a;
    --bg2:    #111111;
    --border: #222222;
    --green:  #00ff84;
    --blue:   #00bfff;
    --yellow: #facc15;
    --red:    #ff4444;
    --orange: #ff8c00;
    --muted:  #555555;
    --text:   #e0e0e0;
    --text2:  #888888;
  }

  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 13px; min-height: 100vh; }

  .page-header { border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--green); }
  .page-subtitle { color: var(--text2); font-size: 11px; letter-spacing: 0.06em; }

  .controls { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .league-pill { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 12px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
  .league-pill:hover { border-color: var(--blue); color: var(--blue); }
  .league-pill.active { border-color: var(--green); color: var(--green); background: rgba(0,255,132,0.06); }

  .search-box { margin-left: auto; background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 5px 10px; width: 200px; outline: none; }
  .search-box:focus { border-color: var(--blue); }
  .search-box::placeholder { color: var(--muted); }

  .csv-zone { padding: 10px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .csv-label { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--text2); text-transform: uppercase; }
  .csv-btn { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 10px; background: transparent; border: 1px solid var(--border); color: var(--blue); cursor: pointer; transition: all 0.15s; }
  .csv-btn:hover { border-color: var(--blue); background: rgba(0,191,255,0.06); }
  #csv-file-input { display: none; }
  .csv-status { font-size: 11px; color: var(--text2); }
  .csv-status.loaded { color: var(--green); }

  .summary-strip { display: flex; gap: 24px; padding: 12px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .summary-item { display: flex; flex-direction: column; gap: 2px; }
  .summary-val { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; line-height: 1; }
  .summary-lbl { font-size: 10px; letter-spacing: 0.1em; color: var(--text2); text-transform: uppercase; }
  .val-red    { color: var(--red); }
  .val-orange { color: var(--orange); }
  .val-yellow { color: var(--yellow); }
  .val-green  { color: var(--green); }

  .status-bar { padding: 8px 24px; font-size: 11px; color: var(--text2); border-bottom: 1px solid var(--border); }
  .status-bar.loading { color: var(--yellow); }
  .status-bar.error   { color: var(--red); }

  .main { padding: 20px 24px; }
  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text2); padding: 6px 10px; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--text); }
  th.sort-asc::after  { content: " ^"; color: var(--green); }
  th.sort-desc::after { content: " v"; color: var(--green); }

  tbody tr { border-bottom: 1px solid #161616; transition: background 0.1s; }
  tbody tr:hover { background: var(--bg2); }
  tbody tr.has-pick { background: rgba(0,255,132,0.03); }
  tbody tr.has-pick:hover { background: rgba(0,255,132,0.07); }

  td { padding: 7px 10px; white-space: nowrap; }

  .td-league { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--text2); }
  .td-player { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
  .td-team   { color: var(--text2); }
  .td-pos    { color: var(--muted); font-size: 11px; }
  .td-injury { color: var(--text2); font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

  .status-badge { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 2px 7px; text-transform: uppercase; }
  .s-out      { background: rgba(255,68,68,0.15);   color: var(--red);    border: 1px solid rgba(255,68,68,0.3); }
  .s-doubtful { background: rgba(255,140,0,0.12);   color: var(--orange); border: 1px solid rgba(255,140,0,0.3); }
  .s-gtd      { background: rgba(250,204,21,0.10);  color: var(--yellow); border: 1px solid rgba(250,204,21,0.3); }
  .s-probable { background: rgba(0,191,255,0.10);   color: var(--blue);   border: 1px solid rgba(0,191,255,0.25); }
  .s-other    { background: rgba(100,100,100,0.10); color: var(--text2);  border: 1px solid var(--border); }

  .pick-flag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; padding: 2px 6px; background: rgba(0,255,132,0.12); color: var(--green); border: 1px solid rgba(0,255,132,0.3); }
  .no-pick   { color: var(--muted); font-size: 11px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>

<div class="page-header">
  <div>
    <div class="page-title">Injury Impact Tracker</div>
    <div class="page-subtitle">ESPN INJURY FEED · CROSS-REF YOUR PICKS</div>
  </div>
</div>

<div class="controls">
  <div class="league-pill active" data-league="all">All</div>
  <div class="league-pill" data-league="NHL">NHL</div>
  <div class="league-pill" data-league="NBA">NBA</div>
  <div class="league-pill" data-league="NCAAB">NCAAB</div>
  <div class="league-pill" data-league="MLB">MLB</div>
  <input type="text" class="search-box" id="inj-search" placeholder="Search player or team...">
</div>

<div class="csv-zone">
  <span class="csv-label">Cross-ref picks:</span>
  <button class="csv-btn" onclick="document.getElementById('csv-file-input').click()">Load CSV</button>
  <input type="file" id="csv-file-input" accept=".csv">
  <span class="csv-status" id="csv-status">No picks loaded</span>
  <button class="csv-btn" id="clear-csv-btn" style="display:none" onclick="clearCSV()">Clear</button>
</div>

<div class="summary-strip" id="summary-strip" style="display:none">
  <div class="summary-item"><span class="summary-val val-red"    id="sum-out">0</span><span class="summary-lbl">Out</span></div>
  <div class="summary-item"><span class="summary-val val-orange" id="sum-dtd">0</span><span class="summary-lbl">Day-To-Day</span></div>
  <div class="summary-item"><span class="summary-val val-yellow" id="sum-gtd">0</span><span class="summary-lbl">Questionable</span></div>
  <div class="summary-item"><span class="summary-val val-green"  id="sum-picked">0</span><span class="summary-lbl">On Picked Teams</span></div>
</div>

<div class="status-bar" id="inj-status">Loading...</div>

<div class="main">
  <div class="table-wrap">
    <table id="inj-table">
      <thead>
        <tr>
          <th data-col="league">League</th>
          <th data-col="player">Player</th>
          <th data-col="position">Pos</th>
          <th data-col="team">Team</th>
          <th data-col="status">Status</th>
          <th data-col="injury">Injury</th>
          <th data-col="pick">Pick Impact</th>
        </tr>
      </thead>
      <tbody id="inj-tbody"></tbody>
    </table>
    <div class="empty-state" id="inj-empty" style="display:none">No injuries found</div>
  </div>
</div>

<script>
var LEAGUES = [
  { key: "NHL",   sport: "hockey",     league: "nhl"                     },
  { key: "NBA",   sport: "basketball", league: "nba"                     },
  { key: "NCAAB", sport: "basketball", league: "mens-college-basketball"  },
  { key: "MLB",   sport: "baseball",   league: "mlb"                     }
];

var allInjuries  = [];
var pickedTeams  = new Set();
var activeLeague = "all";
var searchQuery  = "";
var sortCol      = "status";
var sortDir      = "asc";

async function fetchLeagueInjuries(cfg) {
  var url = "https://site.api.espn.com/apis/site/v2/sports/" + cfg.sport + "/" + cfg.league + "/injuries";
  try {
    var r    = await fetch(url);
    if (!r.ok) return [];
    var data = await r.json();
    var rows = [];

    // Structure confirmed:
    // data.injuries = [ { displayName: "Atlanta Hawks", injuries: [ { athlete, status, details } ] } ]
    var teamGroups = data.injuries || [];
    for (var i = 0; i < teamGroups.length; i++) {
      var group    = teamGroups[i];
      var teamName = group.displayName || "Unknown";
      var injList  = group.injuries   || [];
      for (var j = 0; j < injList.length; j++) {
        var inj      = injList[j];
        var athlete  = inj.athlete  || {};
        var position = (athlete.position && athlete.position.abbreviation) ? athlete.position.abbreviation : "-";
        var injType  = (inj.details && inj.details.type) ? inj.details.type : "-";
        rows.push({
          league:   cfg.key,
          player:   athlete.displayName || "Unknown",
          position: position,
          team:     teamName,
          status:   inj.status || "Unknown",
          injury:   injType
        });
      }
    }
    return rows;
  } catch(e) {
    console.warn(cfg.key + " failed:", e);
    return null;
  }
}

function statusRank(s) {
  var k = (s || "").toLowerCase();
  if (k === "out")           return 0;
  if (k === "doubtful")      return 1;
  if (k === "day-to-day")    return 2;
  if (k === "questionable")  return 3;
  if (k === "probable")      return 4;
  return 5;
}

function statusClass(s) {
  var k = (s || "").toLowerCase();
  if (k === "out")           return "s-out";
  if (k === "doubtful")      return "s-doubtful";
  if (k === "day-to-day")    return "s-gtd";
  if (k === "questionable")  return "s-gtd";
  if (k === "probable")      return "s-probable";
  return "s-other";
}

function parseCSV(text) {
  var lines   = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  var headers = lines[0].split(",").map(function(h) { return h.trim().toLowerCase(); });
  return lines.slice(1).map(function(line) {
    var vals = line.split(",");
    var obj  = {};
    headers.forEach(function(h, i) { obj[h] = (vals[i] || "").trim(); });
    return obj;
  });
}

document.getElementById("csv-file-input").addEventListener("change", function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var rows = parseCSV(ev.target.result);
    pickedTeams = new Set();
    rows.forEach(function(r) {
      if (r.home_team) pickedTeams.add(r.home_team.trim());
      if (r.away_team) pickedTeams.add(r.away_team.trim());
    });
    var el = document.getElementById("csv-status");
    el.textContent = file.name + " - " + pickedTeams.size + " teams";
    el.className = "csv-status loaded";
    document.getElementById("clear-csv-btn").style.display = "";
    render();
  };
  reader.readAsText(file);
});

function clearCSV() {
  pickedTeams = new Set();
  document.getElementById("csv-status").textContent = "No picks loaded";
  document.getElementById("csv-status").className = "csv-status";
  document.getElementById("clear-csv-btn").style.display = "none";
  document.getElementById("csv-file-input").value = "";
  render();
}

function teamInPicks(teamName) {
  if (pickedTeams.size === 0) return false;
  var t = teamName.toLowerCase();
  var found = false;
  pickedTeams.forEach(function(p) {
    if (found) return;
    var pl = p.toLowerCase();
    if (t === pl) { found = true; return; }
    pl.split(" ").forEach(function(part) {
      if (part.length > 3 && t.indexOf(part) !== -1) found = true;
    });
  });
  return found;
}

function render() {
  var rows = allInjuries.slice();

  if (activeLeague !== "all") {
    rows = rows.filter(function(r) { return r.league === activeLeague; });
  }

  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    rows = rows.filter(function(r) {
      return r.player.toLowerCase().indexOf(q) !== -1 ||
             r.team.toLowerCase().indexOf(q)   !== -1 ||
             r.injury.toLowerCase().indexOf(q) !== -1;
    });
  }

  rows = rows.map(function(r) {
    return { league: r.league, player: r.player, position: r.position, team: r.team, status: r.status, injury: r.injury, hasPick: teamInPicks(r.team) };
  });

  rows.sort(function(a, b) {
    var av, bv;
    if (sortCol === "status")      { av = statusRank(a.status); bv = statusRank(b.status); }
    else if (sortCol === "pick")   { av = a.hasPick ? 0 : 1;   bv = b.hasPick ? 0 : 1; }
    else { av = (a[sortCol] || "").toLowerCase(); bv = (b[sortCol] || "").toLowerCase(); }
    if (av < bv) return sortDir === "asc" ? -1 : 1;
    if (av > bv) return sortDir === "asc" ?  1 : -1;
    return 0;
  });

  var counts = { out: 0, dtd: 0, gtd: 0, picked: 0 };
  allInjuries.forEach(function(r) {
    var k = (r.status || "").toLowerCase();
    if (k === "out")                             counts.out++;
    else if (k === "day-to-day")                 counts.dtd++;
    else if (k === "questionable" || k === "doubtful") counts.gtd++;
    if (teamInPicks(r.team)) counts.picked++;
  });
  document.getElementById("sum-out").textContent    = counts.out;
  document.getElementById("sum-dtd").textContent    = counts.dtd;
  document.getElementById("sum-gtd").textContent    = counts.gtd;
  document.getElementById("sum-picked").textContent = counts.picked;
  document.getElementById("summary-strip").style.display = allInjuries.length ? "" : "none";

  var tbody = document.getElementById("inj-tbody");
  var empty = document.getElementById("inj-empty");
  tbody.innerHTML = "";

  if (rows.length === 0) { empty.style.display = ""; return; }
  empty.style.display = "none";

  rows.forEach(function(r) {
    var tr = document.createElement("tr");
    if (r.hasPick) tr.classList.add("has-pick");
    tr.innerHTML =
      '<td class="td-league">' + r.league + '</td>' +
      '<td class="td-player">' + r.player + '</td>' +
      '<td class="td-pos">'    + r.position + '</td>' +
      '<td class="td-team">'   + r.team + '</td>' +
      '<td><span class="status-badge ' + statusClass(r.status) + '">' + r.status + '</span></td>' +
      '<td class="td-injury">' + r.injury + '</td>' +
      '<td>' + (r.hasPick ? '<span class="pick-flag">PICKED</span>' : '<span class="no-pick">-</span>') + '</td>';
    tbody.appendChild(tr);
  });
}

document.querySelectorAll("th[data-col]").forEach(function(th) {
  th.addEventListener("click", function() {
    var col = th.dataset.col;
    if (sortCol === col) sortDir = sortDir === "asc" ? "desc" : "asc";
    else { sortCol = col; sortDir = "asc"; }
    document.querySelectorAll("th[data-col]").forEach(function(t) { t.classList.remove("sort-asc","sort-desc"); });
    th.classList.add(sortDir === "asc" ? "sort-asc" : "sort-desc");
    render();
  });
});
document.querySelector('th[data-col="status"]').classList.add("sort-asc");

document.querySelectorAll(".league-pill").forEach(function(pill) {
  pill.addEventListener("click", function() {
    document.querySelectorAll(".league-pill").forEach(function(p) { p.classList.remove("active"); });
    pill.classList.add("active");
    activeLeague = pill.dataset.league;
    render();
  });
});

document.getElementById("inj-search").addEventListener("input", function(e) {
  searchQuery = e.target.value.trim();
  render();
});

async function loadAll() {
  var statusEl = document.getElementById("inj-status");
  statusEl.textContent = "Fetching injury data...";
  statusEl.className = "status-bar loading";
  allInjuries = [];

  var results = await Promise.all(LEAGUES.map(function(cfg) { return fetchLeagueInjuries(cfg); }));
  var errors  = [];

  results.forEach(function(rows, i) {
    if (rows === null) errors.push(LEAGUES[i].key + " (blocked)");
    else allInjuries = allInjuries.concat(rows);
  });

  render();

  statusEl.textContent = allInjuries.length + " injuries loaded" + (errors.length ? " - Blocked: " + errors.join(", ") : "");
  statusEl.className = "status-bar" + (errors.length ? " error" : "");
}

loadAll();
</script>
</body>
</html>
