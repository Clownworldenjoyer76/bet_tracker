<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Calculator</title>
<link rel="stylesheet" href="css/matstheme.css">
<style>
.controls {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 24px;
  padding: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
}

.controls label {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.bankroll-wrap {
  display: flex;
  align-items: center;
  border: 1px solid var(--accent-green);
  background: var(--background);
}

.bankroll-wrap .dollar {
  padding: 6px 10px;
  font-size: 16px;
  color: var(--accent-green);
  border-right: 1px solid var(--accent-green);
}

.bankroll-wrap input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-family: "Courier New", Courier, monospace;
  font-size: 15px;
  padding: 6px 12px;
  width: 160px;
}

.bankroll-wrap input::placeholder { color: var(--text-muted); }

input[type="date"] {
  background: var(--background);
  border: 1px solid var(--border-soft);
  color: var(--text-main);
  font-family: "Courier New", Courier, monospace;
  font-size: 13px;
  padding: 6px 10px;
  outline: none;
  cursor: pointer;
}

input[type="date"]:focus { border-color: var(--accent-green); }

.fraction-group {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}

.fraction-btns { display: flex; }

.fraction-btns button {
  background: var(--background);
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  font-family: "Courier New", Courier, monospace;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.12s;
  margin-left: -1px;
  text-transform: uppercase;
}

.fraction-btns button.active {
  background: var(--accent-green);
  color: var(--background);
  border-color: var(--accent-green);
  z-index: 1;
}

.fraction-btns button:hover:not(.active) {
  border-color: var(--accent-green);
  color: var(--accent-green);
}

.picks-section { margin-bottom: 32px; }

.sport-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-soft);
}

.sport-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.sport-title.nba { color: var(--accent-yellow); }
.sport-title.mlb { color: var(--accent-blue); }
.sport-title.nhl { color: var(--accent-green); }

.pick-count { font-size: 11px; color: var(--text-muted); }

table { width: 100%; border-collapse: collapse; font-size: 12px; }

thead th {
  text-align: left;
  padding: 6px 10px;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  font-weight: 400;
  border-bottom: 1px solid var(--border-soft);
}

thead th.right { text-align: right; }

tbody tr { border-bottom: 1px solid var(--border-soft); transition: background 0.1s; }
tbody tr:hover { background: rgba(0,255,132,0.03); }
tbody td { padding: 10px 10px; vertical-align: middle; }

.matchup-teams { font-size: 12px; color: var(--text-main); }
.matchup-time { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

.market-pill {
  display: inline-block;
  padding: 2px 6px;
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: 1px solid var(--border-soft);
  color: var(--text-muted);
  border-radius: 2px;
}

.market-pill.spread, .market-pill.puck_line { border-color: rgba(0,191,255,0.3); color: var(--accent-blue); }
.market-pill.moneyline { border-color: rgba(0,255,132,0.3); color: var(--accent-green); }
.market-pill.total { border-color: rgba(250,204,21,0.3); color: var(--accent-yellow); }
.market-pill.run_line { border-color: rgba(0,191,255,0.3); color: var(--accent-blue); }

.side-cell { font-size: 12px; color: var(--text-main); }
.odds-cell { font-size: 12px; color: var(--text-muted); }
.ev-cell { font-size: 12px; color: var(--accent-yellow); }
.kelly-cell { font-size: 12px; color: var(--text-muted); }

.bet-cell {
  text-align: right;
  font-size: 16px;
  font-weight: 700;
  color: var(--accent-green);
  white-space: nowrap;
}

.bet-cell.zero { font-size: 11px; color: var(--text-muted); font-weight: 400; }

.no-picks { padding: 14px 10px; font-size: 11px; color: var(--text-muted); letter-spacing: 1px; }

.loading-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: 2px;
}

.totals-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  border-top: 1px solid var(--border-soft);
  background: var(--bg-card);
  z-index: 100;
}

.total-item {
  padding: 12px 28px;
  border-right: 1px solid var(--border-soft);
}

.total-item label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 3px;
}

.total-item .val {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-green);
}
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container">
  <h1 class="site-title">KELLY CALCULATOR</h1>

  <div class="controls">
    <label>Bankroll</label>
    <div class="bankroll-wrap">
      <span class="dollar">$</span>
      <input type="number" id="bankroll" placeholder="10000" min="0" step="100">
    </div>
    <label>Date</label>
    <input type="date" id="date-picker">
    <div class="fraction-group">
      <label>Kelly Fraction</label>
      <div class="fraction-btns">
        <button data-frac="1" class="active">Full</button>
        <button data-frac="0.5">Half</button>
        <button data-frac="0.25">Quarter</button>
      </div>
    </div>
  </div>

  <div id="picks-container">
    <div class="loading-state">LOADING PICKS...</div>
  </div>
</div>

<div class="totals-bar">
  <div class="total-item">
    <label>Total Picks</label>
    <div class="val" id="total-picks">—</div>
  </div>
  <div class="total-item">
    <label>Total to Bet</label>
    <div class="val" id="total-bet">—</div>
  </div>
  <div class="total-item">
    <label>% of Bankroll</label>
    <div class="val" id="total-pct">—</div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
const BASE = 'https://raw.githubusercontent.com/Clownworldenjoyer76/bet_tracker/main/';
let fraction = 1.0;
const allPicks = { nba: [], mlb: [], nhl: [] };

function toDateStr(v) { return v.replaceAll('-', '_'); }

function initDatePicker() {
  const d = new Date();
  const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const el = document.getElementById('date-picker');
  if (!el.value) el.value = val;
  return el.value;
}

document.querySelectorAll('.fraction-btns button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fraction-btns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fraction = parseFloat(btn.dataset.frac);
    render();
  });
});

document.getElementById('bankroll').addEventListener('input', render);
document.getElementById('date-picker').addEventListener('change', loadAll);

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim());
    return Object.fromEntries(headers.map((h, i) => [h, vals[i] ?? '']));
  });
}

function formatOdds(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return '—';
  return n > 0 ? `+${Math.round(n)}` : `${Math.round(n)}`;
}

function formatDollar(n) {
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatPct(n) { return (n * 100).toFixed(1) + '%'; }

function getNBAKelly(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  if (mt === 'spread') return side === 'home' ? row.home_spread_kelly : row.away_spread_kelly;
  if (mt === 'moneyline') return side === 'home' ? row.home_ml_kelly : row.away_ml_kelly;
  if (mt === 'total') return side === 'over' ? row.over_kelly : row.under_kelly;
  return null;
}

function getNBAEV(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  if (mt === 'spread') return side === 'home' ? row.home_spread_ev : row.away_spread_ev;
  if (mt === 'moneyline') return side === 'home' ? row.home_ml_ev : row.away_ml_ev;
  if (mt === 'total') return side === 'over' ? row.over_ev : row.under_ev;
  return row.selected_ev;
}

function getNBAOdds(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  if (mt === 'spread') return side === 'home' ? row.home_dk_spread_american : row.away_dk_spread_american;
  if (mt === 'moneyline') return side === 'home' ? row.home_dk_moneyline_american : row.away_dk_moneyline_american;
  if (mt === 'total') return side === 'over' ? row.dk_total_over_american : row.dk_total_under_american;
  return null;
}

function buildSideLabel(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  const line = parseFloat(row.line);
  if (mt === 'total') return `${side.toUpperCase()} ${row.line || ''}`;
  if (['spread','puck_line','run_line'].includes(mt)) {
    const team = side === 'home' ? row.home_team : row.away_team;
    const lineStr = !isNaN(line) ? ` ${line > 0 ? '+' : ''}${line}` : '';
    return `${team}${lineStr}`;
  }
  if (mt === 'moneyline') return side === 'home' ? row.home_team : row.away_team;
  return side;
}

function processPicks(rows, sport, dateStr) {
  return rows.filter(row => (row.game_date || '').trim() === dateStr).map(row => {
    let kelly, ev, odds;
    if (sport === 'nba') {
      kelly = parseFloat(getNBAKelly(row));
      ev = parseFloat(getNBAEV(row));
      odds = getNBAOdds(row);
    } else {
      kelly = parseFloat(row.kelly);
      ev = parseFloat(row.ev);
      odds = row.dk_odds_american;
    }
    if (isNaN(kelly) || kelly <= 0) return null;
    return {
      matchup: `${row.away_team} @ ${row.home_team}`,
      time: row.game_time || '',
      market_type: (row.market_type || '').toLowerCase(),
      side: buildSideLabel(row),
      odds: formatOdds(odds),
      ev: isNaN(ev) ? null : ev,
      kelly,
    };
  }).filter(Boolean);
}

function render() {
  const bankroll = parseFloat(document.getElementById('bankroll').value) || 0;
  const container = document.getElementById('picks-container');
  const sports = [
    { key: 'nba', label: 'NBA' },
    { key: 'mlb', label: 'MLB' },
    { key: 'nhl', label: 'NHL' },
  ];

  let totalPicks = 0, totalBet = 0, html = '';
  const allPicksList = sports.flatMap(s => allPicks[s.key]);
  const totalKelly = allPicksList.reduce((sum, p) => sum + p.kelly * fraction, 0);
  const scale = totalKelly > 1.0 ? 1.0 / totalKelly : 1.0;

  for (const { key, label } of sports) {
    const picks = allPicks[key];
    totalPicks += picks.length;

    html += `<div class="picks-section">
      <div class="sport-header">
        <span class="sport-title ${key}">${label}</span>
        <span class="pick-count">${picks.length} PICK${picks.length !== 1 ? 'S' : ''}</span>
      </div>`;

    if (picks.length === 0) {
      html += `<div class="no-picks">No picks for this date</div>`;
    } else {
      html += `<table><thead><tr>
        <th>Matchup</th><th>Market</th><th>Bet</th><th>Odds</th><th>EV</th><th>Kelly</th><th class="right">Bet Size</th>
      </tr></thead><tbody>`;

      for (const p of picks) {
        const betAmt = bankroll > 0 ? bankroll * p.kelly * fraction * scale : 0;
        totalBet += betAmt;
        const betCell = bankroll > 0
          ? `<span class="bet-cell">${formatDollar(betAmt)}</span>`
          : `<span class="bet-cell zero">enter bankroll</span>`;

        html += `<tr>
          <td><div class="matchup-teams">${p.matchup}</div><div class="matchup-time">${p.time}</div></td>
          <td><span class="market-pill ${p.market_type}">${p.market_type.replace('_',' ')}</span></td>
          <td class="side-cell">${p.side}</td>
          <td class="odds-cell">${p.odds}</td>
          <td class="ev-cell">${p.ev !== null ? formatPct(p.ev) : '—'}</td>
          <td class="kelly-cell">${formatPct(p.kelly)}</td>
          <td>${betCell}</td>
        </tr>`;
      }
      html += `</tbody></table>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html;
  document.getElementById('total-picks').textContent = totalPicks || '—';
  document.getElementById('total-bet').textContent = bankroll > 0 && totalBet > 0 ? formatDollar(totalBet) : '—';
  document.getElementById('total-pct').textContent = bankroll > 0 && totalBet > 0 ? formatPct(totalBet / bankroll) : '—';
}

async function loadAll() {
  const date = toDateStr(initDatePicker());
  const files = [
    { sport: 'nba', url: `${BASE}docs/win/basketball/04_select/daily_slate/nba_selected.csv` },
    { sport: 'mlb', url: `${BASE}docs/win/baseball/04_select/${date}_MLB.csv` },
    { sport: 'nhl', url: `${BASE}docs/win/hockey/04_select/${date}_NHL.csv` },
  ];

  await Promise.all(files.map(async ({ sport, url }) => {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      const rows = parseCSV(await r.text());
      allPicks[sport] = processPicks(rows, sport, date);
    } catch {
      allPicks[sport] = [];
    }
  }));

  render();
}

loadAll();
</script>
</body>
</html>
