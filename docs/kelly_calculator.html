<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/matstheme.css">
<style>
body {
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  background: var(--background);
  padding: 0;
}

:root {
  --picks-green:      #00ff84;
  --picks-green-dim:  rgba(0,255,132,0.08);
  --picks-green-glow: rgba(0,255,132,0.2);
  --picks-yellow:     #facc15;
  --picks-red:        #ff2d2d;
  --picks-blue:       #00bfff;
  --picks-border:     rgba(255,255,255,0.06);
  --picks-card:       #0c1118;
  --picks-card-hover: #111822;
  --picks-radius:     3px;
}

/* HEADER */
.picks-header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--picks-border);
}

.picks-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--picks-green);
  line-height: 1;
  margin: 0;
}

/* CONTROLS */
.picks-controls {
  display: flex;
  align-items: flex-end;
  gap: 24px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--picks-border);
  flex-wrap: wrap;
}

.ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ctrl-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
}

input[type="date"] {
  background: var(--picks-card);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-main);
  padding: 7px 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  border-radius: var(--picks-radius);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
}

input[type="date"]:focus {
  border-color: var(--picks-green);
  box-shadow: 0 0 0 3px var(--picks-green-dim);
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1) opacity(0.3);
  cursor: pointer;
}

/* UFC Event display */
#kelly-ufc-event {
  background: var(--picks-card);
  border: 1px solid rgba(0,255,132,0.2);
  color: var(--picks-green);
  padding: 7px 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  border-radius: var(--picks-radius);
  letter-spacing: 1px;
  min-width: 120px;
}

.bankroll-wrap {
  display: flex;
  align-items: center;
  background: var(--picks-card);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--picks-radius);
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.bankroll-wrap:focus-within {
  border-color: var(--picks-green);
  box-shadow: 0 0 0 3px var(--picks-green-dim);
}

.bankroll-wrap .dollar {
  padding: 7px 10px;
  font-size: 13px;
  color: var(--picks-green);
  border-right: 1px solid rgba(255,255,255,0.08);
}

.bankroll-wrap input {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 7px 12px;
  width: 150px;
}

.bankroll-wrap input::placeholder { color: var(--text-muted); }

.fraction-btns { display: flex; border-radius: var(--picks-radius); overflow: hidden; }

.fraction-btns button {
  background: var(--picks-card);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-muted);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 7px 13px;
  cursor: pointer;
  transition: all 0.12s;
  margin-left: -1px;
}

.fraction-btns button.active {
  background: var(--picks-green-dim);
  border-color: var(--picks-green);
  color: var(--picks-green);
  box-shadow: 0 0 8px var(--picks-green-glow);
  z-index: 1;
}

.fraction-btns button:hover:not(.active) {
  border-color: rgba(0,255,132,0.35);
  color: var(--text-main);
}

/* TOTALS BAR */
.totals-bar {
  display: flex;
  gap: 0;
  padding: 0 24px;
  border-bottom: 1px solid var(--picks-border);
  background: var(--picks-card);
}

.total-item {
  padding: 12px 24px 12px 0;
  margin-right: 24px;
  border-right: 1px solid var(--picks-border);
}

.total-item:last-child { border-right: none; }

.total-item .t-label {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: block;
  margin-bottom: 3px;
}

.total-item .t-val {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--picks-green);
  letter-spacing: 1px;
}

/* CONTENT */
.picks-body {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}

/* SPORT SECTION */
.sport-section-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--picks-border);
}

.sport-section-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-muted);
}

.sport-section-title.nba { color: var(--picks-yellow); }
.sport-section-title.mlb { color: var(--picks-blue); }
.sport-section-title.nhl { color: var(--picks-green); }
.sport-section-title.ufc { color: #ff7043; }

.pick-count {
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-muted);
}

/* PICK CARDS GRID */
.picks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}

/* PICK CARD */
.pick-card {
  background: var(--picks-card);
  border: 1px solid var(--picks-border);
  border-left: 3px solid transparent;
  border-radius: var(--picks-radius);
  padding: 14px 16px;
  transition: border-color 0.18s, background 0.18s, transform 0.18s;
}

.pick-card:hover {
  border-left-color: var(--picks-green);
  background: var(--picks-card-hover);
  transform: translateX(2px);
}

.pick-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.pick-market-tag {
  font-size: 8px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 2px;
}

.pick-market-tag.spread, .pick-market-tag.puck_line {
  color: var(--picks-blue);
  background: rgba(0,191,255,0.08);
  border: 1px solid rgba(0,191,255,0.2);
}

.pick-market-tag.moneyline {
  color: var(--picks-green);
  background: var(--picks-green-dim);
  border: 1px solid rgba(0,255,132,0.2);
}

.pick-market-tag.total {
  color: var(--picks-yellow);
  background: rgba(250,204,21,0.08);
  border: 1px solid rgba(250,204,21,0.2);
}

.pick-market-tag.run_line {
  color: var(--picks-blue);
  background: rgba(0,191,255,0.08);
  border: 1px solid rgba(0,191,255,0.2);
}

.pick-market-tag.ufc {
  color: #ff7043;
  background: rgba(255,112,67,0.08);
  border: 1px solid rgba(255,112,67,0.2);
}

.pick-matchup {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

.pick-bet {
  font-size: 11px;
  color: var(--picks-blue);
  margin-bottom: 10px;
}

.pick-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 8px;
  border-top: 1px solid var(--picks-border);
}

.pick-ev {
  font-size: 10px;
  color: var(--picks-green);
  letter-spacing: 1px;
}

.pick-kelly {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1px;
}

.pick-amount {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--picks-green);
  letter-spacing: 1px;
}

.pick-amount.zero {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 400;
}

.no-picks {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  padding: 20px 0;
}

.loading-state {
  text-align: center;
  padding: 80px 0;
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--text-muted);
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="picks-header">
  <h1 class="picks-title">KELLY CALCULATOR</h1>
</div>

<div class="picks-controls">
  <div class="ctrl-group">
    <span class="ctrl-label">Date</span>
    <input type="date" id="date-picker">
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">UFC Event</span>
    <div id="kelly-ufc-event">Loading...</div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Bankroll</span>
    <div class="bankroll-wrap">
      <span class="dollar">$</span>
      <input type="number" id="bankroll" placeholder="10000" min="0" step="100">
    </div>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Kelly Fraction</span>
    <div class="fraction-btns">
      <button data-frac="1" class="active">Full</button>
      <button data-frac="0.5">Half</button>
      <button data-frac="0.25">Quarter</button>
    </div>
  </div>
</div>

<div class="totals-bar">
  <div class="total-item">
    <span class="t-label">Total Picks</span>
    <div class="t-val" id="total-picks">—</div>
  </div>
  <div class="total-item">
    <span class="t-label">Total to Bet</span>
    <div class="t-val" id="total-bet">—</div>
  </div>
  <div class="total-item">
    <span class="t-label">% of Bankroll</span>
    <div class="t-val" id="total-pct">—</div>
  </div>
</div>

<div class="picks-body" id="picks-container">
  <div class="loading-state">Loading picks...</div>
</div>

<script src="js/nav.js"></script>
<script>
const BASE = 'https://raw.githubusercontent.com/Clownworldenjoyer76/bet_tracker/main/';
const BASE_DOCS = BASE + 'docs/';
let fraction = 1.0;
const allPicks = { nba: [], mlb: [], nhl: [], ufc: [] };

function toDateStr(v) { return v.replaceAll('-', '_'); }

function initDatePicker() {
  const d = new Date();
  const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const el = document.getElementById('date-picker');
  if (!el.value) el.value = val;
  return el.value;
}

document.querySelectorAll('.fraction-btns button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.fraction-btns button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    fraction = parseFloat(btn.dataset.frac);
    render();
  });
});

document.getElementById('bankroll').addEventListener('input', render);
document.getElementById('date-picker').addEventListener('change', loadAll);

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim());
    return Object.fromEntries(headers.map((h, i) => [h, vals[i] ?? '']));
  });
}

function formatOdds(val) {
  const n = parseFloat(val);
  if (isNaN(n)) return '—';
  return n > 0 ? `+${Math.round(n)}` : `${Math.round(n)}`;
}

function formatDollar(n) {
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatPct(n) { return (n * 100).toFixed(1) + '%'; }

function getNBAKelly(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  if (mt === 'spread') return side === 'home' ? row.home_spread_kelly : row.away_spread_kelly;
  if (mt === 'moneyline') return side === 'home' ? row.home_ml_kelly : row.away_ml_kelly;
  if (mt === 'total') return side === 'over' ? row.over_kelly : row.under_kelly;
  return null;
}

function getNBAEV(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  if (mt === 'spread') return side === 'home' ? row.home_spread_ev : row.away_spread_ev;
  if (mt === 'moneyline') return side === 'home' ? row.home_ml_ev : row.away_ml_ev;
  if (mt === 'total') return side === 'over' ? row.over_ev : row.under_ev;
  return row.selected_ev;
}

function getNBAOdds(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  if (mt === 'spread') return side === 'home' ? row.home_dk_spread_american : row.away_dk_spread_american;
  if (mt === 'moneyline') return side === 'home' ? row.home_dk_moneyline_american : row.away_dk_moneyline_american;
  if (mt === 'total') return side === 'over' ? row.dk_total_over_american : row.dk_total_under_american;
  return null;
}

function buildSideLabel(row) {
  const mt = (row.market_type || '').toLowerCase();
  const side = (row.bet_side || '').toLowerCase();
  const line = parseFloat(row.line);
  if (mt === 'total') return `${side.toUpperCase()} ${row.line || ''}`;
  if (['spread','puck_line','run_line'].includes(mt)) {
    const team = side === 'home' ? row.home_team : row.away_team;
    const lineStr = !isNaN(line) ? ` ${line > 0 ? '+' : ''}${line}` : '';
    return `${team}${lineStr}`;
  }
  if (mt === 'moneyline') return side === 'home' ? row.home_team : row.away_team;
  return side;
}

function processPicks(rows, sport, dateStr) {
  return rows.filter(row => (row.game_date || '').trim() === dateStr).map(row => {
    let kelly, ev, odds;
    if (sport === 'nba') {
      kelly = parseFloat(getNBAKelly(row));
      ev = parseFloat(getNBAEV(row));
      odds = getNBAOdds(row);
    } else {
      kelly = parseFloat(row.kelly);
      ev = parseFloat(row.ev);
      odds = row.dk_odds_american;
    }
    if (isNaN(kelly) || kelly <= 0) return null;
    return {
      matchup: `${row.away_team} @ ${row.home_team}`,
      time: row.game_time || '',
      market_type: (row.market_type || '').toLowerCase(),
      side: buildSideLabel(row),
      odds: formatOdds(odds),
      ev: isNaN(ev) ? null : ev,
      kelly,
    };
  }).filter(Boolean);
}

// ─── UFC: Find nearest event ───────────────────────────────────────────────
async function findUFCEventDate() {
  const today = new Date();
  const candidates = [];
  for (let offset = -30; offset <= 30; offset++) {
    const d = new Date(today);
    d.setDate(today.getDate() + offset);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    candidates.push({ date: `${y}_${m}_${day}`, offset: Math.abs(offset) });
  }
  const results = await Promise.all(
    candidates.map(async ({ date, offset }) => {
      const url = `${BASE_DOCS}win/mma/ufc/03_select/${date}_ufc_select.csv`;
      try {
        const r = await fetch(url, { method: 'HEAD' });
        return r.ok ? { date, offset } : null;
      } catch { return null; }
    })
  );
  const valid = results.filter(Boolean).sort((a, b) => a.offset - b.offset);
  return valid.length ? valid[0].date : null;
}

async function loadUFCPicks() {
  const eventDate = await findUFCEventDate();
  const el = document.getElementById('kelly-ufc-event');
  if (!eventDate) {
    if (el) el.textContent = 'No event';
    return [];
  }
  if (el) el.textContent = eventDate.replaceAll('_', '-');

  try {
    const url = `${BASE_DOCS}win/mma/ufc/03_select/${eventDate}_ufc_select.csv`;
    const r = await fetch(url);
    if (!r.ok) return [];
    const rows = parseCSV(await r.text());
    return rows.map(row => {
      const kelly = parseFloat(row.kelly || 0);
      const ev = parseFloat(row.ev || 0);
      if (isNaN(kelly) || kelly <= 0) return null;
      return {
        matchup: `${row.fighter} vs ${row.opponent}`,
        time: '',
        market_type: 'ufc',
        side: `${row.fighter} ${row.moneyline || ''}`,
        odds: row.moneyline || '—',
        ev: isNaN(ev) ? null : ev,
        kelly,
        isUFC: true,
      };
    }).filter(Boolean);
  } catch { return []; }
}

function render() {
  const bankroll = parseFloat(document.getElementById('bankroll').value) || 0;
  const container = document.getElementById('picks-container');
  const sports = [
    { key: 'nba', label: 'NBA' },
    { key: 'mlb', label: 'MLB' },
    { key: 'nhl', label: 'NHL' },
    { key: 'ufc', label: 'UFC' },
  ];

  let totalPicks = 0, totalBet = 0, html = '';
  const allPicksList = sports.flatMap(s => allPicks[s.key]);
  const totalKelly = allPicksList.reduce((sum, p) => sum + p.kelly * fraction, 0);
  const scale = totalKelly > 1.0 ? 1.0 / totalKelly : 1.0;

  for (const { key, label } of sports) {
    const picks = allPicks[key];
    totalPicks += picks.length;

    html += `<div class="sport-section">
      <div class="sport-section-header">
        <span class="sport-section-title ${key}">${label}</span>
        <span class="pick-count">${picks.length} PICK${picks.length !== 1 ? 'S' : ''}</span>
      </div>`;

    if (picks.length === 0) {
      html += `<div class="no-picks">No picks${key === 'ufc' ? ' for upcoming event' : ' for this date'}</div>`;
    } else {
      html += `<div class="picks-grid">`;
      for (const p of picks) {
        const betAmt = bankroll > 0 ? bankroll * p.kelly * fraction * scale : 0;
        totalBet += betAmt;
        const amountHtml = bankroll > 0
          ? `<span class="pick-amount">${formatDollar(betAmt)}</span>`
          : `<span class="pick-amount zero">enter bankroll</span>`;

        html += `<div class="pick-card">
          <div class="pick-card-top">
            <span class="pick-market-tag ${p.market_type}">${p.market_type.replace('_',' ')}</span>
            <span class="pick-odds">${p.odds}</span>
          </div>
          <div class="pick-matchup">${p.matchup}${p.time ? ' · ' + p.time : ''}</div>
          <div class="pick-bet">${p.side}</div>
          <div class="pick-footer">
            <span class="pick-ev">EV ${p.ev !== null ? formatPct(p.ev) : '—'}</span>
            <span class="pick-kelly">K ${formatPct(p.kelly)}</span>
            ${amountHtml}
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  }

  container.innerHTML = html;
  document.getElementById('total-picks').textContent = totalPicks || '—';
  document.getElementById('total-bet').textContent = bankroll > 0 && totalBet > 0 ? formatDollar(totalBet) : '—';
  document.getElementById('total-pct').textContent = bankroll > 0 && totalBet > 0 ? formatPct(totalBet / bankroll) : '—';
}

async function loadAll() {
  const date = toDateStr(initDatePicker());
  const files = [
    { sport: 'nba', url: `${BASE}docs/win/basketball/04_select/daily_slate/nba_selected.csv` },
    { sport: 'mlb', url: `${BASE}docs/win/baseball/04_select/${date}_MLB.csv` },
    { sport: 'nhl', url: `${BASE}docs/win/hockey/04_select/${date}_NHL.csv` },
  ];

  await Promise.all([
    ...files.map(async ({ sport, url }) => {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        const rows = parseCSV(await r.text());
        allPicks[sport] = processPicks(rows, sport, date);
      } catch {
        allPicks[sport] = [];
      }
    }),
    loadUFCPicks().then(picks => { allPicks.ufc = picks; }),
  ]);

  render();
}

loadAll();
</script>
</body>
</html>
