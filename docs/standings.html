<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a;--bg2:#111111;--bg3:#141414;--border:#222222;
      --green:#00ff84;--blue:#00bfff;--yellow:#facc15;--red:#ff4444;
      --orange:#ff8c00;--muted:#555555;--text:#e0e0e0;--text2:#888888;
    }
    body { background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--green); }
    .page-subtitle { color:var(--text2);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--blue);color:var(--blue); }
    .league-pill.active { border-color:var(--green);color:var(--green);background:rgba(0,255,132,0.06); }
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--green);box-shadow:0 0 6px var(--green); }
    .status-dot.yellow { background:var(--yellow);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .main { padding:20px 24px;display:flex;flex-direction:column;gap:28px; }
    .conference-block {}
    .conference-header { font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;letter-spacing:0.1em;color:var(--text);text-transform:uppercase;margin-bottom:12px; }
    .division-block { margin-bottom:20px; }
    .division-header { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;color:var(--text2);text-transform:uppercase;padding:0 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px; }
    .standings-table { width:100%;border-collapse:collapse;font-size:12px; }
    .standings-table thead tr { border-bottom:1px solid var(--border); }
    .standings-table th { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);padding:5px 8px;text-align:right; }
    .standings-table th:first-child { text-align:left; }
    .standings-table tbody tr { border-bottom:1px solid #161616;transition:background 0.1s; }
    .standings-table tbody tr:hover { background:var(--bg2); }
    .standings-table td { padding:6px 8px;text-align:right;color:var(--text2); }
    .standings-table td:first-child { text-align:left; }
    .team-cell { display:flex;align-items:center;gap:8px; }
    .team-logo-sm { width:18px;height:18px;object-fit:contain; }
    .team-name-cell { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);letter-spacing:0.04em; }
    .rank-cell { color:var(--muted);font-size:11px;min-width:18px; }
    .val-win { color:var(--green); }
    .val-loss { color:var(--red); }
    .empty-state { text-align:center;padding:60px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div>
    <div class="page-title">Standings</div>
    <div class="page-subtitle">CURRENT SEASON</div>
  </div>
</div>
<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  <div class="league-pill" data-sport="basketball" data-league="mens-college-basketball">NCAAB</div>
</div>
<div class="status-bar" id="standings-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>
<div class="main" id="standings-main"></div>
<div class="empty-state" id="standings-empty" style="display:none">No standings available</div>
<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function getStat(stats, names) {
  if (!stats) return '—';
  var nameList = Array.isArray(names) ? names : [names];
  for (var i = 0; i < stats.length; i++) {
    var s = stats[i];
    var n = (s.name || s.shortDisplayName || s.displayName || '').toLowerCase();
    for (var j = 0; j < nameList.length; j++) {
      if (n === nameList[j].toLowerCase()) {
        return s.displayValue || s.value || '—';
      }
    }
  }
  return '—';
}

function buildTable(entries, sport) {
  var cols;
  if (sport === 'basketball') cols = [
    { label: 'W',   names: ['wins','w'] },
    { label: 'L',   names: ['losses','l'] },
    { label: 'PCT', names: ['winpercent','pct','win%'] },
    { label: 'GB',  names: ['gamesbehind','gb'] },
    { label: 'STRK',names: ['streak'] }
  ];
  else if (sport === 'hockey') cols = [
    { label: 'GP',  names: ['gamesplayed','gp'] },
    { label: 'W',   names: ['wins','w'] },
    { label: 'L',   names: ['losses','l'] },
    { label: 'OTL', names: ['otlosses','otl'] },
    { label: 'PTS', names: ['points','pts'] },
    { label: 'STRK',names: ['streak'] }
  ];
  else if (sport === 'baseball') cols = [
    { label: 'W',   names: ['wins','w'] },
    { label: 'L',   names: ['losses','l'] },
    { label: 'PCT', names: ['winpercent','pct'] },
    { label: 'GB',  names: ['gamesbehind','gb'] },
    { label: 'STRK',names: ['streak'] }
  ];
  else cols = [
    { label: 'W',   names: ['wins','w'] },
    { label: 'L',   names: ['losses','l'] },
    { label: 'PCT', names: ['winpercent','pct'] }
  ];

  var thead = '<thead><tr><th>#</th><th>Team</th>' +
    cols.map(function(c) { return '<th>' + c.label + '</th>'; }).join('') +
    '</tr></thead>';

  var tbody = '<tbody>' + entries.map(function(e, idx) {
    var team  = e.team || {};
    var stats = e.stats || [];
    var logo  = team.logos && team.logos[0] ? '<img class="team-logo-sm" src="' + team.logos[0].href + '" loading="lazy">' : '';
    var name  = team.shortDisplayName || team.displayName || team.name || '—';

    var statCells = cols.map(function(c) {
      var val = getStat(stats, c.names);
      return '<td>' + val + '</td>';
    }).join('');

    return '<tr>' +
      '<td class="rank-cell">' + (idx + 1) + '</td>' +
      '<td><div class="team-cell">' + logo + '<span class="team-name-cell">' + name + '</span></div></td>' +
      statCells +
    '</tr>';
  }).join('') + '</tbody>';

  return '<table class="standings-table">' + thead + tbody + '</table>';
}

async function loadStandings() {
  setStatus('Loading...', 'yellow');
  var main  = document.getElementById('standings-main');
  var empty = document.getElementById('standings-empty');
  main.innerHTML = '';

  try {
    var url  = 'https://site.api.espn.com/apis/v2/sports/' + activeSport + '/' + activeLeague + '/standings';
    var r    = await fetch(url);
    var data = await r.json();

    var groups = data.children || [];
    if (groups.length === 0) {
      // flat standings fallback
      var entries = data.standings && data.standings.entries ? data.standings.entries : [];
      if (entries.length === 0) { empty.style.display = ''; setStatus('No data', ''); return; }
      var block = document.createElement('div');
      block.innerHTML = buildTable(entries, activeSport);
      main.appendChild(block);
      setStatus('Loaded', 'green');
      return;
    }

    groups.forEach(function(conf) {
      var confBlock = document.createElement('div');
      confBlock.className = 'conference-block';

      var confName = conf.name || conf.abbreviation || '';
      if (confName) {
        var ch = document.createElement('div');
        ch.className = 'conference-header';
        ch.textContent = confName;
        confBlock.appendChild(ch);
      }

      var divisions = conf.children || [];
      if (divisions.length > 0) {
        divisions.forEach(function(div) {
          var divBlock = document.createElement('div');
          divBlock.className = 'division-block';
          var entries = div.standings && div.standings.entries ? div.standings.entries : [];
          var divName = div.name || '';
          if (divName) {
            var dh = document.createElement('div');
            dh.className = 'division-header';
            dh.textContent = divName;
            divBlock.appendChild(dh);
          }
          divBlock.innerHTML += buildTable(entries, activeSport);
          confBlock.appendChild(divBlock);
        });
      } else {
        var entries = conf.standings && conf.standings.entries ? conf.standings.entries : [];
        confBlock.innerHTML += buildTable(entries, activeSport);
      }

      main.appendChild(confBlock);
    });

    setStatus('Standings loaded', 'green');
  } catch(e) {
    setStatus('Failed to load', '');
    empty.style.display = '';
  }
}

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    loadStandings();
  });
});

loadStandings();
</script>
</body>
</html>
