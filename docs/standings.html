<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Standings</title>
  <link rel="stylesheet" href="css/matstheme.css">
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container">
  <h1 class="site-title">STANDINGS</h1>

  <select id="league-select">
    <option value="basketball/nba">NBA</option>
    <option value="hockey/nhl">NHL</option>
    <option value="baseball/mlb">MLB</option>
    <option value="basketball/mens-college-basketball">NCAAB</option>
  </select>

  <div id="standings-container"></div>
</div>

<script src="js/nav.js"></script>

<script>
async function loadStandings() {
  const val = document.getElementById("league-select").value;
  const [sport, league] = val.split("/");

  const res = await fetch(`https://site.api.espn.com/apis/v2/sports/${sport}/${league}/standings`);
  const data = await res.json();

  const container = document.getElementById("standings-container");
  container.innerHTML = "";

  data.children[0].standings.entries.forEach(e => {
    container.innerHTML += `
      <div class="game-card">
        ${e.team.displayName} (${e.stats[0].value}-${e.stats[1].value})
      </div>
    `;
  });
}

document.getElementById("league-select").addEventListener("change", loadStandings);
loadStandings();
</script>

</body>
</html>
