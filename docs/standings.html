<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standings · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    .page-header {
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .league-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .league-pill:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .league-pill.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.06);
    }

    .league-pill.placeholder {
      border-style: dashed;
      opacity: 0.75;
    }

    .league-pill.placeholder.active {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      background: rgba(250,204,21,0.06);
    }

    .view-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      margin-left: auto;
    }

    .view-pill:hover {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
    }

    .view-pill.active {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      background: rgba(250,204,21,0.06);
    }

    .view-pill.hidden {
      display: none;
    }

    .status-bar {
      padding: 8px 24px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-dot.yellow {
      background: var(--accent-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.red {
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red);
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .main {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .conferences-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(340px,1fr));
      gap: 16px;
      align-items: start;
    }

    .conference-block {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 14px 16px;
    }

    .conference-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--text-main);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .division-block {
      margin-bottom: 20px;
    }

    .division-block:last-child {
      margin-bottom: 0;
    }

    .division-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      padding: 0 0 6px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 6px;
    }

    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .standings-table thead tr {
      border-bottom: 1px solid var(--border-soft);
    }

    .standings-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 5px 6px;
      text-align: right;
      white-space: nowrap;
    }

    .standings-table th:first-child {
      text-align: right;
      width: 20px;
      padding-right: 4px;
    }

    .standings-table th:nth-child(2) {
      text-align: left;
      padding-left: 4px;
    }

    .standings-table tbody tr {
      border-bottom: 1px solid var(--border-soft);
      transition: background 0.1s;
    }

    .standings-table tbody tr:hover {
      background: var(--bg-card);
    }

    .standings-table td {
      padding: 5px 6px;
      text-align: right;
      color: var(--text-muted);
      vertical-align: middle;
      white-space: nowrap;
    }

    .standings-table td:first-child {
      text-align: right;
    }

    .standings-table td:nth-child(2) {
      text-align: left;
    }

    .team-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .team-logo-sm {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .team-name-cell {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .rank-cell {
      color: var(--text-muted);
      font-size: 11px;
      width: 20px;
      text-align: right;
      padding-right: 4px;
    }

    .standings-table tr.playoff-cutoff td {
      border-bottom: 2px solid rgba(0,255,132,0.4);
    }

    .playoff-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: rgba(0,255,132,0.5);
      text-align: right;
      padding: 2px 6px 4px;
    }

    .rankings-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .poll-block {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 14px 16px;
    }

    .poll-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--accent-yellow);
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-soft);
    }

    .rankings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .rankings-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 5px 6px;
      text-align: right;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    .rankings-table th:nth-child(2) {
      text-align: left;
    }

    .rankings-table td {
      padding: 5px 6px;
      text-align: right;
      color: var(--text-muted);
      vertical-align: middle;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    .rankings-table td:nth-child(2) {
      text-align: left;
    }

    .rankings-table tr:hover td {
      background: var(--bg-card);
    }

    .rankings-table tr:last-child td {
      border-bottom: none;
    }

    .rank-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: var(--accent-yellow);
    }

    .rank-chg-up {
      color: var(--accent-green);
      font-size: 10px;
    }

    .rank-chg-down {
      color: var(--accent-red);
      font-size: 10px;
    }

    .rank-chg-same {
      color: var(--text-muted);
      font-size: 10px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .placeholder-state {
      max-width: 760px;
      margin: 40px auto;
      padding: 28px;
      border: 1px dashed var(--border-soft);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }

    .placeholder-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--accent-yellow);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .placeholder-copy {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .error-details {
      margin-top: 10px;
      color: var(--accent-red);
      font-size: 10px;
      word-break: break-all;
      line-height: 1.5;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 400;
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }

    @media (max-width: 720px) {
      .page-header,
      .controls,
      .status-bar,
      .main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .view-pill {
        margin-left: 0;
      }

      .conferences-wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Standings</div>
    <div class="page-subtitle">ESPN · CURRENT SEASON</div>
  </div>
</div>

<div class="controls" id="league-controls">
  <div class="view-pill hidden" id="rankings-pill">Rankings</div>
</div>

<div class="status-bar" id="standings-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>

<div class="main" id="standings-main"></div>
<div class="empty-state" id="standings-empty" style="display:none">No data available</div>

<script src="js/nav.js"></script>
<script src="js/standings/render.js"></script>
</body>
</html>
