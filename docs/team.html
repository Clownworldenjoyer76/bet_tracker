<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a;--bg2:#111111;--bg3:#141414;--border:#222222;
      --green:#00ff84;--blue:#00bfff;--yellow:#facc15;--red:#ff4444;
      --orange:#ff8c00;--muted:#555555;--text:#e0e0e0;--text2:#888888;
    }
    body { background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--green); }
    .page-subtitle { color:var(--text2);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--blue);color:var(--blue); }
    .league-pill.active { border-color:var(--green);color:var(--green);background:rgba(0,255,132,0.06); }
    .team-select { background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 10px;outline:none;min-width:220px; }
    .team-select:focus { border-color:var(--blue); }
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--green);box-shadow:0 0 6px var(--green); }
    .status-dot.yellow { background:var(--yellow);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }

    /* TABS */
    .tab-bar { display:flex;border-bottom:1px solid var(--border);overflow-x:auto; }
    .tab-item { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:10px 18px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;flex-shrink:0; }
    .tab-item:hover { color:var(--text); }
    .tab-item.active { color:var(--green);border-bottom-color:var(--green); }
    .tab-panel { display:none;padding:20px 24px; }
    .tab-panel.active { display:block; }

    /* TEAM BANNER */
    .team-banner { display:flex;align-items:center;gap:20px;padding:20px 24px;border-bottom:1px solid var(--border); }
    .team-banner-logo { width:64px;height:64px;object-fit:contain;flex-shrink:0; }
    .team-banner-logo-ph { width:64px;height:64px;background:var(--bg3);border:1px solid var(--border);flex-shrink:0; }
    .team-banner-name { font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:var(--text);letter-spacing:0.04em; }
    .team-banner-meta { font-size:11px;color:var(--text2);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap; }
    .team-banner-meta .highlight { color:var(--green);font-family:'Barlow Condensed',sans-serif;font-weight:700; }

    /* OVERVIEW */
    .info-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px; }
    .info-card { background:var(--bg2);border:1px solid var(--border);padding:10px 12px; }
    .info-label { font-size:9px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px; }
    .info-val { font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;color:var(--text); }
    .info-sub { font-size:10px;color:var(--text2);margin-top:2px; }

    /* ROSTER */
    .roster-table { width:100%;border-collapse:collapse;font-size:12px; }
    .roster-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border); }
    .roster-table td { padding:6px 8px;border-bottom:1px solid #161616;color:var(--text2);vertical-align:middle; }
    .roster-table tr:hover td { background:var(--bg2); }
    .roster-table tr:last-child td { border-bottom:none; }
    .p-name { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);letter-spacing:0.04em; }
    .inj-dot { display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle; }
    .section-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:10px;margin-top:16px; }
    .section-title:first-child { margin-top:0; }

    /* SCHEDULE */
    .schedule-table { width:100%;border-collapse:collapse;font-size:12px; }
    .schedule-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border); }
    .schedule-table td { padding:6px 8px;border-bottom:1px solid #161616;color:var(--text2); }
    .schedule-table tr:hover td { background:var(--bg2); }
    .schedule-table tr:last-child td { border-bottom:none; }
    .res-w { font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--green); }
    .res-l { font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--red); }
    .res-upcoming { color:var(--text2); }

    /* DEPTH */
    .depth-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px; }
    .depth-pos-block { background:var(--bg2);border:1px solid var(--border);padding:10px 12px; }
    .depth-pos-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--blue);text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px; }
    .depth-player { display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;border-bottom:1px solid #161616; }
    .depth-player:last-child { border-bottom:none; }
    .depth-rank { color:var(--muted);min-width:14px;font-size:10px; }
    .depth-name { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text); }

    /* HISTORY */
    .history-table { width:100%;border-collapse:collapse;font-size:12px; }
    .history-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text2);padding:5px 8px;text-align:left;border-bottom:1px solid var(--border); }
    .history-table td { padding:6px 8px;border-bottom:1px solid #161616;color:var(--text2); }
    .history-table tr:hover td { background:var(--bg2); }
    .history-table tr:last-child td { border-bottom:none; }

    .loading-msg { color:var(--text2);font-size:11px;padding:20px 0;text-align:center; }
    .error-msg { color:var(--red);font-size:11px;padding:12px 0;text-align:center; }
    .no-data { color:var(--muted);font-size:11px;padding:16px 0;text-align:center;letter-spacing:0.08em; }
    .empty-state { text-align:center;padding:60px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div>
    <div class="page-title">Team</div>
    <div class="page-subtitle">ESPN · OVERVIEW · ROSTER · SCHEDULE · DEPTH · HISTORY</div>
  </div>
</div>
<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  <select class="team-select" id="team-select"><option value="">— Select Team —</option></select>
</div>
<div class="status-bar" id="team-status">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Select a league and team</span>
</div>

<div id="team-content" style="display:none">
  <div class="team-banner" id="team-banner"></div>
  <div class="tab-bar">
    <div class="tab-item active" data-tab="overview">Overview</div>
    <div class="tab-item" data-tab="roster">Roster</div>
    <div class="tab-item" data-tab="schedule">Schedule</div>
    <div class="tab-item" data-tab="depth">Depth Chart</div>
    <div class="tab-item" data-tab="history">History</div>
  </div>
  <div class="tab-panel active" id="tab-overview"><div class="loading-msg">Loading...</div></div>
  <div class="tab-panel" id="tab-roster"><div class="loading-msg">Loading...</div></div>
  <div class="tab-panel" id="tab-schedule"><div class="loading-msg">Loading...</div></div>
  <div class="tab-panel" id="tab-depth"><div class="loading-msg">Loading...</div></div>
  <div class="tab-panel" id="tab-history"><div class="loading-msg">Loading...</div></div>
</div>
<div class="empty-state" id="team-empty">Select a team to view</div>

<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';
var currentTeam  = null;
var panelLoaded  = {};

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function fmtDate(str) {
  if (!str) return '—';
  return new Date(str).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

async function loadTeamList() {
  setStatus('Loading teams...', 'yellow');
  var sel = document.getElementById('team-select');
  sel.innerHTML = '<option value="">— Select Team —</option>';
  document.getElementById('team-content').style.display = 'none';
  document.getElementById('team-empty').style.display = '';
  try {
    var r    = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams?limit=200');
    var data = await r.json();
    var teams = (data.sports[0].leagues[0].teams || []).map(function(t) {
      return { id:t.team.id, name:t.team.displayName, abbr:t.team.abbreviation, logo: t.team.logos && t.team.logos[0] ? t.team.logos[0].href : '' };
    }).sort(function(a,b){return a.name.localeCompare(b.name);});
    teams.forEach(function(t) {
      var o = document.createElement('option'); o.value = t.id; o.dataset.name = t.name; o.dataset.logo = t.logo; o.textContent = t.name; sel.appendChild(o);
    });
    setStatus('Select a team', '');
  } catch(e) { setStatus('Failed to load teams',''); }
}

async function loadTeam(teamId) {
  panelLoaded = {};
  currentTeam = teamId;
  document.getElementById('team-empty').style.display = 'none';
  document.getElementById('team-content').style.display = '';
  ['overview','roster','schedule','depth','history'].forEach(function(t) {
    document.getElementById('tab-' + t).innerHTML = '<div class="loading-msg">Loading...</div>';
  });
  // activate overview tab
  document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
  document.querySelector('.tab-item[data-tab="overview"]').classList.add('active');
  document.getElementById('tab-overview').classList.add('active');
  setStatus('Loading team...', 'yellow');
  await loadPanel('overview');
}

async function loadPanel(tab) {
  if (panelLoaded[tab]) return;
  var panel = document.getElementById('tab-' + tab);
  var base  = 'https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams/' + currentTeam;
  try {
    var r, data;
    if (tab === 'overview') {
      r    = await fetch(base + '?enable=roster,projection,stats');
      data = await r.json();
      renderOverview(data);
    } else if (tab === 'roster') {
      r    = await fetch(base + '/roster');
      data = await r.json();
      renderRoster(data, panel);
    } else if (tab === 'schedule') {
      r    = await fetch(base + '/schedule');
      data = await r.json();
      renderSchedule(data, panel);
    } else if (tab === 'depth') {
      r    = await fetch(base + '/depthcharts');
      data = await r.json();
      renderDepth(data, panel);
    } else if (tab === 'history') {
      r    = await fetch(base + '/history');
      data = await r.json();
      renderHistory(data, panel);
    }
    panelLoaded[tab] = true;
  } catch(e) {
    panel.innerHTML = '<div class="error-msg">Failed to load</div>';
  }
}

function renderOverview(data) {
  var team   = data.team || {};
  var rec    = team.record && team.record.items && team.record.items[0];
  var stats  = rec ? rec.stats || [] : [];
  var getStat = function(name) {
    for (var i=0;i<stats.length;i++) {
      var n=(stats[i].name||'').toLowerCase();
      if (n===name.toLowerCase()) return stats[i].displayValue||stats[i].value||'—';
    }
    return '—';
  };

  // banner
  var sel  = document.getElementById('team-select');
  var opt  = sel.options[sel.selectedIndex];
  var logo = opt ? opt.dataset.logo : '';
  var banner = document.getElementById('team-banner');
  var wins   = getStat('wins'); var losses = getStat('losses');
  var stand  = team.standingSummary || '';
  var coach  = '';
  if (team.coaches && team.coaches.length) {
    var hc = team.coaches.find(function(c){return c.type==='head'||c.type==='headCoach';})||team.coaches[0];
    if (hc) coach = hc.firstName + ' ' + hc.lastName;
  }
  var venue = team.franchise && team.franchise.venue ? team.franchise.venue.fullName||'' : team.venue ? team.venue.fullName||'' : '';

  banner.innerHTML =
    (logo ? '<img class="team-banner-logo" src="' + logo + '">' : '<div class="team-banner-logo-ph"></div>') +
    '<div><div class="team-banner-name">' + (team.displayName||'') + '</div>' +
    '<div class="team-banner-meta">' +
      (wins!=='—' ? '<span class="highlight">' + wins + '-' + losses + '</span>' : '') +
      (stand ? '<span>' + stand + '</span>' : '') +
      (coach ? '<span>' + coach + '</span>' : '') +
      (venue ? '<span>' + venue + '</span>' : '') +
      '<span>' + activeLeague.toUpperCase() + '</span>' +
    '</div></div>';

  var panel = document.getElementById('tab-overview');
  var infoCards = [
    { label:'Wins',       val: wins   },
    { label:'Losses',     val: losses },
    { label:'Win %',      val: getStat('winPercent') !== '—' ? getStat('winPercent') : getStat('winpercent') },
    { label:'Streak',     val: getStat('streak') },
    { label:'Home',       val: getStat('homeRecord') !== '—' ? getStat('homeRecord') : getStat('home') },
    { label:'Away',       val: getStat('awayRecord') !== '—' ? getStat('awayRecord') : getStat('away') }
  ].filter(function(c){return c.val && c.val!=='—';});

  var grid = '<div class="info-grid">' + infoCards.map(function(c) {
    return '<div class="info-card"><div class="info-label">' + c.label + '</div><div class="info-val">' + c.val + '</div></div>';
  }).join('') + '</div>';

  panel.innerHTML = grid;
  setStatus((team.displayName||'') + ' loaded', 'green');
}

function renderRoster(data, panel) {
  var groups = data.athletes || [];
  var allPlayers = [];
  groups.forEach(function(g) {
    var items = g.items||g.athletes||(g.id?[g]:[]);
    items.forEach(function(p){allPlayers.push({p:p,group:g.displayName||''});});
  });
  if (!allPlayers.length) { panel.innerHTML='<div class="no-data">No roster data</div>'; return; }

  var colsByLeague = { nba:['#','Name','Pos','Age','HT','WT'], nhl:['#','Name','Pos','Age','HT','WT'], mlb:['#','Name','Pos','Age','HT','WT','B/T'] };
  var cols = colsByLeague[activeLeague]||['#','Name','Pos','Age'];

  var lastGroup = '';
  var rows = allPlayers.map(function(item) {
    var p = item.p;
    var groupRow = '';
    if (item.group && item.group !== lastGroup) {
      lastGroup = item.group;
      groupRow = '<tr><td colspan="' + (cols.length+1) + '" style="font-family:Barlow Condensed,sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--text2);text-transform:uppercase;padding:8px 8px 4px;border-bottom:1px solid var(--border);">' + item.group + '</td></tr>';
    }
    var pos  = p.position?(p.position.abbreviation||p.position.name||'—'):'—';
    var inj  = p.injuries&&p.injuries.length?'<span class="inj-dot" title="'+p.injuries[0].status+'"></span>':'';
    var bv   = p.bats?(typeof p.bats==='string'?p.bats:(p.bats.abbreviation||'—')):'—';
    var tv   = p.throws?(typeof p.throws==='string'?p.throws:(p.throws.abbreviation||'—')):'—';
    var cells= [p.jersey||'—','<span class="p-name">'+(p.displayName||'—')+'</span>'+inj,pos,p.age||'—',p.displayHeight||'—',p.displayWeight||'—'];
    if (activeLeague==='mlb') cells.push(bv+'/'+tv);
    cells = cells.slice(0,cols.length);
    return groupRow + '<tr>' + cells.map(function(c){return '<td>'+c+'</td>';}).join('') + '</tr>';
  }).join('');

  panel.innerHTML = '<div style="overflow-x:auto"><table class="roster-table"><thead><tr>' +
    cols.map(function(c){return '<th>'+c+'</th>';}).join('') +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function renderSchedule(data, panel) {
  var events = data.events || [];
  if (!events.length) { panel.innerHTML='<div class="no-data">No schedule data</div>'; return; }

  var past=[], upcoming=[];
  events.forEach(function(ev) {
    var comp = ev.competitions&&ev.competitions[0];
    if (!comp) return;
    var completed = ev.status&&ev.status.type&&ev.status.type.completed;
    (completed?past:upcoming).push({ev:ev,comp:comp,completed:completed});
  });

  function buildRows(list) {
    return list.slice(0,20).map(function(item) {
      var ev=item.ev; var comp=item.comp;
      var comps = comp.competitors||[];
      var away  = comps.find(function(c){return c.homeAway==='away';})||comps[0];
      var home  = comps.find(function(c){return c.homeAway==='home';})||comps[1];
      if (!away||!home) return '';
      var date  = fmtDate(ev.date);
      var awayN = away.team?(away.team.abbreviation||away.team.displayName||'?'):'?';
      var homeN = home.team?(home.team.abbreviation||home.team.displayName||'?'):'?';
      var matchup = awayN + ' @ ' + homeN;
      var result = '';
      if (item.completed) {
        var as=parseInt(away.score)||0; var hs=parseInt(home.score)||0;
        result = awayN+' '+as+' — '+homeN+' '+hs;
      } else {
        result = ev.status&&ev.status.type?ev.status.type.shortDetail||'':'' ;
      }
      return '<tr><td>'+date+'</td><td>'+matchup+'</td><td class="'+(item.completed?(away.score>home.score?'res-w':'res-l'):'res-upcoming')+'">'+result+'</td></tr>';
    }).join('');
  }

  var html = '';
  if (past.length) {
    html += '<div class="section-title">Recent Results</div><div style="overflow-x:auto"><table class="schedule-table"><thead><tr><th>Date</th><th>Matchup</th><th>Result</th></tr></thead><tbody>' + buildRows(past.reverse()) + '</tbody></table></div>';
  }
  if (upcoming.length) {
    html += '<div class="section-title">Upcoming</div><div style="overflow-x:auto"><table class="schedule-table"><thead><tr><th>Date</th><th>Matchup</th><th>Status</th></tr></thead><tbody>' + buildRows(upcoming) + '</tbody></table></div>';
  }
  panel.innerHTML = html || '<div class="no-data">No games found</div>';
}

function renderDepth(data, panel) {
  var items = data.depthCharts||data.items||[];
  if (!items.length) { panel.innerHTML='<div class="no-data">No depth chart data</div>'; return; }
  var grid = '<div class="depth-grid">';
  items.forEach(function(pos) {
    var posName = pos.position?(pos.position.displayName||pos.position.abbreviation||''):'';
    var athletes = pos.athletes||[];
    if (!athletes.length) return;
    grid += '<div class="depth-pos-block"><div class="depth-pos-title">' + posName + '</div>';
    athletes.forEach(function(a,i) {
      var name = a.athlete?(a.athlete.displayName||'—'):'—';
      grid += '<div class="depth-player"><span class="depth-rank">'+(i+1)+'</span><span class="depth-name">'+name+'</span></div>';
    });
    grid += '</div>';
  });
  grid += '</div>';
  panel.innerHTML = grid;
}

function renderHistory(data, panel) {
  var seasons = data.seasons||data.history||[];
  if (!seasons.length) { panel.innerHTML='<div class="no-data">No history data</div>'; return; }
  var rows = seasons.slice(0,30).map(function(s) {
    return '<tr><td>'+(s.year||s.displayYear||'—')+'</td><td>'+(s.wins!==undefined?s.wins:'—')+'</td><td>'+(s.losses!==undefined?s.losses:'—')+'</td><td>'+(s.note||s.summary||'—')+'</td></tr>';
  }).join('');
  panel.innerHTML = '<table class="history-table"><thead><tr><th>Year</th><th>W</th><th>L</th><th>Notes</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

// tab switching
document.querySelectorAll('.tab-item').forEach(function(tab) {
  tab.addEventListener('click', function() {
    if (!currentTeam) return;
    document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active');});
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
    tab.classList.add('active');
    var tabId = tab.dataset.tab;
    document.getElementById('tab-' + tabId).classList.add('active');
    loadPanel(tabId);
  });
});

document.getElementById('team-select').addEventListener('change', function() {
  if (this.value) loadTeam(this.value);
});

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p){p.classList.remove('active');});
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    currentTeam  = null;
    loadTeamList();
  });
});

// check for ?team=id&league=nba&sport=basketball deeplink
var params = new URLSearchParams(window.location.search);
var dlTeam   = params.get('team');
var dlLeague = params.get('league');
var dlSport  = params.get('sport');
if (dlLeague && dlSport) {
  activeSport  = dlSport;
  activeLeague = dlLeague;
  document.querySelectorAll('.league-pill').forEach(function(p){p.classList.remove('active');});
  var matchPill = document.querySelector('.league-pill[data-league="'+dlLeague+'"]');
  if (matchPill) matchPill.classList.add('active');
}

loadTeamList().then(function() {
  if (dlTeam) {
    var sel = document.getElementById('team-select');
    sel.value = dlTeam;
    if (sel.value) loadTeam(dlTeam);
  }
});
</script>
</body>
</html>
