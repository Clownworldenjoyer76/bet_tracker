markets:

  nhl:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        # Exclude odds -199 to -150 band (44% WR, -31% ROI across all markets)
        odds_bands:
          - [-149, -100]
          - [-109, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      away:
        enabled: true
        # Exclude odds -199 to -150 band (44% WR, -31% ROI across all markets)
        odds_bands:
          - [-149, -100]
          - [-109, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

    puck_line:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          # +1.5 (dog) removed: 58% WR but -18% ROI — heavy negative odds
          # make wins pay too little vs loss cost regardless of edge
          - [-1.5, -1.5]
        # Exclude odds -199 to -150 band
        odds_bands:
          - [-149, -100]
          - [-109, 300]
        # Raised from 0.02: EV 0.02-0.04 on home -1.5 went 0W/5L
        ev_min: 0.04
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.05

      away:
        enabled: true
        line_bands:
          - [-1.5, -1.5]
          - [1.5, 1.5]
        # Exclude odds -199 to -150 band
        odds_bands:
          - [-149, -100]
          - [-109, 300]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.05

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      under:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        # Raised from 0.02: total under at 0.03-0.04 EV went 29% WR, -41% ROI
        ev_min: 0.04
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05
