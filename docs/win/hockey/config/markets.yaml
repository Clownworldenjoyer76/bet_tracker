markets:

  nhl:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-250, -100]
          - [-100, 250]
        ev_min: 0.00
        ev_max: 0.05
        kelly_min: 0.00
        kelly_max: 0.05

      away:
        enabled: true
        odds_bands:
          - [-250, -100]
          - [-100, 250]
        ev_min: 0.00
        ev_max: 0.05
        kelly_min: 0.00
        kelly_max: 0.05

    puck_line:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          - [1.5, 1.5]
        odds_bands:
          - [-300, 150]
        ev_min: -0.1
        ev_max: 0.10
        # kelly_min set to 0 — +1.5 dogs at heavy negative odds
        # have very low Kelly values even with strong EV; EV alone
        # is the right filter here
        kelly_min: 0.0
        # kelly_max raised to 1.0 — at moderate odds like -150,
        # Kelly can reach 0.25-0.30 at typical +1.5 win probs;
        # old cap of 0.10 was blocking the majority of valid bets
        kelly_max: 1.0

      away:
        enabled: true
        line_bands:
          - [1.5, 1.5]
          - [-1.5, -1.5]
        odds_bands:
          - [-300, 199]
          - [200, 999]
        ev_min: -0.10
        ev_max: 0.10
        kelly_min: 0.0
        kelly_max: 1.0

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.00
        ev_max: 0.10
        kelly_min: 0.00
        kelly_max: 0.1

      under:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.00
        ev_max: 0.10
        kelly_min: 0.00
        kelly_max: 0.1
