markets:

  nhl:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-149, -100]
          - [-109, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      away:
        enabled: true
        odds_bands:
          - [-149, -100]
          - [-109, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

    puck_line:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          - [1.5, 1.5]
        # Lowered ev_min from 0.02 — +1.5 base win rate is 70-72%
        # even small positive EV is meaningful at this base rate
        ev_min: 0.01
        ev_max: 0.10
        kelly_min: 0.005
        # Raised kelly_max — +1.5 at heavy negative odds can have
        # high Kelly even at modest EV; old 0.05 cap was blocking bets
        kelly_max: 0.10

      away:
        enabled: true
        line_bands:
          - [1.5, 1.5]
          - [-1.5, -1.5]
        odds_bands:
          - [-300, 200]
          - [200, 999]
        # Lowered ev_min from 0.02 for same reason as home
        ev_min: 0.01
        ev_max: 0.10
        kelly_min: 0.005
        # Raised kelly_max for same reason as home
        kelly_max: 0.10

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      under:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.04
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05
