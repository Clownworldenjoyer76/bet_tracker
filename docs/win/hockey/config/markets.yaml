markets:

  nhl:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-149, -100]
          - [-109, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      away:
        enabled: true
        odds_bands:
          - [-149, -100]
          - [-109, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

    puck_line:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        # +1.5 only — home -1.5 removed entirely
        # -1.5 requires winning by 2+ goals: consistently 30-40% WR
        # +1.5 dog just needs to avoid losing by 2+: much higher win rate
        line_bands:
          - [1.5, 1.5]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.05

      away:
        enabled: true
        line_bands:
          - [1.5, 1.5]
          # -1.5 kept but restricted to odds +200 or better only
          # at +200+ away -1.5 went 67% WR in historical data
          # below +200 the win rate drops to 40-50% — not worth it
          - [-1.5, -1.5]
        odds_bands:
          # +1.5 dogs: allow negative odds (they cover easily) up to +200
          - [-300, 200]
          # -1.5 favs: only take at +200 or better (high payout justifies lower WR)
          - [200, 999]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.05

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      under:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.04
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05
