markets:

  nhl:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-250, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      away:
        enabled: true
        odds_bands:
          - [-250, 200]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

    puck_line:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          - [-1.5, -1.5]
          - [1.5, 1.5]
        # CHANGE: raised from 0.02 — home puck line below 0.04 EV was 0W/6L (-100% ROI)
        ev_min: 0.04
        ev_max: 0.12
        kelly_min: 0.01
        kelly_max: 0.05
        # CHANGE: excludes +100 to +149 dead zone (1W/5L, -61% ROI)
        # Allows negative odds (favourite covering) and +150 or better (value dog)
        odds_bands:
          - [-300, -100]
          - [150, 300]

      away:
        enabled: true
        line_bands:
          - [-1.5, -1.5]
          - [1.5, 1.5]
        ev_min: 0.02
        ev_max: 0.12
        kelly_min: 0.01
        kelly_max: 0.05
        # CHANGE: excludes heavy favourites worse than -150 (1W/2L, poor risk/reward)
        odds_bands:
          - [-150, 300]

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05

      under:
        enabled: true
        line_bands:
          - [4.5, 7.5]
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.05
