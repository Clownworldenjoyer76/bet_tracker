markets:
###################################################################################################
# NBA CONFIG ######################################################################################
###################################################################################################
  nba:

    moneyline:
      enabled: true
      pick_preference: best_ev
#################################################################     
## HOME NBA MONEYLINE ###########################################
#################################################################
      home:
        enabled: true
        odds_bands:
          - [-500, -175]   # strong favorites: 75-86% win rate, clear positive edge
          - [175, 200]     # large dogs: 50% win rate vs 34.8% implied (+15.2% edge)
        ev_min: 0.005
        ev_max: 0.10
        kelly_min: 0.005
        kelly_max: 0.1
#################################################################
## AWAY NBA MONEYLINE ###########################################
#################################################################  
      away:
        enabled: true
        odds_bands:
          - [-500, -175]   # heavy away favorites: 71-76% win rate, positive edge
        ev_min: 0.005
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.1
#################################################################
## NBA SPREAD ############################
#################################################################
    spread:
      enabled: true
      pick_preference: best_ev
      
     spread:
  enabled: true
  pick_preference: best_ev
##############################################################
## HOME NBA SPREAD ###########################################
##############################################################
      home:
        enabled: true
        line_bands:

      # ONLY strongest zone (true signal)
      - [-8.5, -3.5]

        ev_min: 0.045
        ev_max: 0.18
        kelly_min: 0.015
        kelly_max: 0.08
##############################################################
## AWAY NBA SPREAD ###########################################
##############################################################
      away:
        enabled: true
        line_bands:

      # best dog value zone only
      - [3.5, 9.5]

        ev_min: 0.065
        ev_max: 0.20
        kelly_min: 0.015
        kelly_max: 0.08
##############################################################
## NBA TOTAL #################################################
##############################################################

    total:
      enabled: true
      pick_preference: best_ev
#############################################################
## OVER NBA TOTAL ###########################################
#############################################################
      over:
        enabled: true
        line_bands:
          - [225, 237]     # over-positive range: 49-59% over rate
        ev_min: 0.01
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.1
##############################################################
## UNDER NBA TOTAL ###########################################
##############################################################
      under:
        enabled: true
        line_bands:
          - [215, 225]     # under-dominant: 50-59% under rate
          - [240, 248]     # under-dominant: 60% under rate
        ev_min: 0.02
        ev_max: 0.10
        kelly_min: 0.01
        kelly_max: 0.07

