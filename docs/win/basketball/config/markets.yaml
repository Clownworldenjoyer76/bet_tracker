###################################################################################################
# NBA CONFIG ######################################################################################
# Simulation vs original (276 picks, 46.7% WR, -29.2u):
# Proposed: 140 picks, 57.1% WR, +10.6u
# Every market retained. Filters applied via odds_bands, line_bands, and ev thresholds.
###################################################################################################

  nba:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-500, -150]  
        ev_min: 0.0
        ev_max: 0.20
        kelly_min: 0.0
        kelly_max: 0.25

      away:
        enabled: true
        odds_bands:
          - [-500, -150]
        ev_min: 0.0
        ev_max: 0.05      
        kelly_min: 0.0
        kelly_max: 0.25

#################################################################
## NBA SPREAD ###################################################
#################################################################

    spread:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true

        line_bands:
          - [-20, -3.0]
          - [-0.5, 0]

        ev_min: 0.0
        ev_max: 0.10

        kelly_min: 0.0
        kelly_max: 0.25

        exclude_rules:
          - line_min: -3.0
            line_max: 0
            ev_max: 0.0

      away:
        enabled: true
        line_bands:
          - [5, 8]

        ev_min: 0.0
        ev_max: 0.15

        kelly_min: 0.0
        kelly_max: 0.25

#################################################################
## NBA TOTAL ####################################################
#################################################################

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true

        line_bands:
          - [200, 225]
          - [225, 230]

        ev_min: 0.02
        ev_max: 0.075      

        kelly_min: 0.0
        kelly_max: 0.25

        high_total_rules:
          min_total: 230
          ev_min: 0.05

      under:
        enabled: true

        line_bands:
          - [215, 228]    
          - [233, 245]

        odds_bands:
          - [-109, 100]   

        ev_min: 0.01
        ev_max: 0.05      

        kelly_min: 0.0
        kelly_max: 0.25

###################################################################################################
# NCAAB CONFIG ####################################################################################
###################################################################################################

  ncaab:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-500, -200]
          - [-199, -150]
          - [-149, -110]
          - [101, 150]
        ev_min: 0.03
        ev_max: 0.15
        kelly_min: 0.0
        kelly_max: 0.25

      away:
        enabled: true
        odds_bands:
          - [-500, -200]
          - [-199, -150]
          - [-149, -110]
          - [101, 150]
        ev_min: 0.05
        ev_max: 0.15
        kelly_min: 0.0
        kelly_max: 0.25

#################################################################
## NCAAB SPREAD #################################################
#################################################################

    spread:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          - [-25, -6.5]
          - [-6.0, -3.5]
          - [-3.0, -0.5]
        ev_min: 0.06
        ev_max: 0.20
        kelly_min: 0.01
        kelly_max: 0.05

        exclude_rules:
          - line_min: -6.0
            line_max: -0.5
            ev_max: 0.08

      away:
        enabled: true
        line_bands:
          - [5.0, 8.5]
          - [0.5, 4.5]
        odds_bands:
          - [-109, 100]
        ev_min: 0.02
        ev_max: 0.15
        kelly_min: 0.01
        kelly_max: 0.05

        exclude_rules:
          - line_min: 0.5
            line_max: 4.5
            ev_max: 0.05
          - line_min: 9.0
            line_max: 25
            ev_max: 0.15

#################################################################
## NCAAB TOTAL ##################################################
#################################################################

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [120, 134.5]
          - [135, 154.5]
          - [155, 180]
        ev_min: 0.05
        ev_max: 0.15
        kelly_min: 0.0
        kelly_max: 0.25

        exclude_rules:
          - line_min: 155
            line_max: 180
            ev_max: 0.09

      under:
        enabled: true
        line_bands:
          - [120, 134.5]
          - [135, 144.5]
          - [145, 155]
          - [155.5, 180]
        odds_bands:
          - [-149, -110]
        ev_min: 0.05
        ev_max: 0.10
        kelly_min: 0.0
        kelly_max: 0.25

        exclude_rules:
          - line_min: 120
            line_max: 134.5
            ev_max: 0.08
          - line_min: 145
            line_max: 155
            ev_max: 0.07
