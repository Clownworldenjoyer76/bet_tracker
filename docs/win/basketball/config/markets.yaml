markets:

###################################################################################################
# NBA CONFIG ######################################################################################
###################################################################################################

  nba:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-500, 300]
        ev_min: 0.0
        ev_max: 0.20
        kelly_min: 0.0
        kelly_max: 0.25

      away:
        enabled: true
        odds_bands:
          - [-500, 300]
        ev_min: 0.0
        ev_max: 0.20
        kelly_min: 0.0
        kelly_max: 0.25

#################################################################
## NBA SPREAD ###################################################
#################################################################

    spread:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          - [-20, -0.5]

        ev_min: 0.0
        ev_max: 0.25
        kelly_min: 0.0
        kelly_max: 0.25

      away:
        enabled: true
        line_bands:
          - [0.5, 20]

        ev_min: 0.0
        ev_max: 0.25
        kelly_min: 0.0
        kelly_max: 0.25

#################################################################
## NBA TOTAL ####################################################
#################################################################

    total:
      enabled: true
      pick_preference: best_ev

