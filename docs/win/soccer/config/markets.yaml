# Notes
# -----
# - All bands are inclusive [lo, hi]. A side passes a band check if its
#   value falls inside ANY of the listed [lo, hi] pairs.
# - Empty months / exclude_days_of_week => no date filtering.
# - selection_mode: all_qualifying  => every side that passes is selected.
# - selection_mode: pick_one        => one side per game per market,
#                                      chosen by pick_preference.
# - odds are decimal (dk_*_decimal / btts_yes / btts_no).
# - model_prob refers to engine_*_prob columns.
# - edge refers to *_edge columns.
