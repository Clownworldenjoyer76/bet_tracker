markets:

  mlb:

    moneyline:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        odds_bands:
          - [-300, -1]
          - [0, 300]
        ev_min: 0.001
        ev_max: 0.99
        kelly_min: 0.00
        kelly_max: 0.99

        exclude_rules:
          - odds_min: -200
            odds_max: -110
            ev_max: 0.02
          - odds_min: 100
            odds_max: 140
            ev_max: 0.05
          - odds_min: -300
            odds_max: -200
            ev_max: 0.03

      away:
        enabled: true
        odds_bands:
          - [-300, -1]
          - [0, 300]
        ev_min: 0.001
        ev_max: 0.99
        kelly_min: 0.00
        kelly_max: 0.99

        exclude_rules:
          - odds_min: -180
            odds_max: -110
            ev_max: 0.03
          - odds_min: 100
            odds_max: 160
            ev_max: 0.06
          - odds_min: 180
            odds_max: 300
            ev_max: 0.10

    run_line:
      enabled: true
      pick_preference: best_ev

      home:
        enabled: true
        line_bands:
          - [-1.5, -0.5]
        odds_bands:
          - [-300, 300]
        ev_min: 0.001
        ev_max: 0.99
        kelly_min: 0.00
        kelly_max: 0.99

        exclude_rules:
          - ev_max: 0.03
          - odds_min: -110
            odds_max: 110
            ev_max: 0.08
          - ev_min: 0.15
            ev_max: 0.99

      away:
        enabled: true
        line_bands:
          - [-1.5, -0.5]
        odds_bands:
          - [-300, 300]
        ev_min: 0.001
        ev_max: 0.99
        kelly_min: 0.00
        kelly_max: 0.99

        exclude_rules:
          - ev_max: 0.02
          - odds_min: -110
            odds_max: 110
            ev_max: 0.08
          - ev_min: 0.15
            ev_max: 0.99

    total:
      enabled: true
      pick_preference: best_ev

      over:
        enabled: true
        line_bands:
          - [6.0, 18.0]
        odds_bands:
          - [-300, 300]
        ev_min: 0.001
        ev_max: 0.99
        kelly_min: 0.00
        kelly_max: 0.99

        exclude_rules:
          - ev_max: 0.03
          - ev_min: 0.20
            ev_max: 0.99

      under:
        enabled: true
        line_bands:
          - [6.0, 18.0]
        odds_bands:
          - [-300, 300]
        ev_min: 0.001
        ev_max: 0.99
        kelly_min: 0.00
        kelly_max: 0.99

        exclude_rules:
          - ev_max: 0.05
          - ev_min: 0.15
            ev_max: 0.99
