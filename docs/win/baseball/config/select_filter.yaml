# docs/win/baseball/config/select_filter.yaml
#
# Context-aware filters applied in baseball_select_bets.py.
# These run after the standard EV/Kelly/odds filters in markets.yaml.

mlb:

  # ── Rain Exclusion ───────────────────────────────────────────
  # Skip bet if will_it_rain = 1 OR chance_of_rain > rain_chance_max.
  # Skipped entirely for dome/indoor venues (weather_applicable = 0).
  rain_chance_max: 40            # percent

  # ── SP Sample Flag Exclusion (totals only) ───────────────────
  # Skip total bets if either SP has sample_flag = 'low'.
  sp_sample_exclude_totals: true

  # ── Lineup Low Sample Warning ────────────────────────────────
  # Do not exclude bet, but set low_confidence = 1 in output
  # if home_low_sample_count or away_low_sample_count exceeds threshold.
  lineup_low_sample_warn: 3

  # ── Weather / Park Context Nudges (totals only) ──────────────
  # Wind nudge applies when wind_mph meets or exceeds this threshold.
  wind_nudge_threshold: 12       # mph

  # Cold-weather suppression threshold.
  temp_cold_threshold: 50        # °F

  # Hot-weather offense boost threshold.
  temp_hot_threshold: 80         # °F

  # Multiplier for park-factor-based total edge adjustment.
  park_edge_scale: 0.002
