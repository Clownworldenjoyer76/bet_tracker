<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/matstheme.css">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#0a0a0a;--bg2:#111111;--bg3:#141414;--border:#222222;
    --green:#00ff84;--blue:#00bfff;--yellow:#facc15;--red:#ff4444;
    --orange:#ff8c00;--muted:#555555;--text:#e0e0e0;--text2:#888888;
  }
  body { background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh;padding:0; }

  .picks-header { border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
  .picks-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--green);margin:0; }
  .picks-subtitle { color:var(--text2);font-size:11px;letter-spacing:0.06em;margin-top:2px; }

  #status { font-size:10px;letter-spacing:0.1em;color:var(--text2);text-transform:uppercase; }
  #status.loading { color:var(--green);animation:pulse-text 1.2s ease infinite; }
  @keyframes pulse-text { 0%,100%{opacity:1;}50%{opacity:0.35;} }

  .picks-controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap; }

  .date-wrap { display:flex;flex-direction:column;gap:3px; }
  .date-label { font-size:9px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase; }
  input[type="date"] { background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:5px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;transition:border-color 0.15s;cursor:pointer;color-scheme:dark; }
  input[type="date"]:focus { border-color:var(--blue); }
  input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(1) opacity(0.3);cursor:pointer; }

  #league-filters { display:flex;gap:6px;flex-wrap:wrap;align-items:center; }
  .filter-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;text-transform:uppercase;user-select:none; }
  .filter-pill:hover { border-color:var(--blue);color:var(--blue); }
  .filter-pill.active { border-color:var(--green);color:var(--green);background:rgba(0,255,132,0.06); }

  .status-bar { padding:8px 24px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px; }

  #games { display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0;padding:24px;align-items:start; }

  .league-column { display:flex;flex-direction:column;gap:8px;padding:0 16px 0 0;border-right:1px solid var(--border); }
  .league-column:last-child { border-right:none;padding-right:0; }
  .league-column + .league-column { padding-left:16px; }

  .league-header { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:var(--text2);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:4px; }
  .league-header.lh-NHL  { color:var(--blue); }
  .league-header.lh-NBA  { color:var(--yellow); }
  .league-header.lh-NCAAB{ color:var(--orange); }
  .league-header.lh-MLB  { color:var(--green); }

  .pick-card { background:var(--bg2);border:1px solid var(--border);padding:12px 14px;cursor:pointer;transition:border-color 0.15s,background 0.15s; }
  .pick-card:hover { border-color:var(--green);background:var(--bg3); }

  .modal { position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000; }
  .modal.open { display:flex; }
  .modal-card { background:var(--bg2);border:1px solid var(--border);padding:28px;width:100%;max-width:500px;position:relative;max-height:85vh;overflow-y:auto; }
  .modal-card button { font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;padding:5px 14px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;text-transform:uppercase;margin-top:16px;transition:all 0.15s; }
  .modal-card button:hover { border-color:var(--green);color:var(--green); }

  @media (max-width:640px) { #games { grid-template-columns:1fr;padding:16px; } }
</style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="picks-header">
  <div>
    <h1 class="picks-title">Picks</h1>
    <div class="picks-subtitle">TODAY'S SELECTED BETS</div>
  </div>
  <div id="status"></div>
</div>

<div class="picks-controls">
  <div class="date-wrap">
    <span class="date-label">Date</span>
    <input id="p-date" type="date">
  </div>
  <div id="league-filters"></div>
</div>

<div id="games"></div>

<div id="modal" class="modal">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>

<script>
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.addEventListener('click', function(e) {
  var m = document.getElementById('modal');
  if (e.target === m) closeModal();
});
</script>

<script src="js/app.js"></script>

</body>
</html>
