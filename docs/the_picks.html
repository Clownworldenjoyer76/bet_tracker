<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/matstheme.css">

<style>

/* ===== ORIGINAL STYLES (unchanged) ===== */

.topbar { margin: 0; }

body {
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  background: var(--background);
  padding: 0;
}

:root {
  --picks-green:#00ff84;
  --picks-green-dim:rgba(0,255,132,0.08);
  --picks-green-glow:rgba(0,255,132,0.2);
  --picks-yellow:#facc15;
  --picks-red:#ff2d2d;
  --picks-blue:#00bfff;
  --picks-border:rgba(255,255,255,0.06);
  --picks-card:#0c1118;
  --picks-card-hover:#111822;
  --picks-radius:3px;
}

.picks-header {
  display:flex;
  align-items:center;
  gap:20px;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--picks-border);
}

.picks-title {
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;
  font-weight:800;
  letter-spacing:6px;
  text-transform:uppercase;
  color:var(--picks-green);
}

#status {
  font-size:10px;
  letter-spacing:2px;
  color:var(--text-muted);
  margin-left:auto;
}

.picks-controls {
  display:flex;
  align-items:center;
  gap:24px;
  padding:14px 24px;
  border-bottom:1px solid var(--picks-border);
  flex-wrap:wrap;
}

.date-wrap { display:flex; flex-direction:column; gap:4px; }

input[type="date"] {
  background:var(--picks-card);
  border:1px solid rgba(255,255,255,0.1);
  color:var(--text-main);
  padding:7px 12px;
}

#league-filters {
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

#games {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  padding:24px;
}

.league-column {
  display:flex;
  flex-direction:column;
  padding-right:16px;
  border-right:1px solid var(--picks-border);
}

.pick-card {
  background:var(--picks-card);
  padding:12px 14px;
  cursor:pointer;
}

/* ===== MOBILE RESPONSIVE (FULLY ADDED) ===== */

@media (max-width: 900px) {

  .picks-header {
    flex-direction:column;
    align-items:flex-start;
    gap:10px;
  }

  #status {
    margin-left:0;
  }

  .picks-title {
    font-size:26px;
    letter-spacing:4px;
  }
}

@media (max-width: 700px) {

  .picks-controls {
    flex-direction:column;
    align-items:flex-start;
    gap:14px;
  }

  .date-wrap,
  input[type="date"],
  #league-filters {
    width:100%;
  }
}

@media (max-width: 640px) {

  #games {
    grid-template-columns:1fr;
    padding:14px;
    gap:12px;
  }

  .league-column {
    padding:0 0 18px !important;
    border-right:none !important;
    border-bottom:1px solid var(--picks-border);
  }

  .league-column:last-child {
    border-bottom:none;
  }

  .pick-card {
    padding:14px;
  }

  .modal {
    padding:0;
  }

  .modal-card {
    max-width:100%;
    height:100%;
    max-height:100vh;
    border-radius:0;
    padding:20px;
  }

  .modal-title {
    font-size:18px;
  }

}

</style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="picks-header">
  <h1 class="picks-title">PICKS</h1>
  <div id="status"></div>
</div>

<div class="picks-controls">
  <div class="date-wrap">
    <span>Date</span>
    <input id="p-date" type="date">
  </div>
  <div id="league-filters"></div>
</div>

<div id="games"></div>

<div id="modal" class="modal">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>

<script>
function openModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}
document.addEventListener('click',function(e){
  if(e.target===document.getElementById('modal')) closeModal();
});
</script>

<script src="js/app.js"></script>

</body>
</html>
