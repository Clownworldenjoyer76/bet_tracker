<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/matstheme.css">

<style>

.topbar {
  margin: 0;
}

body {
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  background: var(--background);
  padding: 0;
}

:root {
  --picks-green: #00ff84;
  --picks-green-dim: rgba(0, 255, 132, 0.08);
  --picks-green-glow: rgba(0, 255, 132, 0.2);
  --picks-yellow: #facc15;
  --picks-red: #ff2d2d;
  --picks-blue: #00bfff;
  --picks-border: rgba(255,255,255,0.06);
  --picks-card: #0c1118;
  --picks-card-hover: #111822;
  --picks-radius: 3px;
}

.picks-header {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--picks-border);
}

.picks-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--picks-green);
  line-height: 1;
  margin: 0;
}

#status {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-left: auto;
}

#status.loading {
  color: var(--picks-green);
  animation: pulse-text 1.2s ease infinite;
}

@keyframes pulse-text {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

.picks-controls {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--picks-border);
  flex-wrap: wrap;
}

.date-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.date-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
}

input[type="date"] {
  background: var(--picks-card);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-main);
  padding: 7px 12px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  border-radius: var(--picks-radius);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
  cursor: pointer;
}

input[type="date"]:focus {
  border-color: var(--picks-green);
  box-shadow: 0 0 0 3px var(--picks-green-dim);
}

input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(1) opacity(0.3);
  cursor: pointer;
}

#league-filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-pill {
  padding: 4px 14px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 2px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  color: var(--text-muted);
  background: transparent;
  transition: all 0.15s ease;
  user-select: none;
}

.filter-pill:hover {
  border-color: rgba(0,255,132,0.35);
  color: var(--text-main);
}

.filter-pill.active {
  border-color: var(--picks-green);
  color: var(--picks-green);
  background: var(--picks-green-dim);
  box-shadow: 0 0 8px var(--picks-green-glow);
}

#games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 0;
  padding: 24px;
  align-items: start;
}

.league-column {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 16px 0 0;
  border-right: 1px solid var(--picks-border);
}

.league-column:last-child {
  border-right: none;
  padding-right: 0;
}

.league-column + .league-column {
  padding-left: 16px;
}

.league-header {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-muted);
  padding-bottom: 10px;
  border-bottom: 2px solid var(--picks-border);
  margin-bottom: 4px;
}

.pick-card {
  background: var(--picks-card);
  border: 1px solid var(--picks-border);
  padding: 12px 14px;
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
}

.modal.open {
  display: flex;
}

.modal-card {
  background: #0c1118;
  padding: 28px;
  width: 100%;
  max-width: 500px;
}

@media (max-width: 640px) {
  #games {
    grid-template-columns: 1fr;
    padding: 16px;
  }
}

</style>
</head>

<body>

<div id="nav-placeholder"></div>

<div class="picks-header">
  <h1 class="picks-title">PICKS</h1>
  <div id="status"></div>
</div>

<div class="picks-controls">
  <div class="date-wrap">
    <span class="date-label">Date</span>
    <input id="p-date" type="date">
  </div>
  <div id="league-filters"></div>
</div>

<div id="games"></div>

<div id="modal" class="modal">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>

<script>
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

document.addEventListener('click', function(e) {
  var m = document.getElementById('modal');
  if (e.target === m) closeModal();
});
</script>

<script src="js/app.js"></script>

</body>
</html>
