<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Edgelytics</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/matstheme.css">

<style>
/* (unchanged — omitted here for brevity, keep your full CSS exactly as-is) */
</style>

</head>
<body>

  <div id="nav-placeholder"></div>

  <div class="picks-header">
    <h1 class="picks-title">PICKS</h1>
    <div id="status" class="status"></div>
  </div>

  <div class="picks-controls">
    <div class="date-wrap">
      <span class="date-label">Date</span>
      <input id="p-date" type="date">
    </div>

    <!-- FIX: Added default filter -->
    <div id="league-filters">
      <div class="filter-pill active" onclick="filterLeague('all')">All Leagues</div>
    </div>
  </div>

  <div id="games"></div>

  <div id="modal" class="modal">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div id="modal-content"></div>
      <button class="modal-close-btn"
        onclick="document.getElementById('modal').classList.remove('open')">
        Close
      </button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
