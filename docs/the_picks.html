<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picks — Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/matstheme.css">

<style>

/* ================= BASE ================= */

.topbar { margin: 0; }

body {
  font-family: 'IBM Plex Mono', 'Courier New', monospace;
  background: var(--background);
  padding: 0;
}

/* ================= BURGER NAV ================= */

.burger {
  display: none;
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 2000;
  cursor: pointer;
}

.burger span {
  display: block;
  width: 22px;
  height: 2px;
  background: var(--picks-green);
  margin: 5px 0;
  transition: 0.2s;
}

.mobile-nav {
  position: fixed;
  top: 0;
  right: -100%;
  width: 240px;
  height: 100%;
  background: #0c1118;
  border-left: 1px solid var(--picks-border);
  padding: 60px 20px;
  z-index: 1500;
  transition: right 0.25s ease;
}

.mobile-nav.open {
  right: 0;
}

.mobile-nav a {
  display: block;
  padding: 12px 0;
  color: var(--text-main);
  text-decoration: none;
  font-size: 12px;
  letter-spacing: 2px;
}

.mobile-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  z-index: 1400;
}

.mobile-overlay.open {
  display: block;
}

/* ================= ORIGINAL PICKS ================= */

:root {
  --picks-green:#00ff84;
  --picks-border:rgba(255,255,255,0.06);
  --picks-card:#0c1118;
}

.picks-header {
  display:flex;
  align-items:center;
  gap:20px;
  padding:20px 24px 16px;
  border-bottom:1px solid var(--picks-border);
}

.picks-title {
  font-family:'Barlow Condensed',sans-serif;
  font-size:32px;
  letter-spacing:6px;
  color:var(--picks-green);
}

.picks-controls {
  display:flex;
  gap:24px;
  padding:14px 24px;
}

#games {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  padding:24px;
}

.pick-card {
  background:var(--picks-card);
  padding:12px;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

  .burger {
    display: block;
  }

  .site-nav {
    display: none;
  }

  .picks-header {
    flex-direction: column;
    align-items: flex-start;
  }

  .picks-controls {
    flex-direction: column;
    gap: 12px;
  }

  #games {
    grid-template-columns: 1fr;
    padding: 14px;
  }

}

</style>
</head>

<body>

<div id="nav-placeholder"></div>

<!-- BURGER -->
<div class="burger" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>

<!-- MOBILE NAV -->
<div id="mobile-nav" class="mobile-nav">
  <a href="index.html">HOME</a>
  <a href="games_today.html">GAMES TODAY</a>
  <a href="live_scores.html">LIVE SCORES</a>
  <a href="final_scores.html">FINAL SCORES</a>
  <a href="news.html">NEWS</a>
  <a href="transactions.html">TRANSACTIONS</a>
  <a href="teams.html">TEAMS</a>
  <a href="players.html">PLAYERS</a>
  <a href="standings.html">STANDINGS</a>
  <a href="the_picks.html">PICKS</a>
</div>

<div id="mobile-overlay" class="mobile-overlay" onclick="closeMenu()"></div>

<!-- PAGE -->

<div class="picks-header">
  <h1 class="picks-title">PICKS</h1>
  <div id="status"></div>
</div>

<div class="picks-controls">
  <input id="p-date" type="date">
  <div id="league-filters"></div>
</div>

<div id="games"></div>

<!-- MODAL -->

<div id="modal" class="modal">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div id="modal-content"></div>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/nav.js"></script>

<script>

/* MODAL */
function openModal(html){
  document.getElementById('modal-content').innerHTML=html;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

/* BURGER */
function toggleMenu(){
  document.getElementById('mobile-nav').classList.toggle('open');
  document.getElementById('mobile-overlay').classList.toggle('open');
}
function closeMenu(){
  document.getElementById('mobile-nav').classList.remove('open');
  document.getElementById('mobile-overlay').classList.remove('open');
}

document.addEventListener('click',function(e){
  if(e.target===document.getElementById('modal')) closeModal();
});

</script>

<script src="js/app.js"></script>

</body>
</html>
