<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="css/matstheme.css">

  <style>
    body {
      background: var(--background);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      margin: 0;
    }

    .container {
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    .site-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-align: center;
      margin-bottom: 24px;
      color: var(--accent-green);
    }

    .nav-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 18px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;

      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);

      text-decoration: none;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.05);
    }

    .nav-section {
      margin-top: 20px;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="container">

  <div class="site-title">Dashboard</div>

  <div class="nav-grid">

    <!-- MAIN PAGES -->

    <a href="top_props.html" class="nav-btn">Top Props</a>
    <a href="live_scores.html" class="nav-btn">Scores</a>

    <!-- SPORTS -->
    <div class="nav-section">
      <div class="section-title">Sports</div>

      <a href="nba_dashboard.html" class="nav-btn">NBA</a>
      <a href="mlb_dashboard.html.html" class="nav-btn">MLB</a>
      <a href="nhl_dashboard.html" class="nav-btn">NHL</a>
      <a href="ncaab_dashboard.html" class="nav-btn">NCAAB</a>
    </div>

    <!-- ADVANCED -->
    <div class="nav-section">
      <div class="section-title">Advanced</div>

      <a href="reports.html" class="nav-btn">Reports</a>

</div>
