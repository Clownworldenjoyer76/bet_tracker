<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Scores · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--background); color: var(--text-main); font-family: 'IBM Plex Mono', monospace; font-size: 13px; min-height: 100vh; }

    /* HEADER */
    .page-header { border-bottom: 1px solid var(--border-soft); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-green); }
    .page-subtitle { color: var(--text-muted); font-size: 11px; letter-spacing: 0.06em; margin-top: 2px; }

    /* CONTROLS */
    .controls { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--border-soft); flex-wrap: wrap; }
    .league-pill { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; padding: 4px 12px; border: 1px solid var(--border-soft); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
    .league-pill:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .league-pill.active { border-color: var(--accent-green); color: var(--accent-green); background: rgba(0,255,132,0.06); }
    .date-input { margin-left: auto; background: var(--bg-card); border: 1px solid var(--border-soft); color: var(--text-main); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 5px 10px; outline: none; color-scheme: dark; }
    .date-input:focus { border-color: var(--accent-blue); }

    /* STATUS */
    .status-bar { padding: 8px 24px; font-size: 11px; color: var(--text-muted); border-bottom: 1px solid var(--border-soft); display: flex; align-items: center; gap: 10px; }
    .status-bar.loading { color: var(--accent-yellow); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); display: inline-block; flex-shrink: 0; }
    .status-dot.green  { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .status-dot.yellow { background: var(--accent-yellow); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }

    /* MAIN */
    .main { padding: 20px 24px; display: flex; flex-direction: column; gap: 28px; }

    .league-block {}
    .league-header { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 0.14em; text-transform: uppercase; padding: 0 0 8px; border-bottom: 1px solid var(--border-soft); margin-bottom: 10px; }
    .lh-NBA   { color: var(--accent-yellow); }
    .lh-NCAAB { color: var(--orange); }
    .lh-NHL   { color: var(--accent-blue); }
    .lh-MLB   { color: var(--accent-green); }

    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }

    .game-card { background: var(--bg-card); border: 1px solid var(--border-soft); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    .game-card:hover { border-color: var(--accent-green); background: var(--bg-card); }

    .game-status { font-size: 10px; letter-spacing: 0.1em; color: var(--text-muted); text-transform: uppercase; }

    .game-row { display: flex; align-items: center; justify-content: space-between; }
    .team-abbr { font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: var(--text-main); }
    .team-abbr.winner { color: var(--accent-green); }
    .team-score { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 900; color: var(--text-main); }
    .team-score.winner { color: var(--accent-green); }

    .no-games { font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; padding: 8px 0; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--bg-card); border: 1px solid var(--border-soft); width: 100%; max-width: 540px; max-height: 85vh; overflow-y: auto; position: relative; }
    .modal-close { position: absolute; top: 12px; right: 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; color: var(--text-muted); cursor: pointer; letter-spacing: 0.1em; background: none; border: none; }
    .modal-close:hover { color: var(--text-main); }
    .modal-inner { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }

    .modal-top { display: flex; align-items: center; gap: 10px; }
    .modal-league-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; padding: 2px 8px; text-transform: uppercase; }
    .tag-NBA   { color: var(--accent-yellow); border: 1px solid rgba(250,204,21,0.3);  background: rgba(250,204,21,0.05); }
    .tag-NCAAB { color: var(--orange); border: 1px solid rgba(255,140,0,0.3);   background: rgba(255,140,0,0.05); }
    .tag-NHL   { color: var(--accent-blue);   border: 1px solid rgba(0,191,255,0.3);   background: rgba(0,191,255,0.05); }
    .tag-MLB   { color: var(--accent-green);  border: 1px solid rgba(0,255,132,0.3);   background: rgba(0,255,132,0.05); }
    .modal-final-tag { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-muted); }

    .modal-matchup { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; color: var(--text-main); letter-spacing: 0.04em; }

    .modal-scoreboard { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border-soft); border-bottom: 1px solid var(--border-soft); padding: 12px 0; }
    .modal-score-row { display: flex; align-items: center; justify-content: space-between; }
    .modal-team { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.06em; }
    .modal-team.winner { color: var(--accent-green); }
    .modal-pts { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; color: var(--text-main); }
    .modal-pts.winner { color: var(--accent-green); }

    .modal-section { display: flex; flex-direction: column; gap: 6px; }
    .modal-subtitle { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border-soft); padding-bottom: 4px; }
    .modal-row { font-size: 11px; color: var(--text-muted); padding: 3px 0; border-bottom: 1px solid var(--border-soft); line-height: 1.5; }
    .modal-row:last-child { border-bottom: none; }
    .modal-error { color: var(--accent-red); font-size: 12px; padding: 20px 0; text-align: center; }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Final Scores</div>
    <div class="page-subtitle">ESPN · NBA · NCAAB · NHL · MLB</div>
  </div>
</div>

<div class="controls">
  <div class="league-pill active" data-league="all">All</div>
  <div class="league-pill" data-league="NBA">NBA</div>
  <div class="league-pill" data-league="NCAAB">NCAAB</div>
  <div class="league-pill" data-league="NHL">NHL</div>
  <div class="league-pill" data-league="MLB">MLB</div>
  <input type="date" class="date-input" id="score-date">
</div>

<div class="status-bar" id="scores-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>

<div class="main" id="scores-main"></div>
<div class="empty-state" id="scores-empty" style="display:none">No completed games</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">CLOSE ✕</button>
    <div class="modal-inner" id="modal-inner"></div>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/app.js"></script>
<script>
var LEAGUES = [
  { key: 'NBA',   sport: 'basketball', league: 'nba'                    },
  { key: 'NCAAB', sport: 'basketball', league: 'mens-college-basketball' },
  { key: 'NHL',   sport: 'hockey',     league: 'nhl'                    },
  { key: 'MLB',   sport: 'baseball',   league: 'mlb'                    }
];

var activeLeague = 'all';
var allData      = {};

function setStatus(text, cls, dotCls) {
  document.getElementById('status-text').textContent  = text;
  document.getElementById('scores-status').className  = 'status-bar ' + (cls    || '');
  document.getElementById('status-dot').className     = 'status-dot '  + (dotCls || '');
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function toESPNDate(d) {
  return d.replace(/-/g, '');
}

function renderLeague(cfg, events) {
  var block = document.createElement('div');
  block.className = 'league-block';
  block.dataset.league = cfg.key;
  if (activeLeague !== 'all' && activeLeague !== cfg.key) block.style.display = 'none';

  var hdr = document.createElement('div');
  hdr.className = 'league-header lh-' + cfg.key;
  hdr.textContent = cfg.key;
  block.appendChild(hdr);

  var completed = (events || []).filter(function(ev) {
    return ev.status && ev.status.type && ev.status.type.completed;
  });

  if (completed.length === 0) {
    var ng = document.createElement('div');
    ng.className = 'no-games';
    ng.textContent = 'No completed games';
    block.appendChild(ng);
    return block;
  }

  var grid = document.createElement('div');
  grid.className = 'games-grid';

  completed.forEach(function(ev) {
    var comp  = ev.competitions && ev.competitions[0];
    if (!comp) return;
    var teams = comp.competitors || [];
    var away  = teams.find(function(t) { return t.homeAway === 'away'; });
    var home  = teams.find(function(t) { return t.homeAway === 'home'; });
    if (!away || !home) return;

    var awayScore = parseInt(away.score);
    var homeScore = parseInt(home.score);
    var awayWins  = awayScore > homeScore;
    var homeWins  = homeScore > awayScore;

    var card = document.createElement('div');
    card.className = 'game-card';
    card.dataset.event  = ev.id;
    card.dataset.sport  = cfg.sport;
    card.dataset.league = cfg.league;
    card.dataset.leagueKey = cfg.key;

    card.innerHTML =
      '<div class="game-status">FINAL</div>' +
      '<div class="game-row">' +
        '<span class="team-abbr' + (awayWins ? ' winner' : '') + '">' + (away.team ? away.team.abbreviation : '—') + '</span>' +
        '<span class="team-score' + (awayWins ? ' winner' : '') + '">' + (away.score || '0') + '</span>' +
      '</div>' +
      '<div class="game-row">' +
        '<span class="team-abbr' + (homeWins ? ' winner' : '') + '">' + (home.team ? home.team.abbreviation : '—') + '</span>' +
        '<span class="team-score' + (homeWins ? ' winner' : '') + '">' + (home.score || '0') + '</span>' +
      '</div>';

    card.addEventListener('click', function() {
      openSummaryModal(card.dataset.event, card.dataset.sport, card.dataset.league, card.dataset.leagueKey);
    });

    grid.appendChild(card);
  });

  block.appendChild(grid);
  return block;
}

function applyFilter() {
  document.querySelectorAll('.league-block').forEach(function(b) {
    b.style.display = (activeLeague === 'all' || b.dataset.league === activeLeague) ? '' : 'none';
  });
}

function render() {
  var main  = document.getElementById('scores-main');
  var empty = document.getElementById('scores-empty');
  main.innerHTML = '';

  var total = 0;
  LEAGUES.forEach(function(cfg) {
    var completed = (allData[cfg.key] || []).filter(function(ev) {
      return ev.status && ev.status.type && ev.status.type.completed;
    });
    total += completed.length;
    main.appendChild(renderLeague(cfg, allData[cfg.key] || []));
  });

  empty.style.display = total === 0 ? '' : 'none';
}

async function loadFinalScores() {
  setStatus('Loading...', 'loading', 'yellow');
  var date     = document.getElementById('score-date').value;
  var espnDate = toESPNDate(date);

  var results = await Promise.all(LEAGUES.map(async function(cfg) {
    try {
      var r = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + cfg.sport + '/' + cfg.league + '/scoreboard?dates=' + espnDate);
      if (!r.ok) return { key: cfg.key, events: [] };
      var data = await r.json();
      return { key: cfg.key, events: data.events || [] };
    } catch(e) {
      return { key: cfg.key, events: [] };
    }
  }));

  results.forEach(function(r) { allData[r.key] = r.events; });
  render();
  applyFilter();

  var total = results.reduce(function(sum, r) {
    return sum + r.events.filter(function(ev) { return ev.status && ev.status.type && ev.status.type.completed; }).length;
  }, 0);

  setStatus(total + ' completed games · ' + date, '', 'green');
}

// MODAL
async function openSummaryModal(eventId, sport, league, leagueKey) {
  var overlay = document.getElementById('modal-overlay');
  var inner   = document.getElementById('modal-inner');
  inner.innerHTML = '<div style="padding:20px;color:var(--text-muted);font-size:11px;">Loading...</div>';
  overlay.classList.add('open');

  try {
    var r    = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + sport + '/' + league + '/summary?event=' + eventId);
    var data = await r.json();

    var comp  = data.header.competitions[0];
    var teams = comp.competitors || [];
    var away  = teams.find(function(t) { return t.homeAway === 'away'; });
    var home  = teams.find(function(t) { return t.homeAway === 'home'; });

    var awayWins = parseInt(away.score) > parseInt(home.score);
    var homeWins = parseInt(home.score) > parseInt(away.score);

    var oddsHTML = '';
    var odds = comp.odds && comp.odds[0];
    if (odds) {
      oddsHTML =
        '<div class="modal-row">Spread: ' + (odds.details || '—') + '</div>' +
        '<div class="modal-row">Total: ' + (odds.overUnder || '—') + '</div>';
    }

    // sport-specific stat whitelists
    var NHL_STATS = ['shots on goal', 'hits', 'power play goals', 'power play opportunities', 'giveaways', 'takeaways'];
    var MLB_STATS = ['runs', 'hits', 'errors', 'strikeouts', 'home runs', 'runs batted in', 'batting average', 'left on base'];

    var statsHTML = '';
    if (data.boxscore && data.boxscore.teams) {
      statsHTML = data.boxscore.teams.map(function(t) {
        var allStats = t.statistics || [];
        var flat = [];
        allStats.forEach(function(s) {
          if (s.stats && s.stats.length) {
            s.stats.forEach(function(ss) { flat.push(ss); });
          } else {
            flat.push(s);
          }
        });

        var whitelist = sport === 'hockey' ? NHL_STATS : (sport === 'baseball' ? MLB_STATS : null);

        var rows = flat.filter(function(s) {
          var val   = s.displayValue || s.value || '';
          var label = (s.label || s.displayName || s.name || '').toLowerCase();
          if (!val && val !== 0) return false;
          if (whitelist) return whitelist.indexOf(label) !== -1;
          return true;
        }).slice(0, 8).map(function(s) {
          var label = s.label || s.displayName || s.name || '';
          var val   = s.displayValue || s.value || '';
          return label + ': ' + val;
        });

        if (rows.length === 0) return '';
        var teamName = t.team ? (t.team.displayName || t.team.abbreviation || '') : '';
        return '<div class="modal-row"><strong style="color:var(--text-main)">' + teamName + '</strong><br>' + rows.join(' · ') + '</div>';
      }).filter(Boolean).join('');
    }

    // leaders — API uses displayValue on the leader object
    var leadersHTML = '';
    if (data.leaders) {
      leadersHTML = data.leaders.map(function(l) {
        var top  = l.leaders && l.leaders[0];
        var name = l.displayName || l.name || '';
        var val  = top ? (top.displayValue || top.value || '') : '';
        var athlete = (top && top.athlete) ? (top.athlete.displayName || '') : '';
        return (name && val) ? '<div class="modal-row">' + name + ': ' + (athlete ? athlete + ' — ' : '') + val + '</div>' : '';
      }).filter(Boolean).join('');
    }

    // linescores — live on comp.competitors[x].linescores
    var linesHTML = '';
    var awayLines = away.linescores || [];
    var homeLines = home.linescores || [];
    var periodLabel = sport === 'baseball' ? 'Inn' : (sport === 'hockey' ? 'P' : 'Q');
    if (awayLines.length > 0) {
      linesHTML = awayLines.map(function(l, i) {
        var period  = l.period || (i + 1);
        var awayVal = l.displayValue || l.value || '0';
        var homeLine = homeLines[i];
        var homeVal  = homeLine ? (homeLine.displayValue || homeLine.value || '0') : '0';
        return '<div class="modal-row">' + periodLabel + period + ': ' + away.team.abbreviation + ' ' + awayVal + ' · ' + home.team.abbreviation + ' ' + homeVal + '</div>';
      }).join('');
    }

    inner.innerHTML =
      '<div class="modal-top">' +
        '<span class="modal-league-tag tag-' + leagueKey + '">' + leagueKey + '</span>' +
        '<span class="modal-final-tag">FINAL</span>' +
      '</div>' +
      '<div class="modal-matchup">' + away.team.displayName + ' @ ' + home.team.displayName + '</div>' +
      '<div class="modal-scoreboard">' +
        '<div class="modal-score-row">' +
          '<span class="modal-team' + (awayWins ? ' winner' : '') + '">' + away.team.abbreviation + '</span>' +
          '<span class="modal-pts' + (awayWins ? ' winner' : '') + '">' + away.score + '</span>' +
        '</div>' +
        '<div class="modal-score-row">' +
          '<span class="modal-team' + (homeWins ? ' winner' : '') + '">' + home.team.abbreviation + '</span>' +
          '<span class="modal-pts' + (homeWins ? ' winner' : '') + '">' + home.score + '</span>' +
        '</div>' +
      '</div>' +
      (oddsHTML ? '<div class="modal-section"><div class="modal-subtitle">Betting Lines</div>' + oddsHTML + '</div>' : '') +
      (linesHTML ? '<div class="modal-section"><div class="modal-subtitle">Scoring by Period</div>' + linesHTML + '</div>' : '') +
      (statsHTML ? '<div class="modal-section"><div class="modal-subtitle">Team Stats</div>' + statsHTML + '</div>' : '') +
      (leadersHTML ? '<div class="modal-section"><div class="modal-subtitle">Leaders</div>' + leadersHTML + '</div>' : '');

  } catch(e) {
    inner.innerHTML = '<div class="modal-error">Failed to load game summary</div>';
  }
}

document.getElementById('modal-close').addEventListener('click', function() {
  document.getElementById('modal-overlay').classList.remove('open');
});

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeLeague = pill.dataset.league;
    applyFilter();
  });
});

document.getElementById('score-date').value = todayStr();
document.getElementById('score-date').addEventListener('change', loadFinalScores);

loadFinalScores();
</script>
</body>
</html>
