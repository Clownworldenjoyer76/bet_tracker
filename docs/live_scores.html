<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Scores</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    .page-header {
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .refresh-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border: 1px solid rgba(0,255,132,0.3);
      color: var(--accent-green);
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .league-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .league-pill:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .league-pill.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.06);
    }

    .league-pill.placeholder {
      border-style: dashed;
      opacity: 0.75;
    }

    .status-bar {
      padding: 8px 24px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-bar.loading {
      color: var(--accent-yellow);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-dot.yellow {
      background: var(--accent-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.red {
      background: var(--accent-red);
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .main {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .league-block {}

    .league-header {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      padding: 0 0 8px;
      border-bottom: 1px solid var(--border-soft);
      margin-bottom: 10px;
    }

    .league-header.lh-NHL {
      color: var(--accent-blue);
    }

    .league-header.lh-NBA,
    .league-header.lh-WNBA,
    .league-header.lh-NCAAM {
      color: var(--accent-yellow);
    }

    .league-header.lh-MLB {
      color: var(--accent-green);
    }

    .league-header.lh-EPL,
    .league-header.lh-MLS,
    .league-header.lh-LALIGA,
    .league-header.lh-LIGUE1,
    .league-header.lh-SERIEA,
    .league-header.lh-BUNDESLIGA {
      color: var(--accent-blue);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
    }

    .game-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s;
    }

    .game-card:hover {
      border-color: #333;
    }

    .game-card.live {
      border-color: rgba(0,255,132,0.25);
    }

    .game-status {
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
      min-height: 14px;
    }

    .game-status.is-live {
      color: var(--accent-green);
    }

    .game-status.is-final {
      color: var(--text-muted);
    }

    .game-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .team-side {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .team-abbr {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 145px;
    }

    .team-abbr.winner {
      color: var(--accent-green);
    }

    .team-score {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 900;
      color: var(--text-main);
      min-width: 28px;
      text-align: right;
    }

    .team-score.winner {
      color: var(--accent-green);
    }

    .team-score.no-score {
      color: var(--text-muted);
      font-size: 13px;
    }

    .no-games {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      padding: 8px 0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .placeholder-state {
      max-width: 760px;
      margin: 40px auto;
      padding: 28px;
      border: 1px dashed var(--border-soft);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }

    .placeholder-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--accent-yellow);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .placeholder-copy {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .error-details {
      margin-top: 10px;
      color: var(--accent-red);
      font-size: 10px;
      word-break: break-all;
      line-height: 1.5;
      text-transform: none;
      letter-spacing: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 400;
    }

    @media (max-width: 720px) {
      .page-header,
      .controls,
      .status-bar,
      .main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .games-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Live Scores</div>
    <div class="page-subtitle">ALL LEAGUES · AUTO-REFRESH 30S</div>
  </div>
  <div class="refresh-badge" id="refresh-badge">—</div>
</div>

<div class="controls" id="league-controls"></div>

<div class="status-bar" id="scores-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>

<div class="main" id="scores-main"></div>

<script src="js/nav.js"></script>
<script src="js/live-scores/render.js"></script>
</body>
</html>
