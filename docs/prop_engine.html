<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Engine · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:var(--background);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border-soft);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-green); }
    .page-subtitle { color:var(--text-muted);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .controls-wrap { border-bottom:1px solid var(--border-soft);padding:14px 24px;display:flex;flex-direction:column;gap:10px; }
    .controls-row { display:flex;align-items:center;gap:8px;flex-wrap:wrap; }
    .controls-label { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-muted);min-width:52px; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 14px;border:1px solid var(--border-soft);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .league-pill.active { border-color:var(--accent-green);color:var(--accent-green);background:rgba(0,255,132,0.06); }
    .ctrl-select { background:var(--bg-card);border:1px solid var(--border-soft);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 10px;outline:none;flex:1;min-width:160px;max-width:260px; }
    .ctrl-select:focus { border-color:var(--accent-blue); }
    .ctrl-num { background:var(--bg-card);border:1px solid var(--border-soft);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:6px 10px;outline:none;width:72px; }
    .ctrl-num:focus { border-color:var(--accent-blue); }
    .analyze-btn { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.12em;padding:6px 20px;border:1px solid var(--accent-green);background:rgba(0,255,132,0.08);color:var(--accent-green);cursor:pointer;text-transform:uppercase;transition:all 0.15s;margin-left:auto; }
    .analyze-btn:hover { background:rgba(0,255,132,0.18);box-shadow:0 0 12px rgba(0,255,132,0.15); }
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--accent-green);box-shadow:0 0 6px var(--accent-green); }
    .status-dot.yellow { background:var(--accent-yellow);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .main { padding:20px 24px;display:flex;flex-direction:column;gap:16px; }
    .player-banner { display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border-soft);border-left:3px solid var(--accent-green); }
    .player-headshot { width:56px;height:56px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-soft); }
    .player-headshot-ph { width:56px;height:56px;background:var(--background);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0; }
    .player-banner-name { font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;color:var(--text-main);letter-spacing:0.04em;line-height:1; }
    .player-banner-meta { font-size:10px;color:var(--text-muted);margin-top:4px;letter-spacing:0.08em; }
    .player-banner-prop { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.1em;color:var(--accent-green);margin-top:4px; }
    .stat-strip { display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-soft); }
    .stat-strip-item { padding:14px 16px;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;gap:4px;position:relative; }
    .stat-strip-item:last-child { border-right:none; }
    .stat-val { font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;line-height:1;color:var(--text-main); }
    .stat-lbl { font-size:9px;letter-spacing:0.12em;color:var(--text-muted);text-transform:uppercase; }
    .stat-trend { font-size:11px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.08em;margin-top:2px; }
    .trend-hot  { color:var(--accent-green); }
    .trend-cold { color:var(--accent-red); }
    .trend-mid  { color:var(--text-muted); }
    .results-grid { display:grid;grid-template-columns:1fr 1fr;gap:16px; }
    @media (max-width:700px) { .results-grid { grid-template-columns:1fr; } .stat-strip { grid-template-columns:repeat(2,1fr); } }
    .hit-section { background:var(--bg-card);border:1px solid var(--border-soft);padding:16px 18px; }
    .section-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.16em;color:var(--text-muted);text-transform:uppercase;margin-bottom:14px;padding-bottom:6px;border-bottom:1px solid var(--border-soft); }
    .hit-row { display:flex;align-items:center;gap:10px;margin-bottom:10px; }
    .hit-row:last-child { margin-bottom:0; }
    .hit-line-label { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;color:var(--text-main);min-width:44px;letter-spacing:0.04em; }
    .hit-bar-track { flex:1;height:6px;background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);position:relative;overflow:hidden; }
    .hit-bar-fill { height:100%;transition:width 0.5s cubic-bezier(0.4,0,0.2,1); }
    .hit-pct { font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;min-width:44px;text-align:right; }
    .hit-count { font-size:10px;color:var(--text-muted);min-width:38px;text-align:right;letter-spacing:0.04em; }
    .log-section { background:var(--bg-card);border:1px solid var(--border-soft);padding:16px 18px; }
    .log-table { width:100%;border-collapse:collapse;font-size:11px; }
    .log-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);padding:5px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap; }
    .log-table th:last-child { text-align:right; }
    .log-table td { padding:5px 8px;border-bottom:1px solid rgba(26,31,38,0.6);color:var(--text-muted);white-space:nowrap; }
    .log-table td:last-child { text-align:right; }
    .log-table tr:last-child td { border-bottom:none; }
    .log-table tr:hover td { background:rgba(255,255,255,0.02); }
    .cell-over { color:var(--accent-green);font-weight:700; }
    .cell-under { color:var(--accent-red); }
    .empty-state { text-align:center;padding:80px 20px;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; }
    .empty-sub { font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:8px;font-weight:400;letter-spacing:0;opacity:0.6; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Prop Engine</div>
    <div class="page-subtitle">HIT RATES · TRENDS · OVER/UNDER ANALYSIS</div>
  </div>
</div>

<div class="controls-wrap">
  <div class="controls-row">
    <span class="controls-label">League</span>
    <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
    <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
    <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  </div>
  <div class="controls-row">
    <span class="controls-label">Team</span>
    <select class="ctrl-select" id="team-select"><option value="">— Select Team —</option></select>
    <span class="controls-label" style="margin-left:8px">Player</span>
    <select class="ctrl-select" id="player-select"><option value="">— Select Player —</option></select>
  </div>
  <div class="controls-row">
    <span class="controls-label">Prop</span>
    <select class="ctrl-select" id="prop-select"></select>
    <span class="controls-label" style="margin-left:8px">Games</span>
    <input class="ctrl-num" id="game-count" type="number" min="5" max="82" value="15" title="Last N games">
    <button class="analyze-btn" id="analyze-btn">Analyze</button>
  </div>
</div>

<div class="status-bar" id="prop-status">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Select a league, team, and player</span>
</div>

<div class="main" id="prop-main">
  <div class="empty-state">
    Select a player and prop to begin analysis
    <div class="empty-sub">NBA · NHL · MLB · Hit rates · Trends · Game log</div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';
var allTeams     = [];
var allPlayers   = [];

var PROPS = {
  nba: [
    { label:'Points',           statKeys:['points','PTS'],                abbr:'PTS' },
    { label:'Rebounds',         statKeys:['totalRebounds','REB'],         abbr:'REB' },
    { label:'Assists',          statKeys:['assists','AST'],               abbr:'AST' },
    { label:'3-Point %',        statKeys:['threePointPct','3P%'],         abbr:'3P%' },
    { label:'PRA (Pts+Reb+Ast)',statKeys:['__pra__'],                     abbr:'PRA' },
    { label:'Blocks',           statKeys:['blocks','BLK'],                abbr:'BLK' },
    { label:'Steals',           statKeys:['steals','STL'],                abbr:'STL' }
  ],
  nhl: [
    { label:'Goals',            statKeys:['goals','G'],                   abbr:'G'   },
    { label:'Assists',          statKeys:['assists','A'],                 abbr:'A'   },
    { label:'Points',           statKeys:['points','PTS'],                abbr:'PTS' },
    { label:'Shots on Goal',    statKeys:['shotsTotal','S'],              abbr:'S'   },
    { label:'Power Play Goals', statKeys:['powerPlayGoals','PPG'],        abbr:'PPG' }
  ],
  mlb: [
    { label:'Hits',             statKeys:['hits','H'],                    abbr:'H'   },
    { label:'RBI',              statKeys:['rbi','runsBattedIn','RBI'],    abbr:'RBI' },
    { label:'Strikeouts',       statKeys:['strikeouts','strikeOuts','SO'],abbr:'SO'  },
    { label:'Home Runs',        statKeys:['homeRuns','homerun','HR'],     abbr:'HR'  }
  ]
};

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function populatePropSelect() {
  var sel = document.getElementById('prop-select');
  sel.innerHTML = (PROPS[activeLeague] || []).map(function(p, i) {
    return '<option value="' + i + '">' + p.label + '</option>';
  }).join('');
}

async function loadTeams() {
  setStatus('Loading teams...', 'yellow');
  var teamSelect = document.getElementById('team-select');
  var playerSelect = document.getElementById('player-select');
  teamSelect.innerHTML = '<option value="">— Select Team —</option>';
  playerSelect.innerHTML = '<option value="">— Select Player —</option>';
  allTeams = [];
  allPlayers = [];

  try {
    var url = 'https://site.web.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams?limit=200';
    var r = await fetch(url);
    if (!r.ok) throw new Error('ESPN teams request failed: HTTP ' + r.status);
    var data = await r.json();
    var teams = data && data.sports && data.sports[0] && data.sports[0].leagues && data.sports[0].leagues[0] && data.sports[0].leagues[0].teams ? data.sports[0].leagues[0].teams : [];
    if (!teams.length) throw new Error('No teams returned from ESPN');

    allTeams = teams.map(function(t) {
      return {
        id: t.team && t.team.id ? t.team.id : '',
        name: t.team && t.team.displayName ? t.team.displayName : '',
        abbr: t.team && t.team.abbreviation ? t.team.abbreviation : ''
      };
    }).filter(function(t) {
      return t.id && t.name;
    }).sort(function(a,b) {
      return a.name.localeCompare(b.name);
    });

    if (!allTeams.length) throw new Error('No usable teams returned from ESPN');

    allTeams.forEach(function(t) {
      var o = document.createElement('option');
      o.value = t.id;
      o.textContent = t.name;
      teamSelect.appendChild(o);
    });

    setStatus('Select a team', '');
  } catch(e) {
    console.error('loadTeams failed:', e);
    setStatus('Failed to load teams', '');
  }
}

async function loadPlayers(teamId) {
  var psel = document.getElementById('player-select');
  psel.innerHTML = '<option value="">Loading...</option>';
  allPlayers = [];

  try {
    var url = 'https://site.web.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams/' + teamId + '/roster';
    var r = await fetch(url);
    if (!r.ok) throw new Error('ESPN roster request failed: HTTP ' + r.status);
    var data = await r.json();
    (data.athletes || []).forEach(function(g) {
      (g.items || g.athletes || (g.id ? [g] : [])).forEach(function(p) {
        if (p.id) allPlayers.push(p);
      });
    });

    allPlayers.sort(function(a,b) {
      return (a.displayName || '').localeCompare(b.displayName || '');
    });

    psel.innerHTML = '<option value="">— Select Player —</option>';
    allPlayers.forEach(function(p) {
      var o = document.createElement('option');
      o.value = p.id;
      o.textContent = p.displayName || p.fullName || p.id;
      psel.appendChild(o);
    });

    setStatus('Select a player', '');
  } catch(e) {
    console.error('loadPlayers failed:', e);
    psel.innerHTML = '<option value="">Failed to load</option>';
    setStatus('Failed to load players', '');
  }
}

function extractStatByLabels(labels, names, statsArr, keys) {
  for (var k = 0; k < keys.length; k++) {
    var key = keys[k].toLowerCase();
    for (var i = 0; i < labels.length; i++) {
      if ((labels[i] || '').toLowerCase() === key) {
        var v = parseFloat(statsArr[i]);
        return isNaN(v) ? null : v;
      }
    }
    for (var j = 0; j < (names || []).length; j++) {
      if ((names[j] || '').toLowerCase() === key) {
        var v2 = parseFloat(statsArr[j]);
        return isNaN(v2) ? null : v2;
      }
    }
  }
  return null;
}

function parseGamelog(data, propDef) {
  var gl = data.gameLog || {};
  var sg = (gl.statistics || [])[0];
  if (!sg) return [];

  var labels = sg.labels || [];
  var names = sg.names || [];
  var sgEvts = sg.events || [];
  var evDict = gl.events || {};
  var games = [];

  sgEvts.forEach(function(entry) {
    var statsArr = entry.stats || [];
    var val = null;

    if (propDef.statKeys[0] === '__pra__') {
      var pts = extractStatByLabels(labels, names, statsArr, ['points','pts','PTS']);
      var reb = extractStatByLabels(labels, names, statsArr, ['totalRebounds','rebounds','REB']);
      var ast = extractStatByLabels(labels, names, statsArr, ['assists','AST']);
      if (pts !== null && reb !== null && ast !== null) val = pts + reb + ast;
    } else {
      val = extractStatByLabels(labels, names, statsArr, propDef.statKeys.concat([propDef.abbr]));
    }

    if (val !== null) {
      var ev = evDict[entry.eventId] || {};
      games.push({
        date: ev.gameDate ? new Date(ev.gameDate) : null,
        val: val,
        opp: ev.opponent ? (ev.opponent.abbreviation || '?') : (ev.atVs || '?'),
        result: ev.gameResult || ''
      });
    }
  });

  return games.sort(function(a,b) {
    return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0);
  });
}

function calcHitRate(games, line) {
  var hits = games.filter(function(g) { return g.val > line; }).length;
  return { rate: games.length ? hits / games.length : 0, hits: hits, total: games.length };
}

function barColor(r) {
  return r >= 0.65 ? 'var(--accent-green)' : r >= 0.5 ? 'var(--accent-yellow)' : 'var(--accent-red)';
}

function pctColor(r) {
  return r >= 0.65 ? 'var(--accent-green)' : r >= 0.5 ? 'var(--accent-yellow)' : 'var(--accent-red)';
}

function renderResults(player, games, propDef, n) {
  var main = document.getElementById('prop-main');
  main.innerHTML = '';
  var recent = games.slice(0, n);
  if (!recent.length) {
    main.innerHTML = '<div class="empty-state">No data for ' + propDef.label + '</div>';
    return;
  }

  var vals = recent.map(function(g) { return g.val; });
  var avg = vals.reduce(function(s,v) { return s + v; }, 0) / vals.length;
  var max = Math.max.apply(null, vals);
  var min = Math.min.apply(null, vals);
  var avg3 = vals.slice(0,3).reduce(function(s,v) { return s + v; }, 0) / Math.min(3, vals.length);
  var trendCls = avg3 > avg * 1.1 ? 'trend-hot' : avg3 < avg * 0.9 ? 'trend-cold' : 'trend-mid';
  var trendTxt = avg3 > avg * 1.1 ? '▲ HOT' : avg3 < avg * 0.9 ? '▼ COLD' : '→ AVG';

  var hs = player.headshot ? (player.headshot.href || '') : '';
  var pos = player.position ? (player.position.abbreviation || '') : '';
  var team = allTeams.find(function(t) { return t.id == document.getElementById('team-select').value; });

  var banner = document.createElement('div');
  banner.className = 'player-banner';
  banner.innerHTML = (hs ? '<img class="player-headshot" src="' + hs + '">' : '<div class="player-headshot-ph">👤</div>') + '<div><div class="player-banner-name">' + (player.displayName || '') + '</div>' + '<div class="player-banner-meta">' + (pos || '') + (team ? ' · ' + team.name : '') + ' · ' + activeLeague.toUpperCase() + '</div>' + '<div class="player-banner-prop">' + propDef.label + ' · Last ' + n + ' Games</div></div>';
  main.appendChild(banner);

  var strip = document.createElement('div');
  strip.className = 'stat-strip';
  [
    { val: avg.toFixed(1), lbl: propDef.abbr + ' Average', trend: '' },
    { val: avg3.toFixed(1), lbl: 'Last 3 Avg', trend: '<span class="stat-trend ' + trendCls + '">' + trendTxt + '</span>' },
    { val: max, lbl: 'Season High', trend: '' },
    { val: min, lbl: 'Season Low', trend: '' }
  ].forEach(function(s) {
    strip.innerHTML += '<div class="stat-strip-item"><div class="stat-val">' + s.val + '</div><div class="stat-lbl">' + s.lbl + '</div>' + s.trend + '</div>';
  });
  main.appendChild(strip);

  var grid = document.createElement('div');
  grid.className = 'results-grid';

  var hitSec = document.createElement('div');
  hitSec.className = 'hit-section';
  hitSec.innerHTML = '<div class="section-title">Hit Rate by Line (Over)</div>';

  var step = 0.5;
  var lo = Math.max(0, Math.floor((avg - 2) / step) * step);

  for (var i = 0; i < 7; i++) {
    var line = +(lo + i * step).toFixed(1);
    var hr = calcHitRate(recent, line);
    var pct = (hr.rate * 100).toFixed(0);
    hitSec.innerHTML += '<div class="hit-row"><span class="hit-line-label">' + line + '</span><div class="hit-bar-track"><div class="hit-bar-fill" style="width:' + (hr.rate * 100) + '%;background:' + barColor(hr.rate) + '"></div></div><span class="hit-pct" style="color:' + pctColor(hr.rate) + '">' + pct + '%</span><span class="hit-count">' + hr.hits + '/' + hr.total + '</span></div>';
  }

  grid.appendChild(hitSec);

  var logSec = document.createElement('div');
  logSec.className = 'log-section';
  logSec.innerHTML = '<div class="section-title">Game Log</div>';

  var midLine = +(avg).toFixed(1);
  var rows = recent.map(function(g) {
    var ds = g.date ? g.date.toLocaleDateString('en-US', { month:'short', day:'numeric' }) : '—';
    var cls = g.val > midLine ? 'cell-over' : g.val < midLine ? 'cell-under' : '';
    var rc = g.result === 'W' ? 'style="color:var(--accent-green)"' : g.result === 'L' ? 'style="color:var(--accent-red)"' : '';
    return '<tr><td>' + ds + '</td><td>' + (g.opp || '—') + '</td><td ' + rc + '>' + (g.result || '—') + '</td><td class="' + cls + '">' + g.val + '</td></tr>';
  }).join('');

  logSec.innerHTML += '<table class="log-table"><thead><tr><th>Date</th><th>Opp</th><th>W/L</th><th>' + propDef.abbr + '</th></tr></thead><tbody>' + rows + '</tbody></table>';
  grid.appendChild(logSec);
  main.appendChild(grid);
}

async function analyze() {
  var playerId = document.getElementById('player-select').value;
  var propIdx = parseInt(document.getElementById('prop-select').value);
  var n = Math.max(5, Math.min(82, parseInt(document.getElementById('game-count').value) || 15));
  var propDef = (PROPS[activeLeague] || [])[propIdx];

  if (!playerId || !propDef) {
    setStatus('Select a player and prop', '');
    return;
  }

  var player = allPlayers.find(function(p) { return p.id == playerId; });
  if (!player) return;

  setStatus('Loading...', 'yellow');
  document.getElementById('prop-main').innerHTML = '<div class="empty-state">Loading...</div>';

  try {
    var url = 'https://site.web.api.espn.com/apis/common/v3/sports/' + activeSport + '/' + activeLeague + '/athletes/' + playerId + '/overview';
    var r = await fetch(url);
    if (!r.ok) throw new Error('ESPN athlete overview request failed: HTTP ' + r.status);
    var data = await r.json();
    var games = parseGamelog(data, propDef);

    if (!games.length) {
      setStatus('No data for ' + propDef.label, '');
      document.getElementById('prop-main').innerHTML = '<div class="empty-state">No game log data for ' + propDef.label + '</div>';
      return;
    }

    setStatus(games.length + ' games · ' + propDef.label, 'green');
    renderResults(player, games, propDef, n);
  } catch(e) {
    console.error('analyze failed:', e);
    setStatus('Failed to load', '');
    document.getElementById('prop-main').innerHTML = '<div class="empty-state">Failed to load data</div>';
  }
}

document.getElementById('team-select').addEventListener('change', function() {
  if (this.value) loadPlayers(this.value);
});
document.getElementById('analyze-btn').addEventListener('click', analyze);
document.getElementById('player-select').addEventListener('change', function() {
  if (this.value) analyze();
});
document.getElementById('prop-select').addEventListener('change', function() {
  if (document.getElementById('player-select').value) analyze();
});
document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeSport = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    populatePropSelect();
    loadTeams();
    document.getElementById('prop-main').innerHTML = '<div class="empty-state">Select a player and prop to begin analysis<div class="empty-sub">NBA · NHL · MLB</div></div>';
  });
});

populatePropSelect();
loadTeams();
</script>
</body>
</html>
