<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop Engine · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }    body { background:var(--background);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border-soft);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-green); }
    .page-subtitle { color:var(--text-muted);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 12px;border:1px solid var(--border-soft);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .league-pill.active { border-color:var(--accent-green);color:var(--accent-green);background:rgba(0,255,132,0.06); }
    .team-select,.prop-select { background:var(--bg-card);border:1px solid var(--border-soft);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 10px;outline:none;min-width:180px; }
    .team-select:focus,.prop-select:focus { border-color:var(--accent-blue); }
    .game-count { background:var(--bg-card);border:1px solid var(--border-soft);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 10px;outline:none;width:80px; }
    .game-count:focus { border-color:var(--accent-blue); }
    .search-btn { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.1em;padding:5px 16px;border:1px solid var(--accent-green);background:rgba(0,255,132,0.08);color:var(--accent-green);cursor:pointer;text-transform:uppercase;transition:all 0.15s; }
    .search-btn:hover { background:rgba(0,255,132,0.18); }
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--accent-green);box-shadow:0 0 6px var(--accent-green); }
    .status-dot.yellow { background:var(--accent-yellow);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .main { padding:20px 24px;display:flex;flex-direction:column;gap:20px; }

    /* PLAYER HEADER */
    .player-banner { display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--bg-card);border:1px solid var(--border-soft); }
    .player-headshot { width:52px;height:52px;object-fit:cover;flex-shrink:0; }
    .player-headshot-ph { width:52px;height:52px;background:var(--bg-card);border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0; }
    .player-banner-name { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--text-main);letter-spacing:0.04em; }
    .player-banner-meta { font-size:11px;color:var(--text-muted);margin-top:2px; }

    /* STAT SUMMARY STRIP */
    .stat-strip { display:flex;gap:0;border:1px solid var(--border-soft);border-top:none; }
    .stat-strip-item { flex:1;padding:10px 14px;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;gap:3px; }
    .stat-strip-item:last-child { border-right:none; }
    .stat-val { font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:900;line-height:1;color:var(--text-main); }
    .stat-lbl { font-size:9px;letter-spacing:0.12em;color:var(--text-muted);text-transform:uppercase; }
    .stat-trend { font-size:10px;margin-top:2px; }
    .trend-hot  { color:var(--accent-green); }
    .trend-cold { color:var(--accent-red); }
    .trend-mid  { color:var(--text-muted); }

    /* HIT RATE BAR */
    .hit-section { background:var(--bg-card);border:1px solid var(--border-soft);padding:14px 16px; }
    .hit-section-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:12px; }
    .hit-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
    .hit-line-label { font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text-main);min-width:60px; }
    .hit-bar-wrap { flex:1;height:8px;background:var(--bg-card);border:1px solid var(--border-soft);position:relative; }
    .hit-bar-fill { height:100%;transition:width 0.4s; }
    .hit-pct { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;min-width:44px;text-align:right; }
    .hit-count { font-size:10px;color:var(--text-muted);min-width:50px;text-align:right; }

    /* GAME LOG TABLE */
    .log-section { background:var(--bg-card);border:1px solid var(--border-soft);padding:14px 16px; }
    .log-section-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:10px; }
    .log-table { width:100%;border-collapse:collapse;font-size:11px; }
    .log-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:4px 6px;text-align:right;border-bottom:1px solid var(--border-soft);white-space:nowrap; }
    .log-table th:first-child,.log-table th:nth-child(2) { text-align:left; }
    .log-table td { padding:4px 6px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);text-align:right;white-space:nowrap; }
    .log-table td:first-child,.log-table td:nth-child(2) { text-align:left; }
    .log-table tr:hover td { background:var(--bg-card); }
    .log-table tr:last-child td { border-bottom:none; }
    .cell-over { color:var(--accent-green);font-weight:700; }
    .cell-under { color:var(--accent-red); }

    /* SPLITS */
    .splits-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px; }
    .split-card { background:var(--bg-card);border:1px solid var(--border-soft);padding:12px 14px; }
    .split-card-title { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--border-soft);padding-bottom:4px; }
    .split-row { display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--border-soft);font-size:11px; }
    .split-row:last-child { border-bottom:none; }
    .split-label { color:var(--text-muted); }
    .split-val { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text-main); }

    .empty-state { text-align:center;padding:60px 20px;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; }
    .no-data { color:var(--text-muted);font-size:11px;padding:12px 0;text-align:center; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div>
    <div class="page-title">Prop Engine</div>
    <div class="page-subtitle">HIT RATES · TRENDS · OVER/UNDER ANALYSIS</div>
  </div>
</div>
<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  <select class="team-select" id="team-select"><option value="">— Team —</option></select>
  <select class="prop-select" id="player-select"><option value="">— Player —</option></select>
  <select class="prop-select" id="prop-select"></select>
  <input class="game-count" id="game-count" type="number" min="5" max="82" value="15" title="Last N games">
  <button class="search-btn" id="analyze-btn">Analyze</button>
</div>
<div class="status-bar" id="prop-status">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Select a league, team, and player</span>
</div>
<div class="main" id="prop-main">
  <div class="empty-state">Select a player and prop to begin analysis</div>
</div>

<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';
var allTeams     = [];
var allPlayers   = [];
var currentPlayer = null;
var currentGamelog = null;
var currentSplits  = null;

var PROPS = {
  nba: [
    { label:'Points',          statKeys:['points','pts'],                      abbr:'PTS' },
    { label:'Rebounds',        statKeys:['rebounds','totalRebounds','reb'],     abbr:'REB' },
    { label:'Assists',         statKeys:['assists','ast'],                      abbr:'AST' },
    { label:'3-Pointers Made', statKeys:['threePointFieldGoalsMade','3pm','threePointersMade'], abbr:'3PM' },
    { label:'PRA (Pts+Reb+Ast)',statKeys:['__pra__'],                           abbr:'PRA' }
  ],
  nhl: [
    { label:'Goals',           statKeys:['goals','g'],                          abbr:'G'   },
    { label:'Assists',         statKeys:['assists','a'],                        abbr:'A'   },
    { label:'Points',          statKeys:['points','pts'],                       abbr:'PTS' },
    { label:'Shots on Goal',   statKeys:['shotsOnGoal','shots','sog'],          abbr:'SOG' }
  ],
  mlb: [
    { label:'Hits',            statKeys:['hits','h'],                           abbr:'H'   },
    { label:'RBI',             statKeys:['RBI','rbi','runsBattedIn'],           abbr:'RBI' },
    { label:'Total Bases',     statKeys:['totalBases','tb'],                    abbr:'TB'  },
    { label:'Strikeouts (P)',   statKeys:['strikeouts','strikeOuts','so','k'],   abbr:'K'   }
  ]
};

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function populatePropSelect() {
  var sel   = document.getElementById('prop-select');
  var props = PROPS[activeLeague] || [];
  sel.innerHTML = props.map(function(p, i) {
    return '<option value="' + i + '">' + p.label + '</option>';
  }).join('');
}

async function loadTeams() {
  setStatus('Loading teams...', 'yellow');
  var tsel = document.getElementById('team-select');
  var psel = document.getElementById('player-select');
  tsel.innerHTML = '<option value="">— Team —</option>';
  psel.innerHTML = '<option value="">— Player —</option>';
  allTeams = []; allPlayers = [];
  try {
    var r    = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams?limit=200');
    var data = await r.json();
    allTeams = (data.sports[0].leagues[0].teams || []).map(function(t) {
      return { id: t.team.id, name: t.team.displayName, abbr: t.team.abbreviation };
    }).sort(function(a,b) { return a.name.localeCompare(b.name); });
    allTeams.forEach(function(t) {
      var o = document.createElement('option'); o.value = t.id; o.textContent = t.name; tsel.appendChild(o);
    });
    setStatus('Select a team', '');
  } catch(e) { setStatus('Failed to load teams', ''); }
}

async function loadPlayers(teamId) {
  var psel = document.getElementById('player-select');
  psel.innerHTML = '<option value="">Loading...</option>';
  allPlayers = [];
  try {
    var r    = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams/' + teamId + '/roster');
    var data = await r.json();
    var groups = data.athletes || [];
    groups.forEach(function(g) {
      var items = g.items || g.athletes || (g.id ? [g] : []);
      items.forEach(function(p) { if (p.id) allPlayers.push(p); });
    });
    allPlayers.sort(function(a,b) { return (a.displayName||'').localeCompare(b.displayName||''); });
    psel.innerHTML = '<option value="">— Player —</option>';
    allPlayers.forEach(function(p) {
      var o = document.createElement('option'); o.value = p.id; o.textContent = p.displayName || p.fullName || p.id; psel.appendChild(o);
    });
    setStatus('Select a player', '');
  } catch(e) { psel.innerHTML = '<option value="">Failed to load</option>'; }
}

function extractStat(statsArr, keys) {
  if (!statsArr) return null;
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i].toLowerCase();
    for (var j = 0; j < statsArr.length; j++) {
      var s = statsArr[j];
      var n = (s.name || s.shortDisplayName || s.abbreviation || '').toLowerCase();
      if (n === k) { var v = parseFloat(s.displayValue || s.value); return isNaN(v) ? null : v; }
    }
  }
  return null;
}

function parseGamelog(data, propDef) {
  var seasonTypes = data.seasonTypes || [];
  var games = [];
  seasonTypes.forEach(function(st) {
    var cats = st.categories || [];
    if (!cats.length) return;
    // find the category that has our stat
    cats.forEach(function(cat) {
      var labels = cat.labels || cat.names || [];
      var events = cat.events || [];
      events.forEach(function(ev) {
        var statsArr = (ev.stats || []).map(function(v, i) {
          return { name: labels[i] || '', value: v, displayValue: v };
        });
        var val = null;
        if (propDef.statKeys[0] === '__pra__') {
          var pts = extractStat(statsArr, ['points','pts']);
          var reb = extractStat(statsArr, ['rebounds','totalRebounds','reb']);
          var ast = extractStat(statsArr, ['assists','ast']);
          if (pts !== null && reb !== null && ast !== null) val = pts + reb + ast;
        } else {
          val = extractStat(statsArr, propDef.statKeys);
        }
        if (val !== null) {
          games.push({
            date:  ev.gameDate ? new Date(ev.gameDate) : null,
            val:   val,
            stats: statsArr
          });
        }
      });
    });
  });
  // deduplicate by date+val, sort newest first
  games.sort(function(a,b) { return (b.date ? b.date.getTime() : 0) - (a.date ? a.date.getTime() : 0); });
  return games;
}

function calcHitRate(games, line) {
  if (!games.length) return { rate: 0, hits: 0, total: 0 };
  var hits = games.filter(function(g) { return g.val > line; }).length;
  return { rate: hits / games.length, hits: hits, total: games.length };
}

function barColor(rate) {
  if (rate >= 0.65) return 'var(--accent-green)';
  if (rate >= 0.50) return 'var(--accent-yellow)';
  return 'var(--accent-red)';
}

function pctColor(rate) {
  if (rate >= 0.65) return 'var(--accent-green)';
  if (rate >= 0.50) return 'var(--accent-yellow)';
  return 'var(--accent-red)';
}

function renderResults(player, games, propDef, n) {
  var main = document.getElementById('prop-main');
  main.innerHTML = '';
  var recentGames = games.slice(0, n);
  if (!recentGames.length) { main.innerHTML = '<div class="empty-state">No game log data found for this stat</div>'; return; }

  // player banner
  var hs   = player.headshot ? (player.headshot.href || '') : '';
  var pos  = player.position ? (player.position.abbreviation || '') : '';
  var team = allTeams.find(function(t) { return t.id == document.getElementById('team-select').value; });
  var banner = document.createElement('div');
  banner.className = 'player-banner';
  banner.innerHTML =
    (hs ? '<img class="player-headshot" src="' + hs + '">' : '<div class="player-headshot-ph">👤</div>') +
    '<div><div class="player-banner-name">' + (player.displayName || '') + '</div>' +
    '<div class="player-banner-meta">' + (pos || '') + (team ? ' · ' + team.name : '') + ' · ' + activeLeague.toUpperCase() + ' · Last ' + n + ' games</div></div>';
  main.appendChild(banner);

  // stat summary strip
  var vals    = recentGames.map(function(g) { return g.val; });
  var avg     = vals.reduce(function(s,v){return s+v;},0) / vals.length;
  var max     = Math.max.apply(null, vals);
  var min     = Math.min.apply(null, vals);
  var last3   = vals.slice(0,3);
  var avg3    = last3.reduce(function(s,v){return s+v;},0) / last3.length;
  var trendCls = avg3 > avg * 1.1 ? 'trend-hot' : avg3 < avg * 0.9 ? 'trend-cold' : 'trend-mid';
  var trendTxt = avg3 > avg * 1.1 ? '▲ HOT' : avg3 < avg * 0.9 ? '▼ COLD' : '→ AVG';

  var strip = document.createElement('div');
  strip.className = 'stat-strip';
  [
    { label: 'Avg (' + n + 'G)',     val: avg.toFixed(1),    trend: '' },
    { label: 'Avg (Last 3)',          val: avg3.toFixed(1),   trend: '<span class="stat-trend ' + trendCls + '">' + trendTxt + '</span>' },
    { label: 'High',                  val: max,               trend: '' },
    { label: 'Low',                   val: min,               trend: '' }
  ].forEach(function(s) {
    strip.innerHTML += '<div class="stat-strip-item"><div class="stat-val">' + s.val + '</div><div class="stat-lbl">' + propDef.abbr + ' ' + s.label + '</div>' + (s.trend || '') + '</div>';
  });
  main.appendChild(strip);

  // hit rate section
  var hitSec = document.createElement('div');
  hitSec.className = 'hit-section';
  hitSec.innerHTML = '<div class="hit-section-title">Hit Rate by Line (Over)</div>';

  // generate lines around the average
  var baseLines = [];
  var step = activeLeague === 'nhl' ? 0.5 : (activeLeague === 'mlb' ? 0.5 : 0.5);
  var lo = Math.max(0, Math.floor((avg - 2) / step) * step);
  for (var i = 0; i < 7; i++) { baseLines.push(+(lo + i * step).toFixed(1)); }

  baseLines.forEach(function(line) {
    var hr = calcHitRate(recentGames, line);
    var pct = (hr.rate * 100).toFixed(0);
    hitSec.innerHTML +=
      '<div class="hit-row">' +
        '<span class="hit-line-label">O ' + line + '</span>' +
        '<div class="hit-bar-wrap"><div class="hit-bar-fill" style="width:' + (hr.rate*100) + '%;background:' + barColor(hr.rate) + '"></div></div>' +
        '<span class="hit-pct" style="color:' + pctColor(hr.rate) + '">' + pct + '%</span>' +
        '<span class="hit-count">' + hr.hits + '/' + hr.total + '</span>' +
      '</div>';
  });
  main.appendChild(hitSec);

  // game log table
  var logSec = document.createElement('div');
  logSec.className = 'log-section';
  logSec.innerHTML = '<div class="log-section-title">Game Log · Last ' + n + ' Games</div>';

  var midLine = +(avg).toFixed(1);
  var rows = recentGames.map(function(g) {
    var dateStr = g.date ? g.date.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—';
    var cls     = g.val > midLine ? 'cell-over' : g.val < midLine ? 'cell-under' : '';
    return '<tr><td>' + dateStr + '</td><td class="' + cls + '">' + g.val + '</td></tr>';
  }).join('');

  logSec.innerHTML += '<div style="overflow-x:auto"><table class="log-table"><thead><tr><th>Date</th><th>' + propDef.abbr + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  main.appendChild(logSec);
}

async function analyze() {
  var teamId   = document.getElementById('team-select').value;
  var playerId = document.getElementById('player-select').value;
  var propIdx  = parseInt(document.getElementById('prop-select').value);
  var n        = Math.max(5, Math.min(82, parseInt(document.getElementById('game-count').value) || 15));
  var propDef  = (PROPS[activeLeague] || [])[propIdx];

  if (!playerId || !propDef) { setStatus('Select a player and prop', ''); return; }

  var player = allPlayers.find(function(p) { return p.id == playerId; });
  if (!player) return;

  setStatus('Loading game log...', 'yellow');
  document.getElementById('prop-main').innerHTML = '<div class="empty-state">Loading...</div>';

  try {
    var base = 'https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/athletes/' + playerId;
    var r    = await fetch(base + '/gamelog');
    var data = await r.json();
    var games = parseGamelog(data, propDef);

    if (!games.length) {
      setStatus('No game log data found', '');
      document.getElementById('prop-main').innerHTML = '<div class="empty-state">No game log data for ' + propDef.label + '</div>';
      return;
    }

    setStatus(games.length + ' games loaded · ' + propDef.label, 'green');
    renderResults(player, games, propDef, n);
  } catch(e) {
    setStatus('Failed to load game log', '');
    document.getElementById('prop-main').innerHTML = '<div class="empty-state">Failed to load data</div>';
  }
}

// events
document.getElementById('team-select').addEventListener('change', function() {
  if (this.value) loadPlayers(this.value);
});
document.getElementById('analyze-btn').addEventListener('click', analyze);
document.getElementById('player-select').addEventListener('change', function() {
  if (this.value) analyze();
});
document.getElementById('prop-select').addEventListener('change', function() {
  if (document.getElementById('player-select').value) analyze();
});

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    populatePropSelect();
    loadTeams();
    document.getElementById('prop-main').innerHTML = '<div class="empty-state">Select a player and prop to begin analysis</div>';
  });
});

populatePropSelect();
loadTeams();
</script>
</body>
</html>
