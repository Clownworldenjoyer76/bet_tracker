<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet History · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box;margin:0;padding:0; }
    body { background:var(--background);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }

    .page-header { border-bottom:1px solid var(--border-soft);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-green); }
    .page-subtitle { color:var(--text-muted);font-size:11px;letter-spacing:0.06em;margin-top:2px; }

    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap; }
    .league-pill,
    .market-pill,
    .result-pill {
      font-family:'Barlow Condensed',sans-serif;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.08em;
      padding:4px 10px;
      border:1px solid var(--border-soft);
      background:transparent;
      color:var(--text-muted);
      cursor:pointer;
      transition:all 0.15s;
      text-transform:uppercase;
    }
    .league-pill { font-size:13px;padding:4px 12px; }
    .league-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .league-pill.active { border-color:var(--accent-green);color:var(--accent-green);background:rgba(0,255,132,0.06); }

    .market-pill:hover { border-color:var(--accent-yellow);color:var(--accent-yellow); }
    .market-pill.active { border-color:var(--accent-yellow);color:var(--accent-yellow);background:rgba(250,204,21,0.06); }

    .result-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .result-pill.active { border-color:var(--accent-blue);color:var(--accent-blue);background:rgba(0,191,255,0.06); }

    .refresh-btn {
      font-family:'Barlow Condensed',sans-serif;
      font-size:12px;
      font-weight:700;
      letter-spacing:0.1em;
      padding:5px 14px;
      border:1px solid var(--border-soft);
      background:transparent;
      color:var(--text-muted);
      cursor:pointer;
      text-transform:uppercase;
      transition:all 0.15s;
      margin-left:auto;
    }
    .refresh-btn:hover { border-color:var(--accent-blue);color:var(--accent-blue); }

    .status-bar { padding:8px 24px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--accent-green);box-shadow:0 0 6px var(--accent-green); }
    .status-dot.yellow { background:var(--accent-yellow);animation:pulse 1s infinite; }
    .status-dot.red { background:var(--accent-red); }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }

    .main { padding:20px 24px;display:flex;flex-direction:column;gap:20px; }

    .summary-strip { display:flex;border:1px solid var(--border-soft); }
    .summary-item { flex:1;padding:14px 18px;border-right:1px solid var(--border-soft);display:flex;flex-direction:column;gap:3px; }
    .summary-item:last-child { border-right:none; }
    .summary-val { font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;line-height:1; }
    .summary-lbl { font-size:9px;letter-spacing:0.12em;color:var(--text-muted);text-transform:uppercase; }

    .val-green { color:var(--accent-green); }
    .val-red { color:var(--accent-red); }
    .val-yellow { color:var(--accent-yellow); }
    .val-blue { color:var(--accent-blue); }

    .section { background:var(--bg-card);border:1px solid var(--border-soft);padding:14px 16px; }
    .section-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.14em;color:var(--text-muted);text-transform:uppercase;border-bottom:1px solid var(--border-soft);padding-bottom:4px;margin-bottom:12px; }

    .breakdown-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px; }
    .breakdown-card { background:var(--bg-card);border:1px solid var(--border-soft);padding:10px 12px; }
    .breakdown-title { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--accent-yellow);text-transform:uppercase;margin-bottom:8px; }
    .stat-row { display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid var(--border-soft); }
    .stat-row:last-child { border-bottom:none; }
    .stat-label { color:var(--text-muted); }
    .stat-value { font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--text-main); }

    .bets-table { width:100%;border-collapse:collapse;font-size:11px; }
    .bets-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);padding:4px 6px;text-align:left;border-bottom:1px solid var(--border-soft);white-space:nowrap; }
    .bets-table th:not(:first-child):not(:nth-child(2)):not(:nth-child(3)) { text-align:right; }
    .bets-table td { padding:5px 6px;border-bottom:1px solid var(--border-soft);color:var(--text-muted);white-space:nowrap; }
    .bets-table td:not(:first-child):not(:nth-child(2)):not(:nth-child(3)) { text-align:right; }
    .bets-table tr:last-child td { border-bottom:none; }

    .outcome-w { color:var(--accent-green);font-family:'Barlow Condensed',sans-serif;font-weight:700; }
    .outcome-l { color:var(--accent-red);font-family:'Barlow Condensed',sans-serif;font-weight:700; }
    .outcome-p { color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-weight:700; }

    .prob-high { color:var(--accent-green); }
    .prob-mid { color:var(--accent-yellow); }
    .prob-low { color:var(--accent-red); }

    .empty-state { text-align:center;padding:60px 20px;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; }

    @media (max-width: 820px) {
      .summary-strip { flex-direction:column; }
      .summary-item { border-right:none;border-bottom:1px solid var(--border-soft); }
      .summary-item:last-child { border-bottom:none; }
      .refresh-btn { margin-left:0; }
    }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Bet History</div>
    <div class="page-subtitle">GRADED BETS · RESULTS · MODEL PROBABILITY · EV · ODDS</div>
  </div>
</div>

<div class="controls">
  <div class="league-pill active" data-league="all">All</div>
  <div class="league-pill" data-league="MLB">MLB</div>
  <div class="league-pill" data-league="NBA">NBA</div>
  <div class="league-pill" data-league="NCAAM">NCAAM</div>
  <div class="league-pill" data-league="WNBA">WNBA</div>
  <div class="league-pill" data-league="NHL">NHL</div>
  <div class="league-pill" data-league="SOCCER">Soccer</div>

  <div class="market-pill active" data-market="all">All Markets</div>
  <div class="market-pill" data-market="moneyline">Moneyline</div>
  <div class="market-pill" data-market="spread">Spread / Line</div>
  <div class="market-pill" data-market="total">Total</div>

  <div class="result-pill active" data-result="all">All Results</div>
  <div class="result-pill" data-result="win">Wins</div>
  <div class="result-pill" data-result="loss">Losses</div>
  <div class="result-pill" data-result="push">Push</div>

  <button class="refresh-btn" onclick="loadAll()">↻ Refresh</button>
</div>

<div class="status-bar" id="history-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading bet history...</span>
</div>

<div class="main" id="history-main"></div>

<script src="js/nav.js"></script>

<script>
var REPO = 'Clownworldenjoyer76/bet_tracker';
var BRANCH = 'main';
var BASE = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/';

/*
  Toggle leagues here.

  Use enabled:false to deactivate a league without deleting its path.
  Example: Soccer is currently disabled.
*/
var SOURCES = [
  {
    url: BASE + 'docs/win/baseball/05_final_scores/results/graded/MLB_final.csv',
    label: 'MLB',
    enabled: true
  },
  {
    url: BASE + 'docs/win/basketball/05_final_scores/results/nba/graded/NBA_final.csv',
    label: 'NBA',
    enabled: true
  },
  {
    url: BASE + 'docs/win/basketball/05_final_scores/results/ncaam/graded/NCAAM_final.csv',
    label: 'NCAAM',
    enabled: true
  },
  {
    url: BASE + 'docs/win/basketball/05_final_scores/results/wnba/graded/WNBA_final.csv',
    label: 'WNBA',
    enabled: true
  },
  {
    url: BASE + 'docs/win/final_scores/results/nhl/graded/NHL_final.csv',
    label: 'NHL',
    enabled: true
  },
  {
    url: BASE + 'docs/win/soccer/05_final_scores/results/graded/SOCCER_final.csv',
    label: 'SOCCER',
    enabled: false
  }
];

var allRows = [];
var activeLeague = 'all';
var activeMarket = 'all';
var activeResult = 'all';

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function parseCSV(text) {
  var rows = [];
  var current = [];
  var field = '';
  var inQuotes = false;

  for (var i = 0; i < text.length; i++) {
    var char = text[i];
    var next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      field += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      current.push(field);
      field = '';
    } else if ((char === '\n' || char === '\r') && !inQuotes) {
      if (char === '\r' && next === '\n') i++;
      current.push(field);
      field = '';
      if (current.some(function(v){ return v.trim() !== ''; })) rows.push(current);
      current = [];
    } else {
      field += char;
    }
  }

  if (field || current.length) {
    current.push(field);
    if (current.some(function(v){ return v.trim() !== ''; })) rows.push(current);
  }

  if (rows.length < 2) return [];

  var headers = rows[0].map(function(h) {
    return h.trim().toLowerCase().replace(/"/g, '');
  });

  return rows.slice(1).map(function(row) {
    var obj = {};
    headers.forEach(function(h, i) {
      obj[h] = (row[i] || '').trim().replace(/^"|"$/g, '');
    });
    return obj;
  });
}

function parseNum(value) {
  var n = parseFloat(value);
  return isNaN(n) ? null : n;
}

function normalizeResult(r) {
  var resultCol = ['bet_result','result','outcome','win','won','correct'].find(function(c) {
    return r[c] !== undefined && r[c] !== '';
  });

  var resultVal = resultCol ? String(r[resultCol]).toLowerCase().trim() : '';

  if (resultVal === 'win' || resultVal === 'w' || resultVal === '1' || resultVal === 'true') return 'win';
  if (resultVal === 'loss' || resultVal === 'l' || resultVal === '0' || resultVal === 'false') return 'loss';
  if (resultVal === 'push' || resultVal === 'p' || resultVal === 'void' || resultVal === 'tie') return 'push';

  return 'unknown';
}

function normalizeMarket(r) {
  var leagueNames = ['NBA','NCAAM','NCAAB','WNBA','NHL','MLB','SOCCER','BUNDESLIGA','EPL','LALIGA','LIGUE1','SERIEA','MLS'];
  var mktRaw = r.market_type || '';

  if (!mktRaw) {
    var candidate = (r.market || '').toUpperCase().trim();
    if (leagueNames.indexOf(candidate) === -1) mktRaw = r.market || '';
  }

  var mkt = String(mktRaw).toLowerCase().trim();

  if (mkt === 'moneyline' || mkt === 'match_odds' || mkt === 'ml') return 'moneyline';
  if (mkt === 'spread' || mkt === 'puck_line' || mkt === 'run_line' || mkt === 'line') return 'spread';
  if (mkt === 'total' || mkt === 'over_total' || mkt === 'under_total' || mkt === 'btts' || mkt === 'total25' || mkt === 'total35') return 'total';

  return 'other';
}

function normalizeLeague(r, sourceLabel) {
  var leagueRaw = (r.league || '').toUpperCase().trim();

  if (sourceLabel === 'SOCCER') return 'SOCCER';
  if (leagueRaw === 'NCAAB') return 'NCAAM';
  if (leagueRaw) return leagueRaw;

  return sourceLabel;
}

function normalizeOdds(r, betSide) {
  var oddsAmerican =
    parseNum(r.dk_odds_american) ||
    parseNum(r.odds_american) ||
    parseNum(r.american_odds) ||
    null;

  if (!oddsAmerican) {
    if (betSide === 'home') {
      oddsAmerican = parseNum(r.home_dk_moneyline_american) || parseNum(r.home_dk_spread_american) || null;
    } else if (betSide === 'away') {
      oddsAmerican = parseNum(r.away_dk_moneyline_american) || parseNum(r.away_dk_spread_american) || null;
    } else if (betSide === 'over') {
      oddsAmerican = parseNum(r.dk_total_over_american) || null;
    } else if (betSide === 'under') {
      oddsAmerican = parseNum(r.dk_total_under_american) || null;
    }
  }

  if (!oddsAmerican) {
    var dec = parseNum(r.odds) || parseNum(r.dk_odds_decimal) || null;
    if (dec) {
      oddsAmerican = dec >= 2 ? Math.round((dec - 1) * 100) : Math.round(-100 / (dec - 1));
    }
  }

  return oddsAmerican;
}

function normalizeModelProb(r, betSide) {
  var modelProb = parseNum(r.model_prob);

  if (modelProb === null) {
    if (betSide === 'home' && r.home_prob) modelProb = parseNum(r.home_prob);
    else if (betSide === 'away' && r.away_prob) modelProb = parseNum(r.away_prob);
    else if (betSide === 'over' && r.over_prob) modelProb = parseNum(r.over_prob);
    else if (betSide === 'under' && r.under_prob) modelProb = parseNum(r.under_prob);
  }

  if (modelProb !== null && modelProb > 1) modelProb = modelProb / 100;

  return modelProb;
}

function normalizeRow(r, sourceLabel) {
  var betSide = String(r.bet_side || r.side || r.take_bet || r.pick || '').toLowerCase().trim();

  var league = normalizeLeague(r, sourceLabel);
  var leagueSub = (r.league || '').toUpperCase().trim();

  return {
    source: sourceLabel,
    league: league,
    league_sub: leagueSub,
    game_date: r.game_date || r.match_date || r.date || '',
    matchup: r.matchup || r.game || r.event || r.home_away || '',
    market: normalizeMarket(r),
    market_raw: r.market_type || r.market || '',
    bet_side: r.bet_side || r.side || r.take_bet || r.pick || '',
    line: parseNum(r.line),
    odds: normalizeOdds(r, betSide),
    model_prob: normalizeModelProb(r, betSide),
    ev: parseNum(r.ev) || parseNum(r.selected_ev) || parseNum(r.edge_pct),
    kelly: parseNum(r.kelly),
    result: normalizeResult(r)
  };
}

function loadAll() {
  var activeSources = SOURCES.filter(function(src) {
    return src.enabled !== false;
  });

  if (!activeSources.length) {
    allRows = [];
    setStatus('No leagues are currently enabled.', 'red');
    render();
    return;
  }

  setStatus(
    'Fetching data from GitHub: ' + activeSources.map(function(s){ return s.label; }).join(', ') + '...',
    'yellow'
  );

  document.getElementById('history-main').innerHTML = '';

  var promises = activeSources.map(function(src) {
    return fetch(src.url)
      .then(function(res) {
        if (!res.ok) throw new Error(src.label + ' ' + res.status);
        return res.text();
      })
      .then(function(text) {
        return { label: src.label, rows: parseCSV(text) };
      })
      .catch(function(err) {
        console.warn('Failed to load ' + src.label + ':', err);
        return { label: src.label, rows: [] };
      });
  });

  Promise.all(promises).then(function(results) {
    allRows = [];

    results.forEach(function(result) {
      result.rows.forEach(function(row) {
        allRows.push(normalizeRow(row, result.label));
      });
    });

    var graded = allRows.filter(function(r) {
      return r.result === 'win' || r.result === 'loss' || r.result === 'push';
    }).length;

    setStatus(
      allRows.length + ' bets loaded · ' + graded + ' graded · active: ' + activeSources.map(function(s){ return s.label; }).join(', '),
      'green'
    );

    render();
  });
}

function filteredRows() {
  return allRows.filter(function(r) {
    if (activeLeague !== 'all' && r.league !== activeLeague) return false;
    if (activeMarket !== 'all' && r.market !== activeMarket) return false;
    if (activeResult !== 'all' && r.result !== activeResult) return false;
    return true;
  });
}

function render() {
  var rows = filteredRows();
  var graded = rows.filter(function(r) {
    return r.result === 'win' || r.result === 'loss' || r.result === 'push';
  });

  var main = document.getElementById('history-main');
  main.innerHTML = '';

  if (!graded.length) {
    main.innerHTML = '<div class="empty-state">No graded bets match the current filter</div>';
    return;
  }

  var wins = graded.filter(function(r){ return r.result === 'win'; }).length;
  var losses = graded.filter(function(r){ return r.result === 'loss'; }).length;
  var pushes = graded.filter(function(r){ return r.result === 'push'; }).length;
  var decisions = wins + losses;
  var winRate = decisions ? wins / decisions : 0;
  var avgProbRows = graded.filter(function(r){ return r.model_prob !== null; });
  var avgProb = avgProbRows.length ? avgProbRows.reduce(function(s,r){ return s + r.model_prob; }, 0) / avgProbRows.length : 0;
  var evRows = graded.filter(function(r){ return r.ev !== null; });
  var totalEV = evRows.reduce(function(s,r){ return s + r.ev; }, 0);

  var strip = document.createElement('div');
  strip.className = 'summary-strip';

  [
    { val: graded.length, lbl: 'Graded Bets', cls: '' },
    { val: wins + '-' + losses + (pushes ? '-' + pushes : ''), lbl: 'W-L-P Record', cls: winRate >= 0.55 ? 'val-green' : winRate < 0.45 ? 'val-red' : 'val-yellow' },
    { val: (winRate * 100).toFixed(1) + '%', lbl: 'Win Rate', cls: winRate >= 0.55 ? 'val-green' : winRate < 0.45 ? 'val-red' : 'val-yellow' },
    { val: avgProbRows.length ? (avgProb * 100).toFixed(1) + '%' : '—', lbl: 'Avg Model Prob', cls: 'val-blue' },
    { val: evRows.length ? totalEV.toFixed(2) : '—', lbl: 'Total EV', cls: totalEV >= 0 ? 'val-green' : 'val-red' }
  ].forEach(function(s) {
    strip.innerHTML += '<div class="summary-item"><div class="summary-val ' + s.cls + '">' + s.val + '</div><div class="summary-lbl">' + s.lbl + '</div></div>';
  });

  main.appendChild(strip);

  renderLeagueBreakdown(main, graded);
  renderMarketBreakdown(main, graded);
  renderBetsTable(main, graded);
}

function renderLeagueBreakdown(main, graded) {
  var leagues = [];

  graded.forEach(function(r) {
    if (leagues.indexOf(r.league) === -1) leagues.push(r.league);
  });

  leagues.sort();

  var html = leagues.map(function(league) {
    var rows = graded.filter(function(r){ return r.league === league; });
    var wins = rows.filter(function(r){ return r.result === 'win'; }).length;
    var losses = rows.filter(function(r){ return r.result === 'loss'; }).length;
    var decisions = wins + losses;
    var rate = decisions ? wins / decisions : 0;
    var ev = rows.reduce(function(s,r){ return s + (r.ev || 0); }, 0);

    return '<div class="breakdown-card">' +
      '<div class="breakdown-title">' + league + '</div>' +
      '<div class="stat-row"><span class="stat-label">Bets</span><span class="stat-value">' + rows.length + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">W-L</span><span class="stat-value">' + wins + '-' + losses + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Win Rate</span><span class="stat-value" style="color:' + (rate >= 0.55 ? 'var(--accent-green)' : rate < 0.45 ? 'var(--accent-red)' : 'var(--accent-yellow)') + '">' + (rate * 100).toFixed(1) + '%</span></div>' +
      '<div class="stat-row"><span class="stat-label">Total EV</span><span class="stat-value" style="color:' + (ev >= 0 ? 'var(--accent-green)' : 'var(--accent-red)') + '">' + ev.toFixed(2) + '</span></div>' +
    '</div>';
  }).join('');

  var sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = '<div class="section-title">Performance by League</div><div class="breakdown-grid">' + html + '</div>';
  main.appendChild(sec);
}

function renderMarketBreakdown(main, graded) {
  var markets = ['moneyline', 'spread', 'total', 'other'];

  var html = markets.map(function(market) {
    var rows = graded.filter(function(r){ return r.market === market; });
    if (!rows.length) return '';

    var wins = rows.filter(function(r){ return r.result === 'win'; }).length;
    var losses = rows.filter(function(r){ return r.result === 'loss'; }).length;
    var decisions = wins + losses;
    var rate = decisions ? wins / decisions : 0;
    var ev = rows.reduce(function(s,r){ return s + (r.ev || 0); }, 0);
    var label = market === 'spread' ? 'Spread / Line' : market.charAt(0).toUpperCase() + market.slice(1);

    return '<div class="breakdown-card">' +
      '<div class="breakdown-title">' + label + '</div>' +
      '<div class="stat-row"><span class="stat-label">Bets</span><span class="stat-value">' + rows.length + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">W-L</span><span class="stat-value">' + wins + '-' + losses + '</span></div>' +
      '<div class="stat-row"><span class="stat-label">Win Rate</span><span class="stat-value" style="color:' + (rate >= 0.55 ? 'var(--accent-green)' : rate < 0.45 ? 'var(--accent-red)' : 'var(--accent-yellow)') + '">' + (rate * 100).toFixed(1) + '%</span></div>' +
      '<div class="stat-row"><span class="stat-label">Total EV</span><span class="stat-value" style="color:' + (ev >= 0 ? 'var(--accent-green)' : 'var(--accent-red)') + '">' + ev.toFixed(2) + '</span></div>' +
    '</div>';
  }).join('');

  if (!html.replace(/\s/g, '')) return;

  var sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = '<div class="section-title">Performance by Market</div><div class="breakdown-grid">' + html + '</div>';
  main.appendChild(sec);
}

function renderBetsTable(main, graded) {
  var sorted = graded.slice().sort(function(a, b) {
    return String(b.game_date).localeCompare(String(a.game_date));
  });

  var tableRows = sorted.slice(0, 250).map(function(r) {
    var outCls = r.result === 'win' ? 'outcome-w' : r.result === 'loss' ? 'outcome-l' : 'outcome-p';
    var outTxt = r.result === 'win' ? 'WIN' : r.result === 'loss' ? 'LOSS' : 'PUSH';
    var probCls = (r.model_prob || 0) >= 0.65 ? 'prob-high' : (r.model_prob || 0) >= 0.5 ? 'prob-mid' : 'prob-low';
    var evCls = (r.ev || 0) >= 0 ? 'val-green' : 'val-red';
    var oddsStr = r.odds !== null ? (r.odds > 0 ? '+' + r.odds : r.odds) : '—';
    var probStr = r.model_prob !== null ? (r.model_prob * 100).toFixed(1) + '%' : '—';
    var evStr = r.ev !== null ? r.ev.toFixed(2) : '—';
    var lineStr = r.line !== null ? ' ' + r.line : '';
    var leagueDisplay = r.league === 'SOCCER' && r.league_sub && r.league_sub !== 'SOCCER'
      ? r.league + ' · ' + r.league_sub
      : r.league;

    return '<tr>' +
      '<td>' + (r.game_date || '—') + '</td>' +
      '<td>' + leagueDisplay + '</td>' +
      '<td>' + (r.market_raw || r.market || '—') + '</td>' +
      '<td>' + (r.bet_side || '—') + lineStr + '</td>' +
      '<td>' + oddsStr + '</td>' +
      '<td class="' + probCls + '">' + probStr + '</td>' +
      '<td class="' + evCls + '">' + evStr + '</td>' +
      '<td class="' + outCls + '">' + outTxt + '</td>' +
    '</tr>';
  }).join('');

  var sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML =
    '<div class="section-title">Graded Bet History</div>' +
    '<div style="overflow-x:auto">' +
      '<table class="bets-table">' +
        '<thead>' +
          '<tr>' +
            '<th>Date</th>' +
            '<th>League</th>' +
            '<th>Market</th>' +
            '<th>Side / Line</th>' +
            '<th>Odds</th>' +
            '<th>Model%</th>' +
            '<th>EV</th>' +
            '<th>Result</th>' +
          '</tr>' +
        '</thead>' +
        '<tbody>' + tableRows + '</tbody>' +
      '</table>' +
    '</div>';

  if (sorted.length > 250) {
    sec.innerHTML += '<div style="font-size:10px;color:var(--text-muted);padding:8px 0;text-align:center">Showing most recent 250 of ' + sorted.length + ' graded bets</div>';
  }

  main.appendChild(sec);
}

document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p){ p.classList.remove('active'); });
    pill.classList.add('active');
    activeLeague = pill.dataset.league;

});

document.querySelectorAll('.market-pill').forEach(function(pill) {

document.querySelectorAll('.result-pill').forEach(function(pill) {

    pill.classList.add('active');

});
