<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet History · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background:var(--background);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border-soft);padding:16px 24px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-green); }
    .page-subtitle { color:var(--text-muted);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .empty-state { text-align:center;padding:100px 20px;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase; }
    .empty-sub { font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-muted);margin-top:10px;font-weight:400;letter-spacing:0; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div class="page-title">Bet History</div>
  <div class="page-subtitle">COMING SOON</div>
</div>
<div class="empty-state">
  Under Construction
  <div class="empty-sub">Bet history tracking coming soon.</div>
</div>
<script src="js/nav.js"></script>
</body>
</html>
