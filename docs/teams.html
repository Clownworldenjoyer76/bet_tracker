<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Teams</div>
    <div class="page-subtitle">ESPN · ROSTER & TEAM INFO</div>
  </div>
</div>

<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  <div class="league-pill" data-sport="basketball" data-league="mens-college-basketball">NCAAB</div>
  <input type="text" class="search-box" id="team-search" placeholder="Search team...">
</div>

<div class="status-bar" id="teams-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>

<div class="main" id="teams-main"></div>
<div class="empty-state" id="teams-empty" style="display:none">No teams found</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">CLOSE ✕</button>
    <div class="modal-team-header" id="modal-team-header"></div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div id="modal-panels"></div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>

var activeSport  = 'basketball';
var activeLeague = 'nba';
var allTeams     = [];
var searchQuery  = '';
var TABBED_LEAGUES = ['nba','nhl','mlb'];

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function render() {
  var main  = document.getElementById('teams-main');
  var empty = document.getElementById('teams-empty');
  main.innerHTML = '';

  var teams = allTeams.slice();

  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    teams = teams.filter(function(t) {
      return t.name.toLowerCase().includes(q) || t.abbr.toLowerCase().includes(q);
    });
  }

  if (teams.length === 0) { empty.style.display = ''; return; }

  empty.style.display = 'none';

  var grid = document.createElement('div');
  grid.className = 'team-grid';

  teams.forEach(function(t) {
    var card = document.createElement('div');
    card.className = 'team-card';

    var imgHtml = t.logo
      ? '<img class="team-logo" src="' + t.logo + '">'
      : '<div class="team-logo-placeholder"></div>';

    card.innerHTML = imgHtml +
      '<div class="team-info">' +
        '<div class="team-name">' + t.name + '</div>' +
        '<div class="team-abbr">' + t.abbr + '</div>' +
      '</div>';

    card.onclick = function() { openTeamModal(t); };

    grid.appendChild(card);
  });

  main.appendChild(grid);
}

async function loadTeams() {
  setStatus('Loading...', 'yellow');

  try {
    var url = `https://site.api.espn.com/apis/site/v2/sports/${activeSport}/${activeLeague}/teams?limit=200`;
    var res = await fetch(url);
    var data = await res.json();

    var raw = data.sports[0].leagues[0].teams;

    allTeams = raw.map(function(t) {
      var team = t.team;
      return {
        id: team.id,
        name: team.displayName,
        abbr: team.abbreviation || '',
        logo: team.logos?.[0]?.href || '',
        sport: activeSport,
        league: activeLeague
      };
    });

    render();
    setStatus(allTeams.length + ' teams', 'green');

  } catch {
    setStatus('Failed to load', '');
  }
}

function buildOverviewPanel(data) {
  var team  = data.team || {};
  var rec   = team.record?.items?.[0];
  var stats = rec?.stats || [];

  function getStat(names) {
    for (var n of names) {
      var s = stats.find(x => (x.name || '').toLowerCase() === n);
      if (s) return s.displayValue || s.value;
    }
    return '—';
  }

  var wins   = getStat(['wins','W']);
  var losses = getStat(['losses','L']);
  var pct    = getStat(['winpercent','winPercentage']);

  var coach = '';
  if (team.coaches?.length) {
    var hc = team.coaches.find(c => c.type === 'head' || c.type === 'headCoach') || team.coaches[0];
    if (hc) coach = hc.firstName + ' ' + hc.lastName;
  }

  return `
    <div class="info-grid">
      <div class="info-item"><div class="info-label">Record</div><div class="info-val">${wins !== '—' ? wins + '-' + losses : '—'}</div></div>
      <div class="info-item"><div class="info-label">Win %</div><div class="info-val">${pct}</div></div>
      <div class="info-item"><div class="info-label">Head Coach</div><div class="info-val">${coach || '—'}</div></div>
    </div>
  `;
}

/* ✅ FIXED SCHEDULE LOGIC ONLY */
function buildSchedulePanel(data, t) {
  var events = data.events || [];
  if (!events.length) return '<div class="no-data">No schedule data</div>';

  return events.map(function(ev) {
    var comp = ev.competitions?.[0];
    if (!comp) return '';

    var teams = comp.competitors || [];

    var me  = teams.find(c => c.team?.id === t.id);
    var opp = teams.find(c => c.team?.id !== t.id);

    if (!me || !opp) return '';

    var completed = ev.status?.type?.completed;
    var date = new Date(ev.date).toLocaleDateString();

    var result = '';

    if (completed) {
      var myScore  = parseInt(me.score);
      var oppScore = parseInt(opp.score);
      var win = myScore > oppScore;

      result = `<span class="${win ? 'sch-w' : 'sch-l'}">${win ? 'W' : 'L'} ${myScore}-${oppScore}</span>`;
    }

    return `
      <div class="schedule-row">
        <span>${date}</span>
        <span>${opp.team.abbreviation}</span>
        ${result}
      </div>
    `;
  }).join('');
}

async function openTeamModal(t) {
  document.getElementById('modal-overlay').classList.add('open');

  var panels = document.getElementById('modal-panels');
  panels.innerHTML = '<div class="modal-loading">Loading...</div>';

  var base = `https://site.api.espn.com/apis/site/v2/sports/${t.sport}/${t.league}/teams/${t.id}`;

  try {
    var res = await fetch(base);
    var data = await res.json();

    panels.innerHTML = buildOverviewPanel(data);

  } catch {
    panels.innerHTML = '<div class="modal-error">Failed to load</div>';
  }
}

document.getElementById('modal-close').onclick = () =>
  document.getElementById('modal-overlay').classList.remove('open');

document.querySelectorAll('.league-pill').forEach(p => {
  p.onclick = function() {
    document.querySelectorAll('.league-pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    activeSport = p.dataset.sport;
    activeLeague = p.dataset.league;
    loadTeams();
  };
});

document.getElementById('team-search').oninput = function(e) {
  searchQuery = e.target.value;
  render();
};

loadTeams();

</script>
</body>
</html>
