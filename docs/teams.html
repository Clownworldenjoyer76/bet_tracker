<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0a0a0a;--bg2:#111111;--bg3:#141414;--border:#222222;
      --green:#00ff84;--blue:#00bfff;--yellow:#facc15;--red:#ff4444;
      --orange:#ff8c00;--muted:#555555;--text:#e0e0e0;--text2:#888888;
    }
    body { background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }
    .page-header { border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--green); }
    .page-subtitle { color:var(--text2);font-size:11px;letter-spacing:0.06em;margin-top:2px; }
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 12px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--blue);color:var(--blue); }
    .league-pill.active { border-color:var(--green);color:var(--green);background:rgba(0,255,132,0.06); }
    .search-box { margin-left:auto;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 10px;width:200px;outline:none; }
    .search-box:focus { border-color:var(--blue); }
    .search-box::placeholder { color:var(--muted); }
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--muted);display:inline-block;flex-shrink:0; }
    .status-dot.green { background:var(--green);box-shadow:0 0 6px var(--green); }
    .status-dot.yellow { background:var(--yellow);animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .main { padding:20px 24px; }
    .team-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px; }
    .team-card { background:var(--bg2);border:1px solid var(--border);padding:12px 14px;cursor:pointer;transition:border-color 0.15s,background 0.15s;display:flex;align-items:center;gap:12px; }
    .team-card:hover { border-color:var(--green);background:var(--bg3); }
    .team-logo { width:32px;height:32px;object-fit:contain;flex-shrink:0; }
    .team-logo-placeholder { width:32px;height:32px;flex-shrink:0; }
    .team-info { display:flex;flex-direction:column;gap:2px;min-width:0; }
    .team-name { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .team-abbr { font-size:10px;color:var(--text2);letter-spacing:0.1em; }
    .empty-state { text-align:center;padding:60px 20px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase; }

    /* MODAL */
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:var(--bg2);border:1px solid var(--border);width:100%;max-width:580px;position:relative;margin:auto; }
    .modal-close { position:absolute;top:12px;right:14px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:0.1em;background:none;border:none;z-index:2; }
    .modal-close:hover { color:var(--text); }

    .modal-team-header { display:flex;align-items:center;gap:14px;padding:20px 24px 14px;border-bottom:1px solid var(--border); }
    .modal-logo { width:48px;height:48px;object-fit:contain;flex-shrink:0; }
    .modal-team-name { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--text);letter-spacing:0.04em; }
    .modal-team-sub { font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap; }
    .modal-team-sub span { color:var(--green); }

    .modal-tabs { display:flex;border-bottom:1px solid var(--border);overflow-x:auto; }
    .modal-tab { font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:8px 16px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;flex-shrink:0; }
    .modal-tab:hover { color:var(--text); }
    .modal-tab.active { color:var(--green);border-bottom-color:var(--green); }

    .modal-panel { padding:16px 20px;display:none;min-height:120px; }
    .modal-panel.active { display:block; }

    .modal-subtitle { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:4px;margin-bottom:8px;margin-top:12px; }
    .modal-subtitle:first-child { margin-top:0; }
    .info-grid { display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-bottom:10px; }
    .info-item { display:flex;flex-direction:column;gap:1px; }
    .info-label { font-size:9px;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase; }
    .info-val { font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text); }

    .roster-table { width:100%;border-collapse:collapse;font-size:11px; }
    .roster-table th { font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text2);padding:4px 6px;text-align:left;border-bottom:1px solid var(--border); }
    .roster-table td { padding:5px 6px;border-bottom:1px solid #161616;color:var(--text2);vertical-align:middle; }
    .roster-table tr:last-child td { border-bottom:none; }
    .roster-table tr:hover td { background:var(--bg3); }
    .p-name { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);letter-spacing:0.04em; }
    .inj-dot { display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:5px;vertical-align:middle; }

    .schedule-row { display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #161616;font-size:11px; }
    .schedule-row:last-child { border-bottom:none; }
    .sch-date { color:var(--muted);min-width:60px;font-size:10px; }
    .sch-opp { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);flex:1;padding:0 8px; }
    .sch-result { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700; }
    .sch-w { color:var(--green); }
    .sch-l { color:var(--red); }
    .sch-upcoming { color:var(--text2);font-size:11px; }

    .depth-group { margin-bottom:12px; }
    .depth-pos-header { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--blue);text-transform:uppercase;margin-bottom:4px; }
    .depth-row { display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #161616;font-size:11px; }
    .depth-row:last-child { border-bottom:none; }
    .depth-rank { color:var(--muted);min-width:16px;font-size:10px; }
    .depth-name { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text); }

    .history-row { padding:5px 0;border-bottom:1px solid #161616;font-size:11px;color:var(--text2); }
    .history-row:last-child { border-bottom:none; }
    .history-year { font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text);min-width:50px;display:inline-block; }

    .modal-loading { color:var(--text2);font-size:11px;padding:20px 0;text-align:center; }
    .modal-error { color:var(--red);font-size:11px;padding:12px 0;text-align:center; }
    .no-data { color:var(--muted);font-size:11px;padding:12px 0;text-align:center;letter-spacing:0.08em; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>
<div class="page-header">
  <div>
    <div class="page-title">Teams</div>
    <div class="page-subtitle">ESPN · ROSTER &amp; TEAM INFO</div>
  </div>
</div>
<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb">MLB</div>
  <div class="league-pill" data-sport="basketball" data-league="mens-college-basketball">NCAAB</div>
  <input type="text" class="search-box" id="team-search" placeholder="Search team...">
</div>
<div class="status-bar" id="teams-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>
<div class="main" id="teams-main"></div>
<div class="empty-state" id="teams-empty" style="display:none">No teams found</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">CLOSE ✕</button>
    <div class="modal-team-header" id="modal-team-header"></div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div id="modal-panels"></div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';
var allTeams     = [];
var searchQuery  = '';
var TABBED_LEAGUES = ['nba','nhl','mlb'];

function setStatus(text, dotCls) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls || '');
}

function render() {
  var main  = document.getElementById('teams-main');
  var empty = document.getElementById('teams-empty');
  main.innerHTML = '';
  var teams = allTeams.slice();
  if (searchQuery) {
    var q = searchQuery.toLowerCase();
    teams = teams.filter(function(t) { return t.name.toLowerCase().indexOf(q) !== -1 || t.abbr.toLowerCase().indexOf(q) !== -1; });
  }
  if (teams.length === 0) { empty.style.display = ''; return; }
  empty.style.display = 'none';
  var grid = document.createElement('div');
  grid.className = 'team-grid';
  teams.forEach(function(t) {
    var card = document.createElement('div');
    card.className = 'team-card';
    var imgHtml = t.logo ? '<img class="team-logo" src="' + t.logo + '" loading="lazy">' : '<div class="team-logo-placeholder"></div>';
    card.innerHTML = imgHtml + '<div class="team-info"><div class="team-name">' + t.name + '</div><div class="team-abbr">' + t.abbr + '</div></div>';
    card.addEventListener('click', function() { openTeamModal(t); });
    grid.appendChild(card);
  });
  main.appendChild(grid);
}

async function loadTeams() {
  setStatus('Loading...', 'yellow');
  allTeams = [];
  try {
    var url  = 'https://site.api.espn.com/apis/site/v2/sports/' + activeSport + '/' + activeLeague + '/teams?limit=200';
    var r    = await fetch(url);
    var data = await r.json();
    var raw  = data.sports[0].leagues[0].teams || [];
    allTeams = raw.map(function(t) {
      var team = t.team;
      var logo = team.logos && team.logos[0] ? team.logos[0].href : '';
      return { id: team.id, name: team.displayName, abbr: team.abbreviation || '', location: team.location || '', nickname: team.nickname || '', logo: logo, sport: activeSport, league: activeLeague };
    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
    render();
    setStatus(allTeams.length + ' teams', 'green');
  } catch(e) { setStatus('Failed to load', ''); }
}

// ── MODAL ─────────────────────────────────────────────────────────────────

function safeGet(obj) { try { return obj; } catch(e) { return null; } }

function fmtDate(str) {
  if (!str) return '—';
  var d = new Date(str);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function buildOverviewPanel(data, t) {
  var team  = (data.team) || {};
  var rec   = team.record && team.record.items && team.record.items[0];
  var stats = rec ? rec.stats || [] : [];
  var getStat = function(name) {
    for (var i = 0; i < stats.length; i++) {
      if ((stats[i].name || '').toLowerCase() === name.toLowerCase()) return stats[i].displayValue || stats[i].value || '—';
    }
    return '—';
  };
  var wins   = getStat('wins');
  var losses = getStat('losses');
  var pct    = getStat('winPercent') !== '—' ? getStat('winPercent') : getStat('winpercent');
  var venue  = team.franchise && team.franchise.venue ? team.franchise.venue.fullName || '—' : (team.venue ? team.venue.fullName || '—' : '—');
  var coach  = '';
  if (team.coaches && team.coaches.length) {
    var hc = team.coaches.find(function(c) { return c.type === 'head' || c.type === 'headCoach'; }) || team.coaches[0];
    if (hc) coach = hc.firstName + ' ' + hc.lastName;
  }
  var standing = team.standingSummary || '';

  var html = '<div class="info-grid">' +
    '<div class="info-item"><div class="info-label">Record</div><div class="info-val">' + (wins !== '—' ? wins + '-' + losses : '—') + '</div></div>' +
    '<div class="info-item"><div class="info-label">Win %</div><div class="info-val">' + pct + '</div></div>' +
    '<div class="info-item"><div class="info-label">Standing</div><div class="info-val" style="font-size:11px">' + (standing || '—') + '</div></div>' +
    '<div class="info-item"><div class="info-label">Head Coach</div><div class="info-val" style="font-size:11px">' + (coach || '—') + '</div></div>' +
    '</div>' +
    '<div class="modal-subtitle">Venue</div>' +
    '<div style="font-size:12px;color:var(--text2)">' + venue + '</div>';
  return html;
}

function buildRosterPanel(data) {
  var groups = data.athletes || [];
  if (!groups.length) return '<div class="no-data">No roster data</div>';

  var players = [];
  groups.forEach(function(g) {
    var items = g.items || g.athletes || (g.id ? [g] : []);
    items.forEach(function(p) { players.push(p); });
  });
  if (!players.length) return '<div class="no-data">No players found</div>';

  var rows = players.map(function(p) {
    var pos    = p.position ? (p.position.abbreviation || p.position.name || '—') : '—';
    var jersey = p.jersey ? '#' + p.jersey : '—';
    var inj    = p.injuries && p.injuries.length ? '<span class="inj-dot" title="' + p.injuries[0].status + '"></span>' : '';
    return '<tr><td>' + jersey + '</td><td><span class="p-name">' + (p.displayName || '—') + '</span>' + inj + '</td><td>' + pos + '</td><td>' + (p.displayHeight || '—') + '</td><td>' + (p.displayWeight || '—') + '</td></tr>';
  }).join('');

  return '<table class="roster-table"><thead><tr><th>#</th><th>Name</th><th>Pos</th><th>HT</th><th>WT</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function buildSchedulePanel(data) {
  var events = data.events || [];
  if (!events.length) return '<div class="no-data">No schedule data</div>';

  var rows = events.slice(0, 20).map(function(ev) {
    var comp      = ev.competitions && ev.competitions[0];
    if (!comp) return '';
    var completed = ev.status && ev.status.type && ev.status.type.completed;
    var date      = fmtDate(ev.date);
    var comps     = comp.competitors || [];
    var opp       = comps.find(function(c) { return !c.team || (comp.competitors[0] !== c); });
    var me        = comps.find(function(c) { return c !== opp; });
    if (!opp || !me) return '';
    var oppName   = opp.team ? (opp.team.abbreviation || opp.team.displayName || '') : '—';
    var atHome    = me.homeAway === 'home';
    var label     = atHome ? 'vs ' + oppName : '@ ' + oppName;
    var result    = '';
    if (completed) {
      var myScore  = parseInt(me.score) || 0;
      var oppScore = parseInt(opp.score) || 0;
      var win      = myScore > oppScore;
      result = '<span class="sch-result ' + (win ? 'sch-w' : 'sch-l') + '">' + (win ? 'W' : 'L') + ' ' + myScore + '-' + oppScore + '</span>';
    } else {
      var t = ev.status && ev.status.type ? ev.status.type.shortDetail || '' : '';
      result = '<span class="sch-upcoming">' + t + '</span>';
    }
    return '<div class="schedule-row"><span class="sch-date">' + date + '</span><span class="sch-opp">' + label + '</span>' + result + '</div>';
  }).join('');

  return rows || '<div class="no-data">No games found</div>';
}

function buildDepthPanel(data) {
  var items = data.depthCharts || data.items || [];
  if (!items.length) return '<div class="no-data">No depth chart data</div>';
  var html = '';
  items.forEach(function(pos) {
    var posName = pos.position ? (pos.position.displayName || pos.position.abbreviation || '') : '';
    var athletes = pos.athletes || [];
    if (!athletes.length) return;
    html += '<div class="depth-group"><div class="depth-pos-header">' + posName + '</div>';
    athletes.forEach(function(a, i) {
      var name = a.athlete ? (a.athlete.displayName || '—') : '—';
      html += '<div class="depth-row"><span class="depth-rank">' + (i+1) + '</span><span class="depth-name">' + name + '</span></div>';
    });
    html += '</div>';
  });
  return html || '<div class="no-data">No depth chart data</div>';
}

function buildHistoryPanel(data) {
  var seasons = data.seasons || data.history || [];
  if (!seasons.length) return '<div class="no-data">No history data</div>';
  var html = '';
  seasons.slice(0, 30).forEach(function(s) {
    var year = s.year || s.displayYear || '';
    var wins = s.wins !== undefined ? s.wins : '—';
    var losses = s.losses !== undefined ? s.losses : '—';
    var note = s.note || s.summary || '';
    html += '<div class="history-row"><span class="history-year">' + year + '</span> ' + wins + '-' + losses + (note ? ' · ' + note : '') + '</div>';
  });
  return html || '<div class="no-data">No history data</div>';
}

async function loadPanel(panelId, t, tab) {
  var panel = document.getElementById(panelId);
  if (!panel) return;
  if (panel.dataset.loaded) return; // cached
  panel.innerHTML = '<div class="modal-loading">Loading...</div>';

  var base = 'https://site.api.espn.com/apis/site/v2/sports/' + t.sport + '/' + t.league + '/teams/' + t.id;
  try {
    var r, data, html;
    if (tab === 'overview') {
      r = await fetch(base + '?enable=roster,projection,stats');
      data = await r.json();
      html = buildOverviewPanel(data, t);
    } else if (tab === 'roster') {
      r = await fetch(base + '/roster');
      data = await r.json();
      html = buildRosterPanel(data);
    } else if (tab === 'schedule') {
      r = await fetch(base + '/schedule');
      data = await r.json();
      html = buildSchedulePanel(data);
    } else if (tab === 'depth') {
      r = await fetch(base + '/depthcharts');
      data = await r.json();
      html = buildDepthPanel(data);
    } else if (tab === 'history') {
      r = await fetch(base + '/history');
      data = await r.json();
      html = buildHistoryPanel(data);
    }
    panel.innerHTML = html || '<div class="no-data">No data</div>';
    panel.dataset.loaded = '1';
  } catch(e) {
    panel.innerHTML = '<div class="modal-error">Failed to load</div>';
  }
}

function switchTab(tabName) {
  document.querySelectorAll('.modal-tab').forEach(function(t) { t.classList.remove('active'); });
  document.querySelectorAll('.modal-panel').forEach(function(p) { p.classList.remove('active'); });
  var tab   = document.querySelector('.modal-tab[data-tab="' + tabName + '"]');
  var panel = document.getElementById('panel-' + tabName);
  if (tab)   tab.classList.add('active');
  if (panel) panel.classList.add('active');
}

async function openTeamModal(t) {
  var overlay = document.getElementById('modal-overlay');
  var hdr     = document.getElementById('modal-team-header');
  var tabsEl  = document.getElementById('modal-tabs');
  var panelsEl= document.getElementById('modal-panels');
  overlay.classList.add('open');

  var logoHtml = t.logo ? '<img class="modal-logo" src="' + t.logo + '">' : '';
  hdr.innerHTML = logoHtml +
    '<div><div class="modal-team-name">' + t.name + '</div>' +
    '<div class="modal-team-sub">' + t.league.toUpperCase() + '</div></div>';

  var usesTabs = TABBED_LEAGUES.indexOf(t.league) !== -1;

  if (usesTabs) {
    var tabs = [
      { key: 'overview',  label: 'Overview' },
      { key: 'roster',    label: 'Roster'   },
      { key: 'schedule',  label: 'Schedule' },
      { key: 'depth',     label: 'Depth'    },
      { key: 'history',   label: 'History'  }
    ];

    tabsEl.innerHTML = tabs.map(function(tb) {
      return '<div class="modal-tab' + (tb.key === 'overview' ? ' active' : '') + '" data-tab="' + tb.key + '">' + tb.label + '</div>';
    }).join('');

    panelsEl.innerHTML = tabs.map(function(tb) {
      return '<div class="modal-panel' + (tb.key === 'overview' ? ' active' : '') + '" id="panel-' + tb.key + '"><div class="modal-loading">Loading...</div></div>';
    }).join('');

    tabsEl.querySelectorAll('.modal-tab').forEach(function(tabEl) {
      tabEl.addEventListener('click', function() {
        switchTab(tabEl.dataset.tab);
        loadPanel('panel-' + tabEl.dataset.tab, t, tabEl.dataset.tab);
      });
    });

    // load first tab immediately
    loadPanel('panel-overview', t, 'overview');

  } else {
    // NCAAB — roster only, no tabs
    tabsEl.innerHTML = '';
    panelsEl.innerHTML = '<div class="modal-panel active" id="panel-roster"><div class="modal-loading">Loading roster...</div></div>';
    try {
      var r    = await fetch('https://site.api.espn.com/apis/site/v2/sports/' + t.sport + '/' + t.league + '/teams/' + t.id + '/roster');
      var data = await r.json();
      document.getElementById('panel-roster').innerHTML = buildRosterPanel(data);
    } catch(e) {
      document.getElementById('panel-roster').innerHTML = '<div class="modal-error">Failed to load roster</div>';
    }
  }
}

document.getElementById('modal-close').addEventListener('click', function() {
  document.getElementById('modal-overlay').classList.remove('open');
});
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});
document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p) { p.classList.remove('active'); });
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    searchQuery  = '';
    document.getElementById('team-search').value = '';
    loadTeams();
  });
});
document.getElementById('team-search').addEventListener('input', function(e) {
  searchQuery = e.target.value.trim();
  render();
});

loadTeams();
</script>
</body>
</html>
