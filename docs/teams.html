<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      min-height: 100vh;
    }

    .page-header {
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-green);
    }

    .page-subtitle {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-top: 2px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-soft);
      flex-wrap: wrap;
    }

    .league-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border: 1px solid var(--border-soft);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }

    .league-pill:hover {
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    .league-pill.active {
      border-color: var(--accent-green);
      color: var(--accent-green);
      background: rgba(0,255,132,0.06);
    }

    .league-pill.placeholder {
      border-style: dashed;
      opacity: 0.75;
    }

    .league-pill.placeholder.active {
      border-color: var(--accent-yellow);
      color: var(--accent-yellow);
      background: rgba(255,204,0,0.06);
    }

    .search-box {
      margin-left: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: var(--text-main);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      padding: 5px 10px;
      width: 200px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-blue);
    }

    .search-box::placeholder {
      color: var(--text-muted);
    }

    .status-bar {
      padding: 8px 24px;
      font-size: 11px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      display: inline-block;
      flex-shrink: 0;
    }

    .status-dot.green {
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
    }

    .status-dot.yellow {
      background: var(--accent-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.red {
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red);
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .main {
      padding: 20px 24px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
      gap: 8px;
    }

    .team-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-card:hover {
      border-color: var(--accent-green);
      background: var(--bg-card);
    }

    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .team-logo-placeholder {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .team-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-abbr {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .placeholder-state {
      max-width: 760px;
      margin: 40px auto;
      padding: 28px;
      border: 1px dashed var(--border-soft);
      background: rgba(255,255,255,0.02);
      text-align: center;
    }

    .placeholder-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.1em;
      color: var(--accent-yellow);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .placeholder-copy {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .error-details {
      margin-top: 10px;
      color: var(--accent-red);
      font-size: 10px;
      word-break: break-all;
      line-height: 1.5;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      width: 100%;
      max-width: 680px;
      position: relative;
      margin: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.1em;
      background: none;
      border: none;
      z-index: 2;
    }

    .modal-close:hover {
      color: var(--text-main);
    }

    .modal-team-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .modal-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .modal-team-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .modal-team-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .modal-team-sub span {
      color: var(--accent-green);
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-soft);
      overflow-x: auto;
    }

    .modal-tab {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 16px;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .modal-tab:hover {
      color: var(--text-main);
    }

    .modal-tab.active {
      color: var(--accent-green);
      border-bottom-color: var(--accent-green);
    }

    .modal-panel {
      padding: 16px 20px;
      display: none;
      min-height: 120px;
      max-height: 65vh;
      overflow-y: auto;
    }

    .modal-panel.active {
      display: block;
    }

    .modal-subtitle {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-soft);
      padding-bottom: 4px;
      margin-bottom: 8px;
      margin-top: 12px;
    }

    .modal-subtitle:first-child {
      margin-top: 0;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px 16px;
      margin-bottom: 10px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .info-label {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .info-val {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .roster-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      min-width: 560px;
    }

    .roster-table th {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 4px 6px;
      text-align: left;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }

    .roster-table td {
      padding: 5px 6px;
      border-bottom: 1px solid var(--border-soft);
      color: var(--text-muted);
      vertical-align: middle;
      white-space: nowrap;
    }

    .roster-table tr:last-child td {
      border-bottom: none;
    }

    .roster-table tr:hover td {
      background: var(--bg-card);
    }

    .p-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 0.04em;
    }

    .inj-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-red);
      margin-left: 5px;
      vertical-align: middle;
    }

    .bio-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 11px;
    }

    .bio-row:last-child {
      border-bottom: none;
    }

    .bio-label {
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .bio-val {
      color: var(--text-main);
      text-align: right;
    }

    .modal-loading {
      color: var(--text-muted);
      font-size: 11px;
      padding: 20px 0;
      text-align: center;
    }

    .modal-error {
      color: var(--accent-red);
      font-size: 11px;
      padding: 12px 0;
      text-align: center;
    }

    .no-data {
      color: var(--text-muted);
      font-size: 11px;
      padding: 12px 0;
      text-align: center;
      letter-spacing: 0.08em;
    }

    @media (max-width: 720px) {
      .page-header,
      .controls,
      .status-bar,
      .main {
        padding-left: 14px;
        padding-right: 14px;
      }

      .search-box {
        width: 100%;
        margin-left: 0;
      }

      .info-grid {
        grid-template-columns: repeat(2,1fr);
      }
    }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Teams</div>
    <div class="page-subtitle">ESPN CORE · TEAM INFO &amp; ROSTERS</div>
  </div>
</div>

<div class="controls" id="league-controls">
  <input type="text" class="search-box" id="team-search" placeholder="Search team...">
</div>

<div class="status-bar" id="teams-status">
  <span class="status-dot yellow" id="status-dot"></span>
  <span id="status-text">Loading...</span>
</div>

<div class="main" id="teams-main"></div>
<div class="empty-state" id="teams-empty" style="display:none">No teams found</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">CLOSE ✕</button>
    <div class="modal-team-header" id="modal-team-header"></div>
    <div class="modal-tabs" id="modal-tabs"></div>
    <div id="modal-panels"></div>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/teams/render.js"></script>
</body>
</html>
