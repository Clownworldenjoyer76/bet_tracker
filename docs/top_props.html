<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Props · Edgelytics</title>
  <link rel="stylesheet" href="css/matstheme.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--background);color:var(--text-main);font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:100vh; }

    /* HEADER */
    .page-header { border-bottom:1px solid var(--border-soft);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px; }
    .page-title { font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-green); }
    .page-subtitle { color:var(--text-muted);font-size:11px;letter-spacing:0.06em;margin-top:2px; }

    /* CONTROLS */
    .controls { display:flex;align-items:center;gap:8px;padding:12px 24px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap; }
    .league-pill { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.08em;padding:4px 14px;border:1px solid var(--border-soft);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
    .league-pill:hover { border-color:var(--accent-blue);color:var(--accent-blue); }
    .league-pill.active { border-color:var(--accent-green);color:var(--accent-green);background:rgba(0,255,132,0.06); }
    .run-btn { font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:900;letter-spacing:0.12em;padding:6px 20px;border:1px solid var(--accent-green);background:rgba(0,255,132,0.08);color:var(--accent-green);cursor:pointer;text-transform:uppercase;transition:all 0.15s;margin-left:auto; }
    .run-btn:hover { background:rgba(0,255,132,0.18); }
    .run-btn:disabled { opacity:0.4;cursor:not-allowed; }

    /* STATUS */
    .status-bar { padding:8px 24px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px; }
    .status-dot { width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block;flex-shrink:0; }
    .status-dot.green  { background:var(--accent-green);box-shadow:0 0 6px var(--accent-green); }
    .status-dot.yellow { background:var(--accent-yellow);animation:pulse 1s infinite; }
    .status-dot.red    { background:var(--accent-red); }
    @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.3;} }
    .progress-wrap { flex:1;height:3px;background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);overflow:hidden; }
    .progress-fill { height:100%;background:var(--accent-green);transition:width 0.3s; }

    /* MAIN */
    .main { padding:20px 24px;display:flex;flex-direction:column;gap:24px; }

    /* GAME BLOCK */
    .game-block { border:1px solid var(--border-soft); }
    .game-header { display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-card);border-bottom:1px solid var(--border-soft);gap:12px;flex-wrap:wrap; }
    .game-matchup { font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;letter-spacing:0.06em;color:var(--text-main); }
    .game-meta { font-size:10px;color:var(--text-muted);letter-spacing:0.08em; }
    .game-league-tag { font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:0.1em;padding:2px 8px;text-transform:uppercase; }
    .tag-NBA { color:var(--accent-yellow);border:1px solid rgba(250,204,21,0.3);background:rgba(250,204,21,0.05); }
    .tag-NHL { color:var(--accent-blue);border:1px solid rgba(0,191,255,0.3);background:rgba(0,191,255,0.05); }
    .tag-MLB { color:var(--accent-green);border:1px solid rgba(0,255,132,0.3);background:rgba(0,255,132,0.05); }

    /* PROPS TABLE */
    .props-table { width:100%;border-collapse:collapse; }
    .props-table th { font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);padding:7px 16px;border-bottom:1px solid var(--border-soft);text-align:left;white-space:nowrap; }
    .props-table th.r { text-align:right; }
    .props-table td { padding:9px 16px;border-bottom:1px solid rgba(26,31,38,0.5);font-size:12px;color:var(--text-muted);white-space:nowrap; }
    .props-table tr:last-child td { border-bottom:none; }
    .props-table tr:hover td { background:rgba(255,255,255,0.015); }

    .td-rank { font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:var(--border-soft);width:28px; }
    .td-player { color:var(--text-main);font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.04em; }
    .td-team { font-size:10px;color:var(--text-muted);margin-top:1px; }
    .td-prop { color:var(--accent-blue);font-size:11px;letter-spacing:0.04em; }
    .td-line { font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text-main);text-align:right; }
    .td-avg { font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-muted);text-align:right; }

    /* HIT RATE CELL */
    .hit-cell { text-align:right; }
    .hit-pct { font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;line-height:1; }
    .hit-count { font-size:9px;color:var(--text-muted);margin-top:1px; }
    .pct-high { color:var(--accent-green); }
    .pct-mid  { color:var(--accent-yellow); }
    .pct-low  { color:var(--accent-red); }

    /* MINI BAR */
    .mini-bar-wrap { width:80px;height:4px;background:rgba(255,255,255,0.04);border:1px solid var(--border-soft);display:inline-block;vertical-align:middle; }
    .mini-bar-fill { height:100%; }

    .no-props { padding:16px;font-size:11px;color:var(--text-muted);text-align:center;letter-spacing:0.08em; }
    .empty-state { text-align:center;padding:80px 20px;color:var(--text-muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase; }
    .empty-sub { font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:8px;font-weight:400;letter-spacing:0;opacity:0.6; }
  </style>
</head>
<body>
<div id="nav-placeholder"></div>

<div class="page-header">
  <div>
    <div class="page-title">Top Props</div>
    <div class="page-subtitle">TOP 5 HIGHEST-CONFIDENCE PROPS PER GAME · TODAY</div>
  </div>
</div>

<div class="controls">
  <div class="league-pill active" data-sport="basketball" data-league="nba" data-key="NBA">NBA</div>
  <div class="league-pill" data-sport="hockey" data-league="nhl" data-key="NHL">NHL</div>
  <div class="league-pill" data-sport="baseball" data-league="mlb" data-key="MLB">MLB</div>
  <button class="run-btn" id="run-btn">Run Analysis</button>
</div>

<div class="status-bar" id="status-bar">
  <span class="status-dot" id="status-dot"></span>
  <span id="status-text">Select a league and click Run Analysis</span>
  <div class="progress-wrap" id="progress-wrap" style="display:none"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<div class="main" id="main">
  <div class="empty-state">
    Select a league and click Run Analysis
    <div class="empty-sub">Fetches today's games · analyzes key players · surfaces top props</div>
  </div>
</div>

<script src="js/nav.js"></script>
<script>
var activeSport  = 'basketball';
var activeLeague = 'nba';
var activeKey    = 'NBA';
var isRunning    = false;

var PROPS = {
  nba: [
    { label:'Points',    statKeys:['points','PTS'],           abbr:'PTS' },
    { label:'Rebounds',  statKeys:['totalRebounds','REB'],    abbr:'REB' },
    { label:'Assists',   statKeys:['assists','AST'],          abbr:'AST' },
    { label:'Blocks',    statKeys:['blocks','BLK'],           abbr:'BLK' },
    { label:'Steals',    statKeys:['steals','STL'],           abbr:'STL' }
  ],
  nhl: [
    { label:'Goals',          statKeys:['goals','G'],         abbr:'G'   },
    { label:'Assists',        statKeys:['assists','A'],        abbr:'A'   },
    { label:'Points',         statKeys:['points','PTS'],      abbr:'PTS' },
    { label:'Shots on Goal',  statKeys:['shotsTotal','S'],    abbr:'S'   }
  ],
  mlb: [
    { label:'Hits',       statKeys:['hits','H'],              abbr:'H'   },
    { label:'RBI',        statKeys:['rbi','runsBattedIn'],    abbr:'RBI' },
    { label:'Strikeouts', statKeys:['strikeouts','SO'],       abbr:'SO'  },
    { label:'Home Runs',  statKeys:['homeRuns','HR'],         abbr:'HR'  }
  ]
};

// Min games needed to surface a prop
var MIN_GAMES = 8;
// Top N props per game
var TOP_N = 5;
// Players to analyze per team (starters/key players)
var PLAYERS_PER_TEAM = 6;

function setStatus(text, dotCls, pct) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = 'status-dot ' + (dotCls||'');
  var pw = document.getElementById('progress-wrap');
  var pf = document.getElementById('progress-fill');
  if (pct !== undefined) {
    pw.style.display = '';
    pf.style.width = pct + '%';
  } else {
    pw.style.display = 'none';
  }
}

function todayESPN() {
  var d = new Date();
  var mm = ('0'+(d.getMonth()+1)).slice(-2);
  var dd = ('0'+d.getDate()).slice(-2);
  return d.getFullYear() + '' + mm + '' + dd;
}

function extractStatByLabels(labels, names, statsArr, keys) {
  for (var k = 0; k < keys.length; k++) {
    var key = keys[k].toLowerCase();
    for (var i = 0; i < labels.length; i++) {
      if ((labels[i]||'').toLowerCase() === key) { var v = parseFloat(statsArr[i]); return isNaN(v)?null:v; }
    }
    for (var i = 0; i < (names||[]).length; i++) {
      if ((names[i]||'').toLowerCase() === key) { var v = parseFloat(statsArr[i]); return isNaN(v)?null:v; }
    }
  }
  return null;
}

function parseGamesForProp(data, propDef) {
  var gl = data.gameLog || {};
  var sg = (gl.statistics||[])[0];
  if (!sg) return [];
  var labels = sg.labels||[], names = sg.names||[], sgEvts = sg.events||[];
  var evDict = gl.events||{};
  var games  = [];
  sgEvts.forEach(function(entry) {
    var statsArr = entry.stats||[], val = null;
    val = extractStatByLabels(labels, names, statsArr, propDef.statKeys.concat([propDef.abbr]));
    if (val !== null) {
      var ev = evDict[entry.eventId]||{};
      games.push({ date: ev.gameDate ? new Date(ev.gameDate) : null, val: val });
    }
  });
  return games.sort(function(a,b){ return (b.date?b.date.getTime():0)-(a.date?a.date.getTime():0); });
}

function bestLine(games) {
  // find line with highest hit rate >= 60%, min 8 games
  if (games.length < MIN_GAMES) return null;
  var avg  = games.reduce(function(s,g){return s+g.val;},0)/games.length;
  var step = 0.5;
  var lo   = Math.max(0, Math.floor((avg-1)/step)*step);
  var best = null;
  for (var i = 0; i < 8; i++) {
    var line = +(lo + i*step).toFixed(1);
    var hits = games.filter(function(g){return g.val > line;}).length;
    var rate = hits / games.length;
    if (!best || rate > best.rate) {
      best = { line: line, rate: rate, hits: hits, total: games.length };
    }
  }
  return best && best.rate >= 0.60 ? best : null;
}

async function fetchJSON(url) {
  try {
    var r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch(e) { return null; }
}

async function getTopPropsForGame(game, sport, league) {
  var comp = game.competitions && game.competitions[0];
  if (!comp) return null;
  var competitors = comp.competitors || [];
  var props = PROPS[league] || [];
  var allProps = [];

  // For each team, fetch top N players by roster order
  await Promise.all(competitors.map(async function(team) {
    var teamId   = team.team && team.team.id;
    var teamAbbr = team.team && (team.team.abbreviation || team.team.shortDisplayName || '');
    if (!teamId) return;

    var roster = await fetchJSON('https://site.api.espn.com/apis/site/v2/sports/'+sport+'/'+league+'/teams/'+teamId+'/roster');
    if (!roster) return;

    var players = [];
    (roster.athletes||[]).forEach(function(g) {
      (g.items||g.athletes||(g.id?[g]:[])).forEach(function(p){ if(p.id) players.push(p); });
    });

    // Take first PLAYERS_PER_TEAM (roster is typically ordered by starter/importance)
    var subset = players.slice(0, PLAYERS_PER_TEAM);

    await Promise.all(subset.map(async function(player) {
      var url  = 'https://site.web.api.espn.com/apis/common/v3/sports/'+sport+'/'+league+'/athletes/'+player.id+'/overview';
      var data = await fetchJSON(url);
      if (!data) return;

      props.forEach(function(propDef) {
        var games = parseGamesForProp(data, propDef);
        if (games.length < MIN_GAMES) return;
        var bl = bestLine(games);
        if (!bl) return;
        var avg = games.reduce(function(s,g){return s+g.val;},0)/games.length;
        allProps.push({
          player:   player.displayName || player.fullName || '?',
          teamAbbr: teamAbbr,
          prop:     propDef.label,
          abbr:     propDef.abbr,
          line:     bl.line,
          rate:     bl.rate,
          hits:     bl.hits,
          total:    bl.total,
          avg:      avg
        });
      });
    }));
  }));

  // Sort by hit rate descending, take top N
  allProps.sort(function(a,b){ return b.rate - a.rate; });
  return allProps.slice(0, TOP_N);
}

function pctClass(r) { return r >= 0.70 ? 'pct-high' : r >= 0.55 ? 'pct-mid' : 'pct-low'; }
function barClr(r)   { return r >= 0.70 ? 'var(--accent-green)' : r >= 0.55 ? 'var(--accent-yellow)' : 'var(--accent-red)'; }

function renderGame(game, topProps, leagueKey) {
  var comp       = game.competitions && game.competitions[0];
  var competitors= (comp && comp.competitors) || [];
  var away       = competitors.find(function(c){return c.homeAway==='away';});
  var home       = competitors.find(function(c){return c.homeAway==='home';});
  var awayName   = away && away.team ? (away.team.abbreviation||away.team.shortDisplayName||'?') : '?';
  var homeName   = home && home.team ? (home.team.abbreviation||home.team.shortDisplayName||'?') : '?';
  var timeStr    = game.date ? new Date(game.date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZoneName:'short'}) : '';

  var block = document.createElement('div');
  block.className = 'game-block';

  var tagHtml = '<span class="game-league-tag tag-'+leagueKey+'">'+leagueKey+'</span>';
  block.innerHTML =
    '<div class="game-header">'+
      '<div>'+
        '<div class="game-matchup">'+awayName+' @ '+homeName+'</div>'+
        '<div class="game-meta">'+timeStr+'</div>'+
      '</div>'+
      tagHtml+
    '</div>';

  if (!topProps || !topProps.length) {
    block.innerHTML += '<div class="no-props">Not enough data to surface props for this game</div>';
    return block;
  }

  var rows = topProps.map(function(p, idx) {
    var pct  = (p.rate*100).toFixed(0);
    var cls  = pctClass(p.rate);
    var clr  = barClr(p.rate);
    return '<tr>'+
      '<td class="td-rank">'+(idx+1)+'</td>'+
      '<td><div class="td-player">'+p.player+'</div><div class="td-team">'+p.teamAbbr+'</div></td>'+
      '<td class="td-prop">'+p.prop+'</td>'+
      '<td class="td-line">Over '+p.line+'</td>'+
      '<td class="td-avg">'+p.avg.toFixed(1)+' avg</td>'+
      '<td class="hit-cell">'+
        '<div class="hit-pct '+cls+'">'+pct+'%</div>'+
        '<div class="hit-count">'+p.hits+'/'+p.total+' games</div>'+
        '<div style="margin-top:4px"><div class="mini-bar-wrap"><div class="mini-bar-fill" style="width:'+(p.rate*100)+'%;background:'+clr+'"></div></div></div>'+
      '</td>'+
    '</tr>';
  }).join('');

  block.innerHTML +=
    '<table class="props-table">'+
      '<thead><tr>'+
        '<th></th>'+
        '<th>Player</th>'+
        '<th>Prop</th>'+
        '<th class="r">Line</th>'+
        '<th class="r">Avg</th>'+
        '<th class="r">Hit Rate</th>'+
      '</tr></thead>'+
      '<tbody>'+rows+'</tbody>'+
    '</table>';

  return block;
}

async function runAnalysis() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('run-btn').disabled = true;
  document.getElementById('main').innerHTML = '';

  setStatus('Fetching today\'s games...', 'yellow', 0);

  var url  = 'https://site.api.espn.com/apis/site/v2/sports/'+activeSport+'/'+activeLeague+'/scoreboard?dates='+todayESPN();
  var data = await fetchJSON(url);
  var events = data && data.events || [];

  if (!events.length) {
    setStatus('No games today for '+activeKey, '', undefined);
    document.getElementById('main').innerHTML = '<div class="empty-state">No games today<div class="empty-sub">Check back on a game day</div></div>';
    isRunning = false;
    document.getElementById('run-btn').disabled = false;
    return;
  }

  setStatus('Analyzing '+events.length+' games...', 'yellow', 5);

  var main = document.getElementById('main');
  var done = 0;

  for (var i = 0; i < events.length; i++) {
    var game = events[i];
    var pct  = Math.round(5 + ((i+1)/events.length)*90);
    var comp = game.competitions && game.competitions[0];
    var competitors = (comp && comp.competitors) || [];
    var away = competitors.find(function(c){return c.homeAway==='away';});
    var home = competitors.find(function(c){return c.homeAway==='home';});
    var awayN = away && away.team ? (away.team.abbreviation||'?') : '?';
    var homeN = home && home.team ? (home.team.abbreviation||'?') : '?';
    setStatus('Analyzing '+awayN+' @ '+homeN+' ('+( i+1)+'/'+events.length+')...', 'yellow', pct);

    var topProps = await getTopPropsForGame(game, activeSport, activeLeague);
    main.appendChild(renderGame(game, topProps, activeKey));
    done++;
  }

  setStatus(done+' games analyzed · '+activeKey, 'green', undefined);
  isRunning = false;
  document.getElementById('run-btn').disabled = false;
}

document.getElementById('run-btn').addEventListener('click', runAnalysis);
document.querySelectorAll('.league-pill').forEach(function(pill) {
  pill.addEventListener('click', function() {
    document.querySelectorAll('.league-pill').forEach(function(p){p.classList.remove('active');});
    pill.classList.add('active');
    activeSport  = pill.dataset.sport;
    activeLeague = pill.dataset.league;
    activeKey    = pill.dataset.key;
    document.getElementById('main').innerHTML = '<div class="empty-state">Click Run Analysis<div class="empty-sub">'+activeKey+' · Today\'s games</div></div>';
    setStatus('Select a league and click Run Analysis', '');
  });
});
</script>
</body>
</html>
