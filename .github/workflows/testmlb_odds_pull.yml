name: MLB Odds Pull

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlb-odds-pull:
    runs-on: ubuntu-latest

    env:
      API_ODDS: ${{ secrets.API_ODDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/baseball/mlb/odds
          mkdir -p docs/win/baseball/mlb/errors/00_intake

      - name: Run MLB odds pull
        run: |
          python docs/win/baseball/mlb/scripts/00_parsing/mlb_odds_pull.py

      - name: Commit generated odds output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/baseball/mlb/odds/*.json

          if git diff --cached --quiet; then
            echo "No odds output changes to commit."
          else
            git commit -m "Update MLB odds output"
            git push
          fi
