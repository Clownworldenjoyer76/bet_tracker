name: test_Build Baseball Games List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-games-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/baseball/00_intake/games
          mkdir -p docs/win/baseball/errors/00_intake

      - name: Run build_games_list.py
        run: |
          python -u docs/win/baseball/scripts/00_intake/build_games_list.py

      - name: Verify outputs exist
        run: |
          test -d docs/win/baseball/00_intake/games
          test -d docs/win/baseball/errors/00_intake
          test -f docs/win/baseball/errors/00_intake/build_games_list.txt

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/baseball/00_intake/games docs/win/baseball/errors/00_intake
          git diff --cached --quiet || git commit -m "Run build_games_list"
          git push
