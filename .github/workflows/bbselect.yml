name: bbSelect

on:
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas pyyaml

      # -------------------------
      # RUN SELECT BETS
      # -------------------------
      - name: Run select bets
        run: python docs/win/baseball/scripts/04_select/select_bets.py

      # -------------------------
      # COMMIT OUTPUTS
      # -------------------------
      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add outputs
          git add docs/win/baseball/04_select/
          git add docs/win/baseball/errors/04_select/

          git diff --cached --quiet || git commit -m "baseball select bets $(date +'%Y-%m-%d %H:%M')"
          git push
