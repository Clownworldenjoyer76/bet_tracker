name: _Manual UFC Data Intake

on:
  workflow_dispatch:
    inputs:
      raw_text:
        required: true
        type: string

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            docs/win/mma/ufc
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # =========================
      # MMA / UFC PREDICTIONS
      # =========================
      - name: Run MMA UFC Predictions
        run: |
          printf "%s" "${{ github.event.inputs.raw_text }}" > docs/manual_data.html
          python "docs/win/mma/ufc/scripts/00_parsing/ufc_input.py"

      # =========================
      # COMMIT
      # =========================
      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/mma/ufc/00_intake/sportsbook/
          git add docs/win/mma/ufc/00_intake/predictions/

          git commit -m "manual UFC data intake" || echo "No changes"
          git push
