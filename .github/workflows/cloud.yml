name: Fetch Soccer Data

on:
  workflow_dispatch:   # manual only

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests pandas playwright
          playwright install

      - name: Run odds script
        env:
          CLOUD_API: ${{ secrets.CLOUD_API }}
        run: python docs/win/soccer/scripts/00_parsing/fetch_soccer_odds.py

      - name: Run dratings scraper
        run: python docs/win/soccer/scripts/00_parsing/soccert_drat.py

      - name: Commit & push output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/win/soccer/00_intake/sportsbook/*.csv || true
          git add docs/win/soccer/00_intake/predictions/**/*.csv || true
          git add docs/win/final_scores/results/soccer/final_scores/**/*.csv || true

          git diff --cached --quiet || git commit -m "Update soccer data (odds + dratings)"
          git push
