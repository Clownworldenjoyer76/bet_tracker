name: Odds Parse (Hockey + Basketball + Baseball)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse-odds:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      # =========================
      # RUN HOCKEY
      # =========================
      - name: Run hockey odds parse
        run: python docs/win/hockey/scripts/00_parsing/odds_parse.py

      # =========================
      # RUN BASKETBALL
      # =========================
      - name: Run basketball odds parse
        run: python docs/win/basketball/scripts/00_parsing/odds_parse.py

      # =========================
      # RUN BASEBALL
      # =========================
      - name: Ensure baseball output folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "docs/win/baseball/sportsbook" | Out-Null

      - name: Run baseball odds parse
        run: python docs/win/baseball/scripts/00_parsing/odds_parse.py docs/win/baseball/odds/${{ github.event.inputs.date }}

      # =========================
      # VERIFY OUTPUT
      # =========================
      - name: Verify output written
        shell: pwsh
        run: |
          $hockey = Get-ChildItem -Path "docs/win/hockey/00_intake/sportsbook" -Filter "hockey_*.csv" -ErrorAction SilentlyContinue
          $basketball = Get-ChildItem -Path "docs/win/basketball/00_intake/sportsbook" -Filter "basketball_NBA_*.csv" -ErrorAction SilentlyContinue
          $baseball = Get-ChildItem -Path "docs/win/baseball/sportsbook" -Filter "*_MLB.csv" -ErrorAction SilentlyContinue

          if (($hockey.Count -eq 0) -and ($basketball.Count -eq 0) -and ($baseball.Count -eq 0)) {
            Write-Error "No output CSV files found"
            exit 1
          }

          Write-Output "Hockey files:"
          $hockey | ForEach-Object { Write-Output "  $($_.Name)" }

          Write-Output "Basketball files:"
          $basketball | ForEach-Object { Write-Output "  $($_.Name)" }

          Write-Output "Baseball files:"
          $baseball | ForEach-Object { Write-Output "  $($_.Name)" }

      # =========================
      # COMMIT
      # =========================
      - name: Commit and push output
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/hockey/00_intake/sportsbook/ 2>$null
          git add docs/win/basketball/00_intake/sportsbook/ 2>$null
          git add docs/win/baseball/sportsbook/ 2>$null

          git diff --cached --quiet && Write-Output "No changes to commit" || (git commit -m "odds parse output [$(Get-Date -Format 'yyyy-MM-dd')]" && git push)
