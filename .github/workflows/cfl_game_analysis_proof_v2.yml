name: CFL Game Analysis Proof V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  game-analysis-proof-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run CFL game analysis proof parser V2
        run: python docs/win/football/cfl/scripts/00_parser/cfl_game_analysis_proof_v2.py

      - name: Commit proof V2 outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/football/cfl/data_dump/proof/game_analysis_v2/

          if git diff --cached --quiet; then
            echo "No proof output changes to commit"
          else
            git commit -m "data submitted"
            git push
          fi
