name: Games Today

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  games-today:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Combine basketball market CSVs
        run: python docs/win/basketball/scripts/basketball_games_today.py

      - name: Combine MLB CSVs
        run: python docs/win/baseball/mlb/scripts/mlb_games_today.py

      - name: Copy football schedule CSVs
        run: python docs/win/football/scripts/football_games_today.py

      - name: Combine NHL market CSVs
        run: python docs/win/hockey/nhl/scripts/hockey_games_today.py

      - name: Copy UFC edges CSVs
        run: python docs/win/mma/ufc/scripts/ufc_games_today.py

      - name: Commit and push generated CSVs
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            frontend/data/index_home/basketball/WNBA/*_WNBA_games_today.csv
            frontend/data/index_home/basketball/NBA/*_NBA_games_today.csv
            frontend/data/index_home/basketball/NCAAM/*_NCAAM_games_today.csv
            frontend/data/index_home/baseball/*_mlb_games_today.csv
            frontend/data/index_home/football/CFB/*.csv
            frontend/data/index_home/football/NFL/*.csv
            frontend/data/index_home/hockey/NHL/*_NHL_games_today.csv
            frontend/data/index_home/ufc/*_ufc_edges.csv
          )

          if (( ${#files[@]} == 0 )); then
            echo "No output files; nothing to commit."
            exit 0
          fi

          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update games today CSVs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
