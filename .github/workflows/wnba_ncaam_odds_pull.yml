name: Cloudbet NCAAM WNBA Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-cloudbet-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/basketball/odds
          mkdir -p docs/win/basketball/errors/00_intake

      - name: Verify Cloudbet API key is present
        env:
          CLOUDBET_API_KEY: ${{ secrets.CLOUD_API }}
        run: |
          if [ -z "$CLOUDBET_API_KEY" ]; then
            echo "CLOUD_API secret is missing."
            exit 1
          fi

      - name: Run Cloudbet odds pull
        env:
          CLOUDBET_API_KEY: ${{ secrets.CLOUD_API }}
        run: |
          python docs/win/basketball/scripts/00_intake/00_ncaam_wnba_cloudbet_odds_pull.py

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/win/basketball/odds/*.json docs/win/basketball/errors/00_intake/*.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Run Cloudbet NCAAM/WNBA odds pull"
            git push
          fi
