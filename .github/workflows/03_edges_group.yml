name: 03 Edges Group - All

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-edges-group:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create output folders
        run: |
          mkdir -p docs/win/soccer/errors/03_edges/
          mkdir -p docs/win/soccer/03_edges/

          mkdir -p docs/win/hockey/errors/03_edges/
          mkdir -p docs/win/hockey/03_edges/
          mkdir -p docs/win/hockey/03_edges/ev_kelly/

          mkdir -p docs/win/baseball/errors/03_edges/
          mkdir -p docs/win/baseball/03_edges/
          mkdir -p docs/win/baseball/03_edges/ev_kelly/

          mkdir -p docs/win/basketball/errors/03_edges/
          mkdir -p docs/win/basketball/03_edges/
          mkdir -p docs/win/basketball/03_edges/ev_kelly/

      - name: Run soccer edges
        run: python docs/win/soccer/scripts/03_edges/build_edges.py

      - name: Run hockey edges
        run: python docs/win/hockey/scripts/03_edges/compute_edges.py

      - name: Run hockey ev kelly
        run: python docs/win/hockey/scripts/03_edges/compute_ev_kelly.py

      - name: Run baseball edges
        run: python docs/win/baseball/scripts/03_edges/compute_edges.py

      - name: Run baseball ev kelly
        run: python docs/win/baseball/scripts/03_edges/compute_ev_kelly.py

      - name: Run basketball edges
        run: python docs/win/basketball/scripts/03_edges/compute_edges.py

      - name: Run basketball ev kelly
        run: python docs/win/basketball/scripts/03_edges/compute_ev_kelly.py

      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/soccer/errors/03_edges/ docs/win/soccer/03_edges/
          git add docs/win/hockey/errors/03_edges/ docs/win/hockey/03_edges/
          git add docs/win/baseball/errors/03_edges/ docs/win/baseball/03_edges/
          git add docs/win/basketball/errors/03_edges/ docs/win/basketball/03_edges/
          git diff --cached --quiet || git commit -m "Run 03 edges group workflow outputs"
          git push
