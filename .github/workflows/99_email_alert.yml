name: 99 Notify Workflow Results

on:
  workflow_run:
    workflows:
      - "99 Auto Hourly MLB Lineup Scraper"
      - "99 99 Auto 510am - Daily Odds Pull"
      - "99 Auto 520am - Intake Group"
    types:
      - completed

jobs:
  notify-daily-success-or-fail:
    if: >
      github.event.workflow_run.name != '99 Auto Hourly MLB Lineup Scraper' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Send email for daily workflows
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "[GitHub Actions] ${{ github.event.workflow_run.name }} - ${{ github.event.workflow_run.conclusion }}"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Workflow completed.

            Workflow:   ${{ github.event.workflow_run.name }}
            Conclusion: ${{ github.event.workflow_run.conclusion }}
            Branch:     ${{ github.event.workflow_run.head_branch }}
            Repository: ${{ github.repository }}
            Run URL:    ${{ github.event.workflow_run.html_url }}

  notify-hourly-fail-only:
    if: >
      github.event.workflow_run.name == '99 Auto Hourly MLB Lineup Scraper' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send email for hourly scraper failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "[GitHub Actions] 99 Auto Hourly MLB Lineup Scraper - FAILURE"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            Hourly scraper failed.

            Workflow:   ${{ github.event.workflow_run.name }}
            Conclusion: ${{ github.event.workflow_run.conclusion }}
            Branch:     ${{ github.event.workflow_run.head_branch }}
            Repository: ${{ github.repository }}
            Run URL:    ${{ github.event.workflow_run.html_url }}
