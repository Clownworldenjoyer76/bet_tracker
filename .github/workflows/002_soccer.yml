name: Soccer Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-soccer-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pyyaml

      # =========================
      # RUN PIPELINE
      # =========================
      - name: Run merge_intake
        run: python docs/win/soccer/scripts/01_merge/merge_intake.py

      - name: Run build_juice_files
        run: python docs/win/soccer/scripts/01_merge/build_juice_files.py

      - name: Run apply_juice
        run: python docs/win/soccer/scripts/02_juice/apply_juice.py

      - name: Run build_edges
        run: python docs/win/soccer/scripts/03_edges/build_edges.py

      - name: Run select_bets
        run: python docs/win/soccer/scripts/04_select/select_bets.py

      # =========================
      # COMMIT OUTPUTS TO REPO
      # =========================
      - name: Commit and push outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/win/soccer/02_juice || true
          git add docs/win/soccer/03_edges || true
          git add docs/win/soccer/04_select || true

          git commit -m "auto: update soccer pipeline outputs" || echo "No changes to commit"

          git push
