name: CFL Dump Manifest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run CFL dump manifest script
        run: python docs/win/football/cfl/scripts/00_parser/cfl_dump_manifest.py

      - name: Commit manifest output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/football/cfl/data_dump/manifest/cfl_raw_dump_manifest.csv

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "data submitted"
            git push
          fi
