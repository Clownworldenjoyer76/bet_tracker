name: 05 Final Group - All

on:
  workflow_dispatch:

jobs:
  final-group:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml numpy scipy

      - name: Create output folders
        run: |
          mkdir -p docs/win/final_scores/intermediate/
          mkdir -p docs/win/final_scores/errors/
          mkdir -p docs/win/final_scores/results/soccer/graded/
          mkdir -p docs/win/final_scores/deeper_summaries/soccer/
          mkdir -p docs/win/final_scores/results/nhl/graded/
          mkdir -p docs/win/final_scores/deeper_summaries/nhl/
          mkdir -p docs/win/final_scores/deeper_summaries/nhl/by_market/
          mkdir -p docs/win/final_scores/results/mlb/graded/
          mkdir -p docs/win/final_scores/deeper_summaries/mlb/
          mkdir -p docs/win/final_scores/deeper_summaries/mlb/by_market/
          mkdir -p docs/win/final_scores/results/nba/graded/
          mkdir -p docs/win/final_scores/results/ncaab/graded/
          mkdir -p docs/win/final_scores/deeper_summaries/nba/
          mkdir -p docs/win/final_scores/deeper_summaries/nba/by_market/
          mkdir -p docs/win/final_scores/deeper_summaries/ncaab/
          mkdir -p docs/win/final_scores/deeper_summaries/ncaab/by_market/
          touch docs/win/final_scores/soccer_market_tally.csv

   #   - name: Run soccer results grade
  #      run: python docs/win/final_scores/scripts/05_results/soccer/01_soccer_results_grade.py

 #     - name: Run soccer results analyze
#        run: python docs/win/final_scores/scripts/05_results/soccer/02_soccer_results_analyze.py

#      - name: Run soccer results reports
#        run: python docs/win/final_scores/scripts/05_results/soccer/03_soccer_results_reports.py

      - name: Run hockey results grade
        run: python docs/win/final_scores/scripts/05_results/hockey/01_nhl_results_grade.py

      - name: Run hockey results analyze
        run: python docs/win/final_scores/scripts/05_results/hockey/02_nhl_results_analyze.py

      - name: Run hockey results reports
        run: python docs/win/final_scores/scripts/05_results/hockey/03_nhl_results_reports.py

      - name: Run MLB results grade
        run: python docs/win/final_scores/scripts/05_results/mlb/01_mlb_results_grade.py

      - name: Run MLB results analyze
        run: python docs/win/final_scores/scripts/05_results/mlb/02_mlb_results_analyze.py

      - name: Run MLB results reports
        run: python docs/win/final_scores/scripts/05_results/mlb/03_mlb_results_reports.py

      - name: Run basketball results grade
        run: python docs/win/final_scores/scripts/05_results/basketball/01_basketball_results_grade.py

      - name: Run basketball results analyze
        run: python docs/win/final_scores/scripts/05_results/basketball/02_basketball_results_analyze.py

      - name: Run basketball results reports
        run: python docs/win/final_scores/scripts/05_results/basketball/03_basketball_results_reports.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/final_scores/
          git commit -m "Run 05_final_group outputs" || echo "No changes to commit"
          git push
