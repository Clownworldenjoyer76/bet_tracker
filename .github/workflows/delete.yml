name: DELETE UFC Name Normalization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ufc-name-normalization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run UFC name normalization
        run: python docs/win/mma/ufc/scripts/00_intake/00_name_normalization.py

      - name: Commit normalized files and unmapped output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/mma/ufc/00_intake/sportsbook/
          git add docs/win/mma/ufc/00_intake/predictions/
          git add docs/win/mma/ufc/manual_files/
          git add mappings/mma/ufc/no_map_fighter_name.csv

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Normalize UFC fighter names"
            git pull --rebase origin main
            git push
          fi
