name: A Soccer Results Grade

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-results-grade
  cancel-in-progress: false

jobs:
  soccer_results_grade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run soccer results grade script
        run: |
          python docs/win/soccer/scripts/05_final_scores/01_soccer_results_grade.py

      - name: Show soccer grading logs and outputs
        run: |
          echo "Generated graded files:"
          find docs/win/soccer/05_final_scores/results/graded -type f -name "*.csv" | sort || true

          echo "Summary log:"
          cat docs/win/soccer/05_final_scores/errors/soccer_results_grade_summary.txt || true

          echo "Error log:"
          cat docs/win/soccer/05_final_scores/errors/soccer_results_grade_errors.txt || true

      - name: Fail if no graded files were generated
        run: |
          count=$(find docs/win/soccer/05_final_scores/results/graded -type f -name "*.csv" | wc -l)
          echo "Generated graded file count: $count"

          if [ "$count" -eq 0 ]; then
            echo "No graded soccer files were generated."
            exit 1
          fi

      - name: Commit generated graded results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/soccer/scripts/05_final_scores/01_soccer_results_grade.py
          git add docs/win/soccer/05_final_scores/results/graded/
          git add docs/win/soccer/05_final_scores/errors/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Grade soccer results"
            git pull --rebase origin main
            git push origin main
          fi
