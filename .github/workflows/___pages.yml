
name: __Auto Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "react/**"
      - "frontend/data/**"
      - "app/frontend/**"
      - ".github/workflows/___pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install React dependencies
        working-directory: ./react
        run: npm ci

      - name: Build current React website
        working-directory: ./react
        run: npm run build

      - name: Assemble complete website
        shell: bash
        run: |
          set -euo pipefail

          # Preserve existing site files, including legacy pages.
          mkdir -p _site
          cp -a app/frontend/dist/. _site/

          # Remove outdated Vite-generated bundles only.
          # Keep legacy CSS, JS, images, and other files.
          find _site/assets -maxdepth 1 -type f \
            \( -name 'main-*.js' \
            -o -name 'main-*.css' \
            -o -name 'dashboard-*.js' \
            -o -name 'pipeline-health-*.js' \) \
            -delete

          # Install the freshly built React pages and assets.
          cp -a react/react-dist/. _site/

          # Verify critical pages were preserved.
          test -f _site/index.html
          test -f _site/the_picks.html
          test -f _site/cfl_dashboard.html
          test -f _site/.nojekyll

          echo "Complete website assembled successfully."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
