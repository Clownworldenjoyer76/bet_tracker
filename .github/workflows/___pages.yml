name: __Manual Publish GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: smh-pages-manual
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed website
        uses: actions/checkout@v6

      - name: Verify the committed complete release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('app/frontend/dist')
          manifest_path = root / '.smh-release-manifest.json'
          if not root.is_dir() or not manifest_path.is_file():
              raise SystemExit('Committed release or manifest is missing')
          if not (root / 'index.html').is_file() or not (root / '.nojekyll').is_file():
              raise SystemExit('Required site entry point or .nojekyll missing')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8-sig'))
          if manifest.get('schema') != 1:
              raise SystemExit('Unsupported release manifest format')
          expected = {}
          for record in manifest['files']:
              relative = record['path']
              candidate = root / relative
              if (relative.startswith('/') or '\\' in relative or
                  any(piece in ('', '.', '..') for piece in relative.split('/')) or
                  relative in expected or relative == '.smh-release-manifest.json'):
                  raise SystemExit('Invalid or duplicate manifest path: ' + relative)
              expected[relative] = record
              if not candidate.is_file() or candidate.is_symlink():
                  raise SystemExit('Manifest file missing or not regular: ' + relative)
              data = candidate.read_bytes()
              if (len(data) != record['size'] or
                  hashlib.sha256(data).hexdigest().upper() != record['sha256'].upper()):
                  raise SystemExit('Release hash mismatch: ' + relative)
          actual = set()
          for path in root.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('Symbolic links cannot be published: ' + str(path))
              if path.is_file() and path != manifest_path:
                  actual.add(path.relative_to(root).as_posix())
          if actual != set(expected):
              raise SystemExit('Committed site differs from manifest: missing=' +
                               repr(sorted(set(expected) - actual)) + ', extra=' +
                               repr(sorted(actual - set(expected))))
          html_files = [name for name in expected if name.lower().endswith('.html')]
          if not html_files:
              raise SystemExit('Release does not contain HTML pages')
          print(f'Validated {len(expected)} exact committed files; {len(html_files)} HTML pages')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the unchanged committed website, including hidden files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./app/frontend/dist
          include-hidden-files: true

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
