name: A 2 Soccer Results Analyze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-results-analyze
  cancel-in-progress: false

jobs:
  soccer_results_analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run soccer results analyze script
        run: |
          python docs/win/soccer/scripts/05_final_scores/02_soccer_results_analyze.py

      - name: Show soccer analyze logs and outputs
        run: |
          echo "Generated intermediate files:"
          find docs/win/soccer/05_final_scores/intermediate -type f | sort || true

          echo "Summary log:"
          cat docs/win/soccer/05_final_scores/errors/soccer_results_analyze_summary.txt || true

          echo "Error log:"
          cat docs/win/soccer/05_final_scores/errors/soccer_results_analyze_errors.txt || true

      - name: Fail if work file was not generated
        run: |
          if [ ! -f docs/win/soccer/05_final_scores/intermediate/work_soccer.csv ]; then
            echo "work_soccer.csv was not generated."
            exit 1
          fi

      - name: Commit soccer analyze outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/soccer/scripts/05_final_scores/02_soccer_results_analyze.py
          git add docs/win/soccer/05_final_scores/intermediate/
          git add docs/win/soccer/05_final_scores/errors/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Analyze soccer results"
            git pull --rebase origin main
            git push origin main
          fi
