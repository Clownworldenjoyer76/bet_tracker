name: bbtester

on:
  workflow_dispatch:

jobs:
  baseball_transform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytz

      # -------------------------
      # RUN TRANSFORM
      # -------------------------
      - name: Run baseball transform
        run: python docs/win/baseball/scripts/00_parsing/transform_baseball.py

      # -------------------------
      # RUN NAME NORMALIZATION
      # -------------------------
      - name: Run baseball name normalization
        run: python docs/win/baseball/scripts/00_parsing/name_normalization.py

      # -------------------------
      # COMMIT OUTPUTS
      # -------------------------
      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add baseball outputs
          git add docs/win/baseball/
          git add docs/win/final_scores/

          # Add mapping outputs
          git add mappings/baseball/no_map/ 2>/dev/null

          git diff --cached --quiet || git commit -m "baseball transform + normalization $(date +'%Y-%m-%d %H:%M')"
          git push
