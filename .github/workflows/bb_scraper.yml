name: Basketball Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pandas pytz
          python -m playwright install chromium

      - name: Run scraper
        run: python docs/win/basketball/scripts/00_parsing/basketball_drat_scraper.py

      - name: Run transform
        run: |
            DATE=$(TZ="America/New_York" date +%Y_%m_%d)
            python docs/win/basketball/scripts/00_parsing/transform_basketball.py \
              --nba   docs/win/basketball/00_intake/drat_raw/${DATE}_nba_raw.json \
              --ncaab docs/win/basketball/00_intake/drat_raw/${DATE}_ncaab_raw.json

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/win/basketball/
          git add docs/win/basketball/ docs/win/final_scores/
          git diff --cached --quiet || git commit -m "basketball scraper run $(date +'%Y-%m-%d %H:%M')"
          git push
