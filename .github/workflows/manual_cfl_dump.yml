name: Manual CFL Dump

on:
  workflow_dispatch:
    inputs:
      report_type:
        description: "CFL report type"
        required: true
        type: choice
        options:
          - GAME ANALYSIS REPORT
          - CFL STATISTICS REPORT

      season:
        description: "Season year"
        required: true
        type: string

      week:
        description: "CFL week number"
        required: true
        type: string

      through_game:
        description: "Through game number"
        required: false
        default: ""
        type: string

      report_date:
        description: "Report date"
        required: false
        default: ""
        type: string

      raw_path:
        description: "Raw dump path already saved in repo"
        required: true
        type: string

      dump_id:
        description: "Unique dump ID"
        required: true
        type: string

permissions:
  contents: write

jobs:
  parse-cfl-dump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse CFL dump
        run: |
          python docs/win/football/cfl/scripts/00_parser/parse_cfl_dump.py \
            --report-type "${{ inputs.report_type }}" \
            --season "${{ inputs.season }}" \
            --week "${{ inputs.week }}" \
            --through-game "${{ inputs.through_game }}" \
            --report-date "${{ inputs.report_date }}" \
            --raw-path "${{ inputs.raw_path }}" \
            --dump-id "${{ inputs.dump_id }}" \
            --output-root "docs/win/football/cfl/data_dump"

      - name: Commit parsed CFL dump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/football/cfl/data_dump

          if git diff --cached --quiet; then
            echo "No CFL dump changes to commit."
          else
            git commit -m "data submitted"
            git push
          fi
