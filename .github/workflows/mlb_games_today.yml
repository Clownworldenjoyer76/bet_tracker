name: MLB Games Today

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlb-games-today:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Combine MLB CSVs
        run: python docs/win/baseball/mlb/scripts/mlb_games_today.py

      - name: Commit and push generated CSVs
        shell: bash
        run: |
          git add -- frontend/data/index_home/*_mlb_games_today.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update MLB games today CSVs"
          git push origin "HEAD:${GITHUB_REF}"
