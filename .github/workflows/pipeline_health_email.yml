name: Email Pipeline Health Report
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  email-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Generate and email pipeline health report
        env:
          SMTP_HOST: ${{ secrets.PIPELINE_EMAIL_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.PIPELINE_EMAIL_SMTP_PORT }}
          SMTP_USER: ${{ secrets.PIPELINE_EMAIL_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.PIPELINE_EMAIL_SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.PIPELINE_EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.PIPELINE_EMAIL_TO }}
        run: python scripts/pipeline_health_email.py --config config/pipeline_health_email.yaml --send
