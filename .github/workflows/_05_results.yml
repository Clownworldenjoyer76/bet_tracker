name: _05_Run All Results Script

on:
  workflow_dispatch:

jobs:
  run-batch-process:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Set up Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # -----------------------------
      # Ensure all output folders exist
      # -----------------------------
      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/final_scores/results/nba/graded
          mkdir -p docs/win/final_scores/results/ncaab/graded
          mkdir -p docs/win/final_scores/results/nhl/graded
          mkdir -p docs/win/final_scores/results/soccer/graded

          mkdir -p docs/win/final_scores/intermediate

          mkdir -p docs/win/final_scores/deeper_summaries/nba
          mkdir -p docs/win/final_scores/deeper_summaries/ncaab
          mkdir -p docs/win/final_scores/deeper_summaries/nhl
          mkdir -p docs/win/final_scores/deeper_summaries/soccer

          mkdir -p docs/win/final_scores/errors

      # -----------------------------
      # Normalize team names first
      # -----------------------------
      - name: Run Team Name Normalization
        run: |
          python docs/win/final_scores/scripts/05_results/name_normalization.py

      # -----------------------------
      # Basketball Results Pipeline
      # -----------------------------
      - name: Run Basketball Results Pipeline
        run: |
          python docs/win/final_scores/scripts/05_results/basketball/01_basketball_results_grade.py
          python docs/win/final_scores/scripts/05_results/basketball/02_basketball_results_analyze.py
          python docs/win/final_scores/scripts/05_results/basketball/03_basketball_results_reports.py

      # -----------------------------
      # NHL Results Pipeline
      # -----------------------------
      - name: Run NHL Results Pipeline
        run: |
          python docs/win/final_scores/scripts/05_results/hockey/01_nhl_results_grade.py
          python docs/win/final_scores/scripts/05_results/hockey/02_nhl_results_analyze.py
          python docs/win/final_scores/scripts/05_results/hockey/03_nhl_results_reports.py

      # -----------------------------
      # Soccer Results Pipeline
      # -----------------------------
      - name: Run Soccer Results Pipeline
        run: |
          python docs/win/final_scores/scripts/05_results/soccer/01_soccer_results_grade.py
          python docs/win/final_scores/scripts/05_results/soccer/02_soccer_results_analyze.py
          python docs/win/final_scores/scripts/05_results/soccer/03_soccer_results_reports.py

      # -----------------------------
      # Debug Git changes
      # -----------------------------
      - name: Show Git Changes (debug)
        run: |
          echo "---- GIT STATUS ----"
          git status
          echo "---- GIT DIFF ----"
          git diff || true

      # -----------------------------
      # Commit & push
      # -----------------------------
      - name: Commit and Push All Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Catch all results
          git add docs/win/final_scores/ || true

          # Existing selections
          git add docs/win/basketball/04_select || true
          git add docs/win/hockey/04_select || true
          git add docs/win/soccer/04_select || true

          # Final score outputs
          git add docs/win/final_scores/results || true
          git add docs/win/final_scores/intermediate || true
          git add docs/win/final_scores/deeper_summaries || true
          git add docs/win/final_scores/errors || true

          # Basketball outputs
          git add docs/win/final_scores/results/nba/graded || true
          git add docs/win/final_scores/results/ncaab/graded || true

          # NHL outputs
          git add docs/win/final_scores/results/nhl/graded || true

          # Soccer outputs
          git add docs/win/final_scores/results/soccer/graded || true

          # Market tally reports
          git add docs/win/final_scores/nba_market_tally.csv || true
          git add docs/win/final_scores/ncaab_market_tally.csv || true
          git add docs/win/final_scores/nhl_market_tally.csv || true
          git add docs/win/final_scores/soccer_market_tally.csv || true

          # Mapping outputs
          git add mappings/05_no_map || true

          # Commit only if changes exist
          git diff --staged --quiet || git commit -m "Auto-update: run results pipelines (NBA, NHL, Soccer)"

          git push
