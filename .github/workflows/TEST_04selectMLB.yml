name: TEST Select MLB Bets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-select:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas pyyaml

      - name: Run select script
        run: |
          python docs/win/baseball/scripts/04_select/select_bets.py

      - name: Debug output files
        run: |
          echo "=== OUTPUT FILES ==="
          ls -l docs/win/baseball/04_select

      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add -A docs/win/baseball/04_select
          git add -A docs/win/baseball/errors

          git status

          git commit -m "Run select bets" || echo "No changes"
          git push
