name: React V2 Review - Django Asset Integration

on:
  push:
    branches:
      - review/react-v2-local-20261014_082300
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-django-review:
    if: github.ref == 'refs/heads/review/react-v2-local-20261014_082300'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_ENGINE: sqlite
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: 'ci-only-unprivileged-test-key-not-for-production'
      DJANGO_ALLOWED_HOSTS: 'testserver,localhost,127.0.0.1'
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Install locked React dependencies
        working-directory: react
        run: npm ci

      - name: Build TypeScript and React production shells
        working-directory: react
        run: npm run build

      - name: Set up Python without touching production
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install Django app dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Django system checks
        working-directory: app
        run: python -B manage.py check

      - name: Django existing and React integration tests (in-memory SQLite)
        working-directory: app
        run: >-
          python -B manage.py test
          accounts.tests
          accounts.test_react_bridge
          accounts.test_react_bridge_extended
          accounts.test_react_home_bridge
          accounts.test_react_home_overlay
          accounts.test_react_asset_integration
          --noinput -v 2

      - name: Refuse deployment of unapproved Privacy / Terms drafts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          src = Path('react/scripts/deploy-react-to-production.ps1').read_text(encoding='utf-8-sig')
          match = re.search(r'\$ReactV2OptInPages\s*=\s*@\((.*?)\)\s*if\s*\(\$IncludeReactV2Pages\)', src, re.S)
          assert match, 'React V2 allowlist not found'
          allowed = re.findall(r"'([^']+\.html)'", match.group(1))
          assert len(allowed) == 18, f'Expected 18 reviewed opt-in pages, got {len(allowed)}'
          assert 'privacy.html' not in allowed and 'terms.html' not in allowed, 'Unapproved legal draft would deploy'
          print('PASS: Privacy and Terms draft shells are withheld from deploy allowlist')
          PY