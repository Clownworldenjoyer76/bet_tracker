name: _Email Alert Workflow Failures

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  workflow-failure-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run workflow failure checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/email_alert_workflow_failures.py

      - name: Show alert body
        if: hashFiles('alert_body.txt') != ''
        run: |
          echo "=== alert_body.txt ==="
          cat alert_body.txt

      - name: Send alert email
        if: hashFiles('alert_body.txt') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.ALERT_EMAIL_USERNAME }}
          password: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          subject: "[Betting Alerts] Workflow failure detected"
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: file://alert_body.txt
