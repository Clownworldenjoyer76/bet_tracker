name: Update Pipeline MLB Alt

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to scrape (YYYY-MM-DD). Defaults to today."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  MLB_Alt_Pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.date }}" >> "$GITHUB_ENV"
            echo "DATE=$(echo '${{ github.event.inputs.date }}' | tr '-' '_')" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(TZ='America/New_York' date +'%Y-%m-%d')" >> "$GITHUB_ENV"
            echo "DATE=$(TZ='America/New_York' date +'%Y_%m_%d')" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pandas requests

      - name: Create output directories
        run: |
          mkdir -p docs/win/baseball/mlb/config/

          mkdir -p docs/win/baseball/mlb/00_intake/mlb_raw/
          mkdir -p docs/win/baseball/mlb/data/

          mkdir -p docs/win/baseball/mlb/01_merge/
          mkdir -p docs/win/baseball/mlb/01_merge/01_merguiced/
          mkdir -p docs/win/baseball/mlb/errors/01_merge/

          mkdir -p docs/win/baseball/mlb/errors/02_juice/
          mkdir -p docs/win/baseball/mlb/02_juice/

          mkdir -p docs/win/baseball/mlb/errors/03_edges/
          mkdir -p docs/win/baseball/mlb/03_edges/
          mkdir -p docs/win/baseball/mlb/03_edges/ev_kelly/

          mkdir -p docs/win/baseball/mlb/04_select/
          mkdir -p docs/win/baseball/mlb/errors/04_select/

      - name: Baseball Alt Scrape MLB Raw
        run: python docs/win/baseball/mlb/scripts/00_intake/scrape_mlb_raw.py "$TARGET_DATE"

      - name: Baseball Alt Enrich Game Context
        run: python docs/win/baseball/mlb/scripts/00_intake/enrich_game_context.py

      - name: Baseball Alt Merge Intake
        run: python docs/win/baseball/mlb/scripts/01_merge/merge_intake.py

      - name: Baseball Alt Build Juice Files
        run: python docs/win/baseball/mlb/scripts/01_merge/build_juice_files.py

      - name: Baseball Alt Moneyline Juice
        run: python docs/win/baseball/mlb/scripts/02_juice/apply_moneyline_juice.py

      - name: Baseball Alt Run Line Juice
        run: python docs/win/baseball/mlb/scripts/02_juice/apply_run_line_juice.py

      - name: Baseball Alt Total Juice
        run: python docs/win/baseball/mlb/scripts/02_juice/apply_total_juice.py

      - name: Baseball Alt Edges
        run: python docs/win/baseball/mlb/scripts/03_edges/compute_edges.py

      - name: Baseball Alt EV Kelly
        run: python docs/win/baseball/mlb/scripts/03_edges/compute_ev_kelly.py

      - name: Baseball Alt Select
        run: python docs/win/baseball/mlb/scripts/04_select/baseball_select_bets.py

      - name: Print alt pipeline failure diagnostics
        if: failure()
        run: |
          echo "=== docs/win/baseball/mlb/errors ==="
          find docs/win/baseball/mlb/errors -type f -print || true

          echo ""
          echo "=== 01_merge errors ==="
          find docs/win/baseball/mlb/errors/01_merge -type f -print -exec cat {} \; || true

          echo ""
          echo "=== 02_juice errors ==="
          find docs/win/baseball/mlb/errors/02_juice -type f -print -exec cat {} \; || true

          echo ""
          echo "=== 03_edges errors ==="
          find docs/win/baseball/mlb/errors/03_edges -type f -print -exec cat {} \; || true

          echo ""
          echo "=== 04_select errors ==="
          find docs/win/baseball/mlb/errors/04_select -type f -print -exec cat {} \; || true

      - name: Upload alt pipeline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-alt-pipeline-diagnostics-${{ env.DATE }}
          if-no-files-found: ignore
          path: |
            docs/win/baseball/mlb/config/**
            docs/win/baseball/mlb/errors/**
            docs/win/baseball/mlb/01_merge/**
            docs/win/baseball/mlb/02_juice/**
            docs/win/baseball/mlb/03_edges/**
            docs/win/baseball/mlb/04_select/**
            docs/win/baseball/mlb/data/**

      - name: Commit alt pipeline outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status --short

          git add docs/win/baseball/mlb/

          git status --short

          git diff --cached --quiet || git commit -m "chore: MLB alt pipeline run $(date -u +'%Y-%m-%d %H:%M UTC')"

          git status --short

          git push
