name: 04 Select Group - All
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  select-group:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Create output folders
        run: |
          mkdir -p docs/win/soccer/04_select/
          mkdir -p docs/win/soccer/errors/04_select/
          mkdir -p docs/win/hockey/04_select/
          mkdir -p docs/win/hockey/errors/04_select/
          mkdir -p docs/win/baseball/04_select/
          mkdir -p docs/win/baseball/errors/04_select/
          mkdir -p docs/win/basketball/04_select/daily_slate/
          mkdir -p docs/win/basketball/errors/04_select/
      - name: Run soccer select
        run: python docs/win/soccer/scripts/04_select/soccer_select_bets.py
      - name: Run hockey select
        run: python docs/win/hockey/scripts/04_select/hockey_select_bets.py
      - name: Run baseball select
        run: python docs/win/baseball/scripts/04_select/baseball_select_bets.py
      - name: Run basketball select
        run: python docs/win/basketball/scripts/04_select/basketball_select_bets.py
      - name: Commit and push output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/win/soccer/04_select/ docs/win/soccer/errors/04_select/
          git add docs/win/hockey/04_select/ docs/win/hockey/errors/04_select/
          git add docs/win/baseball/04_select/ docs/win/baseball/errors/04_select/
          git add docs/win/basketball/04_select/daily_slate/ docs/win/basketball/errors/04_select/
          git diff --cached --quiet || git commit -m "Run 04 select group workflow outputs"
          git push
