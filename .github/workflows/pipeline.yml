name: 00 Run Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      # -----------------------------
      # Ensure required directories exist
      # -----------------------------
      - name: Ensure pipeline folders exist
        run: |
          mkdir -p docs/win/soccer/01_merge/market_model

          mkdir -p docs/win/final_scores/results/nba/graded
          mkdir -p docs/win/final_scores/results/ncaab/graded
          mkdir -p docs/win/final_scores/results/nhl/graded
          mkdir -p docs/win/final_scores/results/soccer/graded

          mkdir -p docs/win/final_scores/results/nhl/reports

          mkdir -p docs/win/final_scores/intermediate

          mkdir -p docs/win/final_scores/deeper_summaries/nba
          mkdir -p docs/win/final_scores/deeper_summaries/ncaab
          mkdir -p docs/win/final_scores/deeper_summaries/nhl
          mkdir -p docs/win/final_scores/deeper_summaries/soccer

          mkdir -p docs/win/final_scores/errors
          mkdir -p docs/win/errors

      # -----------------------------
      # CLEAN OLD OUTPUTS (CRITICAL FIX)
      # -----------------------------
      - name: Clean old select outputs
        run: |
          rm -rf docs/win/basketball/04_select/daily_slate/*
          rm -rf docs/win/hockey/04_select/daily_slate/*
          rm -rf docs/win/soccer/04_select/daily_slate/*

      # -----------------------------
      # Run pipeline
      # -----------------------------
      - name: Run pipeline
        run: |
          python scripts/run_pipeline.py

      # -----------------------------
      # Show pipeline log
      # -----------------------------
      - name: Show pipeline log
        run: |
          echo "------ PIPELINE LOG ------"
          if [ -f docs/win/errors/pipeline_log.txt ]; then
            cat docs/win/errors/pipeline_log.txt
          else
            echo "No log file found."
          fi

      # -----------------------------
      # Commit and push results (FIXED)
      # -----------------------------
      - name: Commit and push results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          # Add ALL outputs
          git add -A docs/win

          # Remove pycache from staging safely
          git restore --staged docs/win/**/__pycache__/* || true

          # Commit safely (no crash if no changes)
          git commit -m "Automated pipeline run" || echo "Nothing to commit"

          git push
