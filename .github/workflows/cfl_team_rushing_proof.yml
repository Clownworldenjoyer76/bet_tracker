name: CFL Team Rushing Proof

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  team-rushing-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run CFL team rushing proof parser
        run: python docs/win/football/cfl/scripts/00_parser/cfl_team_rushing_proof.py

      - name: Commit proof output
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/football/cfl/data_dump/proof/team_rushing_proof.csv

          if git diff --cached --quiet; then
            echo "No proof output changes to commit"
          else
            git commit -m "data submitted"
            git push
          fi
