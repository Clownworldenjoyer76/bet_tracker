name: Manual Data Dump

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League"
        required: true
      market:
        description: "Market"
        required: false
      source:
        description: "Source"
        required: true
      raw_text:
        description: "Raw Text"
        required: true

jobs:
  process:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

      # ---------------------------------------------------------
      # Soccer Totals Parsing
      # ---------------------------------------------------------
      - name: Run Soccer Totals Parser
        if: ${{ inputs.league == 'soccer' && inputs.source == 'Soccer Totals' }}
        run: |
          mkdir -p docs/win/soccer/00_intake/sportsbook/totals_odds
          python docs/win/soccer/scripts/00_parsing/soccer_totals_odds.py

      # ---------------------------------------------------------
      # Commit results if files were created
      # ---------------------------------------------------------
      - name: Commit Output Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/soccer/00_intake/sportsbook/totals_odds || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Soccer totals odds intake update"
            git push
          fi
