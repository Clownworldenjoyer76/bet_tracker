name: Qodana

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  qodana:
    name: Qodana - bet_tracker
    runs-on: ubuntu-24.04


    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}/docs/win/baseball/mlb/scripts:${{ github.workspace }}/docs/win/basketball/scripts:${{ github.workspace }}/docs/win/football/cfb/scripts:${{ github.workspace }}/docs/win/football/cfl/scripts:${{ github.workspace }}/docs/win/football/nfl/scripts:${{ github.workspace }}/docs/win/football/prop_engine/scripts:${{ github.workspace }}/docs/win/hockey/nhl/scripts:${{ github.workspace }}/docs/win/mma/ufc/scripts:${{ github.workspace }}/docs/win/mma/ufc/scripts/builder_scripts:${{ github.workspace }}/docs/win/soccer/scripts:${{ github.workspace }}/docs/win/soccer/scripts/00_intake:${{ github.workspace }}/docs/win/soccer/scripts/01_merge:${{ github.workspace }}/docs/win/soccer/scripts/02_juice:${{ github.workspace }}/docs/win/soccer/scripts/03_edges:${{ github.workspace }}/docs/win/soccer/scripts/04_select:${{ github.workspace }}/docs/win/soccer/scripts/05_final_scores:${{ github.workspace }}/docs/win/soccer/ml/epl:${{ github.workspace }}/docs/win/soccer/ml/bundesliga:${{ github.workspace }}/docs/win/soccer/ml/laliga:${{ github.workspace }}/docs/win/soccer/ml/ligue1:${{ github.workspace }}/docs/win/soccer/ml/mls:${{ github.workspace }}/docs/win/soccer/ml/seriea
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.14.5
        id: python-qodana
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'

      - name: Install Qodana analysis dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip==26.2.1

          python -m pip install \
            numpy==2.5.2 \
            pandas==3.0.5 \
            scipy==1.18.0 \
            PyYAML==6.0.3 \
            pyarrow==25.0.1 \
            polars==1.44.2 \
            scikit-learn==1.9.0 \
            xgboost==3.4.1 \
            lightgbm==4.6.0 \
            requests==2.34.2 \
            openpyxl==3.1.5 \
            joblib==1.5.3 \
            python-dateutil==2.9.0.post0 \
            narwhals==2.26.0 \
            tzdata==2026.3 \
            playwright==1.62.0 \
            pytz==2026.3.post1 \
            nflreadpy==0.1.5 \
            pytest==9.1.1 \
            urllib3 \
            beautifulsoup4

          for package in \
            'sportsdataverse==0.0.75' \
            'nfl_data_py==0.3.3' \
            'catboost==1.2.10'
          do
            if ! python -m pip install --no-deps --ignore-requires-python "$package"; then
              echo "::warning::Optional Qodana analysis package unavailable: $package"
            fi
          done

          python --version
          python -c "import sys; print(sys.executable)"
          python -c "from bs4 import BeautifulSoup; print('bs4=PASS')"

      - name: Qodana project-model preflight
        shell: bash
        run: |
          set -euo pipefail

          "$QODANA_PYTHON_PATH" -c "from bs4 import BeautifulSoup; print('UFC_BS4=PASS')"

          "$QODANA_PYTHON_PATH" - <<'PY'
          import feature_columns_common as f

          required = (
              "FATIGUE_FEATURE_COLUMNS",
              "GOALIE_FEATURE_COLUMNS",
              "GOALIE_NUMERIC_FEATURE_COLUMNS",
              "LINEUP_FEATURE_COLUMNS",
              "LINEUP_NUMERIC_FEATURE_COLUMNS",
          )
          missing = [name for name in required if not hasattr(f, name)]
          if missing:
              raise SystemExit("Missing NHL exports: " + ", ".join(missing))

          print("NHL_FEATURE_COLUMNS=PASS")
          print("NHL_MODULE=" + f.__file__)
          PY
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: |
            --linter qodana-python
            --within-docker false
            --config qodana.yaml
          pr-mode: false
          push-fixes: none
          artifact-name: qodana-bet-tracker
          primary-cache-key: qodana-2026.2-bet-tracker-projectmodel-v2-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-bet-tracker-projectmodel-v2-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1493839823 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
          QODANA_PYTHON_PATH: ${{ steps.python-qodana.outputs.python-path }}
