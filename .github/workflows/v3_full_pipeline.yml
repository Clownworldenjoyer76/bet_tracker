name: _00 Full Pipeline (Odds → Scraper → Pipeline)

on:
  workflow_dispatch:

permissions:
  contents: write

# ============================================================
# JOB ORDER:  1. odds  →  2. scraper  →  3. pipeline
# Each job waits for the previous one to finish and commit
# before starting (enforced via "needs:").
# ============================================================

jobs:

# ============================================================
# JOB 1 — ODDS API PULL
# Fetches latest odds from the API and commits them to /odds
# ============================================================
  odds:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # --- Make sure odds folders exist before writing ---
      - name: Ensure odds folders exist
        run: |
          mkdir -p docs/win/basketball/odds
          mkdir -p docs/win/hockey/odds
          mkdir -p docs/win/baseball/odds

      - name: Run odds API script
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_api.py

      - name: Commit and push odds data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/basketball/odds/*
          git add docs/win/hockey/odds/*
          git add docs/win/baseball/odds/*

          git commit -m "Update odds data" || echo "No changes to commit"
          git push


# ============================================================
# JOB 2 — SCRAPERS
# Runs scrapers + transforms + name normalization for all
# three sports. Waits for odds job to finish first.
# ============================================================
  scraper:
    runs-on: ubuntu-latest
    needs: odds
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright pandas pytz
          python -m playwright install chromium

      - name: Set date
        run: echo "DATE=$(TZ='America/New_York' date +%Y_%m_%d)" >> $GITHUB_ENV

      # --- Make sure all output folders exist before writing ---
      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/basketball/00_intake/drat_raw
          mkdir -p docs/win/basketball/00_intake/sportsbook
          mkdir -p docs/win/hockey/00_intake/drat_raw
          mkdir -p docs/win/hockey/00_intake/sportsbook
          mkdir -p docs/win/baseball/00_intake/drat_raw
          mkdir -p docs/win/baseball/00_intake/sportsbook
          mkdir -p docs/win/final_scores/results/nba/graded
          mkdir -p docs/win/final_scores/results/ncaab/graded
          mkdir -p docs/win/final_scores/results/nhl/graded
          mkdir -p docs/win/final_scores/results/soccer/graded
          mkdir -p docs/win/final_scores/results/mlb/graded
          mkdir -p docs/win/final_scores/deeper_summaries/nba/by_market
          mkdir -p docs/win/final_scores/deeper_summaries/ncaab/by_market
          mkdir -p docs/win/final_scores/deeper_summaries/nhl/by_market
          mkdir -p docs/win/final_scores/deeper_summaries/soccer
          mkdir -p docs/win/final_scores/deeper_summaries/mlb/by_market
          mkdir -p docs/win/final_scores/daily_picks
          mkdir -p docs/win/errors
          mkdir -p docs/win/final_scores/errors
          mkdir -p mappings/hockey/no_map
          mkdir -p mappings/basketball/no_map
          mkdir -p mappings/baseball/no_map

      # ---------- BASKETBALL ----------
      - name: Basketball — scraper
        run: python docs/win/basketball/scripts/00_parsing/basketball_drat_scraper.py

      - name: Basketball — transform
        run: |
          python docs/win/basketball/scripts/00_parsing/transform_basketball.py \
            --nba   docs/win/basketball/00_intake/drat_raw/${DATE}_nba_raw.json \
            --ncaab docs/win/basketball/00_intake/drat_raw/${DATE}_ncaab_raw.json

      - name: Basketball — name normalization
        run: python docs/win/basketball/scripts/00_parsing/name_normalization.py

      # ---------- HOCKEY ----------
      - name: Hockey — scraper
        run: python docs/win/hockey/scripts/00_parsing/hockey_drat_scraper.py

      - name: Hockey — transform
        run: |
          python docs/win/hockey/scripts/00_parsing/transform_hockey.py \
            --nhl docs/win/hockey/00_intake/drat_raw/${DATE}_nhl_raw.json

      - name: Hockey — name normalization
        run: python docs/win/hockey/scripts/00_parsing/name_normalization.py

      # ---------- BASEBALL ----------
      - name: Baseball — scraper
        run: python docs/win/baseball/scripts/00_parsing/baseball_drat_scraper.py

      - name: Baseball — name normalization (pre-transform)
        run: python docs/win/baseball/scripts/00_parsing/name_normalization.py

      - name: Baseball — transform
        run: python docs/win/baseball/scripts/00_parsing/transform_baseball.py

      - name: Baseball — name normalization (post-transform)
        run: python docs/win/baseball/scripts/00_parsing/name_normalization.py

      - name: Commit and push scraper outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/basketball/
          git add docs/win/hockey/
          git add docs/win/baseball/
          git add docs/win/final_scores/
          git add mappings/hockey/no_map/ 2>/dev/null
          git add mappings/basketball/no_map/ 2>/dev/null
          git add mappings/baseball/no_map/ 2>/dev/null

          git diff --cached --quiet || git commit -m "Scraper run + normalization (basketball + hockey + baseball) $(date +'%Y-%m-%d %H:%M')"
          git push


# ============================================================
# JOB 3 — FULL PIPELINE V2
# Runs odds parse → normalization → scraper → transform for
# each sport, then the main pipeline and daily picks.
# Waits for scraper job to finish first.
# ============================================================
  pipeline:
    runs-on: ubuntu-latest
    needs: scraper
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pandas playwright pytz
          python -m playwright install chromium

      - name: Set date
        run: echo "DATE=$(TZ='America/New_York' date +%Y_%m_%d)" >> $GITHUB_ENV

      # --- Make sure all output folders exist before writing ---
      - name: Ensure output folders exist
        run: |
          mkdir -p docs/win/basketball/00_intake/drat_raw
          mkdir -p docs/win/basketball/00_intake/sportsbook
          mkdir -p docs/win/hockey/00_intake/drat_raw
          mkdir -p docs/win/hockey/00_intake/sportsbook
          mkdir -p docs/win/baseball/00_intake/drat_raw
          mkdir -p docs/win/baseball/00_intake/sportsbook
          mkdir -p docs/win/soccer/01_merge/market_model
          mkdir -p docs/win/final_scores/results/nba/graded
          mkdir -p docs/win/final_scores/results/ncaab/graded
          mkdir -p docs/win/final_scores/results/nhl/graded
          mkdir -p docs/win/final_scores/results/soccer/graded
          mkdir -p docs/win/final_scores/results/mlb/graded
          mkdir -p docs/win/final_scores/deeper_summaries/nba/by_market
          mkdir -p docs/win/final_scores/deeper_summaries/ncaab/by_market
          mkdir -p docs/win/final_scores/deeper_summaries/nhl/by_market
          mkdir -p docs/win/final_scores/deeper_summaries/soccer
          mkdir -p docs/win/final_scores/deeper_summaries/mlb/by_market
          mkdir -p docs/win/final_scores/daily_picks
          mkdir -p docs/win/errors
          mkdir -p docs/win/final_scores/errors
          mkdir -p mappings/hockey/no_map
          mkdir -p mappings/basketball/no_map
          mkdir -p mappings/baseball/no_map

      # --- Clean stale select outputs before fresh run ---
      - name: Clean old select outputs
        run: |
          rm -rf docs/win/basketball/04_select/daily_slate/*
          rm -f  docs/win/hockey/04_select/*.csv
          rm -rf docs/win/soccer/04_select/daily_slate/*
          rm -rf docs/win/baseball/04_select/*

      # ---------- HOCKEY ----------
      - name: Hockey — odds parse
        run: python docs/win/hockey/scripts/00_parsing/odds_parse.py

      - name: Hockey — name normalization (pre-scrape)
        run: python docs/win/hockey/scripts/00_parsing/name_normalization.py

      - name: Hockey — scraper
        run: python docs/win/hockey/scripts/00_parsing/hockey_drat_scraper.py

      - name: Hockey — transform
        run: |
          python docs/win/hockey/scripts/00_parsing/transform_hockey.py \
            --nhl docs/win/hockey/00_intake/drat_raw/${DATE}_nhl_raw.json

      - name: Hockey — name normalization (post-scrape)
        run: python docs/win/hockey/scripts/00_parsing/name_normalization.py

      # ---------- BASKETBALL ----------
      - name: Basketball — odds parse
        run: python docs/win/basketball/scripts/00_parsing/odds_parse.py

      - name: Basketball — name normalization (pre-scrape)
        run: python docs/win/basketball/scripts/00_parsing/name_normalization.py

      - name: Basketball — scraper
        run: python docs/win/basketball/scripts/00_parsing/basketball_drat_scraper.py

      - name: Basketball — transform
        run: |
          python docs/win/basketball/scripts/00_parsing/transform_basketball.py \
            --nba   docs/win/basketball/00_intake/drat_raw/${DATE}_nba_raw.json \
            --ncaab docs/win/basketball/00_intake/drat_raw/${DATE}_ncaab_raw.json

      - name: Basketball — name normalization (post-scrape)
        run: python docs/win/basketball/scripts/00_parsing/name_normalization.py

      # ---------- BASEBALL ----------
      - name: Baseball — odds parse
        run: python docs/win/baseball/scripts/00_parsing/odds_parse.py docs/win/baseball/odds/${DATE}.json

      - name: Baseball — name normalization (pre-scrape)
        run: python docs/win/baseball/scripts/00_parsing/name_normalization.py

      - name: Baseball — scraper
        run: python docs/win/baseball/scripts/00_parsing/baseball_drat_scraper.py

      - name: Baseball — transform
        run: python docs/win/baseball/scripts/00_parsing/transform_baseball.py

      - name: Baseball — name normalization (post-scrape)
        run: python docs/win/baseball/scripts/00_parsing/name_normalization.py

      # --- Verify all expected sportsbook CSVs were written ---
      - name: Verify ingestion output written
        run: |
          hockey_count=$(ls docs/win/hockey/00_intake/sportsbook/hockey_*.csv 2>/dev/null | wc -l)
          basketball_count=$(ls docs/win/basketball/00_intake/sportsbook/basketball_NBA_*.csv 2>/dev/null | wc -l)
          baseball_count=$(ls docs/win/baseball/00_intake/sportsbook/*_MLB.csv 2>/dev/null | wc -l)

          echo "Hockey files:     $hockey_count"
          echo "Basketball files: $basketball_count"
          echo "Baseball files:   $baseball_count"

          if [ "$hockey_count" -eq 0 ] || [ "$basketball_count" -eq 0 ] || [ "$baseball_count" -eq 0 ]; then
            echo "ERROR: Missing expected ingestion outputs"
            exit 1
          fi

      # ---------- MAIN PIPELINE ----------
      - name: Run pipeline
        run: python scripts/pipeline.py

      - name: Show pipeline log
        run: |
          echo "------ PIPELINE LOG ------"
          if [ -f docs/win/errors/pipeline_log.txt ]; then
            cat docs/win/errors/pipeline_log.txt
          else
            echo "No log file found."
          fi

      # ---------- DAILY PICKS ----------
      - name: Run daily picks script
        run: python scripts/daily_picks.py

      - name: Commit and push all outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          git add -A docs/win/
          git add mappings/hockey/no_map/ 2>/dev/null || true
          git add mappings/basketball/no_map/ 2>/dev/null || true
          git add mappings/baseball/no_map/ 2>/dev/null || true

          git diff --cached --quiet || git commit -m "Full pipeline run $(date +'%Y-%m-%d')"
          git push
