name: TEMP Soccer Add Game ID

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  soccer_add_game_id:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run soccer add game_id script
        run: |
          python docs/win/soccer/scripts/05_final_scores/01_soccer_add_game_id.py

      - name: Commit generated final scores
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/win/soccer/05_final_scores/results/final_scores/
          git add docs/win/soccer/05_final_scores/errors/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add soccer game_id to final score files"
            git push
          fi
