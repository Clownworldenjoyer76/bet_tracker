name: Game ID Predictions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  game-id-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create output directories
        run: |
          mkdir -p docs/win/baseball/00_intake/predictions/pred_with_game_id/
          mkdir -p docs/win/baseball/errors/00_intake/

      - name: Run Game ID Predictions
        run: python docs/win/baseball/scripts/00_intake/game_id_pred.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/baseball/00_intake/predictions/pred_with_game_id/
          git add docs/win/baseball/errors/00_intake/

          git diff --cached --quiet || git commit -m "chore: inject baseball game ids into predictions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
