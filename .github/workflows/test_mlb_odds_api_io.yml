name: Test MLB Odds API IO

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-mlb-odds-api-io:
    runs-on: ubuntu-latest

    env:
      API_ODDS: ${{ secrets.API_ODDS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run odds-api.io MLB test script
        run: |
          python docs/win/baseball/scripts/00_parsing/fetch_mlb_odds_odds_api_io_test.py

      - name: Show tester output files
        run: |
          echo "Tester output directory:"
          ls -la docs/win/baseball/odds/tester || true
          echo ""
          echo "Latest tester output preview:"
          latest_file=$(ls -t docs/win/baseball/odds/tester/*.json 2>/dev/null | head -n 1)
          if [ -n "$latest_file" ]; then
            echo "$latest_file"
            python -m json.tool "$latest_file" | head -n 120
          else
            echo "No JSON output file found."
            exit 1
          fi

      - name: Commit tester output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/win/baseball/odds/tester/

          if git diff --cached --quiet; then
            echo "No tester output changes to commit."
          else
            git commit -m "Run odds-api.io MLB tester"
            git push
          fi
