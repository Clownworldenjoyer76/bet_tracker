name: _Manual Soccer Intake

on:
  workflow_dispatch:
    inputs:
      league:
        description: "League"
        required: true
        type: string
      market:
        description: "Market"
        required: true
        type: string
      source:
        description: "Source"
        required: true
        type: string
      raw_text:
        description: "Raw pasted soccer text"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-soccer-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Write raw text to temp file
        shell: bash
        env:
          RAW_TEXT: ${{ github.event.inputs.raw_text }}
        run: |
          RAW_FILE="$RUNNER_TEMP/manual_soccer_raw.txt"
          printf '%s\n' "$RAW_TEXT" > "$RAW_FILE"
          echo "RAW_FILE=$RAW_FILE" >> "$GITHUB_ENV"

      - name: Create soccer prediction CSV
        if: ${{ github.event.inputs.source == 'Predictions' }}
        shell: bash
        run: |
          python docs/win/soccer/scripts/00_intake/manual_soccer_pred.py \
            --market "${{ github.event.inputs.market }}" \
            --raw-file "$RAW_FILE"

      - name: Create soccer score CSV files
        if: ${{ github.event.inputs.source == 'Soccer Totals' }}
        shell: bash
        run: |
          python docs/win/soccer/scripts/00_intake/manual_soccer_scores.py \
            --market "${{ github.event.inputs.market }}" \
            --raw-file "$RAW_FILE"

      - name: Commit output files
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ "${{ github.event.inputs.source }}" = "Predictions" ]; then
            git add docs/win/soccer/00_intake/predictions/
            COMMIT_MESSAGE="Add manual soccer prediction data"
          elif [ "${{ github.event.inputs.source }}" = "Soccer Totals" ]; then
            git add docs/win/soccer/05_final_scores/results/final_scores_dirty/
            COMMIT_MESSAGE="Add manual soccer final scores"
          else
            echo "Unsupported soccer source: ${{ github.event.inputs.source }}"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "$COMMIT_MESSAGE"
            git push
          fi
